<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #0C1446;
            --deep: #2B5C92;
            --off-white: #F8FAFC;
            --white: #FFFFFF;
            --gold: #C8A96E;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(12,20,70,0.05);
            --border: 1px solid #e2e8f0;
            --red: #e53e3e;
            --green: #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        nav ul { display: flex; list-style: none; gap: 28px; }
        nav ul li a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        nav ul li a:hover { color: var(--white); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        .inbox-header { margin-bottom: 25px; }
        .inbox-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--ink); }

        .conversation-list { display: flex; flex-direction: column; gap: 12px; }

        .conversation-item { background: var(--white); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); border: var(--border); display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; transition: 0.2s; }
        .conversation-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }

        .conv-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #cbd5e1; flex-shrink: 0; }

        .conv-info { flex-grow: 1; overflow: hidden; }
        .conv-name { font-weight: 700; font-size: 1rem; color: var(--ink); display: flex; align-items: center; gap: 6px; }
        .conv-last-message { font-size: 0.9rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
        .conv-time { font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
        .conv-badge { background: var(--red); color: white; border-radius: 12px; padding: 2px 8px; font-size: 0.7rem; font-weight: 700; margin-left: 8px; }
        .join-request-badge { background: var(--gold); color: var(--ink); }
        .listing-badge { background: #e2e8f0; color: var(--ink); margin-left: 8px; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

        @media (max-width: 600px) {
            .container { margin: 20px auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="/index.html" class="logo">Scor<em>alia</em></a>
        <nav>
            <ul>
                <li><a href="/search.html">Browse</a></li>
                <li><a href="/my-listings.html">My Listings</a></li>
                <li><a href="/social.html">Campus Hub</a></li>
                <li><a href="/messages.html">Messages</a></li>
            </ul>
        </nav>
        <div class="header-right"></div>
    </div>
</header>

<main class="container">
    <div class="inbox-header">
        <h1>Messages</h1>
    </div>
    <div class="conversation-list" id="conversation-list">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading conversations...</div>
    </div>
</main>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

    async function main() {
        const response = await fetch('/.netlify/functions/config');
        const config = await response.json();
        const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        const lang = localStorage.getItem('preferred_language') || 'en';
        const ui = {
            en: { loading: "Loading conversations...", noMessages: "No messages yet.", you: "You", requestPrefix: "Request to join", listingChat: "Listing chat" },
            fr: { loading: "Chargement des conversations...", noMessages: "Aucun message.", you: "Vous", requestPrefix: "Demande pour rejoindre", listingChat: "Annonce" }
        }[lang] || { loading: "Loading...", noMessages: "No messages yet.", you: "You", requestPrefix: "Request to join", listingChat: "Listing chat" };

        let currentUser = null;
        const listEl = document.getElementById('conversation-list');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/login.html?redirect=/messages.html'; return; }
            currentUser = user;
            loadConversations();
        });

        function loadConversations() {
            const q = query(
                collection(db, "chats"),
                where("participants", "array-contains", currentUser.uid),
                orderBy("lastMessageTimestamp", "desc")
            );
            onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) {
                    listEl.innerHTML = `<div class="empty-state"><i class="far fa-comment-dots"></i><br>${ui.noMessages}</div>`;
                    return;
                }
                listEl.innerHTML = '';
                const frag = document.createDocumentFragment();
                for (const docSnap of snapshot.docs) {
                    const chat = docSnap.data();
                    const chatId = docSnap.id;
                    const otherUid = chat.participants.find(uid => uid !== currentUser.uid);
                    if (!otherUid) continue;

                    let otherUser = { displayName: "User", photoURL: null };
                    try {
                        const userDoc = await getDoc(doc(db, "users", otherUid));
                        if (userDoc.exists()) otherUser = userDoc.data();
                    } catch(e) { console.warn(e); }

                    const pfp = otherUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${otherUid}&backgroundColor=EBF2FA`;
                    const lastMessage = chat.lastMessage || '';
                    const isJoinRequest = lastMessage.includes(ui.requestPrefix) || lastMessage.includes('requested to join');
                    const timeStr = chat.lastMessageTimestamp ? formatTime(chat.lastMessageTimestamp.toDate()) : '';
                    const isListingChat = chat.listingId != null;
                    
                    let nameHtml = `${otherUser.displayName || 'User'}`;
                    if (isListingChat) {
                        nameHtml += ` <span class="listing-badge"><i class="fas fa-tag"></i> ${chat.listingTitle || ui.listingChat}</span>`;
                    }
                    if (isJoinRequest) {
                        nameHtml += ` <span class="conv-badge join-request-badge"><i class="fas fa-user-plus"></i> Join Request</span>`;
                    }

                    const item = document.createElement('a');
                    item.className = 'conversation-item';
                    item.href = `/chat.html?id=${chatId}`;
                    item.innerHTML = `
                        <img src="${pfp}" class="conv-avatar">
                        <div class="conv-info">
                            <div class="conv-name">${nameHtml}</div>
                            <div class="conv-last-message">${escapeHtml(lastMessage)}</div>
                        </div>
                        <div class="conv-time">${timeStr}</div>
                    `;
                    frag.appendChild(item);
                }
                listEl.appendChild(frag);
            });
        }

        function formatTime(date) {
            const diff = Math.round((new Date() - date) / 60000);
            if (diff < 60) return `${diff}m`;
            if (diff < 1440) return `${Math.round(diff/60)}h`;
            return `${Math.round(diff/1440)}d`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    }
    main();
</script>
</body>
</html>
