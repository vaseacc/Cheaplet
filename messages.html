<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Messages - Cheaplet</title>
    <!-- GLOBAL BRAIN (Connects Profile Circle, Ban Check, Language) -->
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* Header Styles - Matches Global Theme */
        header { 
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); 
            color: white; 
            padding: 15px 0; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; cursor: pointer; color: white; text-decoration: none; }
        .logo span { color: #FFD700; }
        
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav ul li a { color: white; text-decoration: none; font-weight: 500; opacity: 0.9; transition: opacity 0.2s; }
        nav ul li a:hover { opacity: 1; }

        /* Container for global.js brain */
        .header-right { display: flex; align-items: center; gap: 15px; }

        /* Inbox Styles */
        .page-header { padding: 40px 0 20px; border-bottom: 1px solid #ddd; margin-bottom: 30px; }
        .page-header h1 { font-size: 2rem; color: #2E7D32; font-weight: 800; }

        #inbox-container {
            max-width: 800px; margin: 0 auto 50px; background: white; 
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            overflow: hidden; border: 1px solid #eee;
        }

        .conversation-item {
            display: flex; align-items: center; padding: 20px; border-bottom: 1px solid #f0f0f0; 
            cursor: pointer; transition: background-color 0.2s; text-decoration: none; color: inherit;
        }
        .conversation-item:last-child { border-bottom: none; }
        .conversation-item:hover { background-color: #f1f8e9; }

        .avatar {
            width: 55px; height: 55px; border-radius: 50%; background-color: #4CAF50; 
            color: white; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1.4rem; margin-right: 20px; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .conversation-details { flex-grow: 1; overflow: hidden; }
        .participant-name { font-weight: 700; font-size: 1.1rem; color: #333; margin-bottom: 2px; }
        .last-message { color: #777; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .info-message { text-align: center; padding: 100px 0; font-size: 1.2rem; color: #999; }
        
        @media (max-width: 767px) { nav { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-left">
                <a href="/index.html" class="logo">Cheap<span>let</span></a>
                <nav><ul></ul></nav> <!-- Filled by global.js -->
            </div>
            <div class="header-right"></div> <!-- global.js brain target -->
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>My Messages</h1>
        </div>

        <div id="info-container">
            <p class="info-message"><i class="fas fa-circle-notch fa-spin"></i> Loading conversations...</p>
        </div>
    
        <div id="inbox-container">
            <!-- Conversations will be injected here -->
        </div>
    </main>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            
            // Safe Init
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const infoContainer = document.getElementById('info-container');
            const inboxContainer = document.getElementById('inbox-container');

            let unsubscribe;

            onAuthStateChanged(auth, user => {
                if (user && user.emailVerified) {
                    fetchConversations(user);
                } else {
                    if (unsubscribe) unsubscribe();
                    inboxContainer.innerHTML = '';
                    infoContainer.innerHTML = `<p class="info-message">Please log in to see your messages.</p>`;
                }
            });

            function fetchConversations(currentUser) {
                const chatsRef = collection(db, "chats");
                const q = query(chatsRef, where("participants", "array-contains", currentUser.uid), orderBy("lastUpdate", "desc"));
                
                unsubscribe = onSnapshot(q, (snapshot) => {
                    inboxContainer.innerHTML = '';
                    if (snapshot.empty) {
                        infoContainer.innerHTML = `<p class="info-message">You have no messages yet.</p>`;
                    } else {
                        infoContainer.innerHTML = ''; 
                        snapshot.forEach((doc) => {
                            inboxContainer.appendChild(renderConversation(doc, currentUser));
                        });
                    }
                }, (error) => {
                    console.error(error);
                    infoContainer.innerHTML = `<p class="info-message">Error loading messages.</p>`;
                });
            }

            function renderConversation(doc, currentUser) {
                const chatData = doc.data();
                const chatId = doc.id;
                
                const otherParticipantId = chatData.participants.find(p => p !== currentUser.uid);
                const displayName = chatData.participantInfo ? chatData.participantInfo[otherParticipantId] || 'User' : 'User';

                const link = document.createElement('a');
                link.href = `/chat.html?id=${chatId}`;
                link.className = 'conversation-item';
                
                link.innerHTML = `
                    <div class="avatar">${displayName.charAt(0).toUpperCase()}</div>
                    <div class="conversation-details">
                        <p class="participant-name">${displayName}</p>
                        <p class="last-message">${chatData.lastMessage || 'Start a conversation...'}</p>
                    </div>
                `;
                return link;
            }
        }
        main();
    </script>
</body>
</html>
