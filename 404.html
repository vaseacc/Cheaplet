<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Scoralia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #F4F7FC; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
        .error-card { padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(12,20,70,0.15); max-width: 450px; }
        .logo-title { font-size: 3rem; font-weight: bold; color: #0C1446; margin-bottom: 5px; }
        .logo-title span { color: #C8A96E; }
        h1 { color: #1a2a4a; font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #6b84a3; font-size: 1.1rem; margin-bottom: 30px; }
        .btn-home { 
            background: linear-gradient(135deg, #0C1446 0%, #2B5C92 100%); 
            color: white; padding: 12px 30px; border-radius: 25px; 
            text-decoration: none; font-weight: bold; display: inline-block;
            transition: transform 0.2s;
        }
        .btn-home:hover { transform: translateY(-2px); }

/* ==========================================================================
   DARK MODE (prefers-color-scheme)
   ========================================================================== */

@media (prefers-color-scheme: dark) {
  :root {
    --ink:          #0a1030;
    --deep:         #3b6fa0;
    --mist:         #3b4a5e;
    --white:        #1e1e2e;
    --off-white:    #12121a;
    --surface:      #252535;
    --surface-2:    #2d2d40;
    --text-body:    #e0e0f0;
    --text-muted:   #9090b0;
    --text-light:   #6d6d90;
    --gold:         #c8a96e;
    --gold-hover:   #ddb97a;
    --gold-light:   #3c3426;
    --glass-bg:           rgba(18, 18, 26, 0.8);
    --glass-bg-dark:      rgba(10, 10, 20, 0.9);
    --glass-border-dark:  rgba(255,255,255,0.05);
  }

  body {
    background-color: #12121a;
    color: #e0e0f0;
  }

  /* Ensure all text elements are visible */
  body, p, span, a, label, li, td, th, button, input, textarea, select {
    color: #e0e0f0;
  }

  h1, h2, h3, h4, h5, h6 {
    color: #ffffff;
  }

  /* Links should be distinguishable */
  a {
    color: #c8d6e5;
  }

  a:hover {
    color: #ffffff;
  }

  /* Muted text for timestamps, meta info */
  .text-muted, .info-label, .field-label, .form-label, .meta-info,
  .listing-loc, .listing-location, .timestamp, .date-label {
    color: #9090b0;
  }

  .card, .content-card, .card-glass, .error-card, .listing-card,
  .post-card, .topic-card, .user-card, .report-card, .message-card,
  .investigation-card, .config-card, .modal-card, .form-wrapper,
  .login-modal-card, .locked-card, .request-card, .profile-header-card,
  .content-section {
    background: #1e1e2e;
    border-color: #2d2d40;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  /* Specific class overrides for text visibility */
  .listing-title, .listing-price, .post-author, .post-body,
  .comment-text, .profile-name, .profile-bio, .section-title,
  .page-title, .card-title, .modal-card h2, .modal-card p,
  .info-message, .notification {
    color: #e0e0f0;
  }

  .listing-price {
    color: #c8a96e;
  }

  h1, h2, h3, h4, .section-title, .card-title, .profile-name,
  .logo, .logo em {
    color: #ffffff;
  }

  input, textarea, select {
    background: #2d2d40;
    color: #e0e0f0;
    border-color: #3b4a5e;
  }

  input::placeholder, textarea::placeholder {
    color: #888888;
    opacity: 1;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--deep);
    box-shadow: 0 0 0 3px rgba(43,92,146,0.3);
  }

  .btn-primary, .btn-hero-primary, .btn-submit, .btn-accept-terms {
    background: var(--gold);
    color: #0a1030;
  }

  .btn-ghost, .btn-outline {
    border-color: #3b4a5e;
    color: #c8d6e5;
  }

  header, .header-glass, .page-header, .hero, .how-section {
    background: var(--ink);
  }

  .search-box, .filter-section, .filter-bar {
    background: #1e1e2e;
    border-color: #2d2d40;
  }

  .tag-pill {
    background: #252535;
    color: #c8d6e5;
    border-color: #3b4a5e;
  }

  .composer, .composer-content {
    background: #1e1e2e;
    border-color: #2d2d40;
  }

  .comment-content {
    background: #252535;
  }

  /* Override any previously dark text colors */
  [style*="color: #0f172a"], [style*="color: #1a2a4a"], [style*="color: #333"],
  [style*="color: #0C1446"], [style*="color: #1a2555"] {
    color: #e0e0f0 !important;
  }
}
    </style>
</head>
<body>
    <div class="error-card">
        <div class="logo-title">Scor<span>alia</span></div>
        <h1 id="error-title">404 - Page Not Found</h1>
        <p id="error-text">Oops! The page you're looking for doesn't exist.</p>
        <a href="/" class="btn-home" id="btn-text">Back to Home</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('preferred_language') || 'en';
            const errorTitle = document.getElementById('error-title');
            const errorText = document.getElementById('error-text');
            const btnText = document.getElementById('btn-text');
            
            if (lang === 'fr') {
                errorTitle.textContent = "404 - Page introuvable";
                errorText.textContent = "Oups ! La page que vous cherchez n'existe pas.";
                btnText.textContent = "Retour à l'accueil";
            }
        });
    </script>
</body>
</html>
