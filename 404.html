<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Cheaplet</title>
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .error-card { padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; }
        h1 { color: #2E7D32; font-size: 5rem; margin-bottom: 10px; }
        p { color: #666; font-size: 1.2rem; margin-bottom: 30px; }
        .btn-home { background: #4CAF50; color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: bold; transition: background 0.2s; }
        .btn-home:hover { background: #388E3C; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <p id="error-text">Oops! The page you're looking for doesn't exist.</p>
        <a href="/index.html" class="btn-home" id="btn-text">Back to Home</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('preferred_language') || 'en';
            const errorText = document.getElementById('error-text');
            const btnText = document.getElementById('btn-text');
            
            if (lang === 'fr') {
                errorText.textContent = "Oups ! La page que vous cherchez n'existe pas.";
                btnText.textContent = "Retour à l'accueil";
            }
        });
    </script>
</body>
</html>
