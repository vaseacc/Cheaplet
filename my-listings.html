<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
    import { getFirestore, collection, query, where, onSnapshot, orderBy, doc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

    async function main() {
        const response = await fetch('/.netlify/functions/config');
        const config = await response.json();
        const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        const infoContainer = document.getElementById('info-container');
        const myListingsContainer = document.getElementById('my-listings-container');
        const reviewBanner = document.getElementById('review-banner');

        const rejectedModal = document.getElementById('rejected-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const reasonBox = document.getElementById('modal-rej-reason');

        const lang = localStorage.getItem('preferred_language') || 'en';
        const strings = {
            en: { 
                loading: '<i class="fas fa-circle-notch fa-spin"></i> Loading your listings...', 
                empty: '<i class="fas fa-book-open" style="font-size:2rem; color:var(--mist); display:block; margin-bottom:15px;"></i> You haven\'t posted any listings yet!', 
                confirm: "Delete this listing permanently?", deleting: "Deleting...", 
                btnEdit: "Edit", btnDel: "Delete", btnSold: "Mark Sold", confirmSold: "Mark this item as sold?", 
                badgeSold: "SOLD", badgePending: "⏳ IN REVIEW", badgeRejected: "❌ REJECTED",
                modalRejTitle: "Listing Rejected", modalRejDesc: "Our safety system blocked this listing for violating our community guidelines.",
                btnUnderstand: "I Understand", defaultReason: "Inappropriate content, spam, or prohibited items."
            },
            fr: { 
                loading: '<i class="fas fa-circle-notch fa-spin"></i> Chargement de vos annonces...', 
                empty: '<i class="fas fa-book-open" style="font-size:2rem; color:var(--mist); display:block; margin-bottom:15px;"></i> Vous n\'avez pas encore publié d\'annonces !', 
                confirm: "Supprimer cette annonce définitivement ?", deleting: "Suppression...", 
                btnEdit: "Modifier", btnDel: "Supprimer", btnSold: "Vendu", confirmSold: "Marquer cet article comme vendu ?", 
                badgeSold: "VENDU", badgePending: "⏳ EN RÉVISION", badgeRejected: "❌ REJETÉ",
                modalRejTitle: "Annonce Rejetée", modalRejDesc: "Notre système de sécurité a bloqué cette annonce pour non-respect de nos règles communautaires.",
                btnUnderstand: "Je comprends", defaultReason: "Contenu inapproprié, spam ou articles interdits."
            }
        };

        const ui = strings[lang];
        document.getElementById('modal-rej-title').textContent = ui.modalRejTitle;
        document.getElementById('modal-rej-desc').textContent = ui.modalRejDesc;
        btnCloseModal.textContent = ui.btnUnderstand;
        btnCloseModal.onclick = () => { rejectedModal.style.display = 'none'; };

        // Enhanced fetch with fallback
        async function fetchRejectionReason(listingId, attempt = 0) {
            try {
                // First try: exact match (type = "auto")
                let q = query(collection(db, "reports"), where("listingId", "==", listingId), where("type", "==", "auto"));
                let snap = await getDocs(q);
                if (snap.empty && attempt === 0) {
                    // Wait 1 second and try again (Firestore eventual consistency)
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    return fetchRejectionReason(listingId, 1);
                }
                if (snap.empty) {
                    // Try without type filter (maybe the report was created without type)
                    q = query(collection(db, "reports"), where("listingId", "==", listingId));
                    snap = await getDocs(q);
                }
                if (snap.empty) {
                    console.warn(`No report found for listing ${listingId}`);
                    return null;
                }
                const report = snap.docs[0].data();
                const details = report.details || "";
                console.log("Report details for listing", listingId, ":", details); // Debug output
                
                // Try to extract a clean reason
                let reason = "";
                const match = details.match(/Reason: (.+?)(?:\n|$)/i);
                if (match) {
                    reason = match[1].trim();
                } else if (details.length < 200) {
                    reason = details;
                } else {
                    const firstSentence = details.split(/[.!?]/)[0];
                    if (firstSentence && firstSentence.length < 150) {
                        reason = firstSentence.replace(/^.*?Reason: /i, '');
                    } else {
                        reason = details.substring(0, 150) + (details.length > 150 ? "…" : "");
                    }
                }
                return reason || ui.defaultReason;
            } catch (e) {
                console.error("Error fetching rejection reason:", e);
                return null;
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isOAuth = user.providerData.some(p => p.providerId === 'microsoft.com' || p.providerId === 'google.com');
                if (user.emailVerified || isOAuth) {
                    fetchMyListings(user.uid);
                } else {
                    window.location.href = '/LoginInToCheaplet.html';
                }
            } else {
                window.location.href = '/LoginInToCheaplet.html';
            }
        });

        function fetchMyListings(userId) {
            const q = query(collection(db, "listings"), where("posterUid", "==", userId), orderBy("timestamp", "desc"));
            infoContainer.innerHTML = `<p class="info-message">${ui.loading}</p>`;

            onSnapshot(q, (snapshot) => {
                myListingsContainer.innerHTML = '';
                let hasPending = false;

                if (snapshot.empty) {
                    infoContainer.innerHTML = `<p class="info-message">${ui.empty}</p>`;
                    reviewBanner.style.display = 'none';
                } else {
                    infoContainer.innerHTML = ''; 
                    let delay = 0;
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.status === 'pending') hasPending = true;
                        const card = renderMyListing(doc);
                        card.style.animationDelay = `${delay}s`;
                        delay += 0.05;
                        myListingsContainer.appendChild(card);
                    });
                    reviewBanner.style.display = hasPending ? 'block' : 'none';
                }
            });
        }
        
        function renderMyListing(listingDoc) {
            const data = listingDoc.data();
            const card = document.createElement('div');
            card.className = 'listing-card';
            const img = data.imageUrls?.[0] || '';
            
            const isSold = data.status === 'sold';
            const isPending = data.status === 'pending';
            const isRejected = data.status === 'rejected';
            
            let badgeHtml = '';
            if (isSold) badgeHtml = `<div class="status-badge status-sold">${ui.badgeSold}</div>`;
            else if (isPending) badgeHtml = `<div class="status-badge status-pending">${ui.badgePending}</div>`;
            else if (isRejected) badgeHtml = `<div class="status-badge status-rejected">${ui.badgeRejected}</div>`;
            
            let imgContent = badgeHtml;
            if (!img) imgContent += '<i class="fas fa-image"></i>';
            
            const canEdit = !isSold && !isPending && !isRejected;
            const editButtonHtml = canEdit ? `
                <a href="/edit-listing.html?id=${listingDoc.id}">
                    <button class="btn-action btn-edit"><i class="fas fa-pen"></i> ${ui.btnEdit}</button>
                </a>` : '';
            
            const disableActions = isPending || isRejected || isSold;

            card.innerHTML = `
                <div class="listing-image" style="background-image: url('${img}')">
                    ${imgContent}
                </div>
                <div class="listing-details">
                    <h3 class="listing-title">${data.title}</h3>
                    <div class="listing-price">$${data.price ? data.price.toFixed(2) : '0.00'}</div>
                </div>
                <div class="manage-buttons">
                    ${editButtonHtml}
                    <button class="btn-action btn-sold sold-btn" ${disableActions ? 'disabled' : ''}><i class="fas fa-check"></i> ${ui.btnSold}</button>
                    <button class="btn-action btn-delete delete-btn"><i class="fas fa-trash"></i> ${ui.btnDel}</button>
                </div>`;

            const imgDiv = card.querySelector('.listing-image');
            imgDiv.onclick = async () => {
                if (isRejected) {
                    reasonBox.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading reason...';
                    rejectedModal.style.display = 'flex';
                    const reason = await fetchRejectionReason(listingDoc.id);
                    if (reason) {
                        reasonBox.innerHTML = reason;
                    } else {
                        reasonBox.innerHTML = 'No specific reason available. The listing was rejected for violating our community guidelines.';
                    }
                } else if (isPending) {
                    // Do nothing
                } else {
                    window.location.href = `/listing.html?id=${listingDoc.id}`;
                }
            };

            const soldBtn = card.querySelector('.sold-btn');
            soldBtn.onclick = async () => {
                if (confirm(ui.confirmSold)) {
                    soldBtn.disabled = true;
                    soldBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    await updateDoc(doc(db, 'listings', listingDoc.id), { status: 'sold' });
                }
            };

            const delBtn = card.querySelector('.delete-btn');
            delBtn.onclick = async () => {
                if (confirm(ui.confirm)) {
                    delBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    delBtn.disabled = true;
                    await deleteDoc(doc(db, 'listings', listingDoc.id));
                }
            };
            return card;
        }
    }
    main();
                        </script>
