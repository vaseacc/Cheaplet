<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - Cheaplet</title>
    <!-- GLOBAL BRAIN -->
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .logo span { color: #FFD700; }
        nav ul { display: flex; list-style: none; margin: 0; padding: 0; gap: 20px; }
        .header-right { display: flex; align-items: center; gap: 15px; }

        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-delete { background: #f44336 !important; color: white !important; }
        .btn-sold { background: #2E7D32 !important; color: white !important; }
        .btn-sold:disabled { background: #aaa !important; opacity: 0.7; }

        .page-header { display: flex; justify-content: space-between; align-items: center; padding: 40px 0 20px; border-bottom: 1px solid #ddd; margin-bottom: 30px; }
        .page-header h1 { font-size: 2rem; margin: 0; }

        .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .listing-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: transform 0.3s; position: relative; }
        .listing-card:hover { transform: translateY(-5px); }
        
        .listing-image { height: 180px; background-color: #eee; background-size: cover; background-position: center; cursor: pointer; position: relative; }
        .sold-badge { position: absolute; top: 10px; left: 10px; background: rgba(244, 67, 54, 0.9); color: white; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; z-index: 5; }

        .listing-details { padding: 15px; flex-grow: 1; }
        .listing-title { font-weight: 600; font-size: 1rem; margin-bottom: 5px; }
        .listing-price { color: #4CAF50; font-weight: bold; font-size: 1.1rem; }

        .manage-buttons { border-top: 1px solid #eee; padding: 10px; display: flex; gap: 8px; background: #f9f9f9; flex-wrap: wrap; }
        .manage-buttons a { flex: 1; text-decoration: none; min-width: 70px; }
        .manage-buttons .btn { width: 100%; }

        .info-message { text-align: center; padding: 100px 0; font-size: 1.2rem; color: #999; }
        
        footer { background: linear-gradient(135deg, #2E7D32 0%, #1b5e20 100%); color: white; padding: 40px 0 20px; margin-top: 40px; }
        .copyright { text-align: center; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; color: #ccc; }
        @media (max-width: 767px) { nav { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-left">
                <a href="/index.html" class="logo">Cheap<span>let</span></a>
                <nav><ul></ul></nav>
            </div>
            <div class="header-right"></div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 data-i18n="nav_listings">My Listings</h1>
            <a href="/messages.html" class="btn" data-i18n="nav_messages">Messages</a>
        </div>

        <div id="info-container">
            <p class="info-message">...</p>
        </div>
    
        <section class="listings">
            <div class="listings-grid" id="my-listings-container"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="copyright">© 2025 Cheaplet. All rights reserved.</div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const infoContainer = document.getElementById('info-container');
            const myListingsContainer = document.getElementById('my-listings-container');

            const lang = localStorage.getItem('preferred_language') || 'en';
            const strings = {
                en: { loading: "Loading your listings...", empty: "You haven't posted any listings yet!", confirm: "Delete this listing permanently?", deleting: "Deleting...", btnEdit: "Edit", btnDel: "Delete", btnSold: "Sold", confirmSold: "Mark this item as sold?", badgeSold: "SOLD" },
                fr: { loading: "Chargement de vos annonces...", empty: "Vous n'avez pas encore publié d'annonces !", confirm: "Supprimer cette annonce définitivement ?", deleting: "Suppression...", btnEdit: "Modifier", btnDel: "Supprimer", btnSold: "Vendu", confirmSold: "Marquer cet article comme vendu ?", badgeSold: "VENDU" }
            };

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const isOAuth = user.providerData.some(p => p.providerId === 'microsoft.com' || p.providerId === 'google.com');
                    if (user.emailVerified || isOAuth) {
                        fetchMyListings(user.uid);
                    } else {
                        window.location.href = '/LoginInToCheaplet.html';
                    }
                } else {
                    window.location.href = '/LoginInToCheaplet.html';
                }
            });

            function fetchMyListings(userId) {
                const q = query(collection(db, "listings"), where("posterUid", "==", userId), orderBy("timestamp", "desc"));
                infoContainer.innerHTML = `<p class="info-message">${strings[lang].loading}</p>`;

                onSnapshot(q, (snapshot) => {
                    myListingsContainer.innerHTML = '';
                    if (snapshot.empty) {
                        infoContainer.innerHTML = `<p class="info-message">${strings[lang].empty}</p>`;
                    } else {
                        infoContainer.innerHTML = ''; 
                        snapshot.forEach((doc) => {
                            myListingsContainer.appendChild(renderMyListing(doc));
                        });
                    }
                });
            }
            
            function renderMyListing(listingDoc) {
                const data = listingDoc.data();
                const card = document.createElement('div');
                card.className = 'listing-card';
                const img = data.imageUrls?.[0] || '';
                const isSold = data.status === 'sold';
                
                // Show Edit button ONLY if not sold
                const editButtonHtml = isSold ? '' : `
                    <a href="/edit-listing.html?id=${listingDoc.id}">
                        <button class="btn btn-secondary">${strings[lang].btnEdit}</button>
                    </a>`;
                
                card.innerHTML = `
                    <div class="listing-image" style="background-image: url('${img}')" onclick="window.location.href='/listing.html?id=${listingDoc.id}'">
                        ${isSold ? `<div class="sold-badge">${strings[lang].badgeSold}</div>` : ''}
                    </div>
                    <div class="listing-details">
                        <h3 class="listing-title">${data.title}</h3>
                        <div class="listing-price">$${data.price ? data.price.toFixed(2) : '0.00'}</div>
                    </div>
                    <div class="manage-buttons">
                        ${editButtonHtml}
                        <button class="btn btn-sold sold-btn" ${isSold ? 'disabled' : ''}>${strings[lang].btnSold}</button>
                        <button class="btn btn-delete delete-btn">${strings[lang].btnDel}</button>
                    </div>`;

                const soldBtn = card.querySelector('.sold-btn');
                soldBtn.onclick = async () => {
                    if (confirm(strings[lang].confirmSold)) {
                        soldBtn.disabled = true;
                        await updateDoc(doc(db, 'listings', listingDoc.id), { status: 'sold' });
                    }
                };

                const delBtn = card.querySelector('.delete-btn');
                delBtn.onclick = async () => {
                    if (confirm(strings[lang].confirm)) {
                        delBtn.textContent = strings[lang].deleting;
                        delBtn.disabled = true;
                        await deleteDoc(doc(db, 'listings', listingDoc.id));
                    }
                };
                return card;
            }
        }
        main();
    </script>
</body>
</html>
