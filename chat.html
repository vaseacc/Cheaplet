<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - Cheaplet</title>
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; padding: 0 15px; height: 100%; }

        header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100; flex-shrink: 0; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .logo span { color: #FFD700; }
        
        .chat-main-wrapper { display: flex; flex-grow: 1; width: 100%; max-width: 1300px; margin: 0 auto; background: white; border-left: 1px solid #eee; border-right: 1px solid #eee; overflow: hidden; }
        
        .chat-sidebar { width: 320px; border-right: 1px solid #eee; display: flex; flex-direction: column; background: #fdfdfd; flex-shrink: 0; transition: 0.3s ease; }
        .sidebar-header { padding: 20px; font-weight: 800; font-size: 1.2rem; border-bottom: 1px solid #eee; color: #2E7D32; flex-shrink: 0; }
        #sidebar-list { flex-grow: 1; overflow-y: auto; }
        
        .side-conv-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f9f9f9; text-decoration: none; color: inherit; position: relative; }
        .side-avatar { width: 45px; height: 45px; border-radius: 50%; background: #4CAF50; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; overflow: hidden; }
        .side-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .chat-window { flex-grow: 1; display: flex; flex-direction: column; background: white; position: relative; overflow: hidden; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: 700; color: #050505; background: #fff; display: flex; align-items: center; gap: 15px; z-index: 10; flex-shrink: 0; }
        #chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; display: none; }
        #report-chat-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-size: 1.2rem; }

        .listing-preview-banner { display: flex; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; gap: 12px; flex-shrink: 0; text-decoration: none; color: inherit; }
        .lp-img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
        
        #messages-list { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; background-color: #fcfcfc; }
        .message-row { display: flex; width: 100%; margin-bottom: 15px; align-items: flex-end; }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; gap: 8px; }
        .chat-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #ddd; flex-shrink: 0; margin-bottom: 20px; }
        
        .message-bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; }
        .message-bubble.sent { background-color: #4CAF50; color: white; border-bottom-right-radius: 4px; }
        .message-bubble.received { background-color: #f1f0f0; color: #333; border-bottom-left-radius: 4px; }
        
        .date-separator { text-align: center; margin: 20px 0; font-size: 0.8rem; font-weight: bold; color: #888; }
        .date-separator span { background: #f0f0f0; padding: 4px 12px; border-radius: 12px; }

        .message-form { 
            display: flex; align-items: center; padding: 15px; padding-bottom: max(15px, env(safe-area-inset-bottom)); 
            border-top: 1px solid #eee; background: white; gap: 10px; flex-shrink: 0; width: 100%;
        }
        #message-input { flex-grow: 1; border: 1px solid #ddd; border-radius: 25px; padding: 10px 20px; outline: none; }
        #send-btn { border-radius: 50%; width: 40px; height: 40px; background: #FFD700; border: none; cursor: pointer; flex-shrink: 0; }

        .sold-banner { background: #fff3e0; color: #e65100; text-align: center; padding: 12px; font-weight: bold; display: none; flex-shrink: 0; }
        .rating-container { display: flex; flex-direction: column; align-items: center; padding: 15px; padding-bottom: max(15px, env(safe-area-inset-bottom)); background: white; border-top: 1px solid #eee; display: none; flex-shrink: 0; }
        .stars { display: flex; gap: 10px; font-size: 1.8rem; color: #ddd; cursor: pointer; margin: 10px 0; }
        .stars .fas.active { color: #FFD700; }
        .btn-rate { background: #4CAF50; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; }
        @media (max-width: 767px) { 
            .chat-sidebar { position: fixed; left: -100%; top: 60px; height: calc(100dvh - 60px); z-index: 1000; width: 85%; }
            .chat-sidebar.open { left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/index.html" class="logo">Cheap<span>let</span></a>
        </div>
    </header>

    <div class="chat-main-wrapper">
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="sidebar-header">Messages</div>
            <div id="sidebar-list"></div>
        </aside>

        <main class="chat-window">
            <div id="info-container"><p class="info-message">Loading...</p></div>
            <div id="chat-active-ui" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <button id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <img id="chat-header-avatar" src="">
                    <span id="chat-header-name">Chat</span>
                    <button id="report-chat-btn"><i class="fas fa-flag"></i></button>
                </div>
                <a href="#" id="listing-preview-banner" class="listing-preview-banner" style="display: none;">
                    <img src="" class="lp-img" id="lp-image">
                    <div class="lp-info"><span class="lp-title" id="lp-title">...</span></div>
                </a>
                <div id="messages-list"></div>
                <div class="sold-banner" id="sold-banner">Listing Sold</div>
                <div class="rating-container" id="rating-container">
                    <div class="stars" id="star-rating"><i class="fas fa-star" data-val="1"></i><i class="fas fa-star" data-val="2"></i><i class="fas fa-star" data-val="3"></i><i class="fas fa-star" data-val="4"></i><i class="fas fa-star" data-val="5"></i></div>
                    <button class="btn-rate" id="btn-submit-rating">Submit</button>
                </div>
                <form id="message-form" class="message-form">
                    <button type="button" id="img-upload-btn"><i class="fas fa-camera"></i></button>
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-btn">&#10148;</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, where, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const sidebar = document.getElementById('chat-sidebar');
            const messagesList = document.getElementById('messages-list');
            const messageForm = document.getElementById('message-form');
            const messageInput = document.getElementById('message-input');
            const stars = document.querySelectorAll('#star-rating .fas');
            let selectedRating = 0;

            onAuthStateChanged(auth, user => {
                if (user) {
                    const chatId = new URLSearchParams(window.location.search).get('id');
                    if (chatId) initializeChat(chatId, user);
                }
            });

            async function initializeChat(chatId, currentUser) {
                const chatRef = doc(db, 'chats', chatId);
                const chatSnap = await getDoc(chatRef);
                if (!chatSnap.exists()) return;
                
                document.getElementById('info-container').style.display = 'none';
                document.getElementById('chat-active-ui').style.display = 'flex';
                
                // Keyboard fix
                messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') messageInput.blur();
                });

                // Render Messages
                onSnapshot(query(collection(db, 'chats', chatId, 'messages'), orderBy("timestamp", "asc")), (snapshot) => {
                    messagesList.innerHTML = '';
                    snapshot.forEach(doc => renderMessage(doc.data(), currentUser.uid));
                    messagesList.scrollTop = messagesList.scrollHeight;
                });
            }

            function renderMessage(data, currentUserId) {
                const isSent = data.senderId === currentUserId;
                const row = document.createElement('div');
                row.className = `message-row ${isSent ? 'sent' : 'received'}`;
                row.innerHTML = `<div class="message-bubble ${isSent ? 'sent' : 'received'}"><p>${data.text || 'Image'}</p></div>`;
                messagesList.appendChild(row);
            }
            
            stars.forEach(star => {
                star.onclick = function() {
                    selectedRating = parseInt(this.getAttribute('data-val'));
                    stars.forEach(s => s.classList.toggle('active', parseInt(s.getAttribute('data-val')) <= selectedRating));
                };
            });
        }
        main();
    </script>
</body>
</html>
