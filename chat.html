<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* (same styles as before) */
        :root {
            --ink: #0C1446;
            --deep: #2B5C92;
            --off-white: #F8FAFC;
            --white: #FFFFFF;
            --gold: #C8A96E;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(12,20,70,0.05);
            --border: 1px solid #e2e8f0;
            --red: #e53e3e;
            --green: #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }

        header { background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        .chat-header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; background: var(--white); border-bottom: var(--border); }
        .back-btn { color: var(--text-muted); font-size: 1.3rem; text-decoration: none; }
        .chat-user { display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .chat-username { font-weight: 700; font-size: 1.1rem; color: var(--ink); }

        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; max-width: 70%; }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .message-bubble { padding: 12px 16px; border-radius: 18px; background: var(--white); border: var(--border); word-wrap: break-word; }
        .sent .message-bubble { background: var(--deep); color: white; border: none; }
        .message-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; text-align: right; }

        .request-card { background: #f0f7ff; border: 1px solid var(--deep); border-radius: 12px; padding: 16px; margin: 10px 0; }
        .request-text { font-weight: 600; margin-bottom: 12px; }
        .request-actions { display: flex; gap: 10px; }
        .btn-accept { background: var(--green); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .btn-decline { background: var(--red); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .request-status { font-weight: 600; color: var(--deep); }

        .message-input-area { display: flex; gap: 10px; padding: 15px 20px; background: var(--white); border-top: var(--border); }
        .message-input { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 30px; font-family: inherit; font-size: 1rem; outline: none; }
        .send-btn { background: var(--deep); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 600px) {
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="/index.html" class="logo">Scor<em>alia</em></a>
        <div></div>
    </div>
</header>

<div class="chat-header">
    <a href="/messages.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="chat-user">
        <img id="chat-avatar" class="chat-avatar" src="" alt="">
        <span id="chat-username" class="chat-username">Loading...</span>
    </div>
</div>

<div class="messages-container" id="messages-container">
    <div style="text-align:center; color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading messages...</div>
</div>

<div class="message-input-area">
    <input type="text" class="message-input" id="message-input" placeholder="Type a message...">
    <button class="send-btn" id="send-btn" disabled><i class="fas fa-paper-plane"></i></button>
</div>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

    async function main() {
        const response = await fetch('/.netlify/functions/config');
        const config = await response.json();
        const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id');
        if (!chatId) { window.location.href = '/messages.html'; return; }

        const lang = localStorage.getItem('preferred_language') || 'en';
        const ui = {
            en: { 
                accept: "Accept", decline: "Decline", requestApproved: "Request approved!", requestDeclined: "Request declined.",
                statusPending: "Pending...", statusApproved: "Approved", statusDeclined: "Declined"
            },
            fr: { 
                accept: "Accepter", decline: "Refuser", requestApproved: "Demande acceptée !", requestDeclined: "Demande refusée.",
                statusPending: "En attente...", statusApproved: "Acceptée", statusDeclined: "Refusée"
            }
        }[lang] || { 
            accept: "Accept", decline: "Decline", requestApproved: "Request approved!", requestDeclined: "Request declined.",
            statusPending: "Pending...", statusApproved: "Approved", statusDeclined: "Declined"
        };

        let currentUser = null;
        let chatData = null;
        let otherUser = null;
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatAvatar = document.getElementById('chat-avatar');
        const chatUsername = document.getElementById('chat-username');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/login.html?redirect=' + encodeURIComponent(`/chat.html?id=${chatId}`); return; }
            currentUser = user;
            console.log("Chat page: currentUser UID:", currentUser.uid);
            await initializeChat();
        });

        async function initializeChat() {
            try {
                const chatRef = doc(db, "chats", chatId);
                const chatSnap = await getDoc(chatRef);
                if (!chatSnap.exists()) { 
                    console.error("Chat document not found");
                    window.location.href = '/messages.html'; 
                    return; 
                }
                chatData = chatSnap.data();
                console.log("Chat data:", chatData);
                
                const otherUid = chatData.participants.find(uid => uid !== currentUser.uid);
                if (!otherUid) { 
                    console.error("Other participant not found in", chatData.participants);
                    window.location.href = '/messages.html'; 
                    return; 
                }
                console.log("Other participant UID:", otherUid);

                const userDoc = await getDoc(doc(db, "users", otherUid));
                otherUser = userDoc.exists() ? userDoc.data() : { displayName: "User", photoURL: null };
                chatUsername.textContent = otherUser.displayName || "User";
                chatAvatar.src = otherUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${otherUid}&backgroundColor=EBF2FA`;

                messageInput.addEventListener('input', () => sendBtn.disabled = !messageInput.value.trim());
                sendBtn.onclick = sendMessage;
                messageInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });

                loadMessages();
            } catch(e) { 
                console.error("Initialize chat error:", e); 
                window.location.href = '/messages.html'; 
            }
        }

        function loadMessages() {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                console.log(`Loaded ${snapshot.docs.length} messages`);
                messagesContainer.innerHTML = '';
                if (snapshot.empty) {
                    messagesContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted);">No messages yet.</div>';
                    return;
                }
                snapshot.docs.forEach(docSnap => {
                    const msg = docSnap.data();
                    const msgId = docSnap.id;
                    const isSent = msg.senderUid === currentUser.uid;

                    console.log("Message:", msg.type || 'regular', "ID:", msgId, "isSent:", isSent);

                    if (msg.type === 'join_request') {
                        renderJoinRequest(msg, msgId, isSent);
                    } else {
                        renderRegularMessage(msg, isSent);
                    }
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, (error) => {
                console.error("Error loading messages:", error);
                messagesContainer.innerHTML = '<div style="text-align:center; color:var(--red);">Error loading messages. Check console.</div>';
            });
        }

        function renderRegularMessage(msg, isSent) {
            const div = document.createElement('div');
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(msg.text || '')}</div>
                <div class="message-time">${formatTime(msg.timestamp?.toDate() || new Date())}</div>
            `;
            messagesContainer.appendChild(div);
        }

        function renderJoinRequest(msg, msgId, isSent) {
            const card = document.createElement('div');
            card.className = 'request-card';
            
            const status = msg.status || 'pending';
            const isOwner = currentUser.uid === msg.recipientUid;
            console.log("Rendering join request:", { msgId, status, isOwner, recipientUid: msg.recipientUid, currentUid: currentUser.uid });
            
            if (isOwner && status === 'pending') {
                card.innerHTML = `
                    <div class="request-text"><i class="fas fa-user-plus"></i> ${escapeHtml(msg.text || '')}</div>
                    <div class="request-actions">
                        <button class="btn-accept" data-msg-id="${msgId}">${ui.accept}</button>
                        <button class="btn-decline" data-msg-id="${msgId}">${ui.decline}</button>
                    </div>
                `;
                card.querySelector('.btn-accept').onclick = () => handleRequestResponse(msg, msgId, 'approved');
                card.querySelector('.btn-decline').onclick = () => handleRequestResponse(msg, msgId, 'rejected');
            } else {
                let statusText = status === 'pending' ? ui.statusPending : (status === 'approved' ? ui.statusApproved : ui.statusDeclined);
                let icon = status === 'pending' ? '⏳' : (status === 'approved' ? '✅' : '❌');
                card.innerHTML = `
                    <div class="request-text"><i class="fas fa-user-plus"></i> ${escapeHtml(msg.text || '')}</div>
                    <div class="request-status">${icon} ${statusText}</div>
                `;
            }
            messagesContainer.appendChild(card);
        }

        async function handleRequestResponse(msg, msgId, newStatus) {
            console.log(`Handling request response: ${newStatus} for message ${msgId}`);
            try {
                await updateDoc(doc(db, "chats", chatId, "messages", msgId), { status: newStatus });
                
                if (newStatus === 'approved' && msg.topicId) {
                    console.log(`Adding user ${msg.senderUid} to topic ${msg.topicId} members`);
                    await updateDoc(doc(db, "social_channels", msg.topicId), {
                        members: arrayUnion(msg.senderUid)
                    });
                }
                
                const systemText = newStatus === 'approved' ? ui.requestApproved : ui.requestDeclined;
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    text: systemText,
                    senderUid: currentUser.uid,
                    timestamp: serverTimestamp()
                });
                await updateDoc(doc(db, "chats", chatId), { 
                    lastMessage: systemText,
                    lastMessageTimestamp: serverTimestamp() 
                });
                console.log("Request handled successfully.");
            } catch(e) { 
                console.error("Error handling request:", e); 
                alert("Error updating request."); 
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            sendBtn.disabled = true;
            messageInput.value = '';
            try {
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    text,
                    senderUid: currentUser.uid,
                    timestamp: serverTimestamp()
                });
                await updateDoc(doc(db, "chats", chatId), { 
                    lastMessage: text,
                    lastMessageTimestamp: serverTimestamp() 
                });
                console.log("Message sent.");
            } catch(e) { 
                console.error("Send message error:", e);
                alert("Failed to send message."); 
            }
            sendBtn.disabled = false;
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    }
    main();
</script>
</body>
</html>
