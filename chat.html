<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Cheaplet</title>
    <!-- GLOBAL BRAIN -->
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; padding: 0 15px; height: 100%; }

        header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100; flex-shrink: 0; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .logo span { color: #FFD700; }
        nav ul { display: flex; list-style: none; gap: 20px; }
        .header-right { display: flex; align-items: center; gap: 15px; }

        .chat-main-wrapper { display: flex; height: calc(100vh - 65px); max-width: 1300px; margin: 0 auto; background: white; border-left: 1px solid #eee; border-right: 1px solid #eee; }

        /* --- SIDEBAR --- */
        .chat-sidebar { width: 320px; border-right: 1px solid #eee; display: flex; flex-direction: column; background: #fdfdfd; flex-shrink: 0; transition: 0.3s ease; }
        .sidebar-header { padding: 20px; font-weight: 800; font-size: 1.2rem; border-bottom: 1px solid #eee; color: #2E7D32; }
        #sidebar-list { flex-grow: 1; overflow-y: auto; }
        
        .side-conv-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f9f9f9; text-decoration: none; color: inherit; position: relative; }
        .side-conv-item:hover { background: #f1f8e9; }
        .side-conv-item.active { background: #e8f5e9; border-left: 4px solid #4CAF50; }
        .side-avatar { width: 40px; height: 40px; border-radius: 50%; background: #4CAF50; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
        .side-info { overflow: hidden; flex-grow: 1; }
        .side-name { font-weight: 600; font-size: 0.95rem; }
        .side-msg { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .unread-dot { width: 10px; height: 10px; background-color: #f44336; border-radius: 50%; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); display: none; }
        .side-conv-item.is-new .unread-dot { display: block; }

        /* --- CHAT WINDOW --- */
        .chat-window { flex-grow: 1; display: flex; flex-direction: column; background: white; position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: 700; color: #2E7D32; background: #fff; display: flex; align-items: center; gap: 15px; z-index: 10; }
        
        /* LISTING PREVIEW BANNER */
        .listing-preview-banner {
            display: flex; align-items: center; padding: 10px 20px; background: #fff;
            border-bottom: 1px solid #eee; gap: 12px; flex-shrink: 0;
            text-decoration: none; color: inherit; transition: background 0.2s;
        }
        .listing-preview-banner:hover { background: #f9f9f9; }
        .lp-img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; background: #eee; }
        .lp-info { flex-grow: 1; overflow: hidden; }
        .lp-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .lp-price { color: #4CAF50; font-weight: bold; font-size: 0.85rem; }
        .lp-status { font-size: 0.75rem; color: #d32f2f; font-weight: bold; text-transform: uppercase; }

        #mobile-menu-btn { display: none; background: none; border: none; font-size: 1.2rem; color: #4CAF50; cursor: pointer; }

        #messages-list { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; background-color: #fcfcfc; }
        .message-bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; margin-bottom: 12px; word-wrap: break-word; position: relative; }
        .message-bubble.sent { background-color: #4CAF50; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message-bubble.received { background-color: #f1f0f0; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .message-img { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 5px; cursor: pointer; }
        .message-timestamp { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-top: 4px; text-align: right; }
        .message-bubble.received .message-timestamp { color: #888; }

        .message-form { display: flex; align-items: center; padding: 15px; border-top: 1px solid #eee; background: white; gap: 10px; }
        #img-upload-btn { background: #f0f0f0; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        #message-input { flex-grow: 1; border: 1px solid #ddd; border-radius: 25px; padding: 10px 20px; outline: none; }
        #send-btn { border-radius: 50%; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; background: #FFD700; color: #333; border: none; cursor: pointer; font-size: 1.1rem; }

        .info-message { text-align: center; padding: 100px 0; font-size: 1.2rem; color: #999; }

        /* MOBILE RESPONSIVE FIX */
        @media (max-width: 767px) {
            #mobile-menu-btn { display: block; }
            .chat-sidebar { position: fixed; left: -100%; top: 60px; height: calc(100vh - 60px); z-index: 1000; width: 85%; box-shadow: 10px 0 20px rgba(0,0,0,0.1); }
            .chat-sidebar.open { left: 0; }
            nav { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/index.html" class="logo">Cheap<span>let</span></a>
            <nav><ul></ul></nav>
            <div class="header-right"></div> 
        </div>
    </header>

    <div class="chat-main-wrapper">
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="sidebar-header" data-i18n="nav_messages">Messages</div>
            <div id="sidebar-list"></div>
        </aside>

        <main class="chat-window">
            <div id="info-container">
                <p class="info-message" data-i18n="loading_chat">Loading chat...</p>
            </div>

            <div id="chat-active-ui" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <button id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <span id="chat-header-name">Chat</span>
                </div>

                <!-- LISTING PREVIEW BANNER -->
                <a href="#" id="listing-preview-banner" class="listing-preview-banner" style="display: none;">
                    <img src="" class="lp-img" id="lp-image">
                    <div class="lp-info">
                        <span class="lp-title" id="lp-title">...</span>
                        <span class="lp-price" id="lp-price"></span>
                        <span class="lp-status" id="lp-status"></span>
                    </div>
                    <i class="fas fa-chevron-right" style="color: #ccc;"></i>
                </a>

                <div id="messages-list"></div>
                
                <form id="message-form" class="message-form">
                    <input type="file" id="hidden-file-input" accept="image/*" style="display: none;">
                    <button type="button" id="img-upload-btn"><i class="fas fa-camera"></i></button>
                    <input type="text" id="message-input" data-i18n-placeholder="search_placeholder" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-btn">&#10148;</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, where } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${config.cloudinary.cloudName}/image/upload`;
            const UPLOAD_PRESET = config.cloudinary.uploadPreset;

            const sidebar = document.getElementById('chat-sidebar');
            const sidebarList = document.getElementById('sidebar-list');
            const chatActiveUI = document.getElementById('chat-active-ui');
            const messagesList = document.getElementById('messages-list');
            const messageForm = document.getElementById('message-form');
            const messageInput = document.getElementById('message-input');
            const chatHeaderName = document.getElementById('chat-header-name');
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');

            const lpBanner = document.getElementById('listing-preview-banner');
            const lpImage = document.getElementById('lp-image');
            const lpTitle = document.getElementById('lp-title');
            const lpPrice = document.getElementById('lp-price');
            const lpStatus = document.getElementById('lp-status');

            const lang = localStorage.getItem('preferred_language') || 'en';
            const strings = { en: { chatWith: "Chat with", imageSent: "Sent a photo", sold: "SOLD" }, fr: { chatWith: "Discussion avec", imageSent: "A envoyé une photo", sold: "VENDU" } };

            // --- FIXED: MOBILE MENU TOGGLE AND CLICK-AWAY LOGIC ---
            mobileMenuBtn.onclick = (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            };

            document.addEventListener('click', (e) => {
                if (window.innerWidth < 768 && sidebar.classList.contains('open')) {
                    // If the user clicks anywhere outside the sidebar, close it
                    if (!sidebar.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });

            onAuthStateChanged(auth, user => {
                if (user && user.emailVerified) {
                    loadSidebar(user);
                    const chatId = new URLSearchParams(window.location.search).get('id');
                    if (chatId) initializeChat(chatId, user);
                } else { window.location.href = '/LoginInToCheaplet.html'; }
            });

            function loadSidebar(currentUser) {
                const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.uid), orderBy("lastUpdate", "desc"));
                onSnapshot(q, (snapshot) => {
                    sidebarList.innerHTML = '';
                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        const otherId = d.participants.find(p => p !== currentUser.uid);
                        const otherName = d.participantInfo ? d.participantInfo[otherId] : 'User';
                        const isNew = d.lastSenderId && d.lastSenderId !== currentUser.uid;
                        const item = document.createElement('a');
                        item.className = `side-conv-item ${docSnap.id === new URLSearchParams(window.location.search).get('id') ? 'active' : ''} ${isNew ? 'is-new' : ''}`;
                        item.href = `?id=${docSnap.id}`;
                        item.innerHTML = `<div class="side-avatar">${otherName.charAt(0).toUpperCase()}</div><div class="side-info"><div class="side-name">${otherName}</div><div class="side-msg">${d.lastMessage || '...'}</div></div><div class="unread-dot"></div>`;
                        sidebarList.appendChild(item);
                    });
                });
            }

            async function initializeChat(chatId, currentUser) {
                const chatRef = doc(db, 'chats', chatId);
                const chatSnap = await getDoc(chatRef);
                if (!chatSnap.exists() || !chatSnap.data().participants.includes(currentUser.uid)) return;
                
                document.getElementById('info-container').style.display = 'none';
                chatActiveUI.style.display = 'flex';
                
                const d = chatSnap.data();
                const otherId = d.participants.find(p => p !== currentUser.uid);
                const otherName = d.participantInfo ? d.participantInfo[otherId] : 'User';
                chatHeaderName.textContent = `${strings[lang].chatWith} ${otherName}`;

                if (d.listingId) {
                    const lSnap = await getDoc(doc(db, 'listings', d.listingId));
                    if (lSnap.exists()) {
                        const ld = lSnap.data();
                        lpBanner.style.display = 'flex';
                        lpBanner.href = `/listing.html?id=${d.listingId}`;
                        lpImage.src = ld.imageUrls?.[0] || '';
                        lpTitle.textContent = ld.title;
                        if (ld.status === 'sold') {
                            lpPrice.style.display = 'none';
                            lpStatus.textContent = strings[lang].sold;
                        } else {
                            lpStatus.style.display = 'none';
                            lpPrice.textContent = `$${ld.price.toFixed(2)}`;
                        }
                    }
                }

                if (chatSnap.data().lastSenderId !== currentUser.uid) {
                    await updateDoc(chatRef, { lastSenderId: currentUser.uid });
                }

                onSnapshot(query(collection(db, 'chats', chatId, 'messages'), orderBy("timestamp", "asc")), (snapshot) => {
                    messagesList.innerHTML = '';
                    snapshot.forEach(doc => renderMessage(doc.data(), currentUser.uid));
                    messagesList.scrollTop = messagesList.scrollHeight;
                });

                messageForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const text = messageInput.value.trim();
                    if (!text) return;
                    messageInput.value = '';
                    await addDoc(collection(db, 'chats', chatId, 'messages'), { text, senderId: currentUser.uid, timestamp: serverTimestamp() });
                    await updateDoc(chatRef, { lastMessage: text, lastUpdate: serverTimestamp(), lastSenderId: currentUser.uid });
                };

                document.getElementById('img-upload-btn').onclick = () => document.getElementById('hidden-file-input').click();
                document.getElementById('hidden-file-input').onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData }).then(r => r.json());
                    await addDoc(collection(db, 'chats', chatId, 'messages'), { imageUrl: res.secure_url, senderId: currentUser.uid, timestamp: serverTimestamp() });
                    await updateDoc(chatRef, { lastMessage: `📷 ${strings[lang].imageSent}`, lastUpdate: serverTimestamp(), lastSenderId: currentUser.uid });
                };
            }

            function renderMessage(data, currentUserId) {
                const div = document.createElement('div');
                div.className = `message-bubble ${data.senderId === currentUserId ? 'sent' : 'received'}`;
                let content = data.imageUrl ? `<img src="${data.imageUrl}" class="message-img" onclick="window.open('${data.imageUrl}', '_blank')">` : '';
                content += data.text ? `<p>${data.text}</p>` : '';
                const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
                div.innerHTML = `${content}<span class="message-timestamp">${time}</span>`;
                messagesList.appendChild(div);
            }
        }
        main();
    </script>
</body>
</html>
