<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login / Register - Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:        #C8A96E;
            --gold-light:  #e0c48f;
            --gold-solid:  #C8A96E;
            --navy:        #0C1446;
            --navy-card:   rgba(12, 20, 70, 0.85);
            --navy-input:  rgba(255,255,255,0.055);
            --border:      rgba(200,169,110,0.26);
            --border-dim:  rgba(255,255,255,0.09);
            --text:        #f4eedd;
            --muted:       rgba(244,238,221,0.55);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overflow-x: hidden; }

        body {
            background: var(--navy);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── CANVAS BACKGROUND ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── HEADER ── */
        header {
            position: relative;
            z-index: 20;
            background: rgba(12, 20, 70, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-dim);
            padding: 15px 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            justify-content: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 0.01em;
        }

        .logo span { color: var(--gold); }

        /* ── WRAPPER ── */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 57px);
            padding: 30px 16px;
            perspective: 1200px;
        }

        /* ── 3D CARD ── */
        .card-scene {
            width: 100%;
            max-width: 460px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .auth-card {
            position: relative;
            background: var(--navy-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 46px 42px 40px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 2px 0 rgba(200,169,110,0.08) inset,
                0 60px 120px rgba(0,0,0,0.60),
                0 24px 48px rgba(0,0,0,0.35),
                0 0 80px rgba(200,169,110,0.06);
            transform-style: preserve-3d;
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(36px) rotateX(6deg) scale(0.96); }
            to   { opacity: 1; transform: translateY(0)    rotateX(0deg) scale(1); }
        }

        /* Sheen layer that reacts to mouse */
        .card-sheen {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: radial-gradient(
                600px circle at var(--mx, 50%) var(--my, 50%),
                rgba(200,169,110,0.055),
                transparent 50%
            );
            pointer-events: none;
            z-index: 1;
            transition: background 0.15s ease;
        }

        /* Top-left corner accent line */
        .auth-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 90px; height: 90px;
            border-top: 1.5px solid rgba(200,169,110,0.50);
            border-left: 1.5px solid rgba(200,169,110,0.50);
            border-radius: 22px 0 0 0;
            pointer-events: none;
        }

        .card-inner { position: relative; z-index: 2; }

        /* ── TITLE AREA ── */
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ── ERROR ── */
        .error-message {
            color: #ff8f8f;
            background: rgba(255,80,80,0.07);
            border: 1px solid rgba(255,80,80,0.18);
            padding: 10px 14px;
            border-radius: 9px;
            margin-bottom: 18px;
            display: none;
            font-size: 12.5px;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-5px); }
            75%      { transform: translateX(5px); }
        }

        /* ── STUDENT TIP ── */
        .student-tip {
            display: none;
            align-items: flex-start;
            gap: 10px;
            background: rgba(200,169,110,0.06);
            border: 1px solid rgba(200,169,110,0.20);
            color: rgba(240,233,214,0.65);
            padding: 11px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            line-height: 1.55;
            animation: slideDown 0.3s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .student-tip i { color: var(--gold); font-size: 13px; flex-shrink: 0; margin-top: 2px; }
        .student-tip strong { color: var(--gold-light); font-weight: 600; }

        /* ── FIELDS ── */
        .field-wrap { margin-bottom: 12px; }

        .field-label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        /* Unified input styling */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            display: block;
            width: 100%;
            height: 46px;
            padding: 0 16px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input::placeholder { color: rgba(244,238,221,0.22); }

        input:focus {
            border-color: rgba(200,169,110,0.50);
            background: rgba(200,169,110,0.05);
            box-shadow: 0 0 0 3px rgba(200,169,110,0.08);
        }

        /* Autofill fix */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px rgba(12,20,70,0.95) inset !important;
            -webkit-text-fill-color: var(--text) !important;
            border-color: rgba(200,169,110,0.35) !important;
        }

        /* Slide-in register fields */
        #register-fields {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.45s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease;
        }

        #register-fields.visible {
            max-height: 200px;
            opacity: 1;
        }

        /* Username hint & availability */
        .username-hint {
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .username-available {
            color: #8bc34a;
        }
        .username-unavailable {
            color: #ff8f8f;
        }
        .username-loading {
            color: var(--gold-light);
        }

        .forgot-pass-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: var(--gold-light);
            cursor: pointer;
            margin-top: -4px;
            margin-bottom: 18px;
            font-weight: 500;
            opacity: 0.80;
            transition: opacity 0.2s;
        }

        .forgot-pass-link:hover { opacity: 1; text-decoration: underline; }

        /* ── SOLID BUTTONS ── */
        .btn-submit {
            width: 100%;
            height: 46px;
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: var(--gold-solid);
            color: var(--navy);
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 4px 20px rgba(200,169,110,0.30), 0 1px 0 rgba(255,255,255,0.12) inset;
            margin-top: 4px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(200,169,110,0.40), 0 1px 0 rgba(255,255,255,0.15) inset;
        }

        .btn-submit:hover::before { left: 160%; }
        .btn-submit:active { transform: translateY(0); box-shadow: 0 2px 10px rgba(200,169,110,0.22); }
        .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        /* ── SEPARATOR ── */
        .separator {
            display: flex;
            align-items: center;
            margin: 20px 0 16px;
            color: rgba(240,233,214,0.25);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .separator::before { margin-right: 14px; }
        .separator::after  { margin-left: 14px; }

        /* ── OAUTH BUTTONS ── */
        .btn-google, .btn-microsoft {
            background: rgba(255,255,255,0.04);
            color: rgba(244,238,221,0.80);
            border: 1px solid rgba(255,255,255,0.09);
            padding: 0 16px;
            height: 44px;
            width: 100%;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s, border-color 0.2s, transform 0.15s, color 0.2s, box-shadow 0.2s;
        }

        .btn-google:hover, .btn-microsoft:hover {
            background: rgba(200,169,110,0.07);
            border-color: rgba(200,169,110,0.30);
            color: var(--text);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.20);
        }

        .btn-google img, .btn-microsoft img { width: 16px; flex-shrink: 0; }

        /* ── TOGGLE LINK ── */
        .toggle-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: var(--gold-light);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.75;
            transition: opacity 0.2s;
            text-decoration: none;
        }

        .toggle-link:hover { opacity: 1; text-decoration: underline; }

        /* ── LOADING OVERLAY ── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 20, 70, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 18px;
            z-index: 9999;
        }

        .spinner {
            width: 38px; height: 38px;
            border: 2px solid rgba(200,169,110,0.12);
            border-top: 2px solid var(--gold);
            border-right: 2px solid rgba(200,169,110,0.40);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-text {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        @media (max-width: 500px) {
            .auth-card { padding: 32px 22px 28px; border-radius: 16px; }
            .card-title { font-size: 24px; }
        }
    </style>
</head>

    <script>
    (() => {
        /* ---- Canvas particle network ---- */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, nodes =[];

        const NODE_COUNT = 90;
        const LINK_DIST  = 145;
        const GOLD = { r:200, g:169, b:110 };

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function mkNode() {
            return {
                x:  Math.random() * W,
                y:  Math.random() * H,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r:  1 + Math.random() * 1.5,
                pulse: Math.random() * Math.PI * 2
            };
        }

        function init() {
            resize();
            nodes = Array.from({ length: NODE_COUNT }, mkNode);
        }

        function draw(ts) {
            ctx.clearRect(0, 0, W, H);

            const vignette = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
            vignette.addColorStop(0, 'rgba(12,20,70,0)');
            vignette.addColorStop(1, 'rgba(6,10,35,0.35)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);

            nodes.forEach(n => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
                n.pulse += 0.018;
                const alpha = 0.30 + 0.20 * Math.sin(n.pulse);

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${GOLD.r},${GOLD.g},${GOLD.b},${alpha})`;
                ctx.fill();
            });

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i], b = nodes[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < LINK_DIST) {
                        const alpha = (1 - dist / LINK_DIST) * 0.18;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(${GOLD.r},${GOLD.g},${GOLD.b},${alpha})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { resize(); });
        init();
        requestAnimationFrame(draw);

        let mx = -9999, my = -9999;
        window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

        /* ---- 3D tilt on card ---- */
        const scene = document.getElementById('card-scene');
        const sheen = document.getElementById('card-sheen');
        const wrapper = document.getElementById('auth-wrapper');
        const MAX_TILT = 5;

        wrapper.addEventListener('mousemove', e => {
            const rect = scene.getBoundingClientRect();
            const cx = rect.left + rect.width  / 2;
            const cy = rect.top  + rect.height / 2;
            const dx = (e.clientX - cx) / (rect.width  / 2);
            const dy = (e.clientY - cy) / (rect.height / 2);
            const rotY =  dx * MAX_TILT;
            const rotX = -dy * MAX_TILT * 0.6;

            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

            const mx = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
            const my = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
            sheen.style.setProperty('--mx', `${mx}%`);
            sheen.style.setProperty('--my', `${my}%`);
        });

        wrapper.addEventListener('mouseleave', () => {
            scene.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1)';
            scene.style.transform  = 'rotateX(0deg) rotateY(0deg)';
            setTimeout(() => scene.style.transition = 'transform 0.1s ease-out', 620);
        });
    })();
    </script>

                    socialMsg: "Connectez-vous ou inscrivez-vous pour continuer vers le Hub Campus.",
                    loginBtn: "Connexion", regBtn: "Créer un compte",
                    toggleToReg: "Nouveau sur Scoralia ? Créez un compte.", toggleToLogin: "Vous avez déjà un compte ? Connectez-vous.",
                    studentTip: "Utilisez votre courriel scolaire (ou un compte Google/Microsoft de l'école) pour obtenir automatiquement le badge <strong>Étudiant vérifié</strong> !",
                    fullName: "Nom complet", username: "Nom d'utilisateur", usernameHint: "Lettres, chiffres, tiret bas uniquement",
                    usernameAvailable: "✓ Disponible", usernameUnavailable: "✗ Déjà pris", usernameChecking: "Vérification...",
                    placeEmail: "Adresse e-mail", placePass: "Mot de passe",
                    google: "Continuer avec Google", microsoft: "Continuer avec Microsoft", or: "ou", verify: "Vérification...",
                    errBanned: "Compte banni.", errVerify: "Veuillez d'abord vérifier votre e-mail !", errSent: "E-mail de vérification envoyé ! Vérifiez votre boîte de réception.",
                    forgotPass: "Mot de passe oublié ?", enterEmailFirst: "Veuillez entrer votre adresse e-mail pour réinitialiser le mot de passe.", resetSent: "E-mail de réinitialisation envoyé ! Vérifiez votre boîte de réception.",
                    usernameInvalid: "Le nom d'utilisateur ne peut contenir que des lettres, chiffres et tiret bas (pas d'espaces)."
                }
            };

            const urlParams = new URLSearchParams(window.location.search);
            const msgParam = urlParams.get('msg');

            // Apply translations
            const applyUIText = () => {
                formTitle.textContent = isLoginMode ? strings[lang].loginTitle : strings[lang].regTitle;
                
                if (msgParam === 'social') {
                    document.getElementById('form-subtitle').textContent = strings[lang].socialMsg;
                } else {
                    document.getElementById('form-subtitle').textContent = isLoginMode ? strings[lang].loginSub : strings[lang].regSub;
                }

                submitBtn.textContent = isLoginMode ? strings[lang].loginBtn : strings[lang].regBtn;
                toggleLink.textContent = isLoginMode ? strings[lang].toggleToReg : strings[lang].toggleToLogin;
                document.getElementById('student-tip-text').innerHTML = strings[lang].studentTip;
                document.getElementById('full-name').placeholder = strings[lang].fullName;
                document.getElementById('username').placeholder = strings[lang].username;
                document.getElementById('username-status-text').textContent = strings[lang].usernameHint;
                document.getElementById('email').placeholder = strings[lang].placeEmail;
                document.getElementById('password').placeholder = strings[lang].placePass;
                document.getElementById('google-btn-text').textContent = strings[lang].google;
                document.getElementById('microsoft-btn-text').textContent = strings[lang].microsoft;
                document.getElementById('or-text').textContent = strings[lang].or;
                document.getElementById('loading-text').textContent = strings[lang].verify;
                forgotPasswordLink.textContent = strings[lang].forgotPass;
            };
            applyUIText();

            // School domains for verified badge
            const schoolDomains = {
                "@etu.cegepjonquiere.ca": "Cégep de Jonquière",
                "@cegep-lanaudiere.qc.ca": "Cégep de Lanaudière",
                "@etu.cegep-lanaudiere.qc.ca": "Cégep de Lanaudière",
                "@crosemont.qc.ca": "Cégep de Rosemont",
                "@cmaisonneuve.qc.ca": "Cégep Maisonneuve",
                "@cegepmv.qc.ca": "Cégep Marie-Victorin",
                "@collegeahuntsic.qc.ca": "Collège Ahuntsic",
                "@dawsoncollege.qc.ca": "Dawson College",
                "@usherbrooke.ca": "Université de Sherbrooke",
                "@ulaval.ca": "Université Laval"
            };

            function getSchoolInfo(email) {
                const domain = email.substring(email.lastIndexOf("@")).toLowerCase();
                return schoolDomains[domain]
                    ? { isStudent: true, schoolName: schoolDomains[domain] }
                    : { isStudent: false, schoolName: null };
            }

            // Validate username format
            function isValidUsername(username) {
                return /^[a-zA-Z0-9_]+$/.test(username);
            }

            // Check username availability in Firestore
            async function checkUsernameAvailability(username) {
                if (!username || username.length < 3) return false;
                const q = query(collection(db, "users"), where("username", "==", username.toLowerCase()));
                const snapshot = await getDocs(q);
                return snapshot.empty;
            }

            // Real-time username availability
            const usernameInput = document.getElementById('username');
            const usernameStatusSpan = document.getElementById('username-status-text');
            const usernameStatusDiv = document.getElementById('username-status');

            usernameInput.addEventListener('input', async () => {
                const username = usernameInput.value.trim();
                if (usernameCheckTimeout) clearTimeout(usernameCheckTimeout);
                
                if (!username) {
                    usernameStatusSpan.textContent = strings[lang].usernameHint;
                    usernameStatusSpan.className = '';
                    currentUsernameValid = false;
                    return;
                }
                
                if (!isValidUsername(username)) {
                    usernameStatusSpan.textContent = strings[lang].usernameInvalid;
                    usernameStatusSpan.className = 'username-unavailable';
                    currentUsernameValid = false;
                    return;
                }
                
                usernameStatusSpan.textContent = strings[lang].usernameChecking;
                usernameStatusSpan.className = 'username-loading';
                currentUsernameValid = false;
                
                usernameCheckTimeout = setTimeout(async () => {
                    const available = await checkUsernameAvailability(username);
                    if (available) {
                        usernameStatusSpan.textContent = strings[lang].usernameAvailable;
                        usernameStatusSpan.className = 'username-available';
                        currentUsernameValid = true;
                    } else {
                        usernameStatusSpan.textContent = strings[lang].usernameUnavailable;
                        usernameStatusSpan.className = 'username-unavailable';
                        currentUsernameValid = false;
                    }
                }, 500);
            });

            // Helper to create user document with username
            async function createUserDocument(user, displayName, username) {
                const email = user.email.toLowerCase();
                const schoolInfo = getSchoolInfo(email);
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    displayName: displayName,
                    username: username.toLowerCase(),
                    email: email,
                    role: 'user',
                    isStudent: schoolInfo.isStudent,
                    schoolName: schoolInfo.schoolName,
                    createdAt: new Date().toISOString()
                });
            }

            async function handleLoginSuccess(user) {
                loadingOverlay.style.display = 'flex';
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);
                    
                    if (!userDoc.exists()) {
                        // Should not happen for email/password, but for OAuth we might need to prompt for username
                        // Instead of signing out, we'll let global.js handle it via the tour.
                        // So we'll just redirect.
                    }
                    
                    const data = userDoc.data();
                    if (data && data.role === 'banned') {
                        await signOut(auth);
                        alert(strings[lang].errBanned);
                        window.location.reload();
                        return;
                    }
                    window.location.href = new URLSearchParams(window.location.search).get('redirect') || '/index.html';
                } catch (e) {
                    console.error(e);
                    window.location.href = '/index.html';
                }
            }

            onAuthStateChanged(auth, async (user) => {
                if (user && !isRegistering) {
                    const isOAuth = user.providerData.some(p => p.providerId === 'microsoft.com' || p.providerId === 'google.com');
                    if (user.emailVerified || isOAuth) {
                        // For OAuth, we just proceed; global.js will show the tour if username missing
                        handleLoginSuccess(user);
                    } else {
                        await signOut(auth);
                        loadingOverlay.style.display = 'none';
                    }
                }
            });

            forgotPasswordLink.onclick = async () => {
                const emailVal = document.getElementById('email').value.trim();
                if (!emailVal) { alert(strings[lang].enterEmailFirst); return; }
                try {
                    await sendPasswordResetEmail(auth, emailVal);
                    alert(strings[lang].resetSent);
                } catch (e) { alert(e.message); }
            };

            toggleLink.onclick = () => {
                isLoginMode = !isLoginMode;
                const regFields = document.getElementById('register-fields');
                if (!isLoginMode) {
                    regFields.style.display = 'block';
                    setTimeout(() => regFields.classList.add('visible'), 10);
                } else {
                    regFields.classList.remove('visible');
                    setTimeout(() => regFields.style.display = '', 450);
                }
                studentTip.style.display = isLoginMode ? 'none' : 'flex';
                forgotPasswordLink.style.display = isLoginMode ? 'block' : 'none';
                applyUIText();
            };

            // OAuth handlers without username check
            document.getElementById('google-btn').onclick = async () => {
                try {
                    await signInWithPopup(auth, googleProvider);
                    // No further checks; global.js will handle missing username via tour
                } catch (e) { alert(e.message); }
            };
            document.getElementById('microsoft-btn').onclick = async () => {
                try {
                    await signInWithPopup(auth, msProvider);
                    // No further checks; global.js will handle missing username via tour
                } catch (e) { alert(e.message); }
            };

            authForm.onsubmit = async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                const email = document.getElementById('email').value.toLowerCase();
                const pass = document.getElementById('password').value;
                try {
                    if (isLoginMode) {
                        const cred = await signInWithEmailAndPassword(auth, email, pass);
                        if (!cred.user.emailVerified) {
                            await signOut(auth);
                            alert(strings[lang].errVerify);
                        }
                    } else {
                        // Registration
                        const fullName = document.getElementById('full-name').value.trim();
                        const username = document.getElementById('username').value.trim().toLowerCase();
                        
                        if (!fullName) { alert("Full name is required"); submitBtn.disabled = false; return; }
                        if (!username) { alert("Username is required"); submitBtn.disabled = false; return; }
                        if (!isValidUsername(username)) { alert(strings[lang].usernameInvalid); submitBtn.disabled = false; return; }
                        if (!currentUsernameValid) { alert("Please choose a different username"); submitBtn.disabled = false; return; }
                        
                        isRegistering = true;
                        const cred = await createUserWithEmailAndPassword(auth, email, pass);
                        await updateProfile(cred.user, { displayName: fullName });
                        await createUserDocument(cred.user, fullName, username);
                        await sendEmailVerification(cred.user);
                        await signOut(auth);
                        isRegistering = false;
                        alert(strings[lang].errSent);
                        location.reload();
                    }
                } catch (err) {
                    alert(err.message);
                    isRegistering = false;
                }
                submitBtn.disabled = false;
            };
        }
        main();
    </script>
</body>
</html>
