<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Camera Scanner Test - Scoralia</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0C1446;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            max-width: 550px;
            width: 100%;
            border-radius: 32px;
            padding: 28px 24px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #0C1446;
        }
        .secure-badge {
            background: #e6f4ea;
            color: #1e7e34;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        button {
            background: #0C1446;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-top: 16px;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #reader {
            width: 100%;
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
            display: none;
        }
        .result {
            margin-top: 20px;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 16px;
            word-break: break-all;
            font-family: monospace;
        }
        .error {
            color: #c0392b;
            background: #fbe9e7;
        }
        .fallback {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }
        input[type="file"] {
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📸 Barcode Scanner</h1>
    <div class="secure-badge" id="secureStatus">Checking security...</div>
    <p>Click the button below → browser will ask for camera permission.</p>
    <button id="startBtn">🔘 Start Camera Scanner</button>
    <div id="reader"></div>
    <div class="result" id="result">Ready. Scan result will appear here.</div>

    <div class="fallback">
        <p><strong>📁 Alternatively, scan from an image:</strong></p>
        <input type="file" id="fileInput" accept="image/*">
        <div id="fileResult" class="result" style="margin-top: 12px;"></div>
    </div>
</div>

<script>
    (function() {
        // ---- DOM elements ----
        const startBtn = document.getElementById('startBtn');
        const readerDiv = document.getElementById('reader');
        const resultDiv = document.getElementById('result');
        const secureSpan = document.getElementById('secureStatus');
        const fileInput = document.getElementById('fileInput');
        const fileResultDiv = document.getElementById('fileResult');

        let html5QrCode = null;
        let isScanning = false;

        // ---- Show secure context status ----
        if (window.isSecureContext) {
            secureSpan.innerHTML = '✅ Secure context (HTTPS) – camera allowed';
            secureSpan.style.background = '#e6f4ea';
        } else {
            secureSpan.innerHTML = '⚠️ NOT secure – camera will not work. Use HTTPS or localhost.';
            secureSpan.style.background = '#ffe6e5';
            startBtn.disabled = true;
            resultDiv.innerHTML = '❌ Camera requires HTTPS. Please open this page via https://';
        }

        // ---- Helper: stop scanner ----
        async function stopScanner() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    console.log("Scanner stopped");
                } catch(e) { console.warn(e); }
                isScanning = false;
                readerDiv.style.display = 'none';
                startBtn.innerText = '🔘 Start Camera Scanner';
                startBtn.disabled = false;
            }
        }

        // ---- Start scanner (triggers permission prompt) ----
        async function startScanner() {
            // Stop any existing scanner first
            await stopScanner();

            // Make reader div visible (important for some browsers)
            readerDiv.style.display = 'block';
            readerDiv.style.minHeight = '300px';

            // Create new instance
            html5QrCode = new Html5Qrcode("reader");

            // Camera config: use back camera on mobile
            const config = {
                fps: 10,
                qrbox: { width: 280, height: 200 }
            };

            try {
                resultDiv.innerHTML = '⏳ Requesting camera access... Please allow when prompted.';
                resultDiv.classList.remove('error');
                
                // This line is what triggers the browser permission dialog.
                await html5QrCode.start(
                    { facingMode: "environment" },   // back camera
                    config,
                    (decodedText) => {
                        // Success callback
                        resultDiv.innerHTML = `✅ Scanned: <strong>${decodedText}</strong>`;
                        resultDiv.classList.remove('error');
                        // Optional: auto stop after 1 scan
                        // stopScanner();
                    },
                    (errorMsg) => {
                        // Ignore scanning errors (no code found yet)
                        // console.log(errorMsg);
                    }
                );
                
                isScanning = true;
                startBtn.innerText = '⏹️ Stop Scanner';
                resultDiv.innerHTML = '📷 Camera active. Point at a barcode or QR code.';
            } catch (err) {
                console.error('Start error:', err);
                readerDiv.style.display = 'none';
                let errorMessage = '';
                if (err.name === 'NotAllowedError') {
                    errorMessage = '❌ Camera permission denied. Please click the camera icon in the address bar and allow access, then refresh and try again.';
                } else if (err.name === 'NotFoundError') {
                    errorMessage = '❌ No camera found on this device.';
                } else if (err.name === 'NotReadableError') {
                    errorMessage = '❌ Camera is already in use by another app. Close other apps and try again.';
                } else if (err.message && err.message.includes('getUserMedia')) {
                    errorMessage = '❌ Could not access camera. Make sure you are on HTTPS and no other tab is using the camera.';
                } else {
                    errorMessage = `❌ Error: ${err.message || err}`;
                }
                resultDiv.innerHTML = errorMessage;
                resultDiv.classList.add('error');
                startBtn.disabled = false;
                startBtn.innerText = '🔘 Start Camera Scanner';
            }
        }

        // ---- File based scanning (fallback) ----
        async function scanFromFile(file) {
            if (!file) return;
            fileResultDiv.innerHTML = '📄 Processing image...';
            const tempScanner = new Html5Qrcode(/* no element needed */);
            try {
                const decoded = await tempScanner.scanFile(file, true);
                fileResultDiv.innerHTML = `✅ Image scan result: <strong>${decoded}</strong>`;
                fileResultDiv.classList.remove('error');
            } catch (err) {
                console.error(err);
                fileResultDiv.innerHTML = `❌ Could not read barcode from this image. Try a clearer photo.`;
                fileResultDiv.classList.add('error');
            } finally {
                tempScanner.clear();
            }
        }

        // ---- Event listeners ----
        startBtn.addEventListener('click', startScanner);
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) scanFromFile(e.target.files[0]);
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().catch(() => {});
            }
        });
    })();
</script>
</body>
</html>
