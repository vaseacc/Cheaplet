    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, query, where, getDocs, limit, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch(getFunctionUrl('config'));
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: {
                    mainTitle: "List an Item", mainSub: "Fill in the details below and your book will be automatically reviewed.",
                    isbnTitle: "Quick Book Scan", isbnDesc: "Scan your book's barcode to fill in info automatically.",
                    btnScan: "Scan Barcode", btnSkip: "Skip & Fill Manually", isbnPlace: "Enter ISBN manually...",
                    fetching: "Fetching info...", notFound: "Book not found. Please fill manually.",
                    secBasic: "Basic Info", secTags: "Tags", secCond: "Condition & Details", secLoc: "Location", secPhoto: "Photos",
                    lblTitle: "Title", lblDesc: "Description",
                    lblPrice: "Sale Price ($) — Max $1200", lblOrigPrice: "Original Price ($) — Max $5000",
                    lblTags: "Tags (Max 15)", tagPlace: "e.g., Technique, Math, Biology… (press Enter)",
                    lblCond: "Condition", optCondSel: "Select Condition", optNew: "New", optLikeNew: "Like New", optGood: "Good", optFair: "Fair",

                    lblLoc: "Campus Location", lblMeet: "Meeting Point (Max 60 chars)", meetPlace: "e.g., Near Library",
                    lblDet: "Additional Details", chkWrite: "Writing inside", chkWater: "Water damage", chkMiss: "Missing pages",
                    lblPhotos: "Photos (Max 5, Max 5MB each)", btnAddPhoto: "Add Photo", btnPost: "Submit for Review", btnCancel: "Cancel",
                    priceErr: "Price cannot exceed $1200.", origPriceErr: "Original price cannot exceed $5000.",
                    imgErr: "Add at least one photo.", imgTypeErr: "Unsupported file type.",
                    imgSizeErr: "Image too large (Max 5MB).", uploading: "Uploading Images…",
                    tagLimit: "Max 15 tags allowed.", lenErr: "Title, Description, or Meeting Point too long.",
                    tagUses: "uses", uploadFail: "Image upload failed. Please try again.",
                    reviewMessage: "Your listing is being reviewed. You will be notified once approved.",
                    cameraDenied: "Camera permission denied. Please allow camera access in your browser settings.\n\n(On Android/Chrome: tap 🔒 → Permissions → Camera → Allow). Then refresh.",
                    cameraError: "Could not start camera. Make sure you're on a secure connection (HTTPS) and your device has a camera."
                },
                fr: {
                    mainTitle: "Publier un article", mainSub: "Remplissez les détails ci-dessous et votre livre sera automatiquement examiné.",
                    isbnTitle: "Scan rapide du livre", isbnDesc: "Scannez le code-barres pour remplir les infos automatiquement.",
                    btnScan: "Scanner le code-barres", btnSkip: "Ignorer et remplir manuellement", isbnPlace: "Entrer l'ISBN manuellement...",
                    fetching: "Recherche en cours...", notFound: "Livre introuvable. Veuillez remplir manuellement.",
                    secBasic: "Infos de base", secTags: "Mots-clés", secCond: "État et Détails", secLoc: "Emplacement", secPhoto: "Photos",
                    lblTitle: "Titre", lblDesc: "Description",
                    lblPrice: "Prix de vente ($) — Max 1200$", lblOrigPrice: "Prix d'origine ($) — Max 5000$",
                    lblTags: "Mots-clés (Max 15)", tagPlace: "ex : Technique, Mathématiques, Biologie… (Entrée)",
                    lblCond: "État", optCondSel: "Sélectionner l'état", optNew: "Neuf", optLikeNew: "Comme neuf", optGood: "Bon état", optFair: "Acceptable",
                    lblCode: "Code d'accès numérique", optNa: "Non applicable", optAvail: "Disponible / Inutilisé", optUsed: "Déjà utilisé",
                    lblLoc: "Emplacement du campus", lblMeet: "Point de rencontre (Max 60 car.)", meetPlace: "ex: Près de la bibliothèque",
                    lblDet: "Détails supplémentaires", chkWrite: "Écritures à l'intérieur", chkWater: "Dommages causés par l'eau", chkMiss: "Pages manquantes",
                    lblPhotos: "Photos (Max 5, Max 5MB chacune)", btnAddPhoto: "Ajouter une photo", btnPost: "Soumettre pour examen", btnCancel: "Annuler",
                    priceErr: "Le prix ne peut dépasser 1200$.", origPriceErr: "Le prix d'origine ne peut dépasser 5000$.",
                    imgErr: "Ajoutez au moins une photo.", imgTypeErr: "Format non supporté.",
                    imgSizeErr: "Image trop lourde (Max 5MB).", uploading: "Téléchargement…",
                    tagLimit: "Maximum 15 tags autorisés.", lenErr: "Titre, Description ou Point de rencontre trop long.",
                    tagUses: "utilisations", uploadFail: "Échec du téléchargement. Veuillez réessayer.",
                    reviewMessage: "Votre annonce est en cours d'examen. Vous serez notifié une fois approuvée.",
                    cameraDenied: "Permission de la caméra refusée. Veuillez autoriser l'accès dans les paramètres du navigateur.\n\n(Android/Chrome : appuyez sur 🔒 → Autorisations → Caméra → Autoriser). Actualisez ensuite.",
                    cameraError: "Impossible de démarrer la caméra. Vérifiez que vous êtes en HTTPS et que votre appareil possède une caméra."
                }
            };

            // Apply UI texts (same as before)
            document.getElementById('ui-main-title').textContent = ui[lang].mainTitle;
            document.getElementById('ui-main-subtitle').textContent = ui[lang].mainSub;
            document.getElementById('ui-isbn-title').textContent = ui[lang].isbnTitle;
            document.getElementById('ui-isbn-desc').textContent = ui[lang].isbnDesc;
            document.getElementById('ui-btn-scan').textContent = ui[lang].btnScan;
            document.getElementById('ui-btn-skip').textContent = ui[lang].btnSkip;
            document.getElementById('manual-isbn-input').placeholder = ui[lang].isbnPlace;
            document.getElementById('ui-sec-basic').textContent = ui[lang].secBasic;
            document.getElementById('ui-sec-tags').textContent = ui[lang].secTags;
            document.getElementById('ui-sec-cond').textContent = ui[lang].secCond;
            document.getElementById('ui-sec-loc').textContent = ui[lang].secLoc;
            document.getElementById('ui-sec-photo').textContent = ui[lang].secPhoto;
            document.getElementById('ui-label-title').textContent = ui[lang].lblTitle;
            document.getElementById('ui-label-desc').textContent = ui[lang].lblDesc;
            document.getElementById('ui-label-price').textContent = ui[lang].lblPrice;
            document.getElementById('ui-label-orig-price').textContent = ui[lang].lblOrigPrice;
            document.getElementById('ui-label-tags').textContent = ui[lang].lblTags;
            document.getElementById('tag-input').placeholder = ui[lang].tagPlace;
            document.getElementById('ui-label-condition').textContent = ui[lang].lblCond;
            document.getElementById('opt-cond-select').textContent = ui[lang].optCondSel;
            document.getElementById('opt-cond-new').textContent = ui[lang].optNew;
            document.getElementById('opt-cond-likenew').textContent = ui[lang].optLikeNew;
            document.getElementById('opt-cond-good').textContent = ui[lang].optGood;
            document.getElementById('opt-cond-fair').textContent = ui[lang].optFair;
            document.getElementById('ui-label-code').textContent = ui[lang].lblCode;
            document.getElementById('opt-code-na').textContent = ui[lang].optNa;
            document.getElementById('opt-code-avail').textContent = ui[lang].optAvail;
            document.getElementById('opt-code-used').textContent = ui[lang].optUsed;
            document.getElementById('ui-label-location').textContent = ui[lang].lblLoc;
            document.getElementById('ui-label-meet').textContent = ui[lang].lblMeet;
            document.getElementById('listing-meeting-point').placeholder = ui[lang].meetPlace;
            document.getElementById('ui-label-details').textContent = ui[lang].lblDet;
            document.getElementById('ui-check-writing').textContent = ui[lang].chkWrite;
            document.getElementById('ui-check-water').textContent = ui[lang].chkWater;
            document.getElementById('ui-check-missing').textContent = ui[lang].chkMiss;
            document.getElementById('ui-label-photos').textContent = ui[lang].lblPhotos;
            document.getElementById('ui-btn-add-photo').textContent = ui[lang].btnAddPhoto;
            document.getElementById('post-btn-text').textContent = ui[lang].btnPost;
            document.getElementById('cancelListingBtn').textContent = ui[lang].btnCancel;

            let currentUser = null;
            let internalSchoolName = "Global Campus";
            let selectedFiles = [];
            let tags = [];
            const pageLoader = document.getElementById('page-loader');
            const loaderTimeout = setTimeout(() => { pageLoader.style.display = 'none'; }, 4000);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        currentUser = user;
                        internalSchoolName = data.schoolName || "Global Campus";
                        clearTimeout(loaderTimeout); pageLoader.style.display = 'none';
                    }
                } else { window.location.href = '/login'; }
            });

            // ISBN cache
            const isbnCache = {};
            try {
                const saved = localStorage.getItem('scoralia_isbn_cache');
                if (saved) Object.assign(isbnCache, JSON.parse(saved));
            } catch(e) { console.warn("Could not load ISBN cache"); }

            function saveCache() {
                try {
                    const entries = Object.entries(isbnCache);
                    if (entries.length > 50) {
                        const trimmed = Object.fromEntries(entries.slice(-50));
                        localStorage.setItem('scoralia_isbn_cache', JSON.stringify(trimmed));
                    } else {
                        localStorage.setItem('scoralia_isbn_cache', JSON.stringify(isbnCache));
                    }
                } catch(e) { console.warn("Could not save ISBN cache"); }
            }

            // ---------- SMART ISBN EXTRACTOR ----------
            function extractIsbnFromScannedText(rawText) {
                // Remove all non-digit characters
                let digits = rawText.replace(/[^0-9]/g, '');
                // Try to find a valid 13-digit ISBN (starting with 978 or 979)
                let match13 = digits.match(/(978|979)\d{10}/);
                if (match13) return match13[0];
                // Try to find a 10-digit ISBN
                let match10 = digits.match(/\d{10}/);
                if (match10) return match10[0];
                // If all else fails, return the raw digits (will be validated later)
                return digits;
            }

            // ---------- IMPROVED BOOK FETCH WITH DIRECT GOOGLE BOOKS (CORS OK) ----------
            async function fetchBookData(isbn) {
                let cleanIsbn = extractIsbnFromScannedText(isbn);
                
                if (cleanIsbn.length === 13 || cleanIsbn.length === 10) {
                    // valid length
                } else {
                    alert("Scanned code is not a valid ISBN (must be 10 or 13 digits). Please try again or enter manually.");
                    return;
                }

                // Check cache
                if (isbnCache[cleanIsbn]) {
                    const cached = isbnCache[cleanIsbn];
                    document.getElementById('listing-title').value = cached.title;
                    document.getElementById('listing-description').value = cached.description || "";
                    document.getElementById('listing-isbn').value = cleanIsbn;
                    document.getElementById('isbn-section').style.display = 'none';
                    document.getElementById('main-form-section').style.display = 'block';
                    if (html5QrCode && isScanning) {
                        html5QrCode.stop().then(() => { isScanning = false; }).catch(e => console.log(e));
                    }
                    return;
                }

                const manualBtn = document.getElementById('manual-isbn-btn');
                manualBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
                manualBtn.disabled = true;

                let bookData = { title: "", description: "" };
                let found = false;

                // ----- Attempt 1: OpenLibrary (no CORS, free) -----
                try {
                    const url = `https://openlibrary.org/isbn/${cleanIsbn}.json`;
                    const res = await fetch(url, { headers: { 'User-Agent': 'ScoraliaBookApp (admin@scoralia.ca)' } });
                    if (res.ok) {
                        const data = await res.json();
                        const title = data.title || "";
                        let description = "";
                        if (data.description) description = typeof data.description === 'string' ? data.description : (data.description.value || "");
                        if (!description && data.subtitle) description = data.subtitle;
                        if (title) {
                            bookData = { title, description };
                            found = true;
                            console.log("Found via OpenLibrary");
                        }
                    }
                } catch(e) { console.warn("OpenLibrary error", e); }

                // ----- Attempt 2: Google Books DIRECT (CORS enabled) -----
                if (!found) {
                    try {
                        const url = `https://www.googleapis.com/books/v1/volumes?q=isbn:${cleanIsbn}`;
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.items && data.items.length > 0) {
                                const book = data.items[0].volumeInfo;
                                let title = book.title || "";
                                // Add authors if present and valid
                                if (book.authors && book.authors.length) {
                                    const validAuthors = book.authors.filter(a => a && a.trim());
                                    if (validAuthors.length) title += ` by ${validAuthors.join(', ')}`;
                                }
                                let description = "";
                                if (book.description) description = book.description.replace(/<[^>]*>?/gm, '');
                                else if (book.subtitle) description = book.subtitle;
                                if (title) {
                                    bookData = { title, description };
                                    found = true;
                                    console.log("Found via Google Books");
                                }
                            }
                        } else if (res.status === 429) {
                            console.warn("Google Books rate limit");
                        }
                    } catch(e) { console.warn("Google Books error", e); }
                }

                if (found && bookData.title) {
                    isbnCache[cleanIsbn] = bookData;
                    saveCache();
                    document.getElementById('listing-title').value = bookData.title;
                    document.getElementById('listing-description').value = bookData.description;
                    document.getElementById('listing-isbn').value = cleanIsbn;
                    document.getElementById('isbn-section').style.display = 'none';
                    document.getElementById('main-form-section').style.display = 'block';
                    if (html5QrCode && isScanning) {
                        html5QrCode.stop().then(() => { isScanning = false; }).catch(e => console.log(e));
                    }
                } else {
                    alert(`Could not find book data for ISBN ${cleanIsbn}. Please fill in the details manually.`);
                }

                manualBtn.innerHTML = `<i class="fas fa-search"></i>`;
                manualBtn.disabled = false;
            }

            // ---------- SCANNER CODE (unchanged, works) ----------
            let html5QrCode = null;
            let isScanning = false;
            const startScanBtn = document.getElementById('start-scan-btn');
            const readerDiv = document.getElementById('reader');

            async function stopScanner() {
                if (html5QrCode && isScanning) {
                    try {
                        await html5QrCode.stop();
                    } catch(e) { console.warn("stop error", e); }
                    isScanning = false;
                    readerDiv.style.display = 'none';
                    startScanBtn.classList.remove('stop');
                    startScanBtn.innerHTML = `<i class="fas fa-camera"></i> ${ui[lang].btnScan}`;
                    startScanBtn.disabled = false;
                }
            }

            async function startScanner() {
                await stopScanner();
                if (!window.isSecureContext) {
                    alert("Camera requires HTTPS. Please use https://");
                    return;
                }
                readerDiv.style.display = 'block';
                startScanBtn.disabled = true;
                startScanBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Requesting camera...`;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream.getTracks().forEach(track => track.stop());
                    html5QrCode = new Html5Qrcode("reader");
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 150 } },
                        (decodedText) => {
                            stopScanner().then(() => { fetchBookData(decodedText); });
                        },
                        (errorMessage) => { /* ignore */ }
                    );
                    isScanning = true;
                    startScanBtn.classList.add('stop');
                    startScanBtn.innerHTML = `<i class="fas fa-times"></i> Stop Scanner`;
                    startScanBtn.disabled = false;
                } catch (err) {
                    console.error(err);
                    readerDiv.style.display = 'none';
                    let msg = err.name === 'NotAllowedError' ? ui[lang].cameraDenied : ui[lang].cameraError + ' ' + (err.message || err);
                    alert(msg);
                    startScanBtn.disabled = false;
                    startScanBtn.innerHTML = `<i class="fas fa-camera"></i> ${ui[lang].btnScan}`;
                }
            }

            startScanBtn.addEventListener('click', () => {
                if (isScanning) stopScanner();
                else startScanner();
            });

            document.getElementById('manual-isbn-btn').onclick = () => {
                const val = document.getElementById('manual-isbn-input').value.trim();
                if(val) fetchBookData(val);
                else alert("Please enter an ISBN.");
            };

            document.getElementById('skip-scan-btn').onclick = () => {
                stopScanner();
                document.getElementById('isbn-section').style.display = 'none';
                document.getElementById('main-form-section').style.display = 'block';
            };

            // ---------- TAG MANAGEMENT ----------
            const tagInput = document.getElementById('tag-input');
            const selectedTagsContainer = document.getElementById('selected-tags');
            const suggestionsBox = document.getElementById('suggestions-box');

            function renderTags() {
                selectedTagsContainer.innerHTML = '';
                tags.forEach((tag, index) => {
                    const chip = document.createElement('div');
                    chip.className = 'tag-chip';
                    chip.innerHTML = `${tag} <span class="remove-tag" onclick="window.removeTag(${index})">&times;</span>`;
                    selectedTagsContainer.appendChild(chip);
                });
            }
            window.removeTag = (index) => { tags.splice(index, 1); renderTags(); };

            function addTag(tagName) {
                const cleaned = tagName.trim();
                if (tags.length >= 15) { alert(ui[lang].tagLimit); return; }
                if (cleaned && !tags.includes(cleaned)) { tags.push(cleaned); renderTags(); }
                tagInput.value = ''; suggestionsBox.style.display = 'none';
            }

            tagInput.oninput = async (e) => {
                const val = e.target.value.trim().toLowerCase();
                if (val.length < 1) { suggestionsBox.style.display = 'none'; return; }
                const snap = await getDocs(query(collection(db, "global_tags"), where("tag_lowercase", ">=", val), where("tag_lowercase", "<=", val + "\uf8ff"), limit(5)));
                suggestionsBox.innerHTML = '';
                let hasMatch = false;
                if (!snap.empty) {
                    snap.forEach(doc => {
                        hasMatch = true;
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerHTML = `<span>${doc.data().tag}</span><span class="suggestion-count">${doc.data().count || 1} ${ui[lang].tagUses}</span>`;
                        div.onmousedown = (ev) => { ev.preventDefault(); addTag(doc.data().tag); };
                        suggestionsBox.appendChild(div);
                    });
                }
                if (val && !tags.includes(val) && (!hasMatch || ![...suggestionsBox.children].some(child => child.innerText.trim().startsWith(val)))) {
                    const createDiv = document.createElement('div');
                    createDiv.className = 'suggestion-item create-tag-item';
                    createDiv.innerHTML = `<span><i class="fas fa-plus-circle"></i> Create new tag: "<strong>${val}</strong>"</span>`;
                    createDiv.onmousedown = (ev) => { ev.preventDefault(); addTag(val); };
                    suggestionsBox.appendChild(createDiv);
                }
                if (suggestionsBox.children.length > 0) suggestionsBox.style.display = 'block';
            };
            tagInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(tagInput.value); } };

            // ---------- IMAGE UPLOADS ----------
            const imageInput = document.getElementById('listing-image-input');
            const previewContainer = document.getElementById('image-preview-container');

            function renderPreviews() {
                previewContainer.innerHTML = '';
                selectedFiles.forEach((file, index) => {
                    const wrapper = document.createElement('div'); wrapper.className = 'image-preview-wrapper';
                    const img = document.createElement('img'); img.src = URL.createObjectURL(file); img.className = 'image-preview';
                    const btn = document.createElement('button'); btn.className = 'remove-image-btn'; btn.type = 'button'; btn.innerHTML = '&times;';
                    btn.onclick = () => { selectedFiles.splice(index, 1); renderPreviews(); };
                    wrapper.appendChild(img); wrapper.appendChild(btn); previewContainer.appendChild(wrapper);
                });
                document.getElementById('add-photo-label').style.display = selectedFiles.length < 5 ? 'flex' : 'none';
            }

            imageInput.onchange = async (e) => {
                const isHuman = await window.checkBotLimits();
                if (!isHuman) { e.target.value = ''; return; }
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) { alert(ui[lang].imgSizeErr); return; }
                    window.recordActivity('images');
                    selectedFiles.push(file); renderPreviews();
                }
                e.target.value = '';
            };

            // ---------- FORM SUBMISSION (unchanged) ----------
            document.getElementById('listing-form').onsubmit = async (e) => {
                e.preventDefault();
                const logs = [];
                logs.push('=== LISTING SUBMISSION LOGS ===');
                logs.push('Timestamp: ' + new Date().toISOString());
                logs.push('');

                logs.push('[1] Checking bot shield...');
                const isHuman = await window.checkBotLimits();
                logs.push('[1] Bot shield result: ' + (isHuman ? 'PASSED (human)' : 'FAILED (bot detected)'));
                if (!isHuman) {
                    logs.push('ABORTED: Bot detected');
                    alert('scoraliaa.vercel.app says:\n\n' + logs.join('\n'));
                    return;
                }
                logs.push('');

                const title = document.getElementById('listing-title').value.trim();
                const desc = document.getElementById('listing-description').value.trim();
                const price = parseFloat(document.getElementById('listing-price').value);
                const originalPriceInput = document.getElementById('listing-original-price').value;
                const originalPrice = originalPriceInput ? parseFloat(originalPriceInput) : null;

                logs.push('[2] Form validation...');
                logs.push('    Title: ' + title);
                logs.push('    Description length: ' + desc.length + ' chars');
                logs.push('    Price: ' + price);
                logs.push('    Original Price: ' + (originalPrice || 'not set'));
                logs.push('    Images count: ' + selectedFiles.length);

                if (price > 1200) {
                    logs.push('VALIDATION FAILED: Price exceeds 1200');
                    alert(ui[lang].priceErr);
                    alert('scoraliaa.vercel.app says:\n\n' + logs.join('\n'));
                    return;
                }
                if (originalPrice && originalPrice > 5000) {
                    logs.push('VALIDATION FAILED: Original price exceeds 5000');
                    alert(ui[lang].origPriceErr);
                    alert('scoraliaa.vercel.app says:\n\n' + logs.join('\n'));
                    return;
                }
                if (selectedFiles.length === 0) {
                    logs.push('VALIDATION FAILED: No images selected');
                    alert(ui[lang].imgErr);
                    alert('scoraliaa.vercel.app says:\n\n' + logs.join('\n'));
                    return;
                }
                logs.push('[2] Validation: PASSED');
                logs.push('');

                logs.push('[3] Recording activity...');
                window.recordActivity('listings');
                logs.push('[3] Activity recorded');
                logs.push('');

                const submitBtn = document.getElementById('postListingBtn');
                const postBtnText = document.getElementById('post-btn-text');
                submitBtn.disabled = true;
                postBtnText.textContent = "AI Safety Check... (Please wait)";

                try {
                    logs.push('[4] Uploading images to Cloudinary...');
                    const imageUrls = [];
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const file = selectedFiles[i];
                        logs.push('    Uploading image ' + (i + 1) + '/' + selectedFiles.length + ': ' + file.name + ' (' + (file.size / 1024).toFixed(2) + ' KB)');
                        const signRes = await fetch(getFunctionUrl('sign-upload')).then(r => r.json());
                        logs.push('    Got signature from sign-upload API');
                        const formData = new FormData();
                        formData.append('file', file); 
                        formData.append('api_key', signRes.apiKey);
                        formData.append('timestamp', signRes.timestamp); 
                        formData.append('signature', signRes.signature);
                        formData.append('upload_preset', signRes.uploadPreset);
                        const res = await fetch(`https://api.cloudinary.com/v1_1/${signRes.cloudName}/image/upload`, { method: 'POST', body: formData }).then(r => r.json());
                        if (res.secure_url) {
                            imageUrls.push(res.secure_url);
                            logs.push('    Uploaded successfully: ' + res.secure_url);
                        } else {
                            throw new Error(res.error?.message || 'Upload failed');
                        }
                    }
                    logs.push('[4] All images uploaded: ' + imageUrls.length + ' URLs');
                    logs.push('');

                    const rawIsbn = document.getElementById('listing-isbn').value.trim();
                    const cleanIsbn = rawIsbn ? rawIsbn.replace(/[^0-9]/g, '') : null;

                    logs.push('[5] Preparing listing data...');
                    const listingData = {
                        title, description: desc, price, 
                        originalPrice: originalPrice,
                        condition: document.getElementById('listing-condition').value,
                        digitalCode: document.getElementById('listing-digital-code').value,
                        location: document.getElementById('listing-location').value,
                        meetingPoint: document.getElementById('listing-meeting-point').value.trim(),
                        hasWriting: document.getElementById('cond-writing').checked,
                        hasWaterDamage: document.getElementById('cond-water').checked,
                        hasMissingPages: document.getElementById('cond-missing').checked,
                        tags, imageUrls,
                        isbn: cleanIsbn, 
                        posterUid: currentUser.uid,
                        posterDisplayName: currentUser.displayName || "User",
                        status: 'pending',
                        timestamp: serverTimestamp() 
                    };
                    logs.push('[5] Listing data prepared');
                    logs.push('');

                    logs.push('[6] Saving listing to Firestore...');
                    const listingRef = await addDoc(collection(db, 'listings'), listingData);
                    logs.push('[6] Listing saved with ID: ' + listingRef.id);
                    logs.push('');

                    logs.push('[7] Sending to AI moderation...');
                    try {
                        const aiRes = await fetch(getFunctionUrl('moderate-listing'), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ imageUrls, title, description: desc })
                        });
                        
                        logs.push('[7] Moderation API response status: ' + aiRes.status);
                        
                        if (!aiRes.ok) {
                            const errorText = await aiRes.text();
                            logs.push('    Error response: ' + errorText);
                            throw new Error("Moderation server error: " + aiRes.status);
                        }

                        const aiData = await aiRes.json();
                        
                        logs.push('[7] Moderation response received:');
                        logs.push('    Verdict: ' + (aiData.verdict || 'unknown'));
                        logs.push('    Reason: ' + (aiData.reason || 'none'));
                        if (aiData._debug) {
                            logs.push('    Debug Info: ' + JSON.stringify(aiData._debug));
                        }

                        if (aiData.verdict === "UNSAFE") {
                            logs.push('[8] Listing REJECTED by AI moderation');
                            await updateDoc(doc(db, "listings", listingRef.id), {
                                status: 'rejected',
                                rejectionReason: aiData.reason || "Violates community guidelines."
                            });
                            logs.push('[8] Status updated to rejected in Firestore');
                            alert("Your listing was rejected by safety checks: " + (aiData.reason || "Inappropriate content."));
                            submitBtn.disabled = false;
                            postBtnText.textContent = ui[lang].btnPost;
                            logs.push('');
                            logs.push('=== FINAL RESULT: REJECTED ===');
                            alert('scoraliaa.vercel.app says:\n\n' + logs.join('\n'));
                            return; 
                        } else {
                            logs.push('[8] Listing APPROVED by AI moderation');
                            await updateDoc(doc(db, "listings", listingRef.id), {
                                status: 'active',
                                approvedAt: serverTimestamp()
                            });
                            logs.push('[8] Status updated to active in Firestore');
                            logs.push('');
                            logs.push('=== FINAL RESULT: APPROVED ===');
                            logs.push('Redirecting to my-listings...');
                            window.location.href = `/my-listings`;
                        }
                    } catch (err) {
                        logs.push('[7] Moderation error: ' + err.message);
                        console.error("Moderation failed or timed out:", err);
                        logs.push('Proceeding with pending status...');
                        logs.push('');
                        logs.push('=== FINAL RESULT: PENDING (moderation error) ===');
                        window.location.href = `/my-listings?pending=true&id=${listingRef.id}`;
                    }

                } catch (err) {
                    logs.push('ERROR: ' + err.message);
                    logs.push('Stack: ' + err.stack);
                    logs.push('');
                    logs.push('=== FINAL RESULT: ERROR ===');
                    alert("Error: " + err.message);
                    submitBtn.disabled = false;
                    postBtnText.textContent = ui[lang].btnPost;
                }
            };
        }
        main();
    </script>
</body>
</html>
