<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- This is crucial for viewport scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Live QR/Barcode Scanner</title>
    <!-- Include html5-qrcode library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* Simple styles for layout */
        body { font-family: sans-serif; text-align: center; margin: 20px; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        button { margin: 10px; padding: 10px 15px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; word-wrap: break-word; }
        .fallback { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>QR / Barcode Scanner</h1>
    <p>Click the button below to start scanning.</p>

    <div id="reader" style="display: none;"></div>
    
    <div>
        <button id="startBtn">📷 Start Camera Scanner</button>
        <button id="stopBtn" disabled>⏹️ Stop Scanner</button>
    </div>

    <div id="result">Scan result will appear here.</div>

    <div class="fallback">
        <h3>Having trouble with your camera? Scan from an image file instead:</h3>
        <input type="file" id="fileInput" accept="image/*">
        <p id="fileResult"></p>
    </div>

    <script>
        // --- Configuration ---
        const qrCodeRegionId = "reader";
        let html5QrCode = null; // Holds the scanner instance
        let isScanning = false;

        // --- DOM Elements ---
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resultDiv = document.getElementById('result');
        const fileInput = document.getElementById('fileInput');
        const fileResultDiv = document.getElementById('fileResult');

        // --- Helper function to update UI and scanner state ---
        function setScanningState(scanning) {
            isScanning = scanning;
            startBtn.disabled = scanning;
            stopBtn.disabled = !scanning;
        }

        // --- Function to stop the scanner ---
        async function stopScanner() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    console.log("Scanner stopped successfully.");
                } catch (err) {
                    console.error("Error stopping scanner:", err);
                } finally {
                    // Hide the reader container when stopped
                    document.getElementById(qrCodeRegionId).style.display = 'none';
                    setScanningState(false);
                }
            }
        }

        // --- Function to start the scanner ---
        async function startScanner() {
            // Before starting, stop any existing scanner instance to ensure a clean slate
            await stopScanner();

            // 1. Check for a secure context (HTTPS or localhost)
            if (!window.isSecureContext) {
                const errorMsg = "Camera access is only allowed on secure origins (HTTPS or localhost). Please access this page via HTTPS.";
                console.error(errorMsg);
                resultDiv.innerHTML = `<span class="error">Error: ${errorMsg}</span>`;
                return;
            }

            // 2. Show the reader container (it might have been hidden)
            const readerContainer = document.getElementById(qrCodeRegionId);
            readerContainer.style.display = 'block';

            // 3. Create a new instance of Html5Qrcode
            html5QrCode = new Html5Qrcode(qrCodeRegionId);

            // 4. Define the configuration for the scanner
            const config = { 
                fps: 10,     // Frames per second to scan
                qrbox: { width: 250, height: 150 } // Scanning box size
            };

            try {
                // This is the critical line that triggers the camera permission prompt
                await html5QrCode.start(
                    { facingMode: "environment" }, // Use the back camera
                    config,
                    (decodedText, decodedResult) => {
                        // Success callback: A QR code or barcode was detected
                        console.log(`Code detected: ${decodedText}`);
                        resultDiv.innerHTML = `✅ Success! Scanned result: <strong>${decodedText}</strong>`;
                        // Optional: Automatically stop scanning after a successful scan
                        // stopScanner();
                    },
                    (errorMessage) => {
                        // Error callback: This is for scanning errors (e.g., no QR code found in the current frame)
                        // These are normal and can be ignored or logged for debugging.
                        // console.log(`Scan error: ${errorMessage}`);
                    }
                );
                setScanningState(true);
                resultDiv.innerHTML = "Scanner is ready. Point your camera at a QR code or barcode.";
            } catch (err) {
                // This catch block handles errors from the .start() method
                console.error("Failed to start scanner:", err);
                let userMessage = "An unknown error occurred while starting the camera.";
                readerContainer.style.display = 'none';
                
                // Provide more specific error messages based on the error type
                if (err.name === 'NotAllowedError') {
                    userMessage = "Camera permission denied. Please allow camera access for this site in your browser settings, then refresh and try again.";
                } else if (err.name === 'NotFoundError') {
                    userMessage = "No camera found on this device.";
                } else if (err.name === 'NotReadableError') {
                    userMessage = "Camera is already in use by another application. Please close other apps and try again.";
                } else if (err.name === 'SecurityError' || err.message.includes('secure')) {
                    userMessage = "Camera access is restricted to secure contexts (HTTPS). Please access this page via HTTPS.";
                } else if (err.name === 'AbortError') {
                    userMessage = "Camera initialization was aborted. The camera might be in use by another tab or application.";
                }
                
                resultDiv.innerHTML = `<span class="error">Error: ${userMessage}</span>`;
                setScanningState(false);
            }
        }

        // --- File-based scanning (The robust fallback) ---
        async function scanImageFile(file) {
            if (!file) return;
            fileResultDiv.innerHTML = "Processing image...";
            
            // We need a temporary scanner instance for the file upload
            // A new instance can be created just for this purpose.
            const tempScanner = new Html5Qrcode(/* elementId not needed for file scan */);
            try {
                const decodedText = await tempScanner.scanFile(file, /* showImage= */ true);
                fileResultDiv.innerHTML = `✅ Success! Scanned from image: <strong>${decodedText}</strong>`;
            } catch (err) {
                console.error("File scan failed:", err);
                fileResultDiv.innerHTML = `<span class="error">Error: Could not read barcode from this image. Please try a clearer photo.</span>`;
            } finally {
                // Clean up the temporary scanner instance
                tempScanner.clear();
            }
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', startScanner);
        stopBtn.addEventListener('click', stopScanner);
        
        fileInput.addEventListener('change', (event) => {
            if (event.target.files.length > 0) {
                scanImageFile(event.target.files[0]);
            }
        });

        // --- Initial UI message ---
        if (!window.isSecureContext) {
            resultDiv.innerHTML = "<span class='error'>Warning: Page not loaded over HTTPS. Camera scanner will not work. Please use the 'Scan from an image file' option instead.</span>";
        } else {
            resultDiv.innerHTML = "Click 'Start Camera Scanner' and allow camera permissions when prompted.";
        }
    </script>
</body>
</html>
