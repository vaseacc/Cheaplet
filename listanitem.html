<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item - Scoralia</title>
    <script type="module" src="global.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- AI Safety Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,700;0,900;1,700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --mist:      #B3CDE0;
            --white:     #FFFFFF;
            --off-white: #F4F7FC;
            --surface:   #EBF2FA;
            --text-body: #1a2a4a;
            --text-muted:#6b84a3;
            --gold:      #C8A96E;
            --green:     #2E7D5E;
            --red:       #C0392B;
            --radius-sm: 8px;
            --radius-md: 16px;
            --shadow-sm: 0 2px 12px rgba(12,20,70,0.08);
            --shadow-md: 0 8px 32px rgba(12,20,70,0.13);
            --font-display: 'Source Serif 4', Georgia, serif;
            --font-body:    'Source Sans 3', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--off-white); color: var(--text-body); line-height: 1.6; min-height: 100vh; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

        #page-loader { position: fixed; inset: 0; background: var(--ink); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 14px; }
        #page-loader .loader-logo { font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; color: var(--white); letter-spacing: -0.5px; }
        #page-loader .loader-logo em { color: var(--gold); font-style: normal; }
        #page-loader .loader-dots { display: flex; gap: 7px; }
        #page-loader .loader-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--mist); opacity: 0.4; animation: dotPulse 1.2s ease-in-out infinite; }
        #page-loader .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        #page-loader .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

        header { position: sticky; top: 0; z-index: 200; background: rgba(12, 20, 70, 0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(179,205,224,0.15); animation: slideDown 0.4s ease both; }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 28px; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; color: var(--white); text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }
        nav ul { display: flex; list-style: none; gap: 28px; }
        nav ul li a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        nav ul li a:hover { color: var(--white); }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .page-hero { background: linear-gradient(135deg, var(--ink) 0%, var(--deep) 60%, #4a7db5 100%); padding: 36px 28px 32px; position: relative; overflow: hidden; animation: fadeIn 0.5s ease both; }
        .page-hero::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(179,205,224,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(179,205,224,0.06) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
        .page-hero-inner { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; text-align: center; animation: fadeUp 0.5s 0.1s ease both; opacity: 0; animation-fill-mode: forwards; }
        .page-hero h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 900; color: var(--white); letter-spacing: -0.5px; margin-bottom: 6px; }
        .page-hero p { color: rgba(255,255,255,0.6); font-size: 0.92rem; }

        .form-outer { max-width: 660px; margin: 36px auto 60px; padding: 0 20px; animation: fadeUp 0.5s 0.2s ease both; opacity: 0; animation-fill-mode: forwards; }
        .form-wrapper { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid rgba(179,205,224,0.3); padding: 36px 32px; }

        .form-section { border-bottom: 1px solid var(--surface); padding-bottom: 24px; margin-bottom: 24px; }
        .form-section:last-of-type { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .section-label { font-family: var(--font-display); font-size: 0.88rem; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-label i { color: var(--deep); font-size: 0.8rem; }

        label.field-label { font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; display: block; color: var(--text-muted); }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px 14px; margin-bottom: 16px; border: 1.5px solid rgba(179,205,224,0.5); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 0.93rem; color: var(--text-body); background: var(--off-white); outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; display: block; }
        input:focus, textarea:focus, select:focus { border-color: var(--deep); background: var(--white); box-shadow: 0 0 0 3px rgba(43,92,146,0.1); }
        textarea { resize: vertical; min-height: 100px; }

        .price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .price-row > div { display: flex; flex-direction: column; }
        .price-row input { margin-bottom: 0; }

        .tag-container { border: 1.5px solid rgba(179,205,224,0.5); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 16px; background: var(--off-white); display: flex; flex-wrap: wrap; gap: 7px; position: relative; transition: border-color 0.2s, box-shadow 0.2s; }
        .tag-container:focus-within { border-color: var(--deep); background: var(--white); box-shadow: 0 0 0 3px rgba(43,92,146,0.1); }
        .tag-chip { background: var(--surface); color: var(--deep); padding: 4px 10px; border-radius: 50px; font-size: 0.82rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--mist); animation: popIn 0.18s ease both; }
        .tag-chip .remove-tag { cursor: pointer; opacity: 0.6; font-size: 1rem; line-height: 1; transition: opacity 0.15s; }
        .tag-chip .remove-tag:hover { opacity: 1; }
        #tag-input { border: none; outline: none; padding: 4px 6px; flex-grow: 1; min-width: 120px; margin-bottom: 0; background: transparent; font-size: 0.9rem; box-shadow: none; }
        #tag-input:focus { box-shadow: none; }
        .suggestions-box { position: absolute; top: calc(100% + 4px); left: 0; width: 100%; background: var(--white); border: 1.5px solid rgba(179,205,224,0.5); border-radius: var(--radius-sm); max-height: 200px; overflow-y: auto; z-index: 50; display: none; box-shadow: var(--shadow-md); animation: fadeUp 0.15s ease both; }
        .suggestion-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--surface); display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; color: var(--text-body); transition: background 0.15s; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: var(--surface); }
        .suggestion-count { font-size: 0.75rem; color: var(--text-muted); background: var(--surface); padding: 2px 8px; border-radius: 50px; border: 1px solid var(--mist); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .two-col > div { display: flex; flex-direction: column; }
        .two-col select { margin-bottom: 0; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.88rem; cursor: pointer; color: var(--text-body); background: var(--surface); border: 1.5px solid rgba(179,205,224,0.4); border-radius: var(--radius-sm); padding: 8px 14px; transition: background 0.18s, border-color 0.18s; user-select: none; }
        .checkbox-item:has(input:checked) { background: var(--deep); border-color: var(--deep); color: var(--white); }
        .checkbox-item input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--deep); margin-bottom: 0; }
        .checkbox-item:has(input:checked) input { accent-color: var(--white); }

        .image-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .image-preview-wrapper { position: relative; width: 90px; height: 90px; animation: popIn 0.2s ease both; }
        .image-preview { width: 100%; height: 100%; border-radius: var(--radius-sm); object-fit: cover; border: 2px solid var(--mist); }
        .remove-image-btn { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; background: var(--red); color: var(--white); border: 2px solid var(--white); border-radius: 50%; cursor: pointer; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
        .remove-image-btn:hover { transform: scale(1.15); }
        #add-photo-label { width: 90px; height: 90px; border: 2px dashed rgba(179,205,224,0.7); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); gap: 5px; font-size: 0.75rem; transition: border-color 0.2s, background 0.2s, color 0.2s; }
        #add-photo-label i { font-size: 1.3rem; }
        #add-photo-label:hover { border-color: var(--deep); background: var(--surface); color: var(--deep); }
        #listing-image-input { display: none; }

        .form-buttons { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
        .btn-submit { flex: 1; min-width: 140px; background: var(--ink); color: var(--white); border: none; border-radius: var(--radius-sm); padding: 12px 20px; font-family: var(--font-body); font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.15s; }
        .btn-submit:hover:not(:disabled) { background: var(--deep); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-cancel { flex: 1; min-width: 120px; background: var(--surface); color: var(--text-muted); border: 1.5px solid rgba(179,205,224,0.5); border-radius: var(--radius-sm); padding: 12px 20px; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .btn-cancel:hover { background: var(--mist); color: var(--ink); }

        /* AI SAFETY UI */
        .ai-progress-container { width: 100%; background: #eee; border-radius: 10px; height: 10px; margin-top: 10px; display: none; overflow: hidden; }
        .ai-progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }
        .ai-status-text { font-size: 0.75rem; font-weight: bold; color: var(--deep); margin-top: 5px; text-align: center; display: none; }

        /* MOBILE CONSOLE OVERLAY */
        #mobile-debugger { position: fixed; bottom: 0; left: 0; width: 100%; max-height: 150px; background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; overflow-y: auto; z-index: 10000; pointer-events: none; border-top: 2px solid var(--gold); }

        @media (max-width: 767px) {
            nav { display: none; }
            .page-hero { padding: 28px 16px; }
            .form-outer { padding: 0 12px; margin: 24px auto 40px; }
            .form-wrapper { padding: 24px 18px; }
            .price-row { grid-template-columns: 1fr; }
            .two-col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="page-loader">
        <div class="loader-logo">Scor<em>alia</em></div>
        <div class="loader-dots"><span></span><span></span><span></span></div>
    </div>

    <!-- Mobile Debugger UI -->
    <div id="mobile-debugger">--- Scoralia System Logs ---<br></div>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="page-hero">
        <div class="page-hero-inner">
            <h1 id="ui-main-title">List an Item</h1>
            <p id="ui-main-subtitle">Fill in the details below and your book will be live in seconds.</p>
        </div>
    </div>

    <div class="form-outer">
        
        <div id="isbn-section" class="form-wrapper" style="text-align: center; margin-bottom: 20px;">
            <div class="section-label" style="justify-content: center;"><i class="fas fa-barcode"></i> <span id="ui-isbn-title">Quick Book Scan</span></div>
            <p id="ui-isbn-desc" style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Scan your book's barcode to automatically fill in the title and description.</p>
            <div id="reader" style="width: 100%; max-width: 400px; margin: 0 auto 20px; display: none; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid var(--mist);"></div>
            <button type="button" class="btn-submit" id="start-scan-btn" style="margin-bottom: 15px; width: 100%;">
                <i class="fas fa-camera"></i> <span id="ui-btn-scan">Scan Barcode</span>
            </button>
            <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
                <input type="text" id="manual-isbn-input" placeholder="Enter ISBN manually..." style="margin-bottom: 0; flex: 1;">
                <button type="button" class="btn-submit" id="manual-isbn-btn" style="min-width: 50px; padding: 10px;"><i class="fas fa-search"></i></button>
            </div>
            <button type="button" class="btn-cancel" id="skip-scan-btn" style="width: 100%;"><span id="ui-btn-skip">Skip & Fill Manually</span></button>
        </div>

        <div id="main-form-section" style="display: none;">
            <div class="form-wrapper">
                <form id="listing-form">
                    <input type="hidden" id="listing-isbn" value="">

                    <div class="form-section">
                        <div class="section-label"><i class="fas fa-pen"></i> <span id="ui-sec-basic">Basic Info</span></div>
                        <label class="field-label" id="ui-label-title">Title</label>
                        <input type="text" id="listing-title" maxlength="80" required>
                        <label class="field-label" id="ui-label-desc">Description</label>
                        <textarea id="listing-description" maxlength="1500" required></textarea>

                        <div class="price-row">
                            <div>
                                <label class="field-label" id="ui-label-price">Sale Price ($)</label>
                                <input type="text" inputmode="decimal" id="listing-price" placeholder="0.00" required oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1'); if(this.value > 1200) this.value = '1200';">
                            </div>
                            <div>
                                <label class="field-label" id="ui-label-orig-price">Original Price ($)</label>
                                <input type="text" inputmode="decimal" id="listing-original-price" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1'); if(this.value > 5000) this.value = '5000';">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-label"><i class="fas fa-tags"></i> <span id="ui-sec-tags">Tags</span></div>
                        <label class="field-label" id="ui-label-tags">Tags (Max 15)</label>
                        <div class="tag-container" id="tag-container">
                            <div id="selected-tags"></div>
                            <input type="text" id="tag-input" autocomplete="off">
                            <div class="suggestions-box" id="suggestions-box"></div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-label"><i class="fas fa-book"></i> <span id="ui-sec-cond">Condition & Details</span></div>
                        <div class="two-col">
                            <div>
                                <label class="field-label" id="ui-label-condition">Condition</label>
                                <select id="listing-condition" required>
                                    <option value="" id="opt-cond-select">Select Condition</option>
                                    <option value="New" id="opt-cond-new">New</option>
                                    <option value="Like New" id="opt-cond-likenew">Like New</option>
                                    <option value="Good" id="opt-cond-good">Good</option>
                                    <option value="Fair" id="opt-cond-fair">Fair</option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label" id="ui-label-code">Digital Access Code</label>
                                <select id="listing-digital-code">
                                    <option value="Not applicable" id="opt-code-na">Not applicable</option>
                                    <option value="Available / Unused" id="opt-code-avail">Available / Unused</option>
                                    <option value="Already used" id="opt-code-used">Already used</option>
                                </select>
                            </div>
                        </div>
                        <label class="field-label" id="ui-label-details">Additional Details</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" id="cond-writing"> <span id="ui-check-writing">Writing inside</span></label>
                            <label class="checkbox-item"><input type="checkbox" id="cond-water"> <span id="ui-check-water">Water damage</span></label>
                            <label class="checkbox-item"><input type="checkbox" id="cond-missing"> <span id="ui-check-missing">Missing pages</span></label>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-label"><i class="fas fa-location-dot"></i> <span id="ui-sec-loc">Location</span></div>
                        <div class="two-col">
                            <div>
                                <label class="field-label" id="ui-label-location">Campus Location</label>
                                <select id="listing-location" required><option value="Collège de Rosemont" selected>Collège de Rosemont</option></select>
                            </div>
                            <div>
                                <label class="field-label" id="ui-label-meet">Meeting Point</label>
                                <input type="text" id="listing-meeting-point" maxlength="60">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-label"><i class="fas fa-camera"></i> <span id="ui-sec-photo">Photos</span></div>
                        <label class="field-label" id="ui-label-photos">Photos (Max 5, Max 5MB each)</label>
                        <div id="image-uploader">
                            <div class="image-preview-grid" id="image-preview-container"></div>
                            <label for="listing-image-input" id="add-photo-label">
                                <i class="fas fa-plus"></i>
                                <span id="ui-btn-add-photo">Add Photo</span>
                            </label>
                            <input type="file" id="listing-image-input" accept="image/*">
                        </div>
                        
                        <!-- PROGRESS UI -->
                        <div class="ai-progress-container" id="ai-progress-container"><div class="ai-progress-bar" id="ai-progress-bar"></div></div>
                        <div class="ai-status-text" id="ai-status-text">Waking up AI...</div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-submit" id="postListingBtn"><i class="fas fa-paper-plane"></i> <span id="post-btn-text">Post Item</span></button>
                        <button type="button" class="btn-cancel" id="cancelListingBtn" onclick="window.location.href='/index.html'">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, query, where, getDocs, setDoc, increment, limit } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        const dbLog = document.getElementById('mobile-debugger');
        function sysLog(msg, color = "#0f0") { 
            const entry = document.createElement('div');
            entry.style.color = color;
            entry.innerHTML = `> ${msg}`;
            dbLog.appendChild(entry);
            dbLog.scrollTop = dbLog.scrollHeight;
        }

        // --- BACKGROUND AI SAFETY LOADER ---
        let nsfwModel = null;
        let isModelLoading = true;

        sysLog("System: Initializing NSFW Model...");
        nsfwjs.load().then(model => {
            nsfwModel = model;
            isModelLoading = false;
            sysLog("System: AI Security Scanner Ready ✅");
        }).catch(err => {
            sysLog(`CRITICAL ERROR: ${err.message}`, "red");
        });

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';

            const uiStrings = {
                en: {
                    mainTitle: "List an Item", mainSub: "Fill in the details below and your book will be live in seconds.",
                    isbnTitle: "Quick Book Scan", isbnDesc: "Scan your book's barcode to automatically fill in the title and description.",
                    btnScan: "Scan Barcode", btnSkip: "Skip & Fill Manually", isbnPlace: "Enter ISBN manually...",
                    fetching: "Fetching info...", notFound: "Book not found. Please fill manually.",
                    secBasic: "Basic Info", secTags: "Tags", secCond: "Condition & Details", secLoc: "Location", secPhoto: "Photos",
                    lblTitle: "Title", lblDesc: "Description",
                    lblPrice: "Sale Price ($) — Max $1200", lblOrigPrice: "Original Price ($) — Max $5000",
                    lblTags: "Tags (Max 15)", tagPlace: "Type and press Enter…",
                    lblCond: "Condition", optCondSel: "Select Condition", optNew: "New", optLikeNew: "Like New", optGood: "Good", optFair: "Fair",
                    lblCode: "Digital Access Code", optNa: "Not applicable", optAvail: "Available / Unused", optUsed: "Already used",
                    lblLoc: "Campus Location", lblMeet: "Meeting Point (Max 60 chars)", meetPlace: "e.g., Near Library",
                    lblDet: "Additional Details", chkWrite: "Writing inside", chkWater: "Water damage", chkMiss: "Missing pages",
                    lblPhotos: "Photos (Max 5, Max 5MB each)", btnAddPhoto: "Add Photo", btnPost: "Post Item", btnCancel: "Cancel",
                    priceErr: "Price cannot exceed $1200.", origPriceErr: "Original price cannot exceed $5000.",
                    imgErr: "Add at least one photo.", imgTypeErr: "Unsupported file type. Please upload an image.",
                    imgSizeErr: "Image too large (Max 5MB).", uploading: "Processing…",
                    tagLimit: "Max 15 tags allowed.", lenErr: "Title, Description, or Meeting Point too long.",
                    tagUses: "uses", uploadFail: "Image upload failed. Please try again.",
                    aiScanning: "Scanning pixels...", aiNotReady: "AI is still starting up. Please wait 3 seconds.",
                    aiBlocked: "Scoralia Security: Restricted content detected. This attempt has been logged."
                },
                fr: {
                    mainTitle: "Publier un article", mainSub: "Remplissez les détails ci-dessous et votre livre sera en ligne.",
                    isbnTitle: "Scan rapide du livre", isbnDesc: "Scannez le code-barres pour remplir automatiquement le titre et la description.",
                    btnScan: "Scanner le code-barres", btnSkip: "Ignorer et remplir manuellement", isbnPlace: "Entrer l'ISBN manuellement...",
                    fetching: "Recherche en cours...", notFound: "Livre introuvable. Veuillez remplir manuellement.",
                    secBasic: "Infos de base", secTags: "Mots-clés", secCond: "État et Détails", secLoc: "Emplacement", secPhoto: "Photos",
                    lblTitle: "Titre", lblDesc: "Description",
                    lblPrice: "Prix de vente ($) — Max 1200$", lblOrigPrice: "Prix d'origine ($) — Max 5000$",
                    lblTags: "Mots-clés (Max 15)", tagPlace: "Tapez et appuyez sur Entrée…",
                    lblCond: "État", optCondSel: "Sélectionner l'état", optNew: "Neuf", optLikeNew: "Comme neuf", optGood: "Bon état", optFair: "Acceptable",
                    lblCode: "Code d'accès numérique", optNa: "Non applicable", optAvail: "Disponible / Inutilisé", optUsed: "Déjà utilisé",
                    lblLoc: "Emplacement du campus", lblMeet: "Point de rencontre (Max 60 car.)", meetPlace: "ex: Près de la bibliothèque",
                    lblDet: "Détails supplémentaires", chkWrite: "Écritures à l'intérieur", chkWater: "Dommages causés par l'eau", chkMiss: "Pages manquantes",
                    lblPhotos: "Photos (Max 5, Max 5MB chacune)", btnAddPhoto: "Ajouter photo", btnPost: "Publier l'article", btnCancel: "Annuler",
                    priceErr: "Le prix ne peut dépasser 1200$.", origPriceErr: "Le prix d'origine ne peut dépasser 5000$.",
                    imgErr: "Ajoutez au moins une photo.", imgTypeErr: "Format non supporté. Veuillez télécharger une image.",
                    imgSizeErr: "Image trop lourde (Max 5MB).", uploading: "Traitement…",
                    tagLimit: "Maximum 15 tags autorisés.", lenErr: "Titre, Description ou Point de rencontre trop long.",
                    tagUses: "utilisations", uploadFail: "Échec du téléchargement de l'image. Veuillez réessayer.",
                    aiScanning: "Analyse en cours...", aiNotReady: "L'IA démarre encore. Attendez 3 secondes.",
                    aiBlocked: "Sécurité Scoralia : Contenu restreint détecté. Cette tentative a été enregistrée."
                }
            };
            const ui = uiStrings[lang];

            document.getElementById('ui-main-title').textContent = ui.mainTitle;
            document.getElementById('ui-main-subtitle').textContent = ui.mainSub;
            document.getElementById('ui-isbn-title').textContent = ui.isbnTitle;
            document.getElementById('ui-isbn-desc').textContent = ui.isbnDesc;
            document.getElementById('ui-btn-scan').textContent = ui.btnScan;
            document.getElementById('ui-btn-skip').textContent = ui.btnSkip;
            document.getElementById('manual-isbn-input').placeholder = ui.isbnPlace;
            document.getElementById('ui-sec-basic').textContent = ui.secBasic;
            document.getElementById('ui-sec-tags').textContent = ui.secTags;
            document.getElementById('ui-sec-cond').textContent = ui.secCond;
            document.getElementById('ui-sec-loc').textContent = ui.secLoc;
            document.getElementById('ui-sec-photo').textContent = ui.secPhoto;
            document.getElementById('ui-label-title').textContent = ui.lblTitle;
            document.getElementById('ui-label-desc').textContent = ui.lblDesc;
            document.getElementById('ui-label-price').textContent = ui.lblPrice;
            document.getElementById('ui-label-orig-price').textContent = ui.lblOrigPrice;
            document.getElementById('ui-label-tags').textContent = ui.lblTags;
            document.getElementById('tag-input').placeholder = ui.tagPlace;
            document.getElementById('ui-label-condition').textContent = ui.lblCond;
            document.getElementById('opt-cond-select').textContent = ui.optCondSel;
            document.getElementById('opt-cond-new').textContent = ui.optNew;
            document.getElementById('opt-cond-likenew').textContent = ui.optLikeNew;
            document.getElementById('opt-cond-good').textContent = ui.optGood;
            document.getElementById('opt-cond-fair').textContent = ui.optFair;
            document.getElementById('ui-label-code').textContent = ui.lblCode;
            document.getElementById('opt-code-na').textContent = ui.optNa;
            document.getElementById('opt-code-avail').textContent = ui.optAvail;
            document.getElementById('opt-code-used').textContent = ui.optUsed;
            document.getElementById('ui-label-location').textContent = ui.lblLoc;
            document.getElementById('ui-label-meet').textContent = ui.lblMeet;
            document.getElementById('listing-meeting-point').placeholder = ui.meetPlace;
            document.getElementById('ui-label-details').textContent = ui.lblDet;
            document.getElementById('ui-check-writing').textContent = ui.chkWrite;
            document.getElementById('ui-check-water').textContent = ui.chkWater;
            document.getElementById('ui-check-missing').textContent = ui.chkMiss;
            document.getElementById('ui-label-photos').textContent = ui.lblPhotos;
            document.getElementById('ui-btn-add-photo').textContent = ui.btnAddPhoto;
            document.getElementById('post-btn-text').textContent = ui.btnPost;
            document.getElementById('cancelListingBtn').textContent = ui.btnCancel;

            let selectedFiles = [];
            let tags = [];
            const pageLoader = document.getElementById('page-loader');
            const loaderTimeout = setTimeout(() => { pageLoader.style.display = 'none'; }, 4000);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const isOAuth = user.providerData.some(p => p.providerId === 'microsoft.com' || p.providerId === 'google.com');
                    if (user.emailVerified || isOAuth) {
                        try {
                            const userDoc = await getDoc(doc(db, "users", user.uid));
                            if (userDoc.exists() && userDoc.data().role === 'banned') {
                                clearTimeout(loaderTimeout); pageLoader.innerHTML = "<span style='color:white;'>Access Denied</span>"; return;
                            }
                            clearTimeout(loaderTimeout); pageLoader.style.display = 'none';
                        } catch (e) { clearTimeout(loaderTimeout); pageLoader.style.display = 'none'; }
                    } else { window.location.href = '/LoginInToCheaplet.html'; }
                } else { window.location.href = '/LoginInToCheaplet.html'; }
            });

            // Scan logic (unchanged)
            let html5QrCode;
            async function fetchBookData(isbn) {
                const scanBtn = document.getElementById('start-scan-btn');
                scanBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${ui.fetching}</span>`;
                scanBtn.disabled = true;
                try {
                    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        const book = data.items[0].volumeInfo;
                        document.getElementById('listing-title').value = book.title + (book.authors ? ` by ${book.authors.join(', ')}` : '');
                        document.getElementById('listing-isbn').value = isbn;
                        document.getElementById('isbn-section').style.display = 'none';
                        document.getElementById('main-form-section').style.display = 'block';
                        if(html5QrCode && html5QrCode.isScanning) await html5QrCode.stop();
                    } else { alert(ui.notFound); }
                } catch (err) { alert(ui.notFound); }
                scanBtn.innerHTML = `<i class="fas fa-camera"></i> <span>${ui.btnScan}</span>`;
                scanBtn.disabled = false;
            }

            document.getElementById('start-scan-btn').onclick = () => {
                if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                document.getElementById('reader').style.display = 'block';
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => { html5QrCode.stop().then(() => { document.getElementById('reader').style.display = 'none'; fetchBookData(txt); }); }, (err) => {}).catch(e => sysLog(`Camera Error: ${e.message}`, "red"));
            };

            document.getElementById('manual-isbn-btn').onclick = () => { const v = document.getElementById('manual-isbn-input').value.trim(); if(v) fetchBookData(v); };
            document.getElementById('skip-scan-btn').onclick = () => { document.getElementById('isbn-section').style.display = 'none'; document.getElementById('main-form-section').style.display = 'block'; };

            // Image handling with optimized AI scanner
            const imageInput = document.getElementById('listing-image-input');
            const previewContainer = document.getElementById('image-preview-container');
            const postBtn = document.getElementById('postListingBtn');
            const progressContainer = document.getElementById('ai-progress-container');
            const progressBar = document.getElementById('ai-progress-bar');
            const statusText = document.getElementById('ai-status-text');

            function renderPreviews() {
                previewContainer.innerHTML = '';
                selectedFiles.forEach((file, index) => {
                    const wrapper = document.createElement('div'); wrapper.className = 'image-preview-wrapper';
                    const img = document.createElement('img'); img.src = URL.createObjectURL(file); img.className = 'image-preview';
                    const btn = document.createElement('button'); btn.className = 'remove-image-btn'; btn.type = 'button'; btn.innerHTML = '&times;';
                    btn.onclick = () => { selectedFiles.splice(index, 1); renderPreviews(); };
                    wrapper.appendChild(img); wrapper.appendChild(btn); previewContainer.appendChild(wrapper);
                });
                document.getElementById('add-photo-label').style.display = selectedFiles.length < 5 ? 'flex' : 'none';
            }

            imageInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) { alert(ui.imgTypeErr); return; }
                if (file.size > 5 * 1024 * 1024) { alert(ui.imgSizeErr); return; }

                if (isModelLoading || !nsfwModel) {
                    alert(ui.aiNotReady); e.target.value = ''; return;
                }

                sysLog(`AI: Loading Image "${file.name}"...`);
                progressContainer.style.display = 'block';
                statusText.style.display = 'block';
                statusText.textContent = ui.aiScanning;
                progressBar.style.width = '30%';
                postBtn.disabled = true;

                try {
                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    
                    const result = await new Promise((resolve) => {
                        img.onload = async () => {
                            progressBar.style.width = '70%';
                            const predictions = await nsfwModel.classify(img);
                            URL.revokeObjectURL(img.src);
                            
                            const nsfw = predictions.find(p => (p.className === 'Porn' || p.className === 'Hentai') && p.probability > 0.65);
                            sysLog(`AI Result: ${predictions[0].className} (${(predictions[0].probability*100).toFixed(1)}%)`);
                            resolve(!nsfw);
                        };
                        img.onerror = () => { resolve(true); };
                    });

                    if (!result) {
                        sysLog("AI: Image Blocked 🛑", "orange");
                        alert(ui.aiBlocked);
                        if(auth.currentUser) {
                            await addDoc(collection(db, "reports"), { reporterName: "SYSTEM_AI", reason: "NSFW Upload Blocked", targetUid: auth.currentUser.uid, targetUserName: auth.currentUser.displayName, details: `Blocked file: ${file.name}`, timestamp: serverTimestamp() });
                        }
                    } else {
                        sysLog("AI: Image Approved ✅");
                        selectedFiles.push(file);
                        renderPreviews();
                    }
                } catch (err) {
                    sysLog(`AI Scanner Error: ${err.message}`, "red");
                    alert(`Scoralia Error: ${err.message}`);
                } finally {
                    progressBar.style.width = '100%';
                    setTimeout(() => { progressContainer.style.display = 'none'; statusText.style.display = 'none'; progressBar.style.width = '0%'; }, 500);
                    postBtn.disabled = false;
                    imageInput.value = '';
                }
            };

            // Post Form logic
            document.getElementById('listing-form').onsubmit = async (e) => {
                e.preventDefault();
                const price = parseFloat(document.getElementById('listing-price').value);
                if (price > 1200) { alert(ui.priceErr); return; }
                if (selectedFiles.length === 0) { alert(ui.imgErr); return; }

                postBtn.disabled = true;
                const postBtnText = document.getElementById('post-btn-text');
                postBtnText.textContent = ui.uploading;

                try {
                    const imageUrls = [];
                    for (const file of selectedFiles) {
                        const signRes = await fetch('/.netlify/functions/sign-upload').then(r => r.json());
                        const fd = new FormData();
                        fd.append('file', file); fd.append('api_key', signRes.apiKey); fd.append('timestamp', signRes.timestamp); fd.append('signature', signRes.signature); fd.append('upload_preset', signRes.uploadPreset);
                        const res = await fetch(`https://api.cloudinary.com/v1_1/${signRes.cloudName}/image/upload`, { method: 'POST', body: fd }).then(r => r.json());
                        imageUrls.push(res.secure_url);
                    }

                    const docRef = await addDoc(collection(db, 'listings'), {
                        title: document.getElementById('listing-title').value.trim(),
                        description: document.getElementById('listing-description').value.trim(),
                        price: price,
                        originalPrice: parseFloat(document.getElementById('listing-original-price').value) || null,
                        meetingPoint: document.getElementById('listing-meeting-point').value.trim(),
                        hasWriting: document.getElementById('cond-writing').checked,
                        hasWaterDamage: document.getElementById('cond-water').checked,
                        hasMissingPages: document.getElementById('cond-missing').checked,
                        condition: document.getElementById('listing-condition').value,
                        digitalCode: document.getElementById('listing-digital-code').value,
                        location: "Collège de Rosemont",
                        tags: tags,
                        imageUrls: imageUrls,
                        posterUid: auth.currentUser.uid,
                        posterDisplayName: auth.currentUser.displayName,
                        status: 'active',
                        timestamp: serverTimestamp()
                    });
                    window.location.href = `/listing.html?id=${docRef.id}`;
                } catch (err) {
                    alert(ui.uploadFail + "\n" + err.message);
                    postBtn.disabled = false;
                    postBtnText.textContent = ui.btnPost;
                }
            };

            // Tags logic (unchanged)
            const tagInput = document.getElementById('tag-input');
            const selectedTagsContainer = document.getElementById('selected-tags');
            const suggestionsBox = document.getElementById('suggestions-box');
            function renderTags() {
                selectedTagsContainer.innerHTML = '';
                tags.forEach((tag, index) => {
                    const chip = document.createElement('div'); chip.className = 'tag-chip';
                    chip.innerHTML = `${tag} <span class="remove-tag" onclick="window.removeTag(${index})">&times;</span>`;
                    selectedTagsContainer.appendChild(chip);
                });
            }
            window.removeTag = (index) => { tags.splice(index, 1); renderTags(); };
            function addTag(tagName) {
                const cleaned = tagName.trim();
                if (tags.length >= 15) return;
                if (cleaned && !tags.includes(cleaned)) { tags.push(cleaned); renderTags(); }
                tagInput.value = ''; suggestionsBox.style.display = 'none';
            }
            tagInput.oninput = async (e) => {
                const val = e.target.value.trim().toLowerCase();
                if (val.length < 1) { suggestionsBox.style.display = 'none'; return; }
                const q = query(collection(db, "global_tags"), where("tag_lowercase", ">=", val), where("tag_lowercase", "<=", val + "\uf8ff"), limit(5));
                const snap = await getDocs(q);
                suggestionsBox.innerHTML = '';
                if (!snap.empty) {
                    suggestionsBox.style.display = 'block';
                    snap.forEach(doc => {
                        const div = document.createElement('div'); div.className = 'suggestion-item';
                        div.innerHTML = `<span>${doc.data().tag}</span><span class="suggestion-count">${doc.data().count || 1} ${ui.tagUses}</span>`;
                        div.onmousedown = (ev) => { ev.preventDefault(); addTag(doc.data().tag); };
                        suggestionsBox.appendChild(div);
                    });
                }
            };
            tagInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(tagInput.value); } };
        }
        main();
    </script>
</body>
