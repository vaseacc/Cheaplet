<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>User Profile — Scoralia</title>
    
    <!-- GLOBAL BRAIN -->
    <script type="module" src="global.js"></script>
    
    <!-- FONTS & ICONS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ... keep all existing styles exactly as before ... */
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --mist:      #B3CDE0;
            --white:     #FFFFFF;
            --off-white: #F4F7FC;
            --surface:   #EBF2FA;
            --text-body: #1a2a4a;
            --text-muted:#64748b;
            --gold:      #C8A96E;
            --red:       #e53e3e;
            --radius-md: 16px;
            --shadow-sm: 0 4px 20px rgba(12,20,70,0.06);
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body:    'DM Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--off-white); color: var(--text-body); line-height: 1.6; padding-bottom: 60px; }

        /* ── HEADER ── */
        header { position: sticky; top: 0; z-index: 200; background: rgba(12, 20, 70, 0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(179,205,224,0.15); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; color: var(--white); text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }
        
        .main-wrapper { max-width: 900px; margin: 0 auto; padding: 0 20px; animation: fadeUp 0.5s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .info-message { text-align: center; padding: 80px 20px; font-size: 1.1rem; color: var(--text-muted); font-weight: 500; }
        .info-message i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }

        .profile-banner {
            position: relative; height: 220px; border-radius: 0 0 var(--radius-md) var(--radius-md);
            background: linear-gradient(135deg, var(--ink), var(--deep)); overflow: hidden;
        }
        
        .profile-header-card {
            background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
            padding: 0 40px 35px; margin: -60px auto 40px; position: relative; z-index: 10;
            border: 1px solid rgba(179,205,224,0.3);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .public-avatar-wrapper { 
            position: relative; width: 150px; height: 150px; 
            margin-top: -75px; margin-bottom: 15px; flex-shrink: 0;
        }
        
        .public-profile-photo { 
            width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--white); 
            background: var(--surface); object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,0.12); display: block;
        }

        .profile-name { font-family: var(--font-display); font-size: 2.2rem; font-weight: 900; color: var(--ink); line-height: 1.1; margin-bottom: 4px; }
        .profile-username { font-size: 1.05rem; color: var(--text-muted); font-weight: 500; margin-bottom: 16px; }
        .profile-bio { color: var(--text-body); font-size: 1rem; max-width: 600px; line-height: 1.6; margin-bottom: 20px; }
        
        .profile-meta { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .meta-tag { background: var(--surface); color: var(--deep); padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--mist); }
        .meta-tag.verified { background: rgba(46,125,50,0.1); color: var(--deep); border-color: rgba(46,125,50,0.2); }
        .meta-tag.rating { background: rgba(200,169,110,0.1); color: #b8860b; border-color: rgba(200,169,110,0.3); }
        .meta-tag.rating i { color: #d4af37; }

        .section-title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--ink); margin-bottom: 25px; border-left: 5px solid var(--gold); padding-left: 15px; }

        .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .listing-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); text-decoration: none; color: inherit; transition: transform 0.3s; border: 1px solid rgba(179,205,224,0.3); }
        .listing-card:hover { transform: translateY(-5px); }
        .listing-image { height: 180px; background-color: var(--surface); background-size: cover; background-position: center; }
        .listing-details { padding: 15px; }
        .listing-price { color: var(--deep); font-weight: 800; font-size: 1.2rem; font-family: var(--font-display); }
        .listing-title { font-weight: 600; font-size: 0.95rem; color: var(--ink); margin: 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.6em; }
        .listing-loc { font-size: 0.8rem; color: var(--text-muted); }

        /* ── ACTION BUTTONS (Message & Report) ── */
        .profile-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            margin-bottom: 10px;
        }
        .btn-message-profile {
            background: var(--deep);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 6px 16px rgba(43,92,146,0.25);
        }
        .btn-message-profile:hover {
            background: var(--ink);
            transform: translateY(-2px);
        }
        .btn-report-profile {
            background: transparent;
            border: 2px solid #fecaca;
            color: var(--red);
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .btn-report-profile:hover {
            background: #fee2e2;
        }

        /* Admin Zone */
        .admin-zone { margin: 30px auto 0; padding: 20px; border: 2px dashed var(--red); border-radius: 12px; background: #fff5f5; display: none; width: 100%; max-width: 500px; text-align: center; }
        .btn-ban { background: var(--red); color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.8); backdrop-filter: blur(4px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: var(--white); padding: 30px; border-radius: var(--radius-md); width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: fadeUp 0.3s ease; }
        .modal-card h2 { color: var(--red); margin-bottom: 10px; font-family: 'Playfair Display', serif; }
        .modal-card select, .modal-card textarea { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; font-family: inherit; font-size: 1rem; outline: none; }
        .modal-card textarea { height: 100px; resize: none; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 10px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-submit-red { background: var(--red); color: white; }
        .btn-cancel-gray { background: var(--surface); color: var(--text-body); }

        @media (max-width: 768px) {
            .profile-banner { height: 140px; border-radius: 0; }
            .profile-header-card { margin: -65px 0 20px; padding: 0 20px 30px; border-radius: 0; border: none; border-bottom: 1px solid var(--mist); box-shadow: none; }
            .public-avatar-wrapper { width: 130px; height: 130px; margin-top: -65px; }
            .profile-name { font-size: 1.8rem; }
            .listings-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .listing-image { height: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div> 
        </div>
    </header>

    <main class="main-wrapper">
        <div id="loader">
            <p class="info-message"><i class="fas fa-circle-notch fa-spin"></i> Loading profile...</p>
        </div>

        <div id="profile-content" style="display: none;">
            
            <div class="profile-banner" id="user-banner"></div>

            <div class="profile-header-card">
                <div class="public-avatar-wrapper">
                    <img id="user-avatar-img" class="public-profile-photo" alt="Profile picture">
                </div>
                
                <h1 class="profile-name" id="user-display-name"></h1>
                
                <div class="profile-username" id="user-handle"></div>
                <div class="profile-bio" id="user-bio"></div>
                
                <div class="profile-meta">
                    <div class="meta-tag rating" id="user-rating-display"></div>
                    <div class="meta-tag verified" id="verified-badge" style="display: none;">
                        <i class="fas fa-graduation-cap"></i> <span data-i18n="verified_student">Verified Student</span>
                    </div>
                    <div class="meta-tag">
                        <i class="fas fa-university"></i> <span id="user-school-name"></span>
                    </div>
                    <div class="meta-tag">
                        <i class="far fa-calendar-alt"></i> <span id="user-join-date"></span>
                    </div>
                </div>

                <!-- Message & Report Buttons - always in DOM, visibility controlled by JS -->
                <div class="profile-actions" id="profile-actions">
                    <button id="message-user-btn" class="btn-message-profile">
                        <i class="fas fa-comment-dots"></i> <span id="message-btn-text">Message</span>
                    </button>
                    <button id="report-user-btn" class="btn-report-profile">
                        <i class="fas fa-flag"></i> <span id="report-btn-text">Report</span>
                    </button>
                </div>

                <!-- Admin Zone -->
                <div class="admin-zone" id="admin-zone">
                    <h3 style="color:var(--red); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Admin Control</h3>
                    <button id="admin-ban-user-btn" class="btn-ban">Ban User & Delete Content</button>
                </div>
            </div>

            <h2 class="section-title" data-i18n="active_listings">Active Listings</h2>
            <div class="listings-grid" id="user-listings-grid"></div>
        </div>
    </main>

    <!-- REPORT MODAL -->
    <div class="modal-overlay" id="report-modal">
        <div class="modal-card">
            <h2 id="modal-title">Report User</h2>
            <p id="modal-desc">Please explain why you are reporting this user.</p>
            <select id="report-reason">
                <option value="Inappropriate Behavior">Inappropriate Behavior</option>
                <option value="Scam or Fraud">Scam or Fraud</option>
                <option value="Spam">Spam</option>
                <option value="Other">Other</option>
            </select>
            <textarea id="report-details" placeholder="Provide more details..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel-gray" id="close-report-btn">Cancel</button>
                <button class="btn btn-submit-red" id="submit-report-btn">Submit Report</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, orderBy, getDocs, deleteDoc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch(getFunctionUrl('config'));
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const strings = {
                en: { 
                    confirmBan: "Are you sure? This will delete all listings and block the user forever.", 
                    banned: "BANNED", notFound: "User not found.", 
                    reportSuccess: "User has been reported.", 
                    reportTitle: "Report User", reportDesc: "Help us keep Scoralia safe.", 
                    reportPlaceholder: "Describe the issue...", joinPrefix: "Joined ", 
                    noRatings: "No ratings yet", reviews: "reviews", 
                    unspecified: "Unspecified campus", 
                    messageSelf: "You cannot message yourself.",
                    messageBtn: "Message",
                    reportBtn: "Report",
                    activeListings: "Active Listings"
                },
                fr: { 
                    confirmBan: "Êtes-vous sûr ? Cela supprimera toutes les annonces et bloquera l'utilisateur définitivement.", 
                    banned: "BANNI", notFound: "Utilisateur non trouvé.", 
                    reportSuccess: "L'utilisateur a été signalé.", 
                    reportTitle: "Signaler l'utilisateur", reportDesc: "Aidez-nous à protéger Scoralia.", 
                    reportPlaceholder: "Décrivez le problème...", joinPrefix: "Membre depuis ", 
                    noRatings: "Aucune évaluation", reviews: "avis", 
                    unspecified: "Campus non spécifié", 
                    messageSelf: "Vous ne pouvez pas vous envoyer un message.",
                    messageBtn: "Message",
                    reportBtn: "Signaler",
                    activeListings: "Annonces actives"
                }
            }[lang];

            const loader = document.getElementById('loader');
            const profileContent = document.getElementById('profile-content');
            const userDisplayName = document.getElementById('user-display-name');
            const userHandle = document.getElementById('user-handle');
            const userBio = document.getElementById('user-bio');
            const userAvatar = document.getElementById('user-avatar-img');
            const userBanner = document.getElementById('user-banner');
            const userRatingDisplay = document.getElementById('user-rating-display');
            const userSchoolName = document.getElementById('user-school-name');
            const userJoinDate = document.getElementById('user-join-date');
            const userListingsGrid = document.getElementById('user-listings-grid');
            const adminZone = document.getElementById('admin-zone');
            const adminBanBtn = document.getElementById('admin-ban-user-btn');
            const reportBtn = document.getElementById('report-user-btn');
            const messageBtn = document.getElementById('message-user-btn');
            const profileActions = document.getElementById('profile-actions');
            const reportModal = document.getElementById('report-modal');
            
            // Set UI texts
            document.getElementById('message-btn-text').textContent = strings.messageBtn;
            document.getElementById('report-btn-text').textContent = strings.reportBtn;
            document.querySelector('[data-i18n="active_listings"]').textContent = strings.activeListings;
            document.querySelector('[data-i18n="verified_student"]').textContent = strings.verified_student || (lang==='fr'?'Étudiant vérifié':'Verified Student');

            let currentUser = null;
            let targetUserData = null;
            let targetUserId = null;

            function generateBannerGradient(uid) {
                let hash = 0;
                for (let i = 0; i < uid.length; i++) { hash = ((hash << 5) - hash) + uid.charCodeAt(i); hash |= 0; }
                const hue1 = Math.abs(hash % 360);
                const hue2 = (hue1 + 40) % 360;
                const sat = 65 + (Math.abs(hash >> 8) % 20);
                const light = 35 + (Math.abs(hash >> 16) % 20);
                return `linear-gradient(135deg, hsl(${hue1}, ${sat}%, ${light}%), hsl(${hue2}, ${sat}%, ${light - 15}%))`;
            }

            async function createPersonalChat(otherUserId, otherUserName) {
                try {
                    const chatsQuery = query(
                        collection(db, "chats"),
                        where("participants", "array-contains", currentUser.uid)
                    );
                    const chatsSnap = await getDocs(chatsQuery);
                    let existingChatId = null;
                    
                    for (const docSnap of chatsSnap.docs) {
                        const data = docSnap.data();
                        if (!data.listingId && data.participants.includes(otherUserId)) {
                            existingChatId = docSnap.id;
                            break;
                        }
                    }

                    if (existingChatId) {
                        window.location.href = `/chat.html?id=${existingChatId}`;
                        return;
                    }

                    const participants = [currentUser.uid, otherUserId];
                    const chatRef = await addDoc(collection(db, "chats"), {
                        participants: participants,
                        listingId: null,
                        listingTitle: null,
                        participantInfo: {
                            [currentUser.uid]: currentUser.displayName || "You",
                            [otherUserId]: otherUserName
                        },
                        lastMessage: "",
                        lastUpdate: serverTimestamp(),
                        createdAt: serverTimestamp(),
                        unreadBy: []
                    });

                    window.location.href = `/chat.html?id=${chatRef.id}`;
                } catch (error) {
                    console.error("Error creating personal chat:", error);
                    alert("Could not start chat. Please try again.");
                }
            }

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                if (user) {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().role === 'admin') adminZone.style.display = 'block';
                }
                
                targetUserId = new URLSearchParams(window.location.search).get('id');
                
                // Show buttons if viewing another user and logged in
                if (user && targetUserId && targetUserId !== user.uid) {
                    profileActions.style.display = 'flex';
                } else {
                    profileActions.style.display = 'none';
                }
                
                // Also show report button only when appropriate
                if (reportBtn) {
                    reportBtn.style.display = (user && targetUserId && targetUserId !== user.uid) ? 'inline-flex' : 'none';
                }
            });

            // Message button click
            messageBtn.addEventListener('click', async () => {
                if (!currentUser) {
                    window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                    return;
                }
                if (currentUser.uid === targetUserId) {
                    alert(strings.messageSelf);
                    return;
                }
                await createPersonalChat(targetUserId, targetUserData?.displayName || 'User');
            });

            // Report button
            reportBtn.addEventListener('click', () => {
                reportModal.style.display = 'flex';
            });
            document.getElementById('close-report-btn').addEventListener('click', () => reportModal.style.display = 'none');
            document.getElementById('submit-report-btn').addEventListener('click', async () => {
                const reason = document.getElementById('report-reason').value;
                const details = document.getElementById('report-details').value.trim();
                if (!reason) return;
                try {
                    await addDoc(collection(db, "reports"), { 
                        reporterUid: currentUser.uid, 
                        reporterName: currentUser.displayName, 
                        targetUid: targetUserId, 
                        targetUserName: targetUserData ? targetUserData.displayName : "User", 
                        reason: reason, 
                        details: details, 
                        timestamp: serverTimestamp() 
                    });
                    alert(strings.reportSuccess); 
                    reportModal.style.display = 'none';
                } catch (e) { alert("Error."); }
            });

            async function banUser(targetUid) {
                if (!confirm(strings.confirmBan)) return;
                adminBanBtn.disabled = true;
                try {
                    const snap = await getDocs(query(collection(db, "listings"), where("posterUid", "==", targetUid)));
                    for (const d of snap.docs) { await deleteDoc(d.ref); }
                    await updateDoc(doc(db, "users", targetUid), { role: 'banned' });
                    window.location.href = '/index.html';
                } catch (e) { alert(e.message); adminBanBtn.disabled = false; }
            }

            async function loadProfile() {
                targetUserId = new URLSearchParams(window.location.search).get('id');
                if (!targetUserId) { loader.innerHTML = `<p class="info-message">${strings.notFound}</p>`; return; }
                
                adminBanBtn.onclick = () => banUser(targetUserId);

                try {
                    const userSnap = await getDoc(doc(db, "users", targetUserId));
                    if (userSnap.exists()) {
                        targetUserData = userSnap.data();
                        
                        userDisplayName.textContent = targetUserData.displayName || "User";
                        if (targetUserData.role === 'banned') userDisplayName.innerHTML += ` <span style="color:red; font-size:1rem;">(${strings.banned})</span>`;
                        userHandle.textContent = targetUserData.username ? `@${targetUserData.username}` : '';
                        userBio.textContent = targetUserData.bio || '';
                        userSchoolName.textContent = targetUserData.schoolName || strings.unspecified;
                        userBanner.style.background = generateBannerGradient(targetUserId);

                        let photoURL = targetUserData.photoURL;
                        if (!photoURL || photoURL.includes("googleusercontent") || photoURL.includes("live.com")) {
                            photoURL = `https://api.dicebear.com/7.x/identicon/svg?seed=${targetUserId}&backgroundColor=EBF2FA`;
                        }
                        userAvatar.src = photoURL;

                        if (targetUserData.ratingCount && targetUserData.ratingCount > 0) {
                            const avg = (targetUserData.ratingSum / targetUserData.ratingCount).toFixed(1);
                            let starsHtml = '';
                            for(let i=1; i<=5; i++) {
                                if (avg >= i) starsHtml += '<i class="fas fa-star"></i>';
                                else if (avg >= i - 0.5) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                                else starsHtml += '<i class="far fa-star"></i>';
                            }
                            userRatingDisplay.innerHTML = `${starsHtml} <span>(${avg} • ${targetUserData.ratingCount} ${strings.reviews})</span>`;
                        } else {
                            userRatingDisplay.innerHTML = `<i class="far fa-star"></i> <span>${strings.noRatings}</span>`;
                        }

                        if (targetUserData.isStudent) document.getElementById('verified-badge').style.display = 'inline-flex';

                        if (targetUserData.createdAt) {
                            const date = new Date(targetUserData.createdAt);
                            userJoinDate.textContent = `${strings.joinPrefix}${date.toLocaleDateString(lang === 'fr' ? 'fr-CA' : 'en-US', { year: 'numeric', month: 'long' })}`;
                        }
                    } else {
                        loader.innerHTML = `<p class="info-message">${strings.notFound}</p>`; 
                        return;
                    }
                } catch (e) { console.error(e); }

                // Fetch Listings
                const q = query(collection(db, "listings"), where("posterUid", "==", targetUserId), where("status", "==", "active"), orderBy("timestamp", "desc"));
                onSnapshot(q, (snapshot) => {
                    userListingsGrid.innerHTML = '';
                    if (snapshot.empty) userListingsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; font-weight:500;">No active listings.</p>';
                    else snapshot.forEach(doc => {
                        const d = doc.data();
                        const card = document.createElement('a');
                        card.className = 'listing-card';
                        card.href = `/listing.html?id=${doc.id}`;
                        card.innerHTML = `
                            <div class="listing-image" style="background-image: url('${d.imageUrls?.[0] || ''}')"></div>
                            <div class="listing-details">
                                <div class="listing-price">$${d.price.toFixed(2)}</div>
                                <h3 class="listing-title">${d.title}</h3>
                                <div class="listing-loc"><i class="fas fa-map-marker-alt"></i> ${d.location}</div>
                            </div>`;
                        userListingsGrid.appendChild(card);
                    });
                    loader.style.display = 'none';
                    profileContent.style.display = 'block';
                });
            }
            loadProfile();
        }
        main();
    </script>
</body>
</html>
