<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Details - Cheaplet</title>
    <!-- GLOBAL BRAIN (Header, Auth, Ban Check) -->
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { 
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); 
            color: white; height: 60px; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex; align-items: center; justify-content: space-between; 
            z-index: 100; flex-shrink: 0; 
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; display: flex; align-items: center; }
        .logo span { color: #FFD700; }
        nav ul { display: flex; list-style: none; margin: 0; padding: 0; gap: 20px; }
        .header-right { display: flex; align-items: center; gap: 15px; }

        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
        .image-stage { flex: 1; background-color: #000; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .blurred-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center; filter: blur(40px) brightness(0.5); z-index: 1; transition: background-image 0.3s ease-in-out; transform: scale(1.1); }
        .main-image-container { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .main-image { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background-color: rgba(60, 60, 60, 0.6); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; border: none; z-index: 10; }
        .nav-prev { left: 20px; } .nav-next { right: 20px; }
        .thumbnails-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; padding: 5px; }
        .thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; cursor: pointer; opacity: 0.6; border: 2px solid white; transition: all 0.2s; }
        .thumb.active { opacity: 1; border-color: #FFD700; transform: scale(1.15); }

        .details-panel { width: 420px; background-color: white; border-left: 1px solid #ddd; overflow-y: auto; display: flex; flex-direction: column; padding: 25px; flex-shrink: 0; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; color: #050505; }
        .price-container { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .price { font-size: 1.5rem; font-weight: 700; color: #2E7D32; }
        .original-price { font-size: 1.1rem; color: #999; text-decoration: line-through; }
        
        .meta-info { font-size: 0.85rem; color: #65676b; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .action-buttons { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-primary { flex: 1; background-color: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: 600; padding: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; }
        .btn-icon { width: 45px; height: 42px; background-color: #f0f0f0; border-radius: 6px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        .section-header { font-weight: 700; font-size: 1.1rem; margin-top: 15px; margin-bottom: 10px; color: #050505; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .info-label { font-weight: 600; color: #555; }
        .description-text { font-size: 0.95rem; line-height: 1.6; color: #444; white-space: pre-wrap; margin-bottom: 20px; }
        .seller-section { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
        #seller-avatar-small { width: 45px; height: 45px; border-radius: 50%; background: #ddd; background-size: cover; background-position: center; border: 1px solid #eee; }
        .seller-name { font-weight: 600; color: #050505; text-decoration: none; }
        .quick-message-container { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-send { background-color: #4CAF50; color: white; width: 100%; border: none; border-radius: 6px; height: 40px; font-weight: 600; cursor: pointer; }

        @media (max-width: 900px) { .main-wrapper { flex-direction: column; overflow-y: auto; height: auto; } .image-stage { height: 350px; flex: none; } .details-panel { width: 100%; border-left: none; height: auto; padding-bottom: 50px; } nav { display: none; } }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="/index.html" class="logo">Cheap<span>let</span></a>
            <nav><ul></ul></nav>
        </div>
        <div class="header-right"></div>
    </header>

    <div class="main-wrapper">
        <div class="image-stage">
            <div class="blurred-bg" id="blur-bg"></div>
            <div class="main-image-container">
                <button class="nav-arrow nav-prev" id="prev-img-btn"><i class="fas fa-chevron-left"></i></button>
                <img src="" alt="Listing Item" class="main-image" id="main-image">
                <button class="nav-arrow nav-next" id="next-img-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="thumbnails-overlay" id="thumbnail-container"></div>
        </div>

        <div class="details-panel" id="details-container">
            <h1 id="listing-title">Loading...</h1>
            <div class="price-container">
                <div class="price" id="listing-price"></div>
                <div class="original-price" id="original-price-display"></div>
            </div>
            <div class="meta-info" id="listing-meta"></div>

            <div class="action-buttons" id="main-action-buttons">
                <button class="btn-primary" id="btn-message-seller">
                    <i class="fas fa-paper-plane"></i> &nbsp; <span data-i18n="btn_message">Message</span>
                </button>
                <button class="btn-icon" id="btn-save"><i class="far fa-bookmark"></i></button>
                <button class="btn-icon" id="btn-share"><i class="fas fa-share-alt"></i></button>
            </div>

            <div class="section-header" data-i18n="details_title">Details</div>
            <div class="info-row">
                <span class="info-label" data-i18n="condition_label">Condition</span>
                <span class="info-value" id="listing-condition"></span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="access_code_label">Access Code</span>
                <span class="info-value" id="listing-digital-code"></span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="location_label">Location</span>
                <span class="info-value" id="location-text"></span>
            </div>
            
            <div class="info-row">
                <span class="info-label" data-i18n="label_meeting_point">Meeting Point</span>
                <span class="info-value" id="listing-meeting-point"></span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="label_writing">Writing inside</span>
                <span class="info-value" id="listing-writing"></span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="label_water">Water damage</span>
                <span class="info-value" id="listing-water"></span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="label_missing">Missing pages</span>
                <span class="info-value" id="listing-missing"></span>
            </div>

            <div class="section-header" data-i18n="description_title">Description</div>
            <p class="description-text" id="listing-description"></p>

            <div class="section-header" data-i18n="seller_title">Seller Information</div>
            <div class="seller-section">
                <div id="seller-avatar-small"></div>
                <div>
                    <a href="#" id="seller-name-link" class="seller-name">Loading...</a>
                    <div style="font-size: 0.8rem; color: #65676b;">Cheaplet Member</div>
                </div>
            </div>

            <div class="quick-message-container" id="quick-message-area">
                <div class="quick-msg-label" data-i18n="quick_msg_label">Send a quick message</div>
                <textarea class="quick-msg-input" id="quick-msg-text">Hi, is this available?</textarea>
                <button class="btn-send" id="btn-quick-send" data-i18n="btn_send">Send</button>
            </div>

            <div class="admin-controls" id="admin-controls" style="display:none;">
                <p style="color: #d32f2f; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;">Admin Zone</p>
                <button class="btn-delete" id="delete-listing-btn">Delete Listing</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp, deleteDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const mainImage = document.getElementById('main-image');
            const blurBg = document.getElementById('blur-bg'); 
            const thumbnailContainer = document.getElementById('thumbnail-container');
            const saveBtn = document.getElementById('btn-save');
            const shareBtn = document.getElementById('btn-share');
            
            let currentUser = null;
            let currentListingData = null;
            let currentListingId = null;
            let currentImageIndex = 0;
            let imageUrls = [];
            let isSaved = false; 

            const dataTranslations = {
                fr: {
                    "New": "Neuf", "Like New": "Comme neuf", "Good": "Bon état", "Fair": "État correct",
                    "Not applicable": "Non applicable", "Available / Unused": "Disponible / Inutilisé", "Already used": "Déjà utilisé",
                    "Dawson College": "Collège Dawson", "Vanier College": "Collège Vanier", "John Abbott College": "John Abbott College",
                    "Yes": "Oui", "No": "Non", "N/A": "N/O"
                }
            };

            function translateData(value) {
                if (value === true) value = "Yes";
                if (value === false) value = "No";
                const lang = localStorage.getItem('preferred_language') || 'en';
                if (lang === 'fr' && dataTranslations.fr[value]) return dataTranslations.fr[value];
                return value;
            }

            onAuthStateChanged(auth, user => {
                currentUser = user;
                const lang = localStorage.getItem('preferred_language') || 'en';
                if (lang === 'fr') document.getElementById('quick-msg-text').value = "Bonjour, est-ce disponible ?";
                fetchAndDisplayListing();
            });

            async function fetchAndDisplayListing() {
                const params = new URLSearchParams(window.location.search);
                currentListingId = params.get('id');
                if (!currentListingId) { window.location.href = '/index.html'; return; }

                try {
                    const listingRef = doc(db, 'listings', currentListingId);
                    const listingSnap = await getDoc(listingRef);
                    if (!listingSnap.exists()) { document.getElementById('listing-title').textContent = "Listing not found."; return; }

                    const data = listingSnap.data();
                    currentListingData = data;
                    const savedLang = localStorage.getItem('preferred_language') || 'en';

                    document.getElementById('listing-title').textContent = data.title;
                    
                    if (data.status === 'sold') {
                        const soldText = savedLang === 'fr' ? "VENDU" : "SOLD";
                        document.getElementById('listing-price').innerHTML = `<span style="color: #d32f2f; font-weight: 800;">${soldText}</span>`;
                        document.getElementById('original-price-display').style.display = 'none';
                        document.getElementById('btn-message-seller').style.display = 'none';
                        document.getElementById('btn-save').style.display = 'none';
                        document.getElementById('quick-message-area').style.display = 'none';
                    } else {
                        document.getElementById('listing-price').textContent = `$${data.price.toFixed(2)}`;
                        const origPriceEl = document.getElementById('original-price-display');
                        if (data.originalPrice) {
                            origPriceEl.textContent = `$${data.originalPrice.toFixed(2)}`;
                            origPriceEl.style.display = 'block';
                        } else {
                            origPriceEl.style.display = 'none';
                        }
                    }
                    
                    const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() : '';
                    const metaPrefix = savedLang === 'fr' ? 'Publié le' : 'Listed';
                    
                    document.getElementById('listing-meta').textContent = `${metaPrefix} ${date} • ${translateData(data.location)}`;
                    document.getElementById('location-text').textContent = translateData(data.location);
                    document.getElementById('listing-condition').textContent = translateData(data.condition || "Used");
                    document.getElementById('listing-digital-code').textContent = translateData(data.digitalCode || "N/A");
                    
                    document.getElementById('listing-meeting-point').textContent = data.meetingPoint || (savedLang === 'fr' ? "À discuter" : "To be discussed");
                    document.getElementById('listing-writing').textContent = translateData(data.hasWriting);
                    document.getElementById('listing-water').textContent = translateData(data.hasWaterDamage);
                    document.getElementById('listing-missing').textContent = translateData(data.hasMissingPages);

                    document.getElementById('listing-description').textContent = data.description;
                    document.getElementById('seller-name-link').textContent = data.posterDisplayName || "A User";
                    document.getElementById('seller-name-link').href = `/user.html?id=${data.posterUid}`;
                    
                    if (data.posterUid) {
                        try {
                            const sellerDoc = await getDoc(doc(db, "users", data.posterUid));
                            if (sellerDoc.exists() && sellerDoc.data().photoURL) {
                                document.getElementById('seller-avatar-small').style.backgroundImage = `url('${sellerDoc.data().photoURL}')`;
                            }
                        } catch(e) {}
                    }

                    imageUrls = data.imageUrls || [];
                    if (imageUrls.length > 0) {
                        updateMainImage(0); 
                        thumbnailContainer.innerHTML = '';
                        imageUrls.forEach((url, index) => {
                            const img = document.createElement('img');
                            img.src = url;
                            img.className = `thumb ${index === 0 ? 'active' : ''}`;
                            img.onclick = () => updateMainImage(index);
                            thumbnailContainer.appendChild(img);
                        });
                    }

                    if (currentUser) {
                        const userRef = doc(db, "users", currentUser.uid);
                        const userSnap = await getDoc(userRef);
                        if (userSnap.exists()) {
                            const userData = userSnap.data();
                            if (userData.savedListings && userData.savedListings.includes(currentListingId)) {
                                isSaved = true;
                                updateSaveIcon();
                            }
                            if (currentUser.uid === data.posterUid || userData.role === 'admin') {
                                document.getElementById('admin-controls').style.display = 'block';
                                document.getElementById('delete-listing-btn').onclick = () => deleteListing(currentListingId, userData.role === 'admin');
                            }
                        }
                    }
                } catch (error) { console.error(error); }
            }

            function updateMainImage(index) {
                currentImageIndex = index;
                const url = imageUrls[index];
                mainImage.src = url;
                blurBg.style.backgroundImage = `url('${url}')`;
                document.querySelectorAll('.thumb').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }

            document.getElementById('prev-img-btn').onclick = () => { if (imageUrls.length === 0) return; let newIndex = currentImageIndex - 1; if (newIndex < 0) newIndex = imageUrls.length - 1; updateMainImage(newIndex); };
            nextBtn.onclick = () => { if (imageUrls.length === 0) return; let newIndex = currentImageIndex + 1; if (newIndex >= imageUrls.length) newIndex = 0; updateMainImage(newIndex); };

            async function createChat(posterUid, posterName) {
                const uids = [currentUser.uid, posterUid].sort();
                const chatId = uids.join('_');
                const chatRef = doc(db, 'chats', chatId);
                try {
                    const chatSnap = await getDoc(chatRef);
                    if (!chatSnap.exists()) {
                        await setDoc(chatRef, { 
                            participants: uids, 
                            participantInfo: { [currentUser.uid]: currentUser.displayName, [posterUid]: posterName }, 
                            lastUpdate: serverTimestamp(), 
                            lastMessage: "",
                            listingId: currentListingId // ADDED AS REQUESTED
                        }); 
                    }
                    window.location.href = `/chat.html?id=${chatId}`;
                } catch (error) { alert("Error starting chat."); }
            }

            document.getElementById('btn-message-seller').onclick = () => createChat(currentListingData.posterUid, currentListingData.posterDisplayName);
            document.getElementById('btn-quick-send').onclick = () => createChat(currentListingData.posterUid, currentListingData.posterDisplayName);

            function updateSaveIcon() {
                const icon = saveBtn.querySelector('i');
                if (isSaved) { icon.classList.replace('far', 'fas'); icon.style.color = '#4CAF50'; }
                else { icon.classList.replace('fas', 'far'); icon.style.color = '#555'; }
            }

            saveBtn.onclick = async () => {
                if (!currentUser) {
                    const currentPath = window.location.pathname + window.location.search;
                    window.location.href = `/LoginInToCheaplet.html?redirect=${encodeURIComponent(currentPath)}`;
                    return;
                }
                const userRef = doc(db, "users", currentUser.uid);
                const lang = localStorage.getItem('preferred_language') || 'en';
                if (isSaved) {
                    await updateDoc(userRef, { savedListings: arrayRemove(currentListingId) });
                    isSaved = false;
                } else {
                    await updateDoc(userRef, { savedListings: arrayUnion(currentListingId) });
                    isSaved = true;
                    const msg = lang === 'fr' 
                        ? "Annonce enregistrée ! Vous pouvez la retrouver dans votre profil." 
                        : "Listing saved! You can find it in your profile.";
                    alert(msg);
                }
                updateSaveIcon();
            };

            shareBtn.onclick = async () => {
                const url = window.location.href;
                const title = currentListingData ? currentListingData.title : 'Cheaplet Listing';
                const lang = localStorage.getItem('preferred_language') || 'en';
                const copyMsg = lang === 'fr' ? "Lien copié !" : "Link copied!";
                if (navigator.share) {
                    try { await navigator.share({ title: title, url: url }); } catch (err) { await navigator.clipboard.writeText(url); alert(copyMsg); }
                } else { await navigator.clipboard.writeText(url); alert(copyMsg); }
            };

            async function deleteListing(docId, isAdmin) { if (confirm("Delete listing?")) { await deleteDoc(doc(db, 'listings', docId)); window.location.href = '/index.html'; } }
        }
        main();
    </script>
</body>
</html>
