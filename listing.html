<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Details - Cheaplet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #050505; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* --- FB-Style Header --- */
        header { background-color: white; padding: 0 16px; height: 56px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; z-index: 100; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo { font-size: 28px; font-weight: bold; color: #4CAF50; text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: #FFD700; }
        
        .header-right { display: flex; align-items: center; gap: 8px; }
        
        /* Circular Icon Buttons */
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; background-color: #e4e6eb; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: #050505; text-decoration: none;
            transition: background-color 0.2s; font-size: 18px;
        }
        .icon-btn:hover { background-color: #d8dadf; }
        
        /* Profile Dropdown Trigger */
        .profile-trigger { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 1px solid #ddd; }
        .profile-trigger img { width: 100%; height: 100%; object-fit: cover; }
        .profile-trigger div { width: 100%; height: 100%; background-color: #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #666; }

        /* --- Main Content Layout (Split Screen) --- */
        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 56px); overflow: hidden; }
        
        /* Left: Image Stage */
        .image-stage {
            flex: 1; background-color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }
        .main-image-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .main-image { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Navigation Arrows */
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 48px; height: 48px; border-radius: 50%; background-color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.5); color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: background 0.3s;
        }
        .nav-arrow:hover { background-color: rgba(255,255,255,0.5); }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }

        /* Right: Details Panel */
        .details-panel {
            width: 400px; background-color: white; border-left: 1px solid #ddd; overflow-y: auto; display: flex; flex-direction: column;
            padding: 20px; flex-shrink: 0;
        }

        /* Listing Info Styles */
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
        .price { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .meta-info { font-size: 0.9rem; color: #65676b; margin-bottom: 16px; }
        
        /* Action Buttons Row */
        .action-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-primary {
            flex: 1; background-color: #e7f3ff; color: #1877f2; border: none; border-radius: 6px; font-weight: 600;
            padding: 0 12px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: background 0.2s; text-decoration: none;
        }
        .btn-primary:hover { background-color: #dbe7f2; }
        .btn-icon {
            width: 48px; height: 36px; background-color: #e4e6eb; border-radius: 6px; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
        }
        .btn-icon:hover { background-color: #d8dadf; }

        /* Sections */
        .section-header { font-weight: 600; font-size: 1.1rem; margin-top: 20px; margin-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .info-label { font-weight: 600; color: #050505; }
        .info-value { color: #65676b; }
        
        .description-text { font-size: 0.9rem; line-height: 1.5; color: #050505; white-space: pre-wrap; }

        /* Seller Map/Info Placeholder */
        .seller-map { height: 120px; background-color: #f0f2f5; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; justify-content: center; color: #65676b; font-size: 0.8rem; }

        /* Quick Message Box */
        .quick-message-container { margin-top: 30px; border-top: 1px solid #ddd; padding-top: 15px; }
        .quick-msg-label { font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; color: #1877f2; }
        .quick-msg-input {
            width: 100%; border: 1px solid #ccc; border-radius: 20px; padding: 10px 15px; font-size: 0.95rem; resize: none; margin-bottom: 10px; outline: none; background: #f0f2f5;
        }
        .quick-msg-input:focus { border-color: #1877f2; }
        .btn-send {
            background-color: #1877f2; color: white; width: 100%; border: none; border-radius: 6px; height: 36px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-send:hover { background-color: #166fe5; }

        /* Admin Delete Button */
        .admin-controls { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; display: none; }
        .btn-delete { background-color: #fce8e6; color: #d32f2f; width: 100%; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Thumbnails on Image Stage */
        .thumbnails-row {
            height: 60px; display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.5); width: 100%; justify-content: center;
        }
        .thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; cursor: pointer; opacity: 0.6; border: 2px solid transparent; }
        .thumb.active { opacity: 1; border-color: white; }

        /* Responsive */
        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; overflow-y: auto; height: auto; }
            .image-stage { height: 300px; }
            .details-panel { width: 100%; border-left: none; overflow: visible; height: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="/index.html" class="logo">Cheap<span>let</span></a>
        </div>
        <div class="header-right">
            <!-- Icons -->
            <a href="/index.html" class="icon-btn" title="Menu"><i class="fas fa-th"></i></a>
            <a href="/messages.html" class="icon-btn" title="Messages"><i class="fab fa-facebook-messenger"></i></a>
            <div class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></div>
            
            <!-- Profile Avatar (Click goes to profile) -->
            <a href="/profile.html" class="profile-trigger" id="header-profile-link">
                <div id="header-avatar-placeholder">?</div>
            </a>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- Left: Image Gallery -->
        <div class="image-stage">
            <div class="main-image-container">
                <button class="nav-arrow nav-prev" id="prev-img-btn"><i class="fas fa-chevron-left"></i></button>
                <img src="" alt="Listing Item" class="main-image" id="main-image">
                <button class="nav-arrow nav-next" id="next-img-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="thumbnails-row" id="thumbnail-container">
                <!-- Thumbnails injected here -->
            </div>
        </div>

        <!-- Right: Details -->
        <div class="details-panel" id="details-container">
            <h1 id="listing-title">Loading...</h1>
            <div class="price" id="listing-price"></div>
            <div class="meta-info" id="listing-meta"></div>

            <div class="action-buttons">
                <button class="btn-primary" id="btn-message-seller">
                    <i class="fab fa-facebook-messenger"></i> Message
                </button>
                <button class="btn-icon" title="Save"><i class="fas fa-bookmark"></i></button>
                <button class="btn-icon" title="Share"><i class="fas fa-share"></i></button>
                <button class="btn-icon" title="More"><i class="fas fa-ellipsis-h"></i></button>
            </div>

            <div class="section-header">Details</div>
            <div class="info-row">
                <span class="info-label">Condition</span>
                <span class="info-value" id="listing-condition"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Category</span>
                <span class="info-value" id="listing-category"></span>
            </div>

            <div class="section-header">Description</div>
            <p class="description-text" id="listing-description"></p>

            <div class="section-header">Seller Information</div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <div id="seller-avatar-small" style="width: 40px; height: 40px; border-radius: 50%; background: #ddd; background-size: cover; background-position: center;"></div>
                <div>
                    <a href="#" id="seller-name-link" style="text-decoration: none; color: #050505; font-weight: 600;">Loading...</a>
                    <div style="font-size: 0.8rem; color: #65676b;">Joined 2025</div>
                </div>
            </div>

            <div class="section-header">Pickup in <span id="location-text"></span></div>
            <div class="seller-map">
                <i class="fas fa-map-marker-alt"></i> &nbsp; Map view placeholder
            </div>

            <!-- Quick Message Box -->
            <div class="quick-message-container">
                <div class="quick-msg-label"><i class="fab fa-facebook-messenger"></i> Send seller a message</div>
                <textarea class="quick-msg-input" id="quick-msg-text">Hi, is this available?</textarea>
                <button class="btn-send" id="btn-quick-send">Send</button>
            </div>

            <!-- Admin Controls -->
            <div class="admin-controls" id="admin-controls">
                <button class="btn-delete" id="delete-listing-btn">Delete Listing</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            
            const app = initializeApp(config.firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // Elements
            const mainImage = document.getElementById('main-image');
            const thumbnailContainer = document.getElementById('thumbnail-container');
            const prevBtn = document.getElementById('prev-img-btn');
            const nextBtn = document.getElementById('next-img-btn');
            const headerProfileLink = document.getElementById('header-profile-link');
            const headerAvatarPlaceholder = document.getElementById('header-avatar-placeholder');
            
            let currentUser = null;
            let currentListingData = null;
            let currentListingId = null;
            let currentImageIndex = 0;
            let imageUrls = [];

            // --- AUTH STATE ---
            onAuthStateChanged(auth, user => {
                currentUser = user;
                if (user && user.emailVerified) {
                    // Update Header Avatar
                    if (user.photoURL) {
                        headerProfileLink.innerHTML = `<img src="${user.photoURL}" alt="Profile">`;
                    } else {
                        headerAvatarPlaceholder.textContent = user.displayName ? user.displayName.charAt(0).toUpperCase() : 'U';
                    }
                } else {
                    // Default header state
                    headerAvatarPlaceholder.textContent = '?';
                }
                
                // Once auth is checked, load data
                fetchAndDisplayListing();
            });

            async function fetchAndDisplayListing() {
                const params = new URLSearchParams(window.location.search);
                currentListingId = params.get('id');

                if (!currentListingId) {
                    alert("No listing selected.");
                    window.location.href = '/index.html';
                    return;
                }

                try {
                    const listingRef = doc(db, 'listings', currentListingId);
                    const listingSnap = await getDoc(listingRef);
                    
                    if (!listingSnap.exists()) {
                        document.getElementById('listing-title').textContent = "Listing not found.";
                        return;
                    }

                    const data = listingSnap.data();
                    currentListingData = data;

                    // Populate Info
                    document.getElementById('listing-title').textContent = data.title;
                    document.getElementById('listing-price').textContent = `$${data.price.toFixed(2)}`;
                    
                    // Meta Info (Time/Location)
                    const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() : 'Recently';
                    document.getElementById('listing-meta').textContent = `Listed ${date} in ${data.location}`;
                    document.getElementById('location-text').textContent = data.location;

                    document.getElementById('listing-condition').textContent = data.condition || "Used";
                    document.getElementById('listing-category').textContent = data.category || "General";
                    document.getElementById('listing-description').textContent = data.description;

                    // Seller Info
                    document.getElementById('seller-name-link').textContent = data.posterDisplayName || "A User";
                    document.getElementById('seller-name-link').href = `/user.html?id=${data.posterUid}`;
                    
                    // Fetch Seller Avatar if possible (Optional optimization)
                    if (data.posterUid) {
                        try {
                            const sellerDoc = await getDoc(doc(db, "users", data.posterUid));
                            if (sellerDoc.exists() && sellerDoc.data().photoURL) {
                                document.getElementById('seller-avatar-small').style.backgroundImage = `url('${sellerDoc.data().photoURL}')`;
                            }
                        } catch(e) {}
                    }

                    // --- Images ---
                    imageUrls = data.imageUrls || [];
                    if (imageUrls.length > 0) {
                        updateMainImage(0);
                        
                        // Create Thumbnails
                        thumbnailContainer.innerHTML = '';
                        imageUrls.forEach((url, index) => {
                            const img = document.createElement('img');
                            img.src = url;
                            img.className = `thumb ${index === 0 ? 'active' : ''}`;
                            img.onclick = () => updateMainImage(index);
                            thumbnailContainer.appendChild(img);
                        });
                    } else {
                        mainImage.alt = "No Image Available";
                    }

                    // --- Admin/Owner Controls ---
                    if (currentUser) {
                        const isOwner = currentUser.uid === data.posterUid;
                        // Check admin status
                        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                        const isAdmin = userDoc.exists() && userDoc.data().role === 'admin';

                        if (isOwner || isAdmin) {
                            document.getElementById('admin-controls').style.display = 'block';
                            document.getElementById('delete-listing-btn').onclick = () => deleteListing(currentListingId, isAdmin);
                        }
                    }

                } catch (error) {
                    console.error("Error loading listing:", error);
                }
            }

            function updateMainImage(index) {
                currentImageIndex = index;
                mainImage.src = imageUrls[index];
                // Update active thumbnail
                document.querySelectorAll('.thumb').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }

            // Image Navigation Events
            prevBtn.onclick = () => {
                if (imageUrls.length === 0) return;
                let newIndex = currentImageIndex - 1;
                if (newIndex < 0) newIndex = imageUrls.length - 1;
                updateMainImage(newIndex);
            };
            nextBtn.onclick = () => {
                if (imageUrls.length === 0) return;
                let newIndex = currentImageIndex + 1;
                if (newIndex >= imageUrls.length) newIndex = 0;
                updateMainImage(newIndex);
            };

            // --- Messaging Logic ---
            function initiateMessage() {
                if (!currentUser || !currentUser.emailVerified) {
                    const currentPath = window.location.pathname + window.location.search;
                    window.location.href = `/LoginInToCheaplet.html?redirect=${encodeURIComponent(currentPath)}`;
                    return;
                }
                if (currentUser.uid === currentListingData.posterUid) {
                    alert("You cannot message yourself.");
                    return;
                }
                
                // Create Chat
                createChat(currentListingData.posterUid, currentListingData.posterDisplayName);
            }

            async function createChat(posterUid, posterName) {
                const uids = [currentUser.uid, posterUid].sort();
                const chatId = uids.join('_');
                const chatRef = doc(db, 'chats', chatId);
                
                try {
                    const chatSnap = await getDoc(chatRef);
                    if (!chatSnap.exists()) {
                        await setDoc(chatRef, {
                            participants: uids,
                            participantInfo: { [currentUser.uid]: currentUser.displayName, [posterUid]: posterName },
                            lastUpdate: serverTimestamp(),
                            lastMessage: "" // Could optionally set this to the quick message text
                        });
                    }
                    window.location.href = `/messages.html?chatId=${chatId}`;
                } catch (error) {
                    console.error("Chat error:", error);
                    alert("Error starting chat.");
                }
            }

            document.getElementById('btn-message-seller').onclick = initiateMessage;
            document.getElementById('btn-quick-send').onclick = initiateMessage;

            // --- Delete Logic ---
            async function deleteListing(docId, isAdmin) {
                if (confirm(isAdmin ? "ADMIN: Delete this listing?" : "Delete your listing?")) {
                    await deleteDoc(doc(db, 'listings', docId));
                    alert("Deleted.");
                    window.location.href = '/index.html';
                }
            }
        }

        main();
    </script>
</body>
</html>
