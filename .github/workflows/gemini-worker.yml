name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true" # The correct 2026 flag for shell commands
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@example.com"

          # 1. Capture the message and strip out the '/fix' text so Aider doesn't crash
          RAW_MSG="${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ github.event.comment.body }}"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g')

          # 2. Run Aider with the cleaned instruction
          # --suggest-shell-commands lets it actually run 'rm' or 'mv'
          aider --model gemini/gemini-2.5-flash \
                --message "$CLEAN_MSG" \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --suggest-shell-commands \
                --exit

          # 3. The 'Safety Net' - if the AI deleted it but didn't commit, we do it here
          git add .
          git commit -m "AI autonomous update" || echo "No changes to commit"
          git push origin main
