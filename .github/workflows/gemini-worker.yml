- name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@example.com"
          
          # Simplified model name to match the 2026 API aliases
          aider --model gemini/gemini-flash-latest \
                --message "Task: ${{ github.event.issue.title }}. ${{ github.event.issue.body }}" \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --exit
          
          git push origin main
