name: AI Senior Dev (Gemini Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@cheaplet.com"

          # 1. Create a unique branch
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # 2. Extract Prompt
          RAW_MSG="${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ github.event.comment.body }}"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 3. Run Aider (Uses .aider.conf.yml settings)
          # Note: If Gemini 3.1 still fails, swap the model to groq/llama-3.3-70b-versatile
          aider --message "PLAN FIRST: Explain your surgical approach. THEN execute: $CLEAN_MSG" \
                --exit

          # 4. Check for changes (Fixed 'porcelain' typo)
          if [ -n "$(git status --porcelain)" ]; then
            git push origin $BRANCH_NAME
            
            gh pr create \
              --title "🤖 AI Fix: ${{ github.event.issue.title }}" \
              --body "Generated by Gemini 3.1 Pro. 
              
              **Objective:** $CLEAN_MSG
              
              Review the diff to ensure root HTML files were not touched." \
              --base main \
              --head $BRANCH_NAME
          else
            echo "No changes detected."
          fi
