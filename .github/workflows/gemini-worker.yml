name: AI Junior Developer (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    # Only runs if you mention @aider or if it's an issue you want fixed
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aider to fix issue
        uses: p0nk/aider-github-action@main
        with:
          # Your Gemini Key
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # The model that works best for HTML/CSS
          aider_model: gemini/gemini-1.5-pro
          # The instructions from your GitHub Issue
          aider_message: |
            Fix the following issue:
            Title: ${{ github.event.issue.title }}
            Description: ${{ github.event.issue.body }}
            Comment: ${{ github.event.comment.body }}
          # Tell Aider to commit the changes
          aider_args: "--auto-commit --no-show-diffs"
