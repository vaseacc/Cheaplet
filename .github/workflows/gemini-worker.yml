name: AI Senior Dev (Gemini)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '/fix')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix'))
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@cheaplet.com"

          # 1. Combine and clean the message
          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # ========== IMPROVED FILE DETECTION ==========
          FILES_TO_LOAD=""
          for word in $CLEAN_MSG; do
            # Remove trailing punctuation, keep dots inside filenames
            clean_word=$(echo "$word" | sed 's/[.,!?]*$//')

            # Try exact match first
            if [[ -f "$clean_word" ]]; then
              FILES_TO_LOAD="$FILES_TO_LOAD $clean_word"
              continue
            fi

            # Fuzzy match: find files containing the word (case-insensitive)
            # Exclude .git, limit to first 3 matches to avoid overload
            matches=$(find . -type f -not -path "./.git/*" -iname "*${clean_word}*" 2>/dev/null | head -3)

            if [[ -n "$matches" ]]; then
              match_count=$(echo "$matches" | wc -l)

              if [[ $match_count -eq 1 ]]; then
                # Strip leading './' and add to list
                match_path=$(echo "$matches" | sed 's|^\./||')
                FILES_TO_LOAD="$FILES_TO_LOAD $match_path"
              else
                # Multiple matches: log and skip (you could change to add all)
                echo "Multiple files match '$clean_word': $matches" >&2
              fi
            fi
          done
          # =============================================

          # 2. Inject strict Persona Context
          SYSTEM_PROMPT="You are an elite AI developer. You MUST read and strictly obey the rules in CONVENTIONS.md. Make precise, surgical edits using SEARCH/REPLACE blocks. DO NOT output entire files. Task: "
          FINAL_PROMPT="$SYSTEM_PROMPT $CLEAN_MSG"

          # 3. Run Aider
          aider --model gemini/gemini-2.5-flash-lite \
                --edit-format diff \
                --read CONVENTIONS.md \
                --message "$FINAL_PROMPT" \
                $FILES_TO_LOAD \
                --yes-always \
                --auto-commits \
                --map-tokens 1024 \
                --no-stream \
                --exit

          # 4. Final commit and push with safer rebase
          git add .
          git commit -m "AI surgical update: $CLEAN_MSG" || echo "No changes to commit"

          git fetch origin main
          git rebase origin/main || git rebase --abort

          git push origin main
