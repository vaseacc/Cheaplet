name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@scoralia.com"

          # 1. Combine and clean the message
          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 2. SMART FILE SELECTION: Only load files mentioned in the prompt to save API quota
          FILES_TO_LOAD=""
          for word in $CLEAN_MSG; do
            clean_word=$(echo "$word" | tr -d '.,!?')
            if [[ -f "$clean_word" ]]; then
              FILES_TO_LOAD="$FILES_TO_LOAD $clean_word"
            fi
          done

          # 3. Inject strict Context
          SYSTEM_PROMPT="You are an autonomous AI developer operating directly in a GitHub repository via GitHub Actions. IMPORTANT: Make precise, surgical edits using SEARCH/REPLACE blocks. DO NOT output entire files. Task: "
          FINAL_PROMPT="$SYSTEM_PROMPT $CLEAN_MSG"

          # 4. Run Aider (Switched to 2.0-flash to prevent Rate Limit crashes)
          aider --model gemini/gemini-2.0-flash \
                --edit-format diff \
                --message "$FINAL_PROMPT" \
                $FILES_TO_LOAD \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --exit

          # 5. The Enforcer (Deletions & Moves)
          if [[ "$CLEAN_MSG" == *"delete"* ]] || [[ "$CLEAN_MSG" == *"rename"* ]] || [[ "$CLEAN_MSG" == *"move"* ]]; then
            # Specific check for the contact-us rename as a backup
            if [[ "$CLEAN_MSG" == *"contact-us.html"* ]] && [[ -f "contact.html" ]]; then
               git mv contact.html contact-us.html
               echo "Enforced rename to contact-us.html"
            fi
            
            for word in $CLEAN_MSG; do
              clean_word=$(echo "$word" | tr -d '.,!?')
              if [[ -f "$clean_word" ]]; then
                git rm "$clean_word" && echo "Enforced deletion of $clean_word"
              fi
            done
          fi

          # 6. Final Push
          git add .
          git commit -m "AI autonomous update: $CLEAN_MSG" || echo "No changes to commit"
          git push origin main
