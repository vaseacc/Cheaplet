name: AI Senior Dev (Groq)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '/fix')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix'))
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_BASE: https://api.groq.com/openai/v1
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

        run: |
          git config --global user.name "Groq AI"
          git config --global user.email "ai@cheaplet.com"

          # 1. Combine and clean the message
          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 2. Smart file detection
          FILES_TO_LOAD=""

          for word in $CLEAN_MSG; do
            clean_word=$(echo "$word" | sed 's/[.,!?]*$//')

            # Skip tiny/common words
            if [[ ${#clean_word} -lt 3 ]]; then
              continue
            fi

            # Exact file match
            if [[ -f "$clean_word" ]]; then
              FILES_TO_LOAD="$FILES_TO_LOAD $clean_word"
              continue
            fi

            # Fuzzy search
            matches=$(find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./dist/*" \
              -not -path "./build/*" \
              -not -path "./.next/*" \
              -iname "*${clean_word}*" 2>/dev/null | head -3)

            if [[ -n "$matches" ]]; then
              match_count=$(echo "$matches" | wc -l)

              if [[ $match_count -eq 1 ]]; then
                match_path=$(echo "$matches" | sed 's|^\./||')
                FILES_TO_LOAD="$FILES_TO_LOAD $match_path"
              else
                echo "Multiple files match '$clean_word': $matches" >&2
              fi
            fi
          done

          echo "Files loaded:$FILES_TO_LOAD"

          # 3. AI system prompt
          SYSTEM_PROMPT="You are an elite AI developer. You MUST read and strictly obey the rules in CONVENTIONS.md. Make precise, surgical edits using SEARCH/REPLACE blocks. DO NOT output entire files. Task: "

          FINAL_PROMPT="$SYSTEM_PROMPT $CLEAN_MSG"

          # 4. Run Aider with Groq
          aider --model openai/qwen-qwq-32b \
                --edit-format diff \
                --read CONVENTIONS.md \
                --message "$FINAL_PROMPT" \
                $FILES_TO_LOAD \
                --yes-always \
                --auto-commits \
                --map-tokens 512 \
                --no-stream \
                --exit

          # 5. Commit and push safely
          git add .

          git commit -m "AI surgical update: $CLEAN_MSG" || echo "No changes to commit"

          git fetch origin main
          git rebase origin/main || git rebase --abort

          git push origin main
