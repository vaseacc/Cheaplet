name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@scoralia.com"

          # 1. Combine and clean the message
          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 2. FILE DISCOVERY: Automatically find files mentioned in the prompt
          # This matches words in your message to actual files in your repo
          FILES_TO_READ=""
          for word in $CLEAN_MSG; do
            # Remove common punctuation from the word to match filenames
            clean_word=$(echo "$word" | tr -d '.,!?')
            if [[ -f "$clean_word" ]]; then
              FILES_TO_READ="$FILES_TO_READ --file $clean_word"
            fi
          done

          # 3. Inject Context
          SYSTEM_PROMPT="You are an autonomous AI developer. IMPORTANT: Make precise, surgical edits. If asked to delete, use 'git rm'. Task: "
          FINAL_PROMPT="$SYSTEM_PROMPT $CLEAN_MSG"

          # 4. Run Aider
          # We include $FILES_TO_READ so the AI 'sees' the files you named
          aider --model gemini/gemini-2.5-flash \
                --edit-format diff \
                --message "$FINAL_PROMPT" \
                $FILES_TO_READ \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --suggest-shell-commands \
                --exit

          # 5. The Enforcer (Deletions)
          if [[ "$CLEAN_MSG" == *"delete"* ]] || [[ "$CLEAN_MSG" == *"remove"* ]]; then
            for word in $CLEAN_MSG; do
              clean_word=$(echo "$word" | tr -d '.,!?')
              if [[ -f "$clean_word" ]]; then
                git rm "$clean_word" && echo "Enforced deletion of $clean_word"
              fi
            done
          fi

          # 6. Final Push
          git add .
          git commit -m "AI autonomous update: $CLEAN_MSG" || echo "No changes to commit"
          git push origin main
