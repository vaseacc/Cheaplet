name: AI Senior Dev (Groq Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "AI Senior Dev"
          git config --global user.email "ai@cheaplet.com"

          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          RAW_PROMPT="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_PROMPT" | sed 's/\/fix//g')

          export CLEAN_MSG
          
          # THE UPGRADE: Forcing the "Mental Simulation" phase
          # 4. Run Aider with "Read Everything" capability
          aider --model groq/llama-3.3-70b-versatile \
                --message "CRITICAL INSTRUCTION: You are a Senior UI/UX Engineer. 
                1. MENTAL SIMULATION: Read all provided files. Imagine the browser parsing the CSS variables (:root).
                2. VERIFY: Ensure new styles aren't overridden by existing code.
                3. TASK: $CLEAN_MSG" \
                --yes-always \
                --auto-commits \
                --exit \
                $(find . -maxdepth 2 -not -path '*/.*' -type f -name "*.html" -o -name "*.css" -o -name "*.js")

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Changes detected, pushing to origin..."
            git push origin "$BRANCH_NAME"
            
            gh pr create \
              --title "🤖 AI Fix: $ISSUE_TITLE" \
              --body "Generated by Llama 3.3 via Groq.
              
              **Task Objective:** $CLEAN_MSG
              
              *Note: I performed a mental simulation of the CSS/DOM hierarchy to ensure these changes do not get overridden by existing variables.*" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes were made by the AI."
          fi
