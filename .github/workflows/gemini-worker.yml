- name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "AI Senior Dev"
          git config --global user.email "ai@cheaplet.com"

          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          RAW_PROMPT="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_PROMPT" | sed 's/\/fix//g')

          export CLEAN_MSG
          # We add 'architect' mode or explicit instructions to act autonomously
          aider --model groq/llama-3.3-70b-versatile \
                --message "You are in an automated environment. DO NOT ASK QUESTIONS. DO NOT SEEK PERMISSION. 
                Task: $CLEAN_MSG
                If you need to create a directory or a file, DO IT IMMEDIATELY using shell commands or by writing the file." \
                --exit

          # Check if changes happened
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "AI Update: $ISSUE_TITLE" || echo "Nothing to commit"
            git push origin $BRANCH_NAME
            
            gh pr create \
              --title "🤖 AI Fix: $ISSUE_TITLE" \
              --body "Generated by Llama 3.3. Objective: $CLEAN_MSG" \
              --base main \
              --head $BRANCH_NAME
          else
            echo "No changes detected. The AI might have been too cautious."
          fi
