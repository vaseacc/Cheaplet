name: AI Senior Dev (Gemini Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    # Only run if someone types /fix
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@cheaplet.com"

          # 1. Create a unique branch for this task
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # 2. Extract the prompt
          RAW_MSG="${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ github.event.comment.body }}"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 3. Execution with "Chain of Thought" prompt
          # We tell the AI to plan first, ensuring smarter output.
          aider --message "PLAN FIRST: Briefly list the steps you will take. THEN: Execute the changes for: $CLEAN_MSG" \
                --exit

          # 4. Push and Open PR
          if [ -n "$(git status --procelain)" ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse main)" ]; then
            git push origin $BRANCH_NAME
            
            gh pr create \
              --title "🤖 AI Fix: ${{ github.event.issue.title }}" \
              --body "This PR was generated by your AI Senior Dev.
              
              **Objective:** $CLEAN_MSG
              
              **Status:** Please review the diff for accuracy. This PR ignores root HTML files as requested." \
              --base main \
              --head $BRANCH_NAME
          else
            echo "No changes were made by the AI."
          fi
