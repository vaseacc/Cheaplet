name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          # This environment variable tells Aider it's okay to run shell commands automatically
          AIDER_ALLOW_RUNS: "true"
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@example.com"
          
          # We add --architect to give it more "thinking" power for file operations
          # We add --suggest-shell-commands to let it use 'git rm'
          aider --model gemini/gemini-2.5-flash \
                --message "/fix ${{ github.event.issue.title }}. ${{ github.event.issue.body }}" \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --suggest-shell-commands \
                --exit
          
          # Final safety push in case Aider didn't auto-commit a deletion
          git add .
          git commit -m "AI automated cleanup" || echo "No changes"
          git push origin main
