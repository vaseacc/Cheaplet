name: AI Senior Dev (Gemini Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@cheaplet.com"

          # 1. Create a unique branch
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # 2. Robust Prompt Cleaning (No xargs to avoid quote errors)
          # Combine inputs and remove the /fix command safely
          RAW_PROMPT="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_PROMPT" | sed 's/\/fix//g')

          # 3. Run Aider
          # We pass CLEAN_MSG as an environment variable to avoid shell escaping issues
          export CLEAN_MSG
          aider --message "PLAN FIRST: Explain your surgical approach. THEN execute the logic for: $CLEAN_MSG" \
                --exit

          # 4. Check for changes (Fixed 'porcelain' typo)
          if [ -n "$(git status --porcelain)" ]; then
            git push origin $BRANCH_NAME
            
            gh pr create \
              --title "🤖 AI Fix: $ISSUE_TITLE" \
              --body "Generated by Gemini 3.1 Pro (via Aider).
              
              **Objective:** $CLEAN_MSG
              
              Please review the changes in this PR. Root HTML files were ignored per .aiderignore rules." \
              --base main \
              --head $BRANCH_NAME
          else
            echo "No changes detected or AI finished without edits."
          fi
