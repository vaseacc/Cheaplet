name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"
          # Safely pass GitHub text to environment variables to prevent bash syntax crashes
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@scoralia.com"

          # 1. Combine the message safely and strip out the '/fix' trigger
          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 2. Inject strict Context so the AI knows exactly where it is and how to behave
          SYSTEM_PROMPT="You are an autonomous AI developer operating directly in a GitHub repository via GitHub Actions. IMPORTANT: Make precise, surgical edits using SEARCH/REPLACE blocks. DO NOT output entire files. Task: "
          FINAL_PROMPT="$SYSTEM_PROMPT $CLEAN_MSG"

          # 3. Run Aider with the diff format flag
          aider --model gemini/gemini-2.5-flash \
                --edit-format diff \
                --message "$FINAL_PROMPT" \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --suggest-shell-commands \
                --exit

          # 4. The 'Safety Net' - if the AI edited files but didn't commit, we do it here
          git add .
          git commit -m "AI autonomous update via GitHub Actions" || echo "No changes to commit"
          git push origin main
