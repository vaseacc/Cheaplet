name: AI Senior Dev (Groq/Gemini Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "AI Senior Dev"
          git config --global user.email "ai@cheaplet.com"

          # 1. Create a unique branch
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # 2. Safely Combine Prompt
          RAW_PROMPT="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_PROMPT" | sed 's/\/fix//g')

          # 3. Run Aider with Groq
          # Using --model here overrides the .conf file just in case
          export CLEAN_MSG
          aider --model groq/llama-3.3-70b-versatile \
                --message "PLAN FIRST: Explain your surgical approach. THEN execute: $CLEAN_MSG" \
                --exit

          # 4. PR Creation
          if [ -n "$(git status --porcelain)" ]; then
            git push origin $BRANCH_NAME
            gh pr create \
              --title "🤖 AI Fix: $ISSUE_TITLE" \
              --body "Generated by Llama 3.3 (via Groq). 
              
              **Objective:** $CLEAN_MSG
              
              Gemini was rate-limited, so I used Groq for this task." \
              --base main \
              --head $BRANCH_NAME
          else
            echo "No changes detected."
          fi
