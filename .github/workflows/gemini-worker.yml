name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@scoralia.com"

          # 1. Combine and clean the message
          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\/fix//g' | xargs)

          # 2. SMART FILE SELECTION
          FILES_TO_LOAD=""
          for word in $CLEAN_MSG; do
            clean_word=$(echo "$word" | tr -d '.,!?')
            if [[ -f "$clean_word" ]]; then
              FILES_TO_LOAD="$FILES_TO_LOAD $clean_word"
            fi
          done

          # 3. INTELLIGENT SYSTEM PROMPT
          # We define the project rules here so the AI doesn't "hallucinate" names like Scoraplet.
          CONTEXT="CONTEXT: We are rebranding from 'Scoralia' to 'cheaplet'. 'cheaplet' must always be lowercase. "
          RULES="RULES: 1. Use SEARCH/REPLACE blocks for surgical edits. 2. NEVER output the whole file. 3. When replacing text inside HTML tags (like <em>), ensure the final word is exactly as requested. Do not merge names. 4. If asked to replace a name, find all occurrences in the provided files. "
          
          FINAL_PROMPT="$CONTEXT $RULES TASK: $CLEAN_MSG"

          # 4. Run Aider
          # Added --map-tokens 1024 to give the AI a better 'map' of the repo without using too many tokens.
          aider --model gemini/gemini-2.5-flash-lite \
                --edit-format diff \
                --message "$FINAL_PROMPT" \
                $FILES_TO_LOAD \
                --yes-always \
                --auto-commits \
                --map-tokens 1024 \
                --no-stream \
                --exit

          # 5. Safety Net for Moves/Deletions
          if [[ "$CLEAN_MSG" == *"delete"* ]] || [[ "$CLEAN_MSG" == *"rename"* ]] || [[ "$CLEAN_MSG" == *"move"* ]]; then
            for word in $CLEAN_MSG; do
              clean_word=$(echo "$word" | tr -d '.,!?')
              if [[ -f "$clean_word" ]]; then
                git rm "$clean_word" && echo "Deleted $clean_word"
              fi
            done
          fi

          # 6. Final Push
          git add .
          git commit -m "AI surgical update: $CLEAN_MSG" || echo "No changes to commit"
          git push origin main
