name: AI Junior Dev (Aider)
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    # Only runs if the issue or comment contains the /fix command
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOME: /home/runner
        run: |
          # 1. Configure Git so the AI can actually save its work
          git config --global user.name "Gemini AI"
          git config --global user.email "ai@example.com"
          
          # 2. Run Aider with "Free Tier" protections:
          # --model gemini/gemini-1.5-flash: More stable free limits than 2.0 right now.
          # --map-tokens 0: Prevents the AI from scanning the whole repo (saves your quota).
          # --no-stream: Sends one request instead of 100 tiny ones.
          # --yes-always: Automatically accepts file creations/edits.
          aider --model gemini/gemini-1.5-flash \
                --message "Task: ${{ github.event.issue.title }}. ${{ github.event.issue.body }} ${{ github.event.comment.body }}" \
                --yes-always \
                --auto-commits \
                --map-tokens 0 \
                --no-stream \
                --exit
          
          # 3. Push the changes back to your repository
          git push origin main
