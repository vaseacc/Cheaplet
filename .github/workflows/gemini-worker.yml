name: AI Senior Dev (Groq Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    # Only triggers if the issue/comment contains the /fix command
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # 1. Setup Git Identity
          git config --global user.name "AI Senior Dev"
          git config --global user.email "ai@cheaplet.com"

          # 2. Create a unique branch for the task
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          # 3. Clean the prompt safely (avoiding xargs quote issues)
          RAW_PROMPT="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"
          CLEAN_MSG=$(echo "$RAW_PROMPT" | sed 's/\/fix//g')

          # 4. Run Aider
          # We force Groq here because Gemini Free Tier hits daily limits quickly.
          # We use --yes-always to ensure it doesn't wait for user input.
          export CLEAN_MSG
          aider --model groq/llama-3.3-70b-versatile \
                --message "CRITICAL: You are an autonomous agent in a CI pipeline. 
                DO NOT ask questions. DO NOT seek permission. 
                Perform this task immediately: $CLEAN_MSG" \
                --yes-always \
                --auto-commits \
                --exit

          # 5. Check if the AI actually committed changes
          # This compares the current branch HEAD to the main branch
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Changes detected, pushing to origin..."
            git push origin "$BRANCH_NAME"
            
            gh pr create \
              --title "🤖 AI Fix: $ISSUE_TITLE" \
              --body "Generated by Llama 3.3 via Groq.
              
              **Task Objective:** $CLEAN_MSG
              
              This PR contains the surgical edits performed by the AI Senior Dev. Please review the diff before merging." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes were made by the AI. Check the logs for rate limits or logic errors."
          fi
