name: AI Senior Dev (Groq)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '/fix')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix'))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_BASE: https://api.groq.com/openai/v1

          HOME: /home/runner
          AIDER_ALLOW_RUN_COMMANDS: "true"

          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

        run: |
          git config --global user.name "Groq AI"
          git config --global user.email "ai@cheaplet.com"

          # ==========================================
          # Combine prompt
          # ==========================================

          RAW_MSG="$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY"

          CLEAN_MSG=$(echo "$RAW_MSG" | \
            sed 's/\/fix//g' | \
            xargs)

          echo "Prompt:"
          echo "$CLEAN_MSG"

          # ==========================================
          # Smart file detection
          # ==========================================

          FILES_TO_LOAD=""
          FILE_COUNT=0
          MAX_FILES=5

          for word in $CLEAN_MSG; do

            clean_word=$(echo "$word" | \
              tr '[:upper:]' '[:lower:]' | \
              sed 's/[.,!?(){}]//g')

            # Skip tiny words
            if [[ ${#clean_word} -lt 4 ]]; then
              continue
            fi

            # Stop if max files reached
            if [[ $FILE_COUNT -ge $MAX_FILES ]]; then
              break
            fi

            # Exact match
            if [[ -f "$clean_word" ]]; then
              FILES_TO_LOAD="$FILES_TO_LOAD $clean_word"
              FILE_COUNT=$((FILE_COUNT + 1))
              continue
            fi

            # Search for likely files
            matches=$(find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./dist/*" \
              -not -path "./build/*" \
              -not -path "./.next/*" \
              -not -path "./coverage/*" \
              \( \
                -iname "*${clean_word}*.html" -o \
                -iname "*${clean_word}*.js" -o \
                -iname "*${clean_word}*.css" -o \
                -iname "*${clean_word}*.ts" -o \
                -iname "*${clean_word}*.json" \
              \) 2>/dev/null | head -1)

            if [[ -n "$matches" ]]; then

              match_path=$(echo "$matches" | sed 's|^\./||')

              # Avoid duplicates
              if [[ "$FILES_TO_LOAD" != *"$match_path"* ]]; then
                FILES_TO_LOAD="$FILES_TO_LOAD $match_path"
                FILE_COUNT=$((FILE_COUNT + 1))
              fi
            fi
          done

          echo "Files loaded:"
          echo "$FILES_TO_LOAD"

          # ==========================================
          # AI system prompt
          # ==========================================

          SYSTEM_PROMPT="You are an elite senior software engineer.

          STRICT RULES:
          - Read CONVENTIONS.md carefully
          - Make minimal precise edits
          - Never rewrite unrelated code
          - Never delete unrelated files
          - Preserve project structure
          - If creating files, isolate them cleanly
          - Prefer surgical fixes over rewrites
          - Keep styling consistent
          - Avoid breaking existing functionality

          TASK:
          "

          FINAL_PROMPT="$SYSTEM_PROMPT $CLEAN_MSG"

          # ==========================================
          # Run Aider
          # ==========================================

          aider \
            --model openai/llama-3.3-70b-versatile \
            --edit-format diff \
            --read CONVENTIONS.md \
            --message "$FINAL_PROMPT" \
            $FILES_TO_LOAD \
            --yes-always \
            --auto-commits \
            --map-tokens 512 \
            --no-stream \
            --no-show-model-warnings \
            --exit

          # ==========================================
          # Commit and push
          # ==========================================

          git add .

          git commit -m "AI update: $CLEAN_MSG" || echo "No changes to commit"

          git fetch origin main

          git rebase origin/main || git rebase --abort

          git push origin main
