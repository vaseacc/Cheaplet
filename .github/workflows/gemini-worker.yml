name: AI Senior Dev (Groq Agent)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aider-job:
    if: contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          git config --global user.name "AI Senior Dev"
          git config --global user.email "ai@cheaplet.com"

          # Create branch
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          # Clean prompt
          CLEAN_MSG=$(echo "$ISSUE_TITLE $ISSUE_BODY $COMMENT_BODY" | sed 's/\/fix//g')

          # Run Aider with "Architect" intent
          # We use --yes-always and --no-suggest-shell-commands (to force it to just execute)
          aider --model groq/llama-3.3-70b-versatile \
                --message "CRITICAL: You are an autonomous agent. DO NOT ask questions. DO NOT wait for input. Create files/folders immediately. TASK: $CLEAN_MSG" \
                --yes-always \
                --auto-commits \
                --exit

          # Check for changes using the correct 'porcelain' spelling
          if [ -n "$(git status --porcelain)" ]; then
            git push origin "$BRANCH_NAME"
            
            gh pr create \
              --title "🤖 AI Fix: $ISSUE_TITLE" \
              --body "Generated by Llama 3.3. Objective: $CLEAN_MSG" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes were committed by the AI."
          fi
