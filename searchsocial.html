<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Hub — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        .main-wrapper { max-width: 800px; margin: 30px auto; padding: 0 20px; width: 100%; flex-grow: 1; }

        /* ── SEARCH BAR ── */
        .search-header { margin-bottom: 25px; animation: fadeUp 0.3s ease; }
        .search-box { display: flex; align-items: center; background: var(--white); border: var(--border); border-radius: 30px; padding: 5px 15px; box-shadow: var(--shadow); transition: border-color 0.2s; }
        .search-box:focus-within { border-color: var(--deep); }
        .search-input { flex-grow: 1; border: none; outline: none; padding: 12px; font-family: inherit; font-size: 1.05rem; background: transparent; color: var(--text-main); }
        .search-btn { background: var(--gold); color: var(--ink); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; font-size: 1.1rem; }
        .search-btn:hover { transform: scale(1.05); }

        /* ── TABS ── */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 5px; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--white); border: var(--border); color: var(--text-muted); font-family: inherit; font-weight: 600; font-size: 0.95rem; padding: 10px 20px; border-radius: 30px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .tab-btn:hover { background: #f1f5f9; color: var(--deep); }
        .tab-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

        /* ── RESULTS AREAS ── */
        .results-section { display: none; flex-direction: column; gap: 15px; animation: fadeUp 0.3s ease; }
        .results-section.active { display: flex; }
        
        .section-heading { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--ink); margin: 15px 0 5px; padding-bottom: 5px; border-bottom: 2px solid #e2e8f0; display: none; }
        .show-headings .section-heading { display: block; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 1.05rem; }
        .empty-state i { font-size: 2.5rem; color: #cbd5e1; margin-bottom: 15px; display: block; }

        /* ── CARDS ── */
        /* Post Card (Simplified for search) */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); text-decoration: none; color: inherit; display: block; transition: 0.2s; }
        .post-card:hover { border-color: var(--deep); transform: translateY(-2px); }
        .post-header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #f1f5f9; }
        .post-author { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
        .post-topic { font-size: 0.75rem; color: var(--deep); background: #f0f7ff; padding: 2px 8px; border-radius: 12px; margin-left: auto; font-weight: 600; }
        .post-body { font-size: 1rem; color: #334155; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* Topic Card */
        .topic-card { display: flex; align-items: center; justify-content: space-between; background: var(--white); border-radius: 12px; padding: 15px 20px; box-shadow: var(--shadow); border: var(--border); text-decoration: none; transition: 0.2s; }
        .topic-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .topic-info { display: flex; flex-direction: column; }
        .topic-name { font-weight: 800; font-size: 1.1rem; color: var(--ink); display: flex; align-items: center; gap: 8px; }
        .topic-name i { color: var(--text-muted); font-size: 0.9rem; }
        .topic-stats { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

        /* User Card */
        .user-card { display: flex; align-items: center; gap: 15px; background: var(--white); border-radius: 12px; padding: 15px; box-shadow: var(--shadow); border: var(--border); text-decoration: none; transition: 0.2s; }
        .user-card:hover { border-color: var(--deep); transform: translateY(-2px); }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #f1f5f9; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 700; font-size: 1.05rem; color: var(--ink); }
        .user-username { font-size: 0.85rem; color: var(--text-muted); }

        /* Listing Card (Horizontal mini) */
        .listing-card { display: flex; background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); border: var(--border); text-decoration: none; transition: 0.2s; height: 100px; }
        .listing-card:hover { border-color: #4CAF50; transform: translateY(-2px); }
        .listing-img { width: 100px; height: 100%; background-size: cover; background-position: center; background-color: #cbd5e1; flex-shrink: 0; }
        .listing-info { padding: 10px 15px; display: flex; flex-direction: column; justify-content: center; flex-grow: 1; }
        .listing-title { font-weight: 600; font-size: 0.95rem; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
        .listing-price { font-weight: 800; font-size: 1.05rem; color: #2E7D32; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .tabs-container { margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <main class="main-wrapper">
        
        <div class="search-header">
            <div class="search-box">
                <i class="fas fa-search" style="color:var(--text-muted); margin-left:5px;"></i>
                <input type="text" class="search-input" id="search-input" data-i18n-placeholder="search_place" placeholder="Search posts, topics, people...">
                <button class="search-btn" id="btn-search"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="tabs-container" id="tabs">
            <button class="tab-btn active" data-tab="all" data-i18n="tab_all">All Results</button>
            <button class="tab-btn" data-tab="posts" data-i18n="tab_posts">Posts</button>
            <button class="tab-btn" data-tab="topics" data-i18n="tab_topics">Topics</button>
            <button class="tab-btn" data-tab="people" data-i18n="tab_people">People</button>
            <button class="tab-btn" data-tab="listings" data-i18n="tab_listings">Listings</button>
        </div>

        <div id="loading-spinner" class="empty-state" style="display: none;">
            <i class="fas fa-circle-notch fa-spin" style="color:var(--gold);"></i>
            <span data-i18n="searching">Searching...</span>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="show-headings">
            
            <div class="results-section active" id="sec-posts">
                <h2 class="section-heading" data-i18n="tab_posts">Posts</h2>
                <div id="res-posts"></div>
            </div>

            <div class="results-section active" id="sec-topics">
                <h2 class="section-heading" data-i18n="tab_topics">Topics</h2>
                <div id="res-topics"></div>
            </div>

            <div class="results-section active" id="sec-people">
                <h2 class="section-heading" data-i18n="tab_people">People</h2>
                <div id="res-people"></div>
            </div>

            <div class="results-section active" id="sec-listings">
                <h2 class="section-heading" data-i18n="tab_listings">Listings</h2>
                <div id="res-listings"></div>
            </div>

        </div>

    </main>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            // --- BILINGUAL UI ---
            const lang = localStorage.getItem('preferred_language') || 'en';
            const allStrings = {
                en: { 
                    search_place: "Search posts, topics, people...", tab_all: "All Results", tab_posts: "Posts", tab_topics: "Topics", tab_people: "People", tab_listings: "Listings",
                    searching: "Searching...", no_results: "No results found for", posts: "posts"
                },
                fr: { 
                    search_place: "Rechercher messages, sujets, personnes...", tab_all: "Tous les résultats", tab_posts: "Messages", tab_topics: "Sujets", tab_people: "Personnes", tab_listings: "Annonces",
                    searching: "Recherche en cours...", no_results: "Aucun résultat trouvé pour", posts: "messages"
                }
            };
            const ui = allStrings[lang] || allStrings['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => { if (ui[el.getAttribute('data-i18n')]) el.textContent = ui[el.getAttribute('data-i18n')]; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { if (ui[el.getAttribute('data-i18n-placeholder')]) el.placeholder = ui[el.getAttribute('data-i18n-placeholder')]; });

            const searchInput = document.getElementById('search-input');
            const btnSearch = document.getElementById('btn-search');
            const tabs = document.querySelectorAll('.tab-btn');
            const resultsContainer = document.getElementById('results-container');
            const spinner = document.getElementById('loading-spinner');

            const secPosts = document.getElementById('sec-posts');
            const secTopics = document.getElementById('sec-topics');
            const secPeople = document.getElementById('sec-people');
            const secListings = document.getElementById('sec-listings');

            const resPosts = document.getElementById('res-posts');
            const resTopics = document.getElementById('res-topics');
            const resPeople = document.getElementById('res-people');
            const resListings = document.getElementById('res-listings');

            let currentUser = null;
            let internalSchoolName = "Global Campus"; 
            let topicNamesCache = { 'general': ui.tab_all === "All Results" ? 'Campus Public' : 'Campus Public' };

            // Get initial query from URL
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q') || '';
            if (initialQuery) {
                searchInput.value = initialQuery;
            }

            // Auth Check
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    const uDoc = await getDoc(doc(db, "users", user.uid));
                    if (uDoc.exists()) {
                        internalSchoolName = uDoc.data().schoolName || "Global Campus";
                    }
                }
                
                // Fetch topics cache first to resolve wayId to Names
                try {
                    const tSnap = await getDocs(collection(db, "social_channels"));
                    tSnap.forEach(d => { topicNamesCache[d.id] = d.data().name; });
                } catch(e) {}

                if (initialQuery) executeSearch(initialQuery);
            });

            // Tab Switching Logic
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    const target = tab.getAttribute('data-tab');
                    
                    if (target === 'all') {
                        resultsContainer.classList.add('show-headings');
                        secPosts.classList.add('active');
                        secTopics.classList.add('active');
                        secPeople.classList.add('active');
                        secListings.classList.add('active');
                    } else {
                        resultsContainer.classList.remove('show-headings');
                        secPosts.classList.remove('active');
                        secTopics.classList.remove('active');
                        secPeople.classList.remove('active');
                        secListings.classList.remove('active');
                        document.getElementById(`sec-${target}`).classList.add('active');
                    }
                });
            });

            btnSearch.onclick = () => {
                const q = searchInput.value.trim();
                if(q) {
                    window.history.pushState({}, '', `?q=${encodeURIComponent(q)}`);
                    executeSearch(q);
                }
            };

            searchInput.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') { 
                    e.preventDefault(); 
                    searchInput.blur();
                    btnSearch.click(); 
                }
            });

            async function executeSearch(searchTerm) {
                const term = searchTerm.toLowerCase();
                
                // Show loading
                secPosts.style.display = 'none'; secTopics.style.display = 'none';
                secPeople.style.display = 'none'; secListings.style.display = 'none';
                spinner.style.display = 'block';
                resPosts.innerHTML = ''; resTopics.innerHTML = '';
                resPeople.innerHTML = ''; resListings.innerHTML = '';

                try {
                    // We will fetch recent data and filter client-side since Firebase lacks full text search
                    
                    // 1. Fetch Posts
                    const postQ = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(100));
                    const postSnap = await getDocs(postQ);
                    let foundPosts = 0;
                    postSnap.forEach(docSnap => {
                        const d = docSnap.data();
                        // Filter school
                        if (internalSchoolName !== "Global Campus" && d.schoolName && d.schoolName !== internalSchoolName) return;
                        
                        if ((d.text && d.text.toLowerCase().includes(term)) || (d.authorName && d.authorName.toLowerCase().includes(term))) {
                            resPosts.appendChild(renderPostCard(docSnap.id, d));
                            foundPosts++;
                        }
                    });
                    if (foundPosts === 0) resPosts.innerHTML = `<div class="empty-state"><i class="far fa-comment-dots"></i></div>`;

                    // 2. Fetch Topics
                    const topicQ = query(collection(db, "social_channels"), orderBy("postCount", "desc"));
                    const topicSnap = await getDocs(topicQ);
                    let foundTopics = 0;
                    topicSnap.forEach(docSnap => {
                        const d = docSnap.data();
                        
                        // Privacy check
                        const isPrivate = d.visibility === 'private';
                        const isOwner = currentUser && d.createdBy === currentUser.uid;
                        const isMember = currentUser && d.members && d.members.includes(currentUser.uid);
                        if (isPrivate && !isOwner && !isMember) return;

                        if ((d.name && d.name.toLowerCase().includes(term)) || (d.description && d.description.toLowerCase().includes(term))) {
                            resTopics.appendChild(renderTopicCard(docSnap.id, d));
                            foundTopics++;
                        }
                    });
                    if (foundTopics === 0) resTopics.innerHTML = `<div class="empty-state"><i class="fas fa-hashtag"></i></div>`;

                    // 3. Fetch People
                    const userQ = query(collection(db, "users"), limit(100));
                    const userSnap = await getDocs(userQ);
                    let foundUsers = 0;
                    userSnap.forEach(docSnap => {
                        const d = docSnap.data();
                        if ((d.displayName && d.displayName.toLowerCase().includes(term)) || (d.username && d.username.toLowerCase().includes(term))) {
                            resPeople.appendChild(renderUserCard(docSnap.id, d));
                            foundUsers++;
                        }
                    });
                    if (foundUsers === 0) resPeople.innerHTML = `<div class="empty-state"><i class="fas fa-users"></i></div>`;

                    // 4. Fetch Listings
                    const listQ = query(collection(db, "listings"), where("status", "==", "active"), orderBy("timestamp", "desc"), limit(100));
                    const listSnap = await getDocs(listQ);
                    let foundListings = 0;
                    listSnap.forEach(docSnap => {
                        const d = docSnap.data();
                        // Filter school
                        if (internalSchoolName !== "Global Campus" && d.location && d.location !== internalSchoolName) return;

                        if ((d.title && d.title.toLowerCase().includes(term)) || (d.description && d.description.toLowerCase().includes(term))) {
                            resListings.appendChild(renderListingCard(docSnap.id, d));
                            foundListings++;
                        }
                    });
                    if (foundListings === 0) resListings.innerHTML = `<div class="empty-state"><i class="fas fa-book"></i></div>`;

                } catch (e) { console.error("Search error:", e); } 
                finally {
                    spinner.style.display = 'none';
                    // Reset display based on current tab
                    secPosts.style.display = ''; secTopics.style.display = '';
                    secPeople.style.display = ''; secListings.style.display = '';
                }
            }

            // --- RENDER FUNCTIONS ---
            function renderPostCard(id, d) {
                const card = document.createElement('a');
                card.className = 'post-card';
                const dest = d.wayId === 'general' ? '/social.html' : `/topic.html?id=${d.wayId}`;
                card.href = dest;
                
                let pfp = d.authorPhoto || `https://api.dicebear.com/7.x/identicon/svg?seed=${d.authorUid}&backgroundColor=EBF2FA`;
                const topicName = topicNamesCache[d.wayId] || 'Topic';

                card.innerHTML = `
                    <div class="post-header-top">
                        <div class="post-avatar" style="background-image:url('${pfp}'); background-size:cover;"></div>
                        <div>
                            <div class="post-author">${d.authorName}</div>
                        </div>
                        <div class="post-topic">#${topicName}</div>
                    </div>
                    <div class="post-body">${d.text || '[Image Attachment]'}</div>
                `;
                return card;
            }

            function renderTopicCard(id, d) {
                const card = document.createElement('a');
                card.className = 'topic-card';
                card.href = `/topic.html?id=${id}`;
                const lock = d.visibility === 'private' ? ' <i class="fas fa-lock"></i>' : '';
                card.innerHTML = `
                    <div class="topic-info">
                        <div class="topic-name"><i class="fas fa-hashtag"></i> ${d.name}${lock}</div>
                        <div class="topic-stats">${d.postCount || 0} ${ui.posts}</div>
                    </div>
                    <i class="fas fa-chevron-right" style="color:var(--mist);"></i>
                `;
                return card;
            }

            function renderUserCard(id, d) {
                const card = document.createElement('a');
                card.className = 'user-card';
                card.href = `/user.html?id=${id}`;
                let pfp = d.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${id}&backgroundColor=EBF2FA`;
                card.innerHTML = `
                    <img src="${pfp}" class="user-avatar">
                    <div class="user-info">
                        <div class="user-name">${d.displayName || 'User'}</div>
                        <div class="user-username">@${d.username || id.substring(0,8)}</div>
                    </div>
                `;
                return card;
            }

            function renderListingCard(id, d) {
                const card = document.createElement('a');
                card.className = 'listing-card';
                card.href = `/listing.html?id=${id}`;
                const img = d.imageUrls?.[0] || '';
                card.innerHTML = `
                    <div class="listing-img" style="background-image:url('${img}')"></div>
                    <div class="listing-info">
                        <div class="listing-title">${d.title}</div>
                        <div class="listing-price">$${d.price.toFixed(2)}</div>
                    </div>
                `;
                return card;
            }
        }
        main();
    </script>
</body>
</html>
