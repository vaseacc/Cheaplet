<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Scoralia</title>
    
    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://firebaseapp.com">
    <link rel="dns-prefetch" href="https://googleapis.com">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- Modulepreload for critical JS -->
    <link rel="modulepreload" href="/global.js">
    
    <!-- Preload critical fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome with integrity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <script type="module" src="global.js"></script>
    
    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --mist:      #B3CDE0;
            --white:     #FFFFFF;
            --off-white: #F4F7FC;
            --surface:   #EBF2FA;
            --text-body: #1a2a4a;
            --text-muted:#6b84a3;
            --gold:      #C8A96E;
            --red:       #e53e3e;
            --deep:      #2B5C92;
            --radius-sm: 8px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 20px rgba(12,20,70,0.06);
            --shadow-md: 0 8px 30px rgba(12,20,70,0.1);
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body:    'DM Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--off-white); color: var(--text-body); line-height: 1.6; padding-bottom: 60px; }

        /* ── HEADER ── */
        header { position: sticky; top: 0; z-index: 200; background: rgba(12, 20, 70, 0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(179,205,224,0.15); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; color: var(--white); text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }
        
        .main-wrapper { max-width: 900px; margin: 0 auto; padding: 0 20px; animation: fadeUp 0.5s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ── LOADER ── */
        .info-message { text-align: center; padding: 80px 20px; font-size: 1.1rem; color: var(--text-muted); font-weight: 500; }
        .info-message i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }

        /* ── PROFILE BANNER & HEADER ── */
        .profile-banner {
            position: relative; height: 240px; border-radius: 0 0 var(--radius-md) var(--radius-md);
            background: linear-gradient(135deg, var(--ink), var(--deep)); overflow: hidden;
            box-shadow: inset 0 -20px 60px rgba(0,0,0,0.2);
        }
        .profile-banner::after {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(circle at 30% 40%, rgba(200,169,110,0.15) 2px, transparent 2px);
            background-size: 24px 24px; pointer-events: none;
        }
        
        .profile-header-card {
            background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
            padding: 0 40px 35px; margin: -60px auto 40px; position: relative; z-index: 10;
            border: 1px solid rgba(179,205,224,0.3);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .main-avatar-wrapper { 
            position: relative; width: 150px; height: 150px; 
            margin-top: -75px; /* Pops out of the top of the card */
            margin-bottom: 15px; flex-shrink: 0;
        }
        
        .main-profile-photo { 
            width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--white); 
            background: var(--surface); object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,0.12); display: block;
        }
        
        .edit-avatar-btn {
            position: absolute; bottom: 5px; right: 5px; width: 42px; height: 42px;
            background: var(--gold); color: var(--ink); border: none; border-radius: 50%;
            cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(200,169,110,0.4); transition: transform 0.2s;
        }
        .edit-avatar-btn:hover { transform: scale(1.1); background: #dcb878; }
        .edit-avatar-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .profile-name { font-family: var(--font-display); font-size: 2.2rem; font-weight: 900; color: var(--ink); line-height: 1.1; margin-bottom: 4px; }
        .profile-username { font-size: 1.05rem; color: var(--text-muted); font-weight: 500; margin-bottom: 16px; }
        .profile-bio { color: var(--text-body); font-size: 1rem; max-width: 600px; line-height: 1.6; margin-bottom: 20px; }
        
        .profile-meta { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .meta-tag { background: var(--surface); color: var(--deep); padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--mist); }
        .meta-tag.verified { background: rgba(46,125,50,0.1); color: var(--deep); border-color: rgba(46,125,50,0.2); }
        .meta-tag.rating { background: rgba(200,169,110,0.1); color: #b8860b; border-color: rgba(200,169,110,0.3); }
        .meta-tag.rating i { color: #d4af37; }

        /* ── SECTIONS (Forms & Grids) ── */
        .content-section { background: var(--white); border-radius: var(--radius-md); padding: 30px; margin-bottom: 30px; box-shadow: var(--shadow-sm); border: 1px solid rgba(179,205,224,0.3); }
        .section-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--ink); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--gold); font-size: 1.2rem; }

        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .form-input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--mist); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 1rem; color: var(--text-body); background: var(--off-white); outline: none; transition: 0.2s; }
        .form-input:focus { border-color: var(--deep); background: var(--white); box-shadow: 0 0 0 3px rgba(43,92,146,0.1); }
        textarea.form-input { resize: vertical; min-height: 100px; }

        .username-status { font-size: 0.8rem; margin-top: 6px; font-weight: 500; }
        .username-status.valid { color: var(--deep); }
        .username-status.invalid { color: var(--red); }
        .username-status.checking { color: #f59e0b; }

        /* ── BUTTONS ── */
        .btn-group { display: flex; gap: 15px; justify-content: flex-end; margin-top: 10px; }
        .btn { padding: 12px 24px; border-radius: 50px; font-family: var(--font-body); font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--gold); color: var(--ink); box-shadow: 0 4px 15px rgba(200,169,110,0.3); }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,169,110,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: var(--surface); color: var(--deep); border: 1.5px solid var(--mist); }
        .btn-secondary:hover { background: var(--mist); color: var(--ink); }
        .btn-danger { background: #fef2f2; color: var(--red); border: 1.5px solid #fecaca; }
        .btn-danger:hover { background: var(--red); color: var(--white); }

        #save-feedback { text-align: right; font-weight: 600; font-size: 0.9rem; margin-top: 10px; }

        /* ── SAVED LISTINGS ── */
        .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .saved-card { background: var(--white); border: 1px solid var(--mist); border-radius: var(--radius-sm); overflow: hidden; text-decoration: none; color: inherit; transition: 0.2s; display: flex; flex-direction: column; }
        .saved-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: var(--shadow-sm); }
        .saved-img { height: 140px; background-color: var(--surface); background-size: cover; background-position: center; border-bottom: 1px solid var(--mist); }
        .saved-info { padding: 12px; }
        .saved-price { font-weight: 800; color: var(--deep); font-size: 1.1rem; font-family: var(--font-display); margin-bottom: 4px; }
        .saved-title { font-size: 0.9rem; font-weight: 500; color: var(--text-body); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            nav { display: none; }
            .profile-banner { height: 160px; border-radius: 0; }
            .profile-header-card { margin: -50px 0 20px; padding: 0 20px 30px; border-radius: 0; border-left: none; border-right: none; box-shadow: none; border-bottom: 1px solid var(--mist); }
            
            .main-avatar-wrapper { width: 120px; height: 120px; margin-top: -60px; }
            .main-profile-photo { border-width: 4px; }
            .edit-avatar-btn { width: 38px; height: 38px; font-size: 1rem; bottom: 4px; right: 4px; }
            
            .profile-name { font-size: 1.8rem; }
            
            .edit-grid { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
            .content-section { padding: 20px; border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div> <!-- Injected by global.js -->
        </div>
    </header>

    <main class="main-wrapper">
        <div id="info-container">
            <p class="info-message"><i class="fas fa-circle-notch fa-spin"></i> <span id="ui-loading">Loading profile...</span></p>
        </div>

        <div id="profile-container" style="display: none;">
            
            <!-- Banner -->
            <div class="profile-banner" id="profile-banner"></div>
            
            <!-- Centered Header Card -->
            <div class="profile-header-card">
                <div class="main-avatar-wrapper">
                    <img id="profile-avatar-img" class="main-profile-photo" alt="Profile picture" src="">
                    <button class="edit-avatar-btn" id="edit-avatar-btn" title="Change photo"><i class="fas fa-camera"></i></button>
                    <input type="file" id="photo-upload-input" accept="image/*" style="display: none;">
                </div>
                
                <h1 class="profile-name" id="display-name-display"></h1>
                <div class="profile-username" id="username-display"></div>
                <div class="profile-bio" id="bio-display"></div>
                
                <div class="profile-meta">
                    <div class="meta-tag rating" id="rating-display"></div>
                    <div class="meta-tag verified" id="verified-badge" style="display: none;">
                        <i class="fas fa-graduation-cap"></i> <span id="verified-text">Verified Student</span>
                    </div>
                    <div class="meta-tag school">
                        <i class="fas fa-university"></i> <span id="school-name"></span>
                    </div>
                    <div class="meta-tag">
                        <i class="far fa-calendar-alt"></i> <span id="join-date-display"></span>
                    </div>
                </div>
            </div>
            
            <!-- Editable Profile Info -->
            <div class="content-section">
                <h2 class="section-title"><i class="fas fa-user-edit"></i> <span id="ui-edit-profile">Edit Profile</span></h2>
                <div class="edit-grid">
                    <div class="form-group">
                        <label class="form-label" id="ui-fullname-lbl">Full Name</label>
                        <input type="text" id="edit-fullname" class="form-input" placeholder="">
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="ui-username-lbl">Username</label>
                        <input type="text" id="edit-username" class="form-input" placeholder="username" autocomplete="off">
                        <div class="username-status" id="username-status"></div>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label" id="ui-bio-lbl">Bio</label>
                        <textarea id="edit-bio" class="form-input" maxlength="160" placeholder=""></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label" id="ui-language-lbl">App Language / Langue</label>
                        <select id="language-select" class="form-input">
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                </div>
                
                <div id="save-feedback"></div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="reset-password-btn"><i class="fas fa-key"></i> <span id="ui-btn-reset">Reset Password</span></button>
                    <button class="btn btn-primary" id="save-profile-btn"><i class="fas fa-save"></i> <span id="ui-btn-save">Save Changes</span></button>
                </div>
            </div>
            
            <!-- Saved Listings -->
            <div class="content-section">
                <h2 class="section-title"><i class="fas fa-bookmark"></i> <span id="ui-saved-items">Saved Items</span></h2>
                <div id="saved-listings-container" class="saved-grid">
                    <p style="color: var(--text-muted); font-weight: 500;" id="ui-loading-saved">Loading saved items...</p>
                </div>
            </div>
            
            <!-- Account Security -->
            <div class="content-section" style="border-color: #fecaca;">
                <h2 class="section-title" style="color: var(--red);"><i class="fas fa-shield-alt"></i> <span id="ui-danger-zone">Danger Zone</span></h2>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;" id="ui-danger-text">Once you delete your account, there is no going back. Please be certain.</p>
                <button class="btn btn-danger" id="delete-account-btn"><i class="fas fa-trash-alt"></i> <span id="ui-btn-delete">Delete My Account</span></button>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateProfile, sendPasswordResetEmail, deleteUser } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);
            
            // Cloudinary settings
            const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${config.cloudinary.cloudName}/image/upload`;
            const UPLOAD_PRESET = config.cloudinary.uploadPreset;

            // DOM Elements
            const infoContainer = document.getElementById('info-container');
            const profileContainer = document.getElementById('profile-container');
            const avatarImg = document.getElementById('profile-avatar-img');
            const editAvatarBtn = document.getElementById('edit-avatar-btn');
            const photoUploadInput = document.getElementById('photo-upload-input');
            const editFullname = document.getElementById('edit-fullname');
            const editUsername = document.getElementById('edit-username');
            const editBio = document.getElementById('edit-bio');
            const languageSelect = document.getElementById('language-select');
            const usernameStatus = document.getElementById('username-status');
            const saveBtn = document.getElementById('save-profile-btn');
            const resetPwdBtn = document.getElementById('reset-password-btn');
            const deleteBtn = document.getElementById('delete-account-btn');
            const saveFeedback = document.getElementById('save-feedback');
            const savedListingsContainer = document.getElementById('saved-listings-container');
            const bannerDiv = document.getElementById('profile-banner');

            let currentUser = null;
            let currentUserData = null;
            let usernameCheckTimeout = null;
            let isUsernameValid = false;
            let originalUsername = '';

            // --- BILINGUAL TRANSLATIONS ---
            const lang = localStorage.getItem('preferred_language') || 'en';
            const t = {
                en: {
                    loading: "Loading profile...",
                    editProfile: "Edit Profile", fullName: "Full Name", usernameLbl: "Username",
                    bio: "Bio", bioPlace: "Tell the campus a little about yourself...",
                    appLang: "App Language / Langue", resetPwd: "Reset Password", saveChanges: "Save Changes",
                    savedItems: "Saved Items", loadingSaved: "Loading saved items...", noSaved: "You haven't saved any items yet.",
                    dangerZone: "Danger Zone", dangerText: "Once you delete your account, there is no going back. Please be certain.",
                    deleteBtn: "Delete My Account",
                    verified: "Verified Student", joinPrefix: "Joined ", noRating: "No ratings yet",
                    saveSuccess: "Profile updated successfully!", saveError: "Error saving profile.",
                    pwdResetSent: "Password reset email sent!", deleteConfirm: "Are you sure? This will permanently delete your account and all your data.",
                    usernameTaken: "Username already taken", usernameAvailable: "✓ Available",
                    usernameInvalid: "Only letters, numbers, underscore", usernameChecking: "Checking...", usernameHint: "Only letters, numbers, underscore",
                    imgUploadFailed: "Failed to upload image. Please try again."
                },
                fr: {
                    loading: "Chargement du profil...",
                    editProfile: "Modifier le profil", fullName: "Nom complet", usernameLbl: "Nom d'utilisateur",
                    bio: "Biographie", bioPlace: "Parlez-nous un peu de vous...",
                    appLang: "Langue de l'application", resetPwd: "Réinitialiser le mot de passe", saveChanges: "Enregistrer les modifications",
                    savedItems: "Articles sauvegardés", loadingSaved: "Chargement des articles sauvegardés...", noSaved: "Vous n'avez pas encore d'articles sauvegardés.",
                    dangerZone: "Zone de danger", dangerText: "Une fois votre compte supprimé, il n'y a pas de retour en arrière. Soyez certain.",
                    deleteBtn: "Supprimer mon compte",
                    verified: "Étudiant vérifié", joinPrefix: "Membre depuis ", noRating: "Aucune évaluation",
                    saveSuccess: "Profil mis à jour avec succès !", saveError: "Erreur lors de la mise à jour.",
                    pwdResetSent: "E-mail de réinitialisation envoyé !", deleteConfirm: "Êtes-vous sûr ? Cela supprimera définitivement votre compte et toutes vos données.",
                    usernameTaken: "Nom d'utilisateur déjà pris", usernameAvailable: "✓ Disponible",
                    usernameInvalid: "Lettres, chiffres, tiret bas uniquement", usernameChecking: "Vérification...", usernameHint: "Lettres, chiffres, tiret bas uniquement",
                    imgUploadFailed: "Échec du téléchargement de l'image. Veuillez réessayer."
                }
            }[lang];

            // Apply translations to UI
            document.getElementById('ui-loading').textContent = t.loading;
            document.getElementById('ui-edit-profile').textContent = t.editProfile;
            document.getElementById('ui-fullname-lbl').textContent = t.fullName;
            document.getElementById('ui-username-lbl').textContent = t.usernameLbl;
            document.getElementById('ui-bio-lbl').textContent = t.bio;
            document.getElementById('edit-bio').placeholder = t.bioPlace;
            document.getElementById('ui-language-lbl').textContent = t.appLang;
            document.getElementById('ui-btn-reset').textContent = t.resetPwd;
            document.getElementById('ui-btn-save').textContent = t.saveChanges;
            document.getElementById('ui-saved-items').textContent = t.savedItems;
            document.getElementById('ui-loading-saved').textContent = t.loadingSaved;
            document.getElementById('ui-danger-zone').textContent = t.dangerZone;
            document.getElementById('ui-danger-text').textContent = t.dangerText;
            document.getElementById('ui-btn-delete').textContent = t.deleteBtn;

            // Helpers
            function generateBannerGradient(uid) {
                let hash = 0;
                for (let i = 0; i < uid.length; i++) { hash = ((hash << 5) - hash) + uid.charCodeAt(i); hash |= 0; }
                const hue1 = Math.abs(hash % 360);
                const hue2 = (hue1 + 40) % 360;
                const sat = 65 + (Math.abs(hash >> 8) % 20);
                const light = 35 + (Math.abs(hash >> 16) % 20);
                return `linear-gradient(135deg, hsl(${hue1}, ${sat}%, ${light}%), hsl(${hue2}, ${sat}%, ${light - 15}%))`;
            }

            function isValidUsernameFormat(username) {
                return /^[a-zA-Z0-9_]{3,}$/.test(username);
            }

            async function checkUsernameAvailability(username, currentUid) {
                if (!username || !isValidUsernameFormat(username)) return false;
                const q = query(collection(db, "users"), where("username", "==", username.toLowerCase()));
                const snap = await getDocs(q);
                if (snap.empty) return true;
                if (snap.docs.length === 1 && snap.docs[0].id === currentUid) return true;
                return false;
            }

            // --- AUTO UPLOAD AVATAR ---
            editAvatarBtn.onclick = () => photoUploadInput.click();
            
            photoUploadInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // 1. Show local preview instantly
                const reader = new FileReader();
                reader.onload = (ev) => { avatarImg.src = ev.target.result; };
                reader.readAsDataURL(file);

                // 2. Change icon to spinner & disable
                const originalIcon = editAvatarBtn.innerHTML;
                editAvatarBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                editAvatarBtn.disabled = true;

                try {
                    // Get signature
                    const signRes = await fetch('/.netlify/functions/sign-upload').then(r => r.json());
                    
                    // Upload to Cloudinary
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('api_key', signRes.apiKey);
                    formData.append('timestamp', signRes.timestamp);
                    formData.append('signature', signRes.signature);
                    formData.append('upload_preset', signRes.uploadPreset);
                    
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${signRes.cloudName}/image/upload`, {
                        method: 'POST', body: formData
                    }).then(r => r.json());
                    
                    if (res.secure_url) {
                        const finalPhotoURL = res.secure_url;
                        // Update Firebase Auth & DB immediately
                        await updateProfile(currentUser, { photoURL: finalPhotoURL });
                        await updateDoc(doc(db, "users", currentUser.uid), { photoURL: finalPhotoURL });
                        currentUserData.photoURL = finalPhotoURL;
                    } else {
                        throw new Error("Upload Failed");
                    }
                } catch (err) {
                    console.error(err);
                    alert(t.imgUploadFailed);
                    // Revert to old image
                    avatarImg.src = currentUserData.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}&backgroundColor=EBF2FA`;
                } finally {
                    // Restore button
                    editAvatarBtn.innerHTML = originalIcon;
                    editAvatarBtn.disabled = false;
                    photoUploadInput.value = ''; // clear input
                }
            };

            // Username validation listener
            editUsername.addEventListener('input', async () => {
                if (usernameCheckTimeout) clearTimeout(usernameCheckTimeout);
                const newUsername = editUsername.value.trim().toLowerCase();
                
                if (!newUsername) {
                    usernameStatus.textContent = t.usernameHint; usernameStatus.className = 'username-status'; isUsernameValid = false; return;
                }
                if (!isValidUsernameFormat(newUsername)) {
                    usernameStatus.textContent = t.usernameInvalid; usernameStatus.className = 'username-status invalid'; isUsernameValid = false; return;
                }
                
                usernameStatus.textContent = t.usernameChecking; usernameStatus.className = 'username-status checking'; isUsernameValid = false;
                
                usernameCheckTimeout = setTimeout(async () => {
                    const available = await checkUsernameAvailability(newUsername, currentUser.uid);
                    if (available) {
                        usernameStatus.textContent = t.usernameAvailable; usernameStatus.className = 'username-status valid'; isUsernameValid = true;
                    } else {
                        usernameStatus.textContent = t.usernameTaken; usernameStatus.className = 'username-status invalid'; isUsernameValid = false;
                    }
                }, 500);
            });

            // Load Data
            async function loadProfile() {
                const user = auth.currentUser;
                if (!user) return;
                currentUser = user;
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists()) {
                    infoContainer.innerHTML = '<p class="info-message">Profile not found. Please re-login.</p>'; return;
                }
                
                currentUserData = userDoc.data();
                
                // Populate DOM
                document.getElementById('display-name-display').textContent = currentUserData.displayName || 'User';
                document.getElementById('username-display').textContent = currentUserData.username ? `@${currentUserData.username}` : '';
                document.getElementById('bio-display').textContent = currentUserData.bio || '';
                
                editFullname.value = currentUserData.displayName || '';
                editFullname.placeholder = t.fullName;
                
                editUsername.value = currentUserData.username || '';
                originalUsername = currentUserData.username || '';
                
                editBio.value = currentUserData.bio || '';
                languageSelect.value = currentUserData.language || localStorage.getItem('preferred_language') || 'en';
                
                let photoURL = currentUserData.photoURL;
                if (!photoURL || photoURL.includes("googleusercontent") || photoURL.includes("live.com")) {
                    photoURL = `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=EBF2FA`;
                }
                avatarImg.src = photoURL;
                bannerDiv.style.background = generateBannerGradient(user.uid);
                
                const ratingContainer = document.getElementById('rating-display');
                if (currentUserData.ratingCount && currentUserData.ratingCount > 0) {
                    const avg = (currentUserData.ratingSum / currentUserData.ratingCount).toFixed(1);
                    let stars = '';
                    for (let i = 1; i <= 5; i++) {
                        if (avg >= i) stars += '<i class="fas fa-star"></i>';
                        else if (avg >= i - 0.5) stars += '<i class="fas fa-star-half-alt"></i>';
                        else stars += '<i class="far fa-star"></i>';
                    }
                    ratingContainer.innerHTML = `${stars} <span style="color:var(--text-muted); margin-left:4px;">(${avg})</span>`;
                } else {
                    ratingContainer.innerHTML = `<i class="far fa-star"></i> <span>${t.noRating}</span>`;
                }
                
                if (currentUserData.isStudent) {
                    document.getElementById('verified-badge').style.display = 'inline-flex';
                    document.getElementById('verified-text').textContent = t.verified;
                }
                
                document.getElementById('school-name').textContent = currentUserData.schoolName || (lang === 'fr' ? 'Université non spécifiée' : 'Unspecified campus');
                
                const joinDateSpan = document.getElementById('join-date-display');
                if (currentUserData.createdAt) {
                    const date = new Date(currentUserData.createdAt);
                    joinDateSpan.textContent = `${t.joinPrefix}${date.toLocaleDateString(lang === 'fr' ? 'fr-CA' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' })}`;
                } else {
                    joinDateSpan.textContent = t.joinPrefix + (lang === 'fr' ? 'récemment' : 'recently');
                }
                
                // Fetch Saved Listings (Reversing the array to show newest first)
                if (currentUserData.savedListings && currentUserData.savedListings.length > 0) {
                    const idsToFetch = [...currentUserData.savedListings].reverse();
                    const promises = idsToFetch.map(id => getDoc(doc(db, "listings", id)));
                    const snaps = await Promise.all(promises);
                    
                    savedListingsContainer.innerHTML = '';
                    let hasItems = false;
                    
                    snaps.forEach(snap => {
                        if (snap.exists() && snap.data().status !== 'sold') {
                            hasItems = true;
                            const d = snap.data();
                            const card = document.createElement('a');
                            card.className = 'saved-card';
                            card.href = `/listing.html?id=${snap.id}`;
                            card.innerHTML = `
                                <div class="saved-img" style="background-image: url('${d.imageUrls?.[0] || ''}')"></div>
                                <div class="saved-info">
                                    <div class="saved-price">$${d.price.toFixed(2)}</div>
                                    <div class="saved-title">${d.title}</div>
                                </div>`;
                            savedListingsContainer.appendChild(card);
                        }
                    });
                    if (!hasItems) savedListingsContainer.innerHTML = `<p style="grid-column:1/-1; color:var(--text-muted);">${t.noSaved}</p>`;
                } else {
                    savedListingsContainer.innerHTML = `<p style="grid-column:1/-1; color:var(--text-muted);">${t.noSaved}</p>`;
                }
                
                infoContainer.style.display = 'none';
                profileContainer.style.display = 'block';
            }
            
            // Save logic (Only handles text fields now)
            async function saveProfile() {
                saveBtn.disabled = true;
                saveFeedback.textContent = '';
                saveFeedback.style.color = 'var(--text-muted)';
                
                const newFullname = editFullname.value.trim();
                const newUsername = editUsername.value.trim().toLowerCase();
                const newBio = editBio.value.trim();
                const newLanguage = languageSelect.value;
                
                if (!newFullname || !newUsername) {
                    saveFeedback.textContent = 'Name and Username are required.';
                    saveFeedback.style.color = 'var(--red)';
                    saveBtn.disabled = false; return;
                }
                if (!isValidUsernameFormat(newUsername)) {
                    saveFeedback.textContent = t.usernameInvalid;
                    saveFeedback.style.color = 'var(--red)';
                    saveBtn.disabled = false; return;
                }
                if (newUsername !== originalUsername && !isUsernameValid) {
                    const available = await checkUsernameAvailability(newUsername, currentUser.uid);
                    if (!available) {
                        saveFeedback.textContent = t.usernameTaken;
                        saveFeedback.style.color = 'var(--red)';
                        saveBtn.disabled = false; return;
                    }
                }
                
                saveFeedback.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
                
                try {
                    await updateProfile(currentUser, { displayName: newFullname });
                    await updateDoc(doc(db, "users", currentUser.uid), {
                        displayName: newFullname, username: newUsername, bio: newBio, language: newLanguage
                    });
                    
                    if (newFullname !== currentUserData.displayName && window.updateUserContent) {
                        await window.updateUserContent(currentUser.uid, newFullname);
                    }
                    
                    localStorage.setItem('preferred_language', newLanguage);
                    
                    document.getElementById('display-name-display').textContent = newFullname;
                    document.getElementById('username-display').textContent = `@${newUsername}`;
                    document.getElementById('bio-display').textContent = newBio;
                    
                    currentUserData.displayName = newFullname;
                    currentUserData.username = newUsername;
                    currentUserData.bio = newBio;
                    originalUsername = newUsername;
                    
                    saveFeedback.textContent = t.saveSuccess;
                    saveFeedback.style.color = 'var(--deep)';
                    
                    if (newLanguage !== (currentUserData.language || 'en')) {
                        setTimeout(() => location.reload(), 800);
                    }
                } catch (err) {
                    console.error(err);
                    saveFeedback.textContent = t.saveError;
                    saveFeedback.style.color = 'var(--red)';
                } finally {
                    saveBtn.disabled = false;
                }
            }
            
            // Text Save button
            saveBtn.onclick = saveProfile;
            
            // Password Reset
            resetPwdBtn.onclick = async () => {
                try {
                    await sendPasswordResetEmail(auth, currentUser.email);
                    alert(t.pwdResetSent);
                } catch (e) { alert(e.message); }
            };
            
            // Delete Account
            deleteBtn.onclick = async () => {
                if (confirm(t.deleteConfirm)) {
                    try {
                        await deleteDoc(doc(db, "users", currentUser.uid));
                        await deleteUser(currentUser);
                        window.location.href = '/index.html';
                    } catch (err) { alert("Error deleting account: " + err.message); }
                }
            };
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const isOAuth = user.providerData.some(p => p.providerId === 'microsoft.com' || p.providerId === 'google.com');
                    if (user.emailVerified || isOAuth) { loadProfile(); } 
                    else { window.location.href = '/login.html'; }
                } else { window.location.href = '/login.html'; }
            });
        }
        main();
    </script>
</body>
</html>
