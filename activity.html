<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Activity — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; flex-shrink: 0; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        .page-header { background: linear-gradient(135deg, var(--ink) 0%, var(--deep) 60%, #4a7db5 100%); padding: 40px 20px; text-align: center; color: var(--white); position: relative; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; }
        .page-header p { color: rgba(255,255,255,0.7); font-size: 1rem; }

        .main-wrapper { max-width: 700px; margin: 30px auto; padding: 0 20px; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); }
        .loader-msg i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }
        
        .empty-state { text-align: center; padding: 60px 20px; background: var(--white); border-radius: var(--radius); border: var(--border); box-shadow: var(--shadow); }
        .empty-state i { font-size: 3rem; color: var(--mist); margin-bottom: 15px; display: block; }

        /* ── POST CARDS ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; position: relative; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .post-meta { display: flex; flex-direction: column; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .source-tag { font-size: 0.7rem; background: var(--surface); color: var(--deep); padding: 2px 8px; border-radius: 12px; border: 1px solid var(--mist); font-weight: 700; margin-top: 5px; width: fit-content; }

        .post-body { font-size: 1rem; line-height: 1.6; color: #334155; white-space: pre-wrap; margin-bottom: 15px; }
        .post-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        
        .post-actions { display: flex; gap: 15px; padding-top: 15px; border-top: 1px solid #f1f5f9; justify-content: flex-end; }
        .btn-delete { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-delete:hover { background: var(--red); color: var(--white); }

        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
        .status-pending { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .status-rejected { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        /* Custom Dialog Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.8); backdrop-filter: blur(6px); z-index: 10020; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: var(--white); padding: 35px 30px; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-confirm { background: var(--red); color: white; }
        .btn-cancel { background: var(--off-white); color: var(--ink); border: 1px solid var(--border) !important; }

        @media (max-width: 767px) {
            .post-card { padding: 16px; }
            .page-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="page-header">
        <h1 data-i18n="activity_title">My Activity</h1>
        <p data-i18n="activity_sub">Gérez vos publications sur tous les canaux du campus.</p>
    </div>

    <main class="main-wrapper" id="activity-list">
        <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br>Chargement...</div>
    </main>

    <div class="modal-overlay" id="custom-dialog-modal">
        <div class="modal-card">
            <h2 id="dialog-title">Confirm</h2>
            <p id="dialog-message">Are you sure?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="dialog-cancel">No</button>
                <button class="btn-confirm" id="dialog-confirm">Yes</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const db = getFirestore(app);
            const auth = getAuth(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: { confirm_del: "Delete this post permanently?", source_global: "Global Feed", source_school: "School Feed", source_custom: "Topic", empty: "No activity yet.", btn_del: "Delete" },
                fr: { confirm_del: "Supprimer définitivement ce message ?", source_global: "Fil Global", source_school: "Fil École", source_custom: "Sujet", empty: "Aucune activité pour le moment.", btn_del: "Supprimer" }
            }[lang];

            const listContainer = document.getElementById('activity-list');

            // --- Custom Dialog Logic ---
            window.scoraliaConfirm = (msg) => {
                return new Promise(res => {
                    const modal = document.getElementById('custom-dialog-modal');
                    document.getElementById('dialog-message').textContent = msg;
                    modal.style.display = 'flex';
                    document.getElementById('dialog-confirm').onclick = () => { modal.style.display = 'none'; res(true); };
                    document.getElementById('dialog-cancel').onclick = () => { modal.style.display = 'none'; res(false); };
                });
            };

            onAuthStateChanged(auth, user => {
                if (user) loadUserActivity(user.uid);
                else window.location.href = '/login.html';
            });

            async function loadUserActivity(uid) {
                try {
                    const collections = [
                        { name: "social_posts_global", label: ui.source_global },
                        { name: "social_posts_rosemont", label: ui.source_school },
                        { name: "social_posts", label: ui.source_custom }
                    ];

                    let allPosts = [];

                    for (const coll of collections) {
                        const q = query(collection(db, coll.name), where("authorUid", "==", uid));
                        const snap = await getDocs(q);
                        snap.forEach(d => {
                            allPosts.push({ id: d.id, collection: coll.name, sourceLabel: coll.label, ...d.data() });
                        });
                    }

                    allPosts.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                    renderActivity(allPosts);
                } catch (e) {
                    console.error(e);
                    listContainer.innerHTML = "Error loading activity.";
                }
            }

            function renderActivity(posts) {
                listContainer.innerHTML = '';
                if (posts.length === 0) {
                    listContainer.innerHTML = `<div class="empty-state"><i class="far fa-comment-dots"></i><h3>${ui.empty}</h3></div>`;
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    
                    const dateStr = post.timestamp ? new Date(post.timestamp.toDate()).toLocaleDateString(lang, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
                    let statusHtml = '';
                    if (post.status === 'pending') statusHtml = `<span class="status-badge status-pending">⏳ In Review</span>`;
                    if (post.status === 'rejected') statusHtml = `<span class="status-badge status-rejected">❌ Rejected</span>`;

                    card.innerHTML = `
                        <div class="post-header-top">
                            <div class="post-meta">
                                <span class="post-time">${dateStr} ${statusHtml}</span>
                                <div class="source-tag">${post.sourceLabel}</div>
                            </div>
                        </div>
                        <div class="post-body">${post.text || ''}</div>
                        ${post.imageUrl ? `<img src="${window.optimizeImageUrl(post.imageUrl)}" class="post-img">` : ''}
                        <div class="post-actions">
                            <button class="btn-delete" onclick="window.deleteActivityPost('${post.id}', '${post.collection}')"><i class="fas fa-trash-alt"></i> ${ui.btn_del}</button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }

            window.deleteActivityPost = async (id, collName) => {
                const ok = await window.scoraliaConfirm(ui.confirm_del);
                if (ok) {
                    try {
                        await deleteDoc(doc(db, collName, id));
                        // Refresh
                        loadUserActivity(auth.currentUser.uid);
                    } catch (e) { alert("Error deleting."); }
                }
            };
        }
        main();
    </script>
</body>
</html>
