<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Activity — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; flex-shrink: 0; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        nav ul { display: flex; list-style: none; gap: 28px; margin: 0; padding: 0; }
        nav ul li a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        nav ul li a:hover { color: var(--white); }

        .page-header { background: linear-gradient(135deg, var(--ink) 0%, var(--deep) 60%, #4a7db5 100%); padding: 40px 20px; text-align: center; color: var(--white); position: relative; overflow: hidden; }
        .page-header::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; pointer-events: none; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; position: relative; z-index: 1; }
        .page-header p { color: rgba(255,255,255,0.7); font-size: 1rem; position: relative; z-index: 1; }

        .main-wrapper { max-width: 700px; margin: 30px auto; padding: 0 20px; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.1rem; font-weight: 500; }
        .loader-msg i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }
        
        .empty-state { text-align: center; padding: 60px 20px; background: var(--white); border-radius: var(--radius); border: var(--border); box-shadow: var(--shadow); }
        .empty-state i { font-size: 3rem; color: var(--mist); margin-bottom: 15px; }
        .empty-state h3 { color: var(--ink); margin-bottom: 10px; font-family: 'Playfair Display', serif; font-size: 1.4rem; }
        .empty-state p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
        .btn-action { background: var(--gold); color: var(--ink); border: none; padding: 10px 24px; border-radius: 30px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; box-shadow: 0 4px 12px rgba(200,169,110,0.3); }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(200,169,110,0.4); }

        /* ── POST CARDS ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; overflow: visible; position: relative; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .post-author-info { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
        
        .post-avatar-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
        .post-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; }
        
        .post-meta { display: flex; flex-direction: column; overflow: hidden; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.3px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .source-tag { font-size: 0.7rem; background: var(--surface); color: var(--deep); padding: 2px 8px; border-radius: 12px; border: 1px solid var(--mist); font-weight: 700; margin-left: 6px; white-space: nowrap; }

        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; word-wrap: break-word; width: 100%; margin-bottom: 15px; }
        .post-image-attachment { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        
        .post-actions { display: flex; gap: 15px; margin-top: 5px; padding-top: 15px; border-top: 1px solid #f1f5f9; justify-content: flex-end; }
        .btn-delete { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
        .btn-delete:hover { background: var(--red); color: var(--white); }

        /* Custom Dialog Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.8); backdrop-filter: blur(6px); z-index: 10020; display: none; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 0.2s ease; }
        .modal-card { background: var(--white); padding: 35px 30px; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-card h2 { font-family: 'Playfair Display', serif; color: var(--ink); margin-bottom: 10px; font-size: 1.6rem; }
        .modal-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; font-size: 0.95rem; }
        .btn-submit-red { background: var(--red); color: white; box-shadow: 0 4px 15px rgba(229,62,62,0.3); }
        .btn-submit-red:hover { background: #b91c1c; transform: translateY(-2px); }
        .btn-cancel-gray { background: var(--surface); color: var(--ink); border: 1px solid var(--mist) !important; }
        .btn-cancel-gray:hover { background: var(--mist); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        @media (max-width: 767px) {
            nav { display: none; }
            .post-card { padding: 16px; border-radius: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <nav>
                <ul>
                    <li><a href="/search.html" data-i18n="nav_browse">Browse</a></li>
                    <li><a href="/my-listings.html" data-i18n="nav_listings">My Listings</a></li>
                    <li><a href="/social.html" data-i18n="nav_hub">Campus Hub</a></li>
                </ul>
            </nav>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="page-header">
        <h1 data-i18n="activity_title">My Activity</h1>
        <p data-i18n="activity_sub">Manage your posts across all campus channels.</p>
    </div>

    <main class="main-wrapper" id="feed-container">
        <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br><span data-i18n="activity_loading">Loading your activity...</span></div>
    </main>

    <!-- CUSTOM SCORALIA DIALOG OVERLAY -->
    <div class="modal-overlay" id="custom-dialog-modal">
        <div class="modal-card">
            <h2 id="dialog-title">Confirm</h2>
            <p id="dialog-message">Are you sure?</p>
            <div class="modal-buttons" id="dialog-buttons">
                <button class="btn-cancel-gray" id="dialog-cancel">Cancel</button>
                <button class="btn-submit-red" id="dialog-confirm">Yes</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, deleteDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const uiStrings = {
                en: {
                    activity_title: "My Activity", activity_sub: "Manage your posts across all campus channels.", activity_loading: "Loading your activity...",
                    empty_title: "No Activity Yet", empty_desc: "You haven't posted anything in the Campus Hub or any custom topics.",
                    btn_hub: "Go to Campus Hub", confirm_title: "Delete Post", confirm_msg: "Are you sure you want to permanently delete this post?",
                    btn_yes: "Delete", btn_cancel: "Cancel", err_delete: "Error deleting post.", source_global: "Global Campus", source_custom: "Topic", source_school: "School Feed"
                },
                fr: {
                    activity_title: "Mon Activité", activity_sub: "Gérez vos publications sur tous les canaux du campus.", activity_loading: "Chargement de votre activité...",
                    empty_title: "Aucune activité", empty_desc: "Vous n'avez encore rien publié dans le Hub Campus ni dans les sujets.",
                    btn_hub: "Aller au Hub Campus", confirm_title: "Supprimer la publication", confirm_msg: "Êtes-vous sûr de vouloir supprimer définitivement cette publication ?",
                    btn_yes: "Supprimer", btn_cancel: "Annuler", err_delete: "Erreur lors de la suppression.", source_global: "Campus Global", source_custom: "Sujet", source_school: "Flux de l'école"
                }
            };
            const ui = uiStrings[lang] || uiStrings['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (ui[el.getAttribute('data-i18n')]) el.innerHTML = ui[el.getAttribute('data-i18n')];
            });

            // --- CUSTOM DIALOGS SYSTEM ---
            const dialogOverlay = document.getElementById('custom-dialog-modal');
            const dialogTitle = document.getElementById('dialog-title');
            const dialogMessage = document.getElementById('dialog-message');
            const dialogCancel = document.getElementById('dialog-cancel');
            const dialogConfirm = document.getElementById('dialog-confirm');

            window.scoraliaConfirm = (message, title = ui.confirm_title) => {
                return new Promise((resolve) => {
                    dialogTitle.textContent = title;
                    dialogMessage.textContent = message;
                    dialogCancel.style.display = 'block';
                    dialogCancel.textContent = ui.btn_cancel;
                    dialogConfirm.textContent = ui.btn_yes;
                    dialogOverlay.style.display = 'flex';

                    const cleanup = (val) => {
                        dialogOverlay.style.display = 'none';
                        dialogConfirm.onclick = null;
                        dialogCancel.onclick = null;
                        resolve(val);
                    };

                    dialogConfirm.onclick = () => cleanup(true);
                    dialogCancel.onclick = () => cleanup(false);
                });
            };

            window.scoraliaAlert = (message, title = "Notice") => {
                return new Promise((resolve) => {
                    dialogTitle.textContent = title;
                    dialogMessage.textContent = message;
                    dialogCancel.style.display = 'none';
                    dialogConfirm.textContent = "OK";
                    dialogConfirm.className = "btn-submit-red";
                    dialogConfirm.style.background = "var(--gold)";
                    dialogOverlay.style.display = 'flex';

                    dialogConfirm.onclick = () => {
                        dialogOverlay.style.display = 'none';
                        resolve();
                    };
                });
            };

            const feedContainer = document.getElementById('feed-container');

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    loadActivity(user.uid);
                } else {
                    window.location.href = '/login.html';
                }
            });

            async function loadActivity(uid) {
                try {
                    // Fetch from all 3 social collections concurrently
                    const p1 = getDocs(query(collection(db, "social_posts_global"), where("authorUid", "==", uid)));
                    const p2 = getDocs(query(collection(db, "social_posts_rosemont"), where("authorUid", "==", uid))); // Replace rosemont with dynamic logic if needed, but since users only post to their own, this catches it
                    const p3 = getDocs(query(collection(db, "social_posts"), where("authorUid", "==", uid)));

                    const [s1, s2, s3] = await Promise.all([p1, p2, p3]);
                    
                    let allPosts =
