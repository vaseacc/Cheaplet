<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Activity — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#476483;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; flex-shrink: 0; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        .page-header { background: linear-gradient(135deg, var(--ink) 0%, var(--deep) 60%, #4a7db5 100%); padding: 50px 20px; text-align: center; color: var(--white); position: relative; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 900; margin-bottom: 10px; }
        .page-header p { color: rgba(255,255,255,0.8); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        .main-wrapper { max-width: 800px; margin: 30px auto; padding: 0 20px; width: 100%; flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }

        /* ── ACTIVITY CARDS ── */
        .activity-card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); display: flex; gap: 15px; animation: fadeUp 0.4s ease both; transition: transform 0.2s; }
        .activity-card:hover { transform: translateY(-2px); border-color: var(--gold); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .activity-icon-wrap { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; }
        .icon-post { background: rgba(43,92,146,0.1); color: var(--deep); }
        .icon-comment { background: rgba(200,169,110,0.1); color: var(--gold); }
        .icon-like { background: rgba(229,62,62,0.1); color: var(--red); }
        .icon-topic { background: rgba(46,125,50,0.1); color: var(--green); }

        .activity-content { flex-grow: 1; min-width: 0; }
        .activity-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .activity-type { font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .activity-time { font-size: 0.75rem; color: #94a3b8; }
        
        .activity-text { font-size: 1rem; line-height: 1.5; color: var(--text-main); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .activity-link { font-size: 0.85rem; color: var(--deep); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
        .activity-link:hover { text-decoration: underline; }

        .btn-delete { background: none; border: none; color: var(--red); cursor: pointer; padding: 5px; opacity: 0.6; transition: 0.2s; font-size: 0.9rem; }
        .btn-delete:hover { opacity: 1; transform: scale(1.1); }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); font-weight: 600; }
        .loader-msg i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }
        
        .empty-state { text-align: center; padding: 60px 20px; background: var(--white); border-radius: var(--radius); border: var(--border); box-shadow: var(--shadow); }
        .empty-state i { font-size: 3rem; color: var(--mist); margin-bottom: 15px; display: block; }

        /* Custom Dialog Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.8); backdrop-filter: blur(4px); z-index: 10020; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: var(--white); padding: 35px 30px; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-confirm { background: var(--red); color: white; }
        .btn-cancel { background: var(--surface); color: var(--ink); border: 1px solid var(--border) !important; }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 1.8rem; }
            nav { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="page-header">
        <h1 data-i18n="nav_activity">My Activity</h1>
        <p data-i18n="activity_sub">Manage your contributions to the Scoralia community.</p>
    </div>

    <main class="main-wrapper" id="activity-feed">
        <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br><span data-i18n="loading_activity">Loading your timeline...</span></div>
    </main>

    <!-- CUSTOM DIALOG MODAL -->
    <div class="modal-overlay" id="custom-dialog-modal">
        <div class="modal-card">
            <h2 id="dialog-title" style="font-family: 'Playfair Display', serif; color: var(--ink); margin-bottom: 10px;">Confirm Action</h2>
            <p id="dialog-message" style="color: var(--text-muted); line-height: 1.5;">Are you sure you want to proceed?</p>
            <div class="modal-buttons">
                <button class="btn-cancel" id="dialog-cancel">Cancel</button>
                <button class="btn-confirm" id="dialog-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, deleteDoc, doc, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            // 1. BOOTSTRAP: Get config before anything else
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const uiStrings = {
                en: { 
                    post: "Post", comment: "Comment", like: "Like", topic: "New Topic", view: "View Original", del_confirm: "Permanently delete this activity?",
                    empty: "No activity found.", del_success: "Deleted successfully."
                },
                fr: { 
                    post: "Publication", comment: "Commentaire", like: "J'aime", topic: "Nouveau Sujet", view: "Voir l'original", del_confirm: "Supprimer définitivement cette activité ?",
                    empty: "Aucune activité trouvée.", del_success: "Supprimé avec succès."
                }
            };
            const ui = uiStrings[lang];

            const feedContainer = document.getElementById('activity-feed');

            // --- Custom Dialog System ---
            window.scoraliaConfirm = (msg) => {
                return new Promise(res => {
                    const modal = document.getElementById('custom-dialog-modal');
                    document.getElementById('dialog-message').textContent = msg;
                    modal.style.display = 'flex';
                    document.getElementById('dialog-confirm').onclick = () => { modal.style.display = 'none'; res(true); };
                    document.getElementById('dialog-cancel').onclick = () => { modal.style.display = 'none'; res(false); };
                });
            };

            onAuthStateChanged(auth, user => {
                if (user) loadActivity(user.uid);
                else window.location.href = '/login.html';
            });

            async function loadActivity(uid) {
                try {
                    let timeline = [];

                    // Collection definitions
                    const postColls = ["social_posts_global", "social_posts_rosemont", "social_posts"];
                    
                    const fetchPosts = postColls.map(async (collName) => {
                        const q = query(collection(db, collName), where("authorUid", "==", uid), limit(20));
                        const snap = await getDocs(q);
                        snap.forEach(d => timeline.push({ type: 'post', id: d.id, collection: collName, ...d.data() }));
                    });

                    const fetchLikes = postColls.map(async (collName) => {
                        const q = query(collection(db, collName), where("likedBy", "array-contains", uid), limit(20));
                        const snap = await getDocs(q);
                        snap.forEach(d => timeline.push({ type: 'like', id: d.id, collection: collName, ...d.data() }));
                    });

                    const fetchTopics = (async () => {
                        const q = query(collection(db, "social_channels"), where("createdBy", "==", uid), limit(10));
                        const snap = await getDocs(q);
                        snap.forEach(d => timeline.push({ type: 'topic', id: d.id, collection: 'social_channels', ...d.data() }));
                    })();

                    // We use Promise.all to fetch everything at the same time (faster)
                    await Promise.all([...fetchPosts, ...fetchLikes, fetchTopics]);

                    // Sort by newest first
                    timeline.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                    renderTimeline(timeline);
                } catch (err) {
                    console.error("Timeline error:", err);
                    feedContainer.innerHTML = `<p style="text-align:center; color:var(--red);">Error loading activity feed.</p>`;
                }
            }

            function renderTimeline(items) {
                feedContainer.innerHTML = '';
                if (items.length === 0) {
                    feedContainer.innerHTML = `<div class="empty-state"><i class="far fa-folder-open"></i><p>${ui.empty}</p></div>`;
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'activity-card';

                    const date = item.timestamp ? new Date(item.timestamp.toDate()).toLocaleDateString(lang, { month: 'short', day: 'numeric' }) : 'Recently';
                    
                    let iconClass = "icon-post";
                    let iconInner = "fa-pen";
                    let label = ui.post;
                    let link = item.wayId === 'general' ? '/social.html' : `/topic.html?id=${item.wayId || item.id}`;

                    if (item.type === 'like') { iconClass = "icon-like"; iconInner = "fa-heart"; label = ui.like; }
                    if (item.type === 'topic') { iconClass = "icon-topic"; iconInner = "fa-hashtag"; label = ui.topic; link = `/topic.html?id=${item.id}`; }

                    card.innerHTML = `
                        <div class="activity-icon-wrap ${iconClass}">
                            <i class="fas ${iconInner}"></i>
                        </div>
                        <div class="activity-content">
                            <div class="activity-top">
                                <span class="activity-type">${label}</span>
                                <span class="activity-time">${date}</span>
                            </div>
                            <div class="activity-text">${item.text || item.name || item.description || ''}</div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <a href="${link}" class="activity-link">${ui.view} <i class="fas fa-arrow-right"></i></a>
                                ${item.type !== 'like' ? `<button class="btn-delete" onclick="window.deleteItem('${item.id}', '${item.collection}')"><i class="fas fa-trash-alt"></i></button>` : ''}
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(card);
                });
            }

            window.deleteItem = async (id, coll) => {
                const confirmed = await window.scoraliaConfirm(ui.del_confirm);
                if (confirmed) {
                    try {
                        await deleteDoc(doc(db, coll, id));
                        // Re-load to show updated list
                        loadActivity(auth.currentUser.uid);
                    } catch (e) {
                        console.error(e);
                    }
                }
            };
        }
        main();
    </script>
</body>
</html>
