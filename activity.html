<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_activity_title">My Activity — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://firebaseapp.com">
    <link rel="dns-prefetch" href="https://googleapis.com">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- Modulepreload for critical JS -->
    <link rel="modulepreload" href="/global.js">
    
    <!-- Preload critical fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome with integrity -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── AUTH REQUIRED SCREEN ── */
        .auth-required { display: none; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 68px); padding: 20px; text-align: center; }
        .auth-card { background: var(--white); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); max-width: 450px; width: 100%; animation: fadeUp 0.4s ease both; }
        .auth-icon { font-size: 3rem; color: var(--deep); margin-bottom: 20px; }
        .auth-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 15px; }
        .auth-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .btn-auth { background: var(--gold); color: var(--ink); border: none; padding: 12px 30px; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(200, 169, 110, 0.4); }

        /* ── MAIN LAYOUT ── */
        .activity-layout { display: none; max-width: 800px; margin: 30px auto; padding: 0 20px; width: 100%; }
        
        /* ── ACTIVITY HEADER ── */
        .activity-header { background: var(--white); border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); border: var(--border); margin-bottom: 25px; display: flex; align-items: center; gap: 20px; }
        .activity-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); background: #eee; }
        .activity-info h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 5px; }
        .activity-stats { display: flex; gap: 20px; margin-top: 10px; }
        .activity-stat { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .activity-stat i { color: var(--gold); }
        .activity-stat strong { color: var(--ink); }

        /* ── FILTER TABS ── */
        .activity-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .activity-tab { flex-shrink: 0; padding: 10px 20px; background: var(--white); border: var(--border); border-radius: 25px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .activity-tab:hover { background: #f1f5f9; color: var(--deep); }
        .activity-tab.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .activity-tab i { margin-right: 6px; }

        /* ── ACTIVITY FEED ── */
        .activity-feed { display: flex; flex-direction: column; gap: 16px; }
        
        .activity-card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.3s ease both; }
        .activity-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .activity-card-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #eee; border: 2px solid var(--off-white); }
        .activity-card-meta { flex-grow: 1; }
        .activity-card-author { font-weight: 700; color: var(--ink); font-size: 0.95rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .activity-card-time { font-size: 0.75rem; color: var(--text-muted); }
        .activity-type-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .activity-type-badge.post { background: #e3f2fd; color: #1976d2; }
        .activity-type-badge.comment { background: #f3e5f5; color: #7b1fa2; }
        .activity-type-badge.like { background: #ffebee; color: #c62828; }
        .activity-type-badge.topic { background: #e8f5e9; color: #388e3c; }
        .activity-type-badge i { font-size: 0.7rem; }

        .activity-content { font-size: 0.95rem; color: var(--text-main); line-height: 1.6; margin-bottom: 12px; }
        .activity-content a { color: var(--deep); text-decoration: none; font-weight: 600; }
        .activity-content a:hover { text-decoration: underline; }
        .activity-original-post { background: var(--off-white); border: 1px dashed #cbd5e1; border-radius: 12px; padding: 15px; margin-top: 12px; }
        .activity-original-post p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
        .activity-original-text { font-style: italic; color: var(--text-main); }
        .activity-image-preview { max-width: 150px; max-height: 150px; border-radius: 8px; margin-top: 8px; display: block; cursor: pointer; border: 1px solid #e2e8f0; }
        
        .activity-footer { display: flex; align-items: center; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .activity-action { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .activity-action:hover { color: var(--deep); }
        .activity-action i { font-size: 0.9rem; }
        .activity-action.liked { color: var(--red); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 20px; }
        .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--ink); margin-bottom: 10px; }
        .empty-state p { font-size: 0.95rem; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 767px) {
            .activity-header { flex-direction: column; text-align: center; }
            .activity-stats { justify-content: center; }
            .activity-tabs { padding: 10px 0; }
            .activity-tab { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- Auth Required Screen -->
    <div class="auth-required" id="auth-required">
        <div class="auth-card">
            <i class="fas fa-user-lock auth-icon"></i>
            <h2 class="auth-title" data-i18n="auth_required_title">Sign In Required</h2>
            <p class="auth-desc" data-i18n="auth_required_desc">Please sign in to view your activity feed.</p>
            <a href="/login.html" class="btn-auth" data-i18n="btn_signin">Sign In</a>
        </div>
    </div>

    <!-- Main Activity Layout -->
    <div class="activity-layout" id="activity-layout">
        <!-- User Header -->
        <div class="activity-header">
            <img src="" alt="Profile" class="activity-avatar" id="user-avatar">
            <div class="activity-info">
                <h1 id="user-name">User</h1>
                <div class="activity-stats">
                    <div class="activity-stat"><i class="fas fa-pen"></i> <strong id="stat-posts">0</strong> <span data-i18n="stat_posts">Posts</span></div>
                    <div class="activity-stat"><i class="fas fa-comment"></i> <strong id="stat-comments">0</strong> <span data-i18n="stat_comments">Comments</span></div>
                    <div class="activity-stat"><i class="fas fa-heart"></i> <strong id="stat-likes">0</strong> <span data-i18n="stat_likes">Likes Given</span></div>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="activity-tabs">
            <div class="activity-tab active" data-filter="all"><i class="fas fa-stream"></i> <span data-i18n="filter_all">All</span></div>
            <div class="activity-tab" data-filter="post"><i class="fas fa-pen"></i> <span data-i18n="filter_posts">Posts</span></div>
            <div class="activity-tab" data-filter="comment"><i class="fas fa-comment"></i> <span data-i18n="filter_comments">Comments</span></div>
            <div class="activity-tab" data-filter="like"><i class="fas fa-heart"></i> <span data-i18n="filter_likes">Likes</span></div>
            <div class="activity-tab" data-filter="topic"><i class="fas fa-folder"></i> <span data-i18n="filter_topics">Topics</span></div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-feed" id="activity-feed">
            <div class="loader-msg" style="text-align:center; padding: 40px; color: var(--text-muted);">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 15px;" data-i18n="loading_activity">Loading your activity...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, orderBy, limit, getDocs, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        const auth = getAuth();
        const db = getFirestore();
        let currentUser = null;
        let currentFilter = 'all';
        let allActivities = [];

        // Wait for global.js to initialize
        setTimeout(init, 500);

        function init() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('auth-required').style.display = 'none';
                    document.getElementById('activity-layout').style.display = 'block';
                    await loadUserData(user.uid);
                    await loadActivities(user.uid);
                } else {
                    document.getElementById('auth-required').style.display = 'flex';
                    document.getElementById('activity-layout').style.display = 'none';
                }
            });

            // Tab filters
            document.querySelectorAll('.activity-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.activity-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderFeed();
                });
            });
        }

        async function loadUserData(uid) {
            try {
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('user-name').textContent = data.displayName || 'User';
                    let avatarUrl = data.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${uid}&backgroundColor=EBF2FA`;
                    if (avatarUrl.includes("googleusercontent.com") || avatarUrl.includes("live.com")) {
                        avatarUrl = `https://api.dicebear.com/7.x/identicon/svg?seed=${uid}&backgroundColor=EBF2FA`;
                    }
                    document.getElementById('user-avatar').src = avatarUrl;
                }
            } catch (e) {
                console.error("Error loading user data:", e);
            }
        }

        async function loadActivities(uid) {
            try {
                const activities = [];
                
                // Load posts from global feed
                const postsGlobalQ = query(collection(db, "social_posts_global"), where("authorUid", "==", uid), orderBy("timestamp", "desc"), limit(50));
                const postsGlobalSnap = await getDocs(postsGlobalQ);
                postsGlobalSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    activities.push({
                        type: 'post',
                        timestamp: data.timestamp,
                        authorUid: uid,
                        authorName: data.authorName,
                        authorPhoto: data.authorPhoto,
                        content: data.text,
                        imageUrl: data.imageUrl,
                        attachedListing: data.attachedListing,
                        postId: docSnap.id,
                        collection: 'social_posts_global',
                        schoolName: data.schoolName
                    });
                });

                // Load posts from school feed if student
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists() && userSnap.data().isStudent) {
                    const postsSchoolQ = query(collection(db, "social_posts_rosemont"), where("authorUid", "==", uid), orderBy("timestamp", "desc"), limit(50));
                    const postsSchoolSnap = await getDocs(postsSchoolQ);
                    postsSchoolSnap.forEach(docSnap => {
                        const data = docSnap.data();
                        activities.push({
                            type: 'post',
                            timestamp: data.timestamp,
                            authorUid: uid,
                            authorName: data.authorName,
                            authorPhoto: data.authorPhoto,
                            content: data.text,
                            imageUrl: data.imageUrl,
                            attachedListing: data.attachedListing,
                            postId: docSnap.id,
                            collection: 'social_posts_rosemont',
                            schoolName: data.schoolName
                        });
                    });
                }

                // Load topics created by user
                const topicsQ = query(collection(db, "social_channels"), where("createdBy", "==", uid), orderBy("timestamp", "desc"), limit(50));
                const topicsSnap = await getDocs(topicsQ);
                topicsSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    activities.push({
                        type: 'topic',
                        timestamp: data.timestamp,
                        topicName: data.name,
                        topicId: docSnap.id,
                        description: data.description
                    });
                });

                // Load comments (need to iterate through posts - this is a limitation, we'll sample recent posts)
                const recentPostsQ = query(collection(db, "social_posts_global"), orderBy("timestamp", "desc"), limit(100));
                const recentPostsSnap = await getDocs(recentPostsQ);
                for (const postDoc of recentPostsSnap.docs) {
                    const commentsQ = query(collection(db, "social_posts_global", postDoc.id, "comments"), where("authorUid", "==", uid), orderBy("timestamp", "desc"), limit(10));
                    const commentsSnap = await getDocs(commentsQ);
                    commentsSnap.forEach(commentDoc => {
                        const cData = commentDoc.data();
                        activities.push({
                            type: 'comment',
                            timestamp: cData.timestamp,
                            authorUid: uid,
                            authorName: cData.authorName,
                            authorPhoto: cData.authorPhoto,
                            content: cData.text,
                            imageUrl: cData.imageUrl,
                            commentId: commentDoc.id,
                            postId: postDoc.id,
                            postText: postDoc.data().text,
                            collection: 'social_posts_global'
                        });
                    });
                }

                // Load likes (sample recent posts)
                const likedPostsQ = query(collection(db, "social_posts_global"), orderBy("timestamp", "desc"), limit(100));
                const likedPostsSnap = await getDocs(likedPostsQ);
                likedPostsSnap.forEach(postDoc => {
                    const pData = postDoc.data();
                    if (pData.likedBy && pData.likedBy.includes(uid)) {
                        activities.push({
                            type: 'like',
                            timestamp: pData.timestamp,
                            authorUid: pData.authorUid,
                            authorName: pData.authorName,
                            authorPhoto: pData.authorPhoto,
                            postText: pData.text,
                            postId: postDoc.id,
                            collection: 'social_posts_global'
                        });
                    }
                });

                // Sort all activities by timestamp
                activities.sort((a, b) => {
                    const timeA = a.timestamp ? (a.timestamp.toDate ? a.timestamp.toDate().getTime() : new Date(a.timestamp).getTime()) : 0;
                    const timeB = b.timestamp ? (b.timestamp.toDate ? b.timestamp.toDate().getTime() : new Date(b.timestamp).getTime()) : 0;
                    return timeB - timeA;
                });

                allActivities = activities;
                updateStats(activities);
                renderFeed();
            } catch (e) {
                console.error("Error loading activities:", e);
                document.getElementById('activity-feed').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3 data-i18n="error_loading">Error Loading Activity</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            }
        }

        function updateStats(activities) {
            const posts = activities.filter(a => a.type === 'post').length;
            const comments = activities.filter(a => a.type === 'comment').length;
            const likes = activities.filter(a => a.type === 'like').length;
            
            document.getElementById('stat-posts').textContent = posts;
            document.getElementById('stat-comments').textContent = comments;
            document.getElementById('stat-likes').textContent = likes;
        }

        function renderFeed() {
            const feedContainer = document.getElementById('activity-feed');
            const filtered = currentFilter === 'all' 
                ? allActivities 
                : allActivities.filter(a => a.type === currentFilter);

            if (filtered.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <h3 data-i18n="no_activity_yet">No Activity Yet</h3>
                        <p data-i18n="no_activity_desc">Start posting, commenting, or liking to see your activity here!</p>
                    </div>
                `;
                return;
            }

            feedContainer.innerHTML = '';
            filtered.forEach(activity => {
                const card = createActivityCard(activity);
                if (card) feedContainer.appendChild(card);
            });
        }

        function createActivityCard(activity) {
            const card = document.createElement('div');
            card.className = 'activity-card';

            let avatarUrl = activity.authorPhoto || `https://api.dicebear.com/7.x/identicon/svg?seed=${activity.authorUid}&backgroundColor=EBF2FA`;
            if (avatarUrl && (avatarUrl.includes("googleusercontent.com") || avatarUrl.includes("live.com"))) {
                avatarUrl = `https://api.dicebear.com/7.x/identicon/svg?seed=${activity.authorUid}&backgroundColor=EBF2FA`;
            }

            const timeStr = formatTime(activity.timestamp);
            const typeLabel = getTypeLabel(activity.type);
            const typeIcon = getTypeIcon(activity.type);

            let contentHtml = '';
            
            switch (activity.type) {
                case 'post':
                    contentHtml = `
                        <div class="activity-type-badge post"><i class="fas fa-pen"></i> ${typeLabel}</div>
                        <div class="activity-content">${escapeHtml(activity.content || '')}</div>
                        ${activity.imageUrl ? `<img src="${window.optimizeImageUrl ? window.optimizeImageUrl(activity.imageUrl) : activity.imageUrl}" class="activity-image-preview" onclick="window.open('${activity.imageUrl}', '_blank')">` : ''}
                        ${activity.attachedListing ? `
                            <div class="activity-original-post">
                                <p><i class="fas fa-link"></i> Attached Listing</p>
                                <a href="/listing.html?id=${activity.attachedListing.id}">${escapeHtml(activity.attachedListing.title)} - $${activity.attachedListing.price}</a>
                            </div>
                        ` : ''}
                        <div class="activity-footer">
                            <a href="/social.html" class="activity-action"><i class="fas fa-external-link-alt"></i> View Post</a>
                        </div>
                    `;
                    break;

                case 'comment':
                    contentHtml = `
                        <div class="activity-type-badge comment"><i class="fas fa-comment"></i> ${typeLabel}</div>
                        <div class="activity-content">${escapeHtml(activity.content || '')}</div>
                        ${activity.imageUrl ? `<img src="${window.optimizeImageUrl ? window.optimizeImageUrl(activity.imageUrl) : activity.imageUrl}" class="activity-image-preview">` : ''}
                        <div class="activity-original-post">
                            <p><i class="fas fa-quote-left"></i> On post:</p>
                            <p class="activity-original-text">"${escapeHtml(activity.postText || '').substring(0, 150)}${activity.postText && activity.postText.length > 150 ? '...' : ''}"</p>
                        </div>
                        <div class="activity-footer">
                            <a href="/social.html" class="activity-action"><i class="fas fa-external-link-alt"></i> View Context</a>
                        </div>
                    `;
                    break;

                case 'like':
                    contentHtml = `
                        <div class="activity-type-badge like"><i class="fas fa-heart"></i> ${typeLabel}</div>
                        <div class="activity-content">
                            You liked <strong>${escapeHtml(activity.authorName || 'a post')}</strong>'s post
                        </div>
                        <div class="activity-original-post">
                            <p class="activity-original-text">"${escapeHtml(activity.postText || '').substring(0, 150)}${activity.postText && activity.postText.length > 150 ? '...' : ''}"</p>
                        </div>
                        <div class="activity-footer">
                            <a href="/social.html" class="activity-action"><i class="fas fa-external-link-alt"></i> View Post</a>
                        </div>
                    `;
                    break;

                case 'topic':
                    contentHtml = `
                        <div class="activity-type-badge topic"><i class="fas fa-folder"></i> ${typeLabel}</div>
                        <div class="activity-content">
                            Created topic: <a href="/topic.html?id=${activity.topicId}">${escapeHtml(activity.topicName || 'Untitled')}</a>
                        </div>
                        ${activity.description ? `<p style="color: var(--text-muted); font-size: 0.9rem;">${escapeHtml(activity.description)}</p>` : ''}
                        <div class="activity-footer">
                            <a href="/topic.html?id=${activity.topicId}" class="activity-action"><i class="fas fa-external-link-alt"></i> View Topic</a>
                        </div>
                    `;
                    break;
            }

            card.innerHTML = `
                <div class="activity-card-header">
                    <img src="${avatarUrl}" class="activity-card-avatar" alt="Avatar">
                    <div class="activity-card-meta">
                        <div class="activity-card-author">${escapeHtml(activity.authorName || 'Unknown')}</div>
                        <div class="activity-card-time">${timeStr}</div>
                    </div>
                </div>
                ${contentHtml}
            `;

            return card;
        }

        function getTypeLabel(type) {
            const labels = {
                'post': document.querySelector('[data-i18n="label_post"]')?.textContent || 'New Post',
                'comment': document.querySelector('[data-i18n="label_comment"]')?.textContent || 'Comment',
                'like': document.querySelector('[data-i18n="label_like"]')?.textContent || 'Liked',
                'topic': document.querySelector('[data-i18n="label_topic"]')?.textContent || 'Topic Created'
            };
            return labels[type] || type;
        }

        function getTypeIcon(type) {
            const icons = {
                'post': 'fa-pen',
                'comment': 'fa-comment',
                'like': 'fa-heart',
                'topic': 'fa-folder'
            };
            return icons[type] || 'fa-star';
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const diff = Math.round((new Date() - date) / 60000);
            const lang = localStorage.getItem('preferred_language') || 'en';
            
            if (diff < 60) return lang === 'fr' ? `Il y a ${diff} min` : `${diff}m ago`;
            if (diff < 1440) return lang === 'fr' ? `${Math.round(diff/60)} h` : `${Math.round(diff/60)}h ago`;
            if (diff < 10080) return lang === 'fr' ? `${Math.round(diff/1440)} j` : `${Math.round(diff/1440)}d ago`;
            
            return lang === 'fr' 
                ? date.toLocaleDateString('fr-CA', { month: 'short', day: 'numeric' })
                : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Expose optimizeImageUrl if not already available
        if (!window.optimizeImageUrl) {
            window.optimizeImageUrl = (url) => {
                if (!url) return url;
                if (url.includes('cloudinary.com') && url.includes('/upload/')) {
                    if (!url.includes('f_auto') && !url.includes('q_auto')) {
                        return url.replace('/upload/', '/upload/f_auto,q_auto/');
                    }
                }
                return url;
            };
        }
    </script>
</body>
</html>
