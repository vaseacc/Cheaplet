<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item - Scoralia</title>
    <script type="module" src="global.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- AI Safety Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --gold:      #C8A96E;
            --red:       #C0392B;
            --radius-md: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #F4F7FC; color: #1a2a4a; line-height: 1.6; min-height: 100vh; padding-bottom: 180px; }

        header { position: sticky; top: 0; z-index: 200; background: rgba(12, 20, 70, 0.97); backdrop-filter: blur(12px); height: 68px; border-bottom: 1px solid rgba(179,205,224,0.15); }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 28px; height: 100%; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: white; text-decoration: none; }
        .logo em { color: var(--gold); font-style: normal; }

        .form-outer { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .form-wrapper { background: white; border-radius: var(--radius-md); padding: 30px; box-shadow: 0 4px 20px rgba(12,20,70,0.06); border: 1px solid #e2e8f0; }
        
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #eee; border-radius: 10px; font-family: inherit; font-size: 1rem; outline: none; }
        .btn-submit { background: var(--ink); color: white; border: none; padding: 14px; border-radius: 30px; width: 100%; font-weight: 800; cursor: pointer; }
        
        .image-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .image-preview-wrapper { position: relative; width: 80px; height: 80px; }
        .image-preview { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
        .remove-image-btn { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; z-index: 5; }

        #add-photo-label { border: 2px dashed #ddd; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #6b84a3; }

        /* ── AI BOX ── */
        .ai-box { margin-top: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; display: none; }
        .ai-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        .ai-bar-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.3s; }
        .ai-msg { font-size: 0.8rem; font-weight: bold; color: var(--ink); text-align: center; }

        /* ── CONSOLE ── */
        #scoralia-console { position: fixed; bottom: 0; left: 0; width: 100%; height: 160px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; overflow-y: auto; z-index: 10000; border-top: 2px solid var(--gold); }
        .copy-log-btn { position: absolute; top: 10px; right: 10px; background: var(--gold); color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 10001; }
    </style>
</head>
<body>

    <div id="scoralia-console">
        <button class="copy-log-btn" id="btn-copy-logs">COPY LOGS</button>
        --- Scoralia Boot Sequence ---<br>
    </div>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="form-outer">
        <div class="form-wrapper">
            <h1 style="margin-bottom: 20px; font-family: 'Playfair Display';">Post a Book</h1>
            <form id="listing-form">
                <input type="text" id="listing-title" placeholder="Book Title" required>
                <textarea id="listing-description" placeholder="Description..."></textarea>
                <input type="number" id="listing-price" placeholder="Price ($)">

                <div class="image-preview-grid" id="image-preview-container"></div>
                <label for="listing-image-input" id="add-photo-label">
                    <i class="fas fa-camera fa-2x"></i>
                    <span id="ai-btn-text">Add Photo</span>
                </label>
                <input type="file" id="listing-image-input" accept="image/*" style="display:none;">

                <!-- AI PROGRESS UI -->
                <div class="ai-box" id="ai-box">
                    <div class="ai-msg" id="ai-msg">Downloading Security AI...</div>
                    <div class="ai-bar-bg"><div class="ai-bar-fill" id="ai-bar"></div></div>
                </div>

                <button type="submit" class="btn-submit" id="postListingBtn" style="margin-top:20px;">Post Item</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        const logEl = document.getElementById('scoralia-console');
        function sysLog(txt, color="#0f0") {
            const div = document.createElement('div');
            div.style.color = color;
            div.innerHTML = `> ${txt}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('btn-copy-logs').onclick = () => {
            const text = logEl.innerText.replace("COPY LOGS", "");
            navigator.clipboard.writeText(text);
            alert("Logs copied!");
        };

        // --- AI LOGIC (THE "NEVER FAIL" VERSION) ---
        let nsfwModel = null;
        let isModelLoading = true;
        const aiBox = document.getElementById('ai-box');
        const aiBar = document.getElementById('ai-bar');
        const aiMsg = document.getElementById('ai-msg');

        async function initAI() {
            // Show progress bar immediately
            aiBox.style.display = 'block';
            aiBar.style.width = '10%';
            
            const models = [
                "https://nsfwjs-models.s3.amazonaws.com/mobilenet_v2/", // Official S3
                "https://cdn.jsdelivr.net/gh/infinitered/nsfwjs@master/models/mobilenet_v2/" // JSDelivr Github Proxy
            ];

            for (let baseUrl of models) {
                try {
                    sysLog(`Connecting to AI Shield: ${baseUrl}...`);
                    // nsfwjs.load handles the shards internally
                    nsfwModel = await nsfwjs.load(baseUrl, { type: 'graph' });
                    
                    sysLog("AI Shield Synchronized. ✅", "#00ff00");
                    isModelLoading = false;
                    aiBar.style.width = '100%';
                    setTimeout(() => { aiBox.style.display = 'none'; }, 1000);
                    return; 
                } catch (err) {
                    sysLog(`Connection Failed: ${err.message}`, "orange");
                }
            }

            sysLog("CRITICAL: All AI Nodes unreachable. Using local backup.", "red");
            try {
                nsfwModel = await nsfwjs.load();
                isModelLoading = false;
                aiBox.style.display = 'none';
            } catch(e) {
                sysLog("SECURITY SYSTEM OFFLINE.", "red");
                isModelLoading = false;
            }
        }
        initAI();

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            let selectedFiles = [];
            const imageInput = document.getElementById('listing-image-input');
            const previewContainer = document.getElementById('image-preview-container');

            function renderPreviews() {
                previewContainer.innerHTML = '';
                selectedFiles.forEach((f, i) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'image-preview-wrapper';
                    wrap.innerHTML = `<img class="image-preview" src="${URL.createObjectURL(f)}"><button class="remove-image-btn" type="button" onclick="window.removeFile(${i})">&times;</button>`;
                    previewContainer.appendChild(wrap);
                });
            }
            window.removeFile = (i) => { selectedFiles.splice(i,1); renderPreviews(); };

            imageInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (isModelLoading) {
                    alert("Scoralia Security: AI is still downloading. Please wait a few seconds.");
                    return;
                }

                aiBox.style.display = 'block';
                aiMsg.textContent = "Scanning Image Pixels...";
                aiBar.style.width = "40%";

                try {
                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    
                    const isSafe = await new Promise((resolve) => {
                        img.onload = async () => {
                            aiBar.style.width = "80%";
                            const predictions = await nsfwModel.classify(img);
                            URL.revokeObjectURL(img.src);
                            
                            const top = predictions[0];
                            sysLog(`AI Report: ${top.className} (${(top.probability*100).toFixed(0)}%)`);
                            
                            // Block Porn/Hentai if over 60% confidence
                            const nsfw = predictions.find(p => (p.className === 'Porn' || p.className === 'Hentai') && p.probability > 0.60);
                            resolve(!nsfw);
                        };
                        img.onerror = () => resolve(true);
                    });

                    if (!isSafe) {
                        sysLog("RESTRICTED CONTENT DETECTED. BLOCKING. 🛑", "red");
                        alert("Scoralia Security: This image violates community guidelines.");
                    } else {
                        aiBar.style.width = "100%";
                        sysLog("AI: Image Safe. ✅");
                        selectedFiles.push(file);
                        renderPreviews();
                    }
                } catch (err) {
                    sysLog(`AI Scan Error: ${err.message}`, "orange");
                    selectedFiles.push(file); renderPreviews(); // Fail open for UX
                } finally {
                    setTimeout(() => { aiBox.style.display = 'none'; aiBar.style.width = "0%"; }, 1000);
                    imageInput.value = '';
                }
            };
        }
        main();
    </script>
</body>
</html>
