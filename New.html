<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item - Scoralia</title>
    <script type="module" src="global.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- AI Safety Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --mist:      #B3CDE0;
            --white:     #FFFFFF;
            --off-white: #F4F7FC;
            --surface:   #EBF2FA;
            --text-body: #1a2a4a;
            --text-muted:#6b84a3;
            --gold:      #C8A96E;
            --green:     #2E7D5E;
            --red:       #C0392B;
            --radius-sm: 8px;
            --radius-md: 16px;
            --shadow-sm: 0 2px 12px rgba(12,20,70,0.08);
            --shadow-md: 0 8px 32px rgba(12,20,70,0.13);
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body:    'DM Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--off-white); color: var(--text-body); line-height: 1.6; min-height: 100vh; padding-bottom: 160px; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #page-loader { position: fixed; inset: 0; background: var(--ink); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 14px; }
        #page-loader .loader-logo { font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; color: var(--white); }
        #page-loader .loader-logo em { color: var(--gold); font-style: normal; }

        header { position: sticky; top: 0; z-index: 200; background: rgba(12, 20, 70, 0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(179,205,224,0.15); height: 68px; }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 28px; height: 100%; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; color: var(--white); text-decoration: none; }
        .logo em { color: var(--gold); font-style: normal; }

        .form-outer { max-width: 660px; margin: 36px auto; padding: 0 20px; }
        .form-wrapper { background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid rgba(179,205,224,0.3); padding: 30px; }
        
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #eee; border-radius: 10px; font-family: inherit; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--deep); }

        .btn-submit { background: var(--ink); color: white; border: none; padding: 14px; border-radius: 30px; width: 100%; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .image-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        .image-preview-wrapper { position: relative; width: 80px; height: 80px; }
        .image-preview { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
        .remove-image-btn { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; }

        #add-photo-label { border: 2px dashed #ddd; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--text-muted); }

        /* ── AI PROGRESS BAR ── */
        .ai-box { margin-top: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; display: none; }
        .ai-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .ai-bar-fill { width: 0%; height: 100%; background: var(--gold); transition: width 0.4s; }
        .ai-msg { font-size: 0.8rem; font-weight: bold; color: var(--ink); text-align: center; }

        /* ── ON-SCREEN DEBUGGER ── */
        #scoralia-console { position: fixed; bottom: 0; left: 0; width: 100%; height: 120px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; overflow-y: auto; z-index: 10000; border-top: 2px solid var(--gold); }

        @media (max-width: 600px) { .form-wrapper { padding: 20px; } }
    </style>
</head>
<body>

    <div id="page-loader">
        <div class="loader-logo">Scor<em>alia</em></div>
    </div>

    <div id="scoralia-console">--- Scoralia Boot Sequence ---<br></div>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="form-outer">
        <div class="form-wrapper">
            <h1 style="margin-bottom: 20px; font-family: var(--font-display);">Post a Book</h1>
            <form id="listing-form">
                <input type="text" id="listing-title" placeholder="Book Title" required>
                <textarea id="listing-description" placeholder="Describe the condition..."></textarea>
                <input type="number" id="listing-price" placeholder="Price ($)">
                <select id="listing-condition">
                    <option value="New">New</option>
                    <option value="Good">Good</option>
                    <option value="Used">Used</option>
                </select>

                <div class="image-preview-grid" id="image-preview-container"></div>
                <label for="listing-image-input" id="add-photo-label">
                    <i class="fas fa-camera fa-2x"></i>
                    <span id="ai-btn-text">Add Photo</span>
                </label>
                <input type="file" id="listing-image-input" accept="image/*" style="display:none;">

                <!-- AI PROGRESS -->
                <div class="ai-box" id="ai-box">
                    <div class="ai-msg" id="ai-msg">Initializing Security AI...</div>
                    <div class="ai-bar-bg"><div class="ai-bar-fill" id="ai-bar"></div></div>
                </div>

                <button type="submit" class="btn-submit" id="postListingBtn" style="margin-top:20px;">Post Item</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        const logEl = document.getElementById('scoralia-console');
        function sysLog(txt, color="#0f0") {
            const div = document.createElement('div');
            div.style.color = color;
            div.innerHTML = `> ${txt}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // --- AI LOGIC (ROBUST VERSION) ---
        let nsfwModel = null;
        const aiBox = document.getElementById('ai-box');
        const aiBar = document.getElementById('ai-bar');
        const aiMsg = document.getElementById('ai-msg');

        async function initAI() {
            try {
                sysLog("Fetching AI Model from mirror...");
                // Explicitly loading from unpkg to avoid "Failed to fetch" on default S3 buckets
                nsfwModel = await nsfwjs.load('https://unpkg.com/nsfwjs@2.4.1/models/mobilenet_v2/', { type: 'graph' });
                sysLog("AI Security Online. System Protected. ✅");
            } catch (err) {
                sysLog(`AI FAIL: ${err.message}`, "red");
                sysLog("Attempting local fallback...", "yellow");
                try {
                    nsfwModel = await nsfwjs.load(); // Default fallback
                    sysLog("AI Online (Fallback Mode).");
                } catch(e) { sysLog("AI Offline. Security disabled.", "red"); }
            }
        }
        initAI();

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            document.getElementById('page-loader').style.display = 'none';

            let selectedFiles = [];
            const imageInput = document.getElementById('listing-image-input');
            const previewContainer = document.getElementById('image-preview-container');

            function renderPreviews() {
                previewContainer.innerHTML = '';
                selectedFiles.forEach((file, index) => {
                    const wrap = document.createElement('div'); wrap.className = 'image-preview-wrapper';
                    wrap.innerHTML = `<img class="image-preview" src="${URL.createObjectURL(file)}"><button class="remove-image-btn" type="button" onclick="window.removeFile(${index})">&times;</button>`;
                    previewContainer.appendChild(wrap);
                });
            }
            window.removeFile = (i) => { selectedFiles.splice(i,1); renderPreviews(); };

            imageInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!nsfwModel) {
                    alert("Security system is still loading. Please wait 5 seconds and try again.");
                    return;
                }

                aiBox.style.display = 'block';
                aiMsg.textContent = "Scanning Pixels...";
                aiBar.style.width = "20%";

                try {
                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    
                    const isSafe = await new Promise((resolve) => {
                        img.onload = async () => {
                            aiBar.style.width = "60%";
                            const predictions = await nsfwModel.classify(img);
                            URL.revokeObjectURL(img.src);
                            
                            // Check for Porn or Hentai (Confidence > 60%)
                            const nsfw = predictions.find(p => (p.className === 'Porn' || p.className === 'Hentai') && p.probability > 0.60);
                            
                            sysLog(`Scan Result: ${predictions[0].className} (${(predictions[0].probability*100).toFixed(0)}%)`);
                            resolve(!nsfw);
                        };
                        img.onerror = () => { resolve(true); }; // fallback if image is weird
                    });

                    if (!isSafe) {
                        sysLog("SECURITY ALERT: NSFW Content Blocked! 🛑", "red");
                        alert("Scoralia Security: This image violates our guidelines and cannot be posted.");
                        // Log attempt to database for banning
                        await addDoc(collection(db, "reports"), { 
                            reporterName: "AI_GUARD", reason: "NSFW Attempt", 
                            targetUid: auth.currentUser?.uid || "guest", 
                            details: `Blocked file: ${file.name}`, timestamp: serverTimestamp() 
                        });
                    } else {
                        aiBar.style.width = "100%";
                        sysLog("AI: Image Clean. ✅");
                        selectedFiles.push(file);
                        renderPreviews();
                    }
                } catch (err) {
                    sysLog(`ERROR during scan: ${err.message}`, "red");
                    // If AI crashes, we let it pass but log the error
                    selectedFiles.push(file);
                    renderPreviews();
                } finally {
                    setTimeout(() => { aiBox.style.display = 'none'; aiBar.style.width = "0%"; }, 1000);
                    imageInput.value = '';
                }
            };

            document.getElementById('listing-form').onsubmit = async (e) => {
                e.preventDefault();
                if (selectedFiles.length === 0) { alert("Add a photo!"); return; }
                
                const btn = document.getElementById('postListingBtn');
                btn.disabled = true;
                btn.textContent = "Uploading...";

                try {
                    // Logic to upload to Cloudinary and save to Firestore...
                    // (Skipping for brevity, use your existing upload logic here)
                    sysLog("Uploading metadata to Scoralia...");
                    alert("Success! Book posted.");
                    window.location.href = '/index.html';
                } catch (err) {
                    alert(err.message);
                    btn.disabled = false;
                    btn.textContent = "Post Item";
                }
            };
        }
        main();
    </script>
</body>
</html>
