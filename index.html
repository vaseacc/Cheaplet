<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🔥 SECURITY & SEO TRUST SIGNALS (Tells Google you are a real, safe business) -->
    <meta name="description" content="Scoralia - The smartest campus marketplace. Buy and sell textbooks, find deals, and connect with students securely.">
    <meta name="theme-color" content="#0C1446">
    <meta property="og:title" content="Scoralia — Campus Hub">
    <meta property="og:description" content="Buy and sell used books for less. Join your campus community today.">
    <meta property="og:type" content="website">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <title>Campus Hub — Scoralia</title>
    
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; }

        /* ── HEADER ── */
        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── LAYOUT ── */
        .hub-layout { max-width: 1000px; margin: 30px auto; display: grid; grid-template-columns: 260px 1fr; gap: 40px; padding: 0 20px; align-items: start; }

        /* ── SIDEBAR (TOPICS) ── */
        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; }
        
        .school-header { margin-bottom: 10px; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
        .school-sub { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; }

        .topics-menu { display: flex; flex-direction: column; gap: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 10px; }
        
        .way-item { padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); transition: all 0.2s; font-size: 0.95rem; }
        .way-item:hover { background: #f1f5f9; color: var(--deep); }
        .way-item.active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); border: var(--border); font-weight: 700; }
        .way-item i { width: 20px; text-align: center; color: var(--text-muted); font-size: 1.1rem; }
        .way-item.active i { color: var(--gold); }
        
        .way-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); background: var(--off-white); padding: 2px 8px; border-radius: 12px; font-weight: 700; }

        .btn-new-way { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: 1.5px dashed #cbd5e1; border-radius: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-top: 10px; }
        .btn-new-way:hover { color: var(--deep); border-color: var(--deep); background: #f8fafc; }

        /* ── MOBILE WAYS BAR ── */
        .mobile-ways-bar { display: none; background: var(--white); border-bottom: var(--border); padding: 12px 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; position: sticky; top: 68px; z-index: 150; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 10px; cursor: pointer; border: var(--border); transition: 0.2s; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .m-way-count { opacity: 0.6; font-size: 0.75rem; margin-left: 4px; }

        /* ── FEED COLUMN ── */
        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); }
        .composer-top { display: flex; gap: 15px; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-input { flex-grow: 1; border: none; font-family: inherit; font-size: 1.1rem; color: var(--text-main); resize: none; outline: none; padding-top: 10px; min-height: 60px; background: transparent; }
        .composer-input::placeholder { color: #94a3b8; font-weight: 400; }
        .composer-bottom { display: flex; justify-content: flex-end; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 15px; margin-top: 10px; }
        
        /* ── BUTTONS ── */
        .btn-action { background: var(--gold); color: var(--ink); border: none; padding: 10px 28px; border-radius: 30px; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(200, 169, 110, 0.2); }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(200, 169, 110, 0.4); }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-ghost { background: #f1f5f9; color: var(--text-main); padding: 10px 28px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-ghost:hover { background: #e2e8f0; }

        /* ── SOCIAL POST CARD ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; }
        .post-header { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; }
        .post-meta { display: flex; flex-direction: column; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.3px; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; word-wrap: break-word; }
        
        .post-actions { display: flex; gap: 25px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .action-btn:hover { color: var(--deep); }
        .action-btn.liked { color: #e53e3e; }
        .action-btn.liked i { animation: popHeart 0.3s ease; }

        @keyframes popHeart { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* ── MARKETPLACE BREAK ── */
        .market-break { margin: 10px 0; padding: 25px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); }
        .break-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .break-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 8px; }
        .break-link { color: var(--deep); font-size: 0.85rem; font-weight: 700; text-decoration: none; }
        .break-link:hover { text-decoration: underline; }
        
        .break-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .break-scroll::-webkit-scrollbar { display: none; }
        
        .mini-book-card { flex: 0 0 160px; background: var(--white); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--text-main); scroll-snap-align: start; border: var(--border); transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
        .mini-book-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
        .mini-img { height: 130px; background-size: cover; background-position: center; background-color: #f1f5f9; }
        .mini-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .mini-price { font-weight: 800; font-size: 1rem; color: var(--deep); margin-bottom: 4px; }
        .mini-title { font-size: 0.8rem; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.1rem; font-weight: 500; }
        .loader-msg i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ── CUSTOM MODAL ── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.8); backdrop-filter: blur(4px); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal-card { background: var(--white); padding: 30px; border-radius: var(--radius); width: 90%; max-width: 400px; box-shadow: var(--shadow); animation: fadeUp 0.3s ease; }
        .modal-card h2 { color: var(--ink); margin-bottom: 10px; font-family: 'Playfair Display', serif; }
        .modal-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
        .modal-card input { width: 100%; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; font-family: inherit; font-size: 1rem; outline: none; transition: 0.2s; }
        .modal-card input:focus { border-color: var(--deep); box-shadow: 0 0 0 3px rgba(43,92,146,0.1); }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }

        /* ── MOBILE OPTIMIZATIONS ── */
        @media (max-width: 850px) {
            .hub-layout { grid-template-columns: 1fr; padding: 0; gap: 0; margin-top: 0; }
            .sidebar { display: none; }
            .mobile-ways-bar { display: block; }
            .feed-column { gap: 8px; padding: 8px 0 60px; background: var(--off-white); }
            .composer { padding: 15px; margin-bottom: 0; border-radius: 0; border-left: none; border-right: none; border-top: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
            .composer-input { font-size: 1rem; min-height: 40px; }
            .post-card { padding: 16px 15px; border-radius: 0; border-left: none; border-right: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 0; }
            .post-header { margin-bottom: 12px; }
            .post-avatar { width: 40px; height: 40px; }
            .post-body { font-size: 0.95rem; line-height: 1.5; }
            .post-actions { margin-top: 15px; padding-top: 12px; }
            .market-break { padding: 20px 15px; margin: 0; border-radius: 0; border-left: none; border-right: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
            .break-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- MOBILE TOPICS BAR -->
    <div class="mobile-ways-bar" id="mobile-ways-list">
        <div class="m-way-pill active" id="m-way-general" onclick="window.selectWay('general')">
            <i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span>
        </div>
    </div>

    <div class="hub-layout">
        
        <!-- DESKTOP SIDEBAR -->
        <aside class="sidebar">
            <div class="school-header">
                <div class="school-name" id="d-user-school">Loading...</div>
                <div class="school-sub">Community Hub</div>
            </div>
            
            <div class="topics-menu">
                <div class="topic-section-title" data-i18n="topics_public">Public Channels</div>
                <div id="desktop-general-list">
                    <div class="way-item active" id="d-way-general" onclick="window.selectWay('general')">
                        <i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span>
                    </div>
                </div>

                <div class="topic-section-title" style="margin-top: 20px;" data-i18n="topics_custom">Custom Topics</div>
                <div id="desktop-ways-list"></div>
                <button class="btn-new-way" id="btn-create-way"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>
            </div>

            <!-- List Book Button in Sidebar -->
            <button class="btn-action" style="width:100%; margin-top:15px; background:var(--ink); color:white; justify-content:center;" onclick="window.location.href='/listanitem.html'" data-i18n="sell">List a Book</button>

            <!-- Mini Legal Footer -->
            <div style="padding: 10px; font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; margin-top: 10px;">
                <a href="/terms.html" style="color:inherit; text-decoration:none;">Terms</a> · 
                <a href="/privacy.html" style="color:inherit; text-decoration:none;">Privacy</a> · 
                <a href="/safety.html" style="color:inherit; text-decoration:none;">Safety</a><br>
                © 2026 Scoralia
            </div>
        </aside>

        <!-- MAIN FEED -->
        <main class="feed-column">
            
            <!-- COMPOSER -->
            <div class="composer" id="composer-card" style="display: none;">
                <div class="composer-top">
                    <!-- Added Alt Tag -->
                    <img src="" id="composer-pfp" class="composer-pfp" alt="Profile Picture">
                    <textarea class="composer-input" id="post-input" data-i18n-placeholder="post_placeholder" placeholder="What's happening on campus?"></textarea>
                </div>
                <div class="composer-bottom">
                    <button class="btn-action" id="btn-send-post" data-i18n="btn_post">Post</button>
                </div>
            </div>

            <!-- FEED CONTAINER -->
            <div id="feed-container">
                <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i> <br><span id="ui-loading" data-i18n="loading_hub">Loading campus hub...</span></div>
            </div>

        </main>
    </div>

    <!-- CUSTOM MODAL FOR NEW TOPIC -->
    <div class="modal-overlay" id="topic-modal">
        <div class="modal-card">
            <h2 data-i18n="modal_title">Create New Topic</h2>
            <p data-i18n="modal_desc">Enter a name for the new topic (e.g. Mathematics, Campus Events):</p>
            <input type="text" id="topic-name-input" maxlength="30" data-i18n-placeholder="modal_place" placeholder="Topic name...">
            <div class="modal-buttons">
                <button class="btn-ghost" id="btn-cancel-topic" data-i18n="btn_cancel">Cancel</button>
                <button class="btn-action" id="btn-confirm-topic" data-i18n="btn_create" style="background:var(--deep); color:white;">Create</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, limit, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        // 🔥 SECURITY: Sanitize database inputs before injecting them to avoid XSS flags
        const escapeHTML = (str) => String(str || '').replace(/[&<>'"]/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[match] || match);

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            // --- BILINGUAL UI ---
            const lang = localStorage.getItem('preferred_language') || 'en';
            const allStrings = {
                en: { 
                    topics_public: "Public Channels", topics_campus: "Campus Public", topics_custom: "Custom Topics", topics_new: "Create Topic",
                    post_placeholder: "What's happening on campus?", btn_post: "Post", loading_hub: "Loading campus hub...",
                    promptWay: "Enter a name for the new topic:", noPosts: "No posts yet. Be the first to share something!",
                    justNow: "Just now", suggest: "Campus Marketplace", browse: "Browse All →", guest: "Global Campus", sell: "List a Book",
                    modal_title: "Create New Topic", modal_desc: "Enter a name for the new topic (e.g. Study Groups, Tech):",
                    modal_place: "Topic name...", btn_cancel: "Cancel", btn_create: "Create", err_short: "Name too short."
                },
                fr: { 
                    topics_public: "Canaux Publics", topics_campus: "Campus Public", topics_custom: "Sujets Personnalisés", topics_new: "Nouveau Sujet",
                    post_placeholder: "Que se passe-t-il sur le campus ?", btn_post: "Publier", loading_hub: "Chargement du hub...",
                    promptWay: "Entrez un nom pour le nouveau sujet :", noPosts: "Aucune publication. Soyez le premier à partager !",
                    justNow: "À l'instant", suggest: "Marché du Campus", browse: "Voir tout →", guest: "Campus Global", sell: "Vendre un livre",
                    modal_title: "Créer un nouveau sujet", modal_desc: "Entrez un nom pour le sujet (ex: Groupes d'étude, Tech) :",
                    modal_place: "Nom du sujet...", btn_cancel: "Annuler", btn_create: "Créer", err_short: "Nom trop court."
                }
            };
            const ui = allStrings[lang] || allStrings['en'];

            // Apply translations safely
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (ui[key]) el.textContent = ui[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (ui[key]) el.placeholder = ui[key];
            });

            function formatCount(num) {
                if (!num) return 0;
                return num > 999 ? (num / 1000).toFixed(1) + 'k' : num;
            }

            let currentUser = null;
            let internalSchoolName = "Global Campus"; 
            let currentWayId = "general";
            let unsubscribePosts = null;
            let listings = []; 

            const dSchoolName = document.getElementById('d-user-school');
            const desktopWaysList = document.getElementById('desktop-ways-list');
            const mobileWaysList = document.getElementById('mobile-ways-list');
            const feedContainer = document.getElementById('feed-container');
            const postInput = document.getElementById('post-input');
            const btnSendPost = document.getElementById('btn-send-post');

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        currentUser = { ...user, ...data };
                        internalSchoolName = data.schoolName || "Global Campus";
                        
                        // Handle Display Translation
                        dSchoolName.textContent = internalSchoolName === "Global Campus" ? ui.guest : escapeHTML(internalSchoolName);
                        document.getElementById('composer-card').style.display = 'block';

                        let pfpUrl = data.photoURL;
                        if (!pfpUrl || pfpUrl.includes("googleusercontent") || pfpUrl.includes("live.com")) {
                            pfpUrl = `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=EBF2FA`;
                        }
                        document.getElementById('composer-pfp').src = escapeHTML(pfpUrl);
                        
                        loadTopics();
                        preloadBooksAndLoadFeed("general");
                    }
                } else {
                    // GUEST MODE
                    internalSchoolName = "Global Campus";
                    dSchoolName.textContent = ui.guest;
                    preloadBooksAndLoadFeed("general");
                }
            });

            // --- 1. LOAD TOPICS ---
            function loadTopics() {
                if (!currentUser) return;
                const q = query(collection(db, "social_channels"), where("schoolName", "==", internalSchoolName), orderBy("postCount", "desc"));
                onSnapshot(q, (snapshot) => {
                    desktopWaysList.innerHTML = '';
                    const mGeneral = document.getElementById('m-way-general');
                    mobileWaysList.innerHTML = '';
                    mobileWaysList.appendChild(mGeneral);

                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        
                        // Hide empty topics
                        if (d.postCount === 0 && docSnap.id !== currentWayId && d.createdBy !== currentUser.uid) {
                            return; 
                        }

                        const displayCount = formatCount(d.postCount);
                        const safeName = escapeHTML(d.name);
                        
                        const dItem = document.createElement('div');
                        dItem.className = `way-item ${currentWayId === docSnap.id ? 'active' : ''}`;
                        dItem.id = `d-way-${docSnap.id}`;
                        dItem.innerHTML = `<i class="fas fa-hashtag"></i> <span style="flex-grow:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${safeName}</span> <span class="way-count">${displayCount}</span>`;
                        dItem.onclick = () => window.selectWay(docSnap.id);
                        desktopWaysList.appendChild(dItem);

                        const mItem = document.createElement('div');
                        mItem.className = `m-way-pill ${currentWayId === docSnap.id ? 'active' : ''}`;
                        mItem.id = `m-way-${docSnap.id}`;
                        mItem.innerHTML = `<i class="fas fa-hashtag"></i> ${safeName} <span class="m-way-count">${displayCount}</span>`;
                        mItem.onclick = () => window.selectWay(docSnap.id);
                        mobileWaysList.appendChild(mItem);
                    });

                    const mNew = document.createElement('div');
                    mNew.className = 'm-way-pill';
                    mNew.innerHTML = `<i class="fas fa-plus"></i> ${ui.topics_new}`;
                    mNew.onclick = triggerNewWay;
                    mobileWaysList.appendChild(mNew);
                });
            }

            window.selectWay = (wayId) => {
                if (currentWayId !== 'general' && currentWayId !== wayId) {
                    const wayToClean = currentWayId;
                    getDoc(doc(db, "social_channels", wayToClean)).then(d => {
                        if (d.exists() && d.data().postCount === 0 && d.data().createdBy === currentUser?.uid) {
                            deleteDoc(doc(db, "social_channels", wayToClean)).catch(e=>console.log(e));
                        }
                    });
                }

                currentWayId = wayId;
                
                document.querySelectorAll('.way-item').forEach(el => el.classList.remove('active'));
                const dEl = document.getElementById(`d-way-${wayId}`) || document.getElementById('d-way-general');
                if (dEl) dEl.classList.add('active');

                document.querySelectorAll('.m-way-pill').forEach(el => el.classList.remove('active'));
                const mEl = document.getElementById(`m-way-${wayId}`) || document.getElementById('m-way-general');
                if (mEl) mEl.classList.add('active');

                loadFeed(wayId);
            };

            // --- CUSTOM MODAL FOR TOPICS ---
            const topicModal = document.getElementById('topic-modal');
            const topicInput = document.getElementById('topic-name-input');
            const btnCancelTopic = document.getElementById('btn-cancel-topic');
            const btnConfirmTopic = document.getElementById('btn-confirm-topic');

            const triggerNewWay = () => {
                if (!currentUser) { window.location.href='/LoginInToCheaplet.html'; return; }
                topicModal.style.display = 'flex';
                topicInput.value = '';
                topicInput.focus();
            };
            document.getElementById('btn-create-way').onclick = triggerNewWay;

            btnCancelTopic.onclick = () => { topicModal.style.display = 'none'; };

            btnConfirmTopic.onclick = async () => {
                const wayName = topicInput.value.trim();
                if (!wayName || wayName.length < 2) { alert(ui.err_short); return; }

                btnConfirmTopic.disabled = true;
                try {
                    const newRef = await addDoc(collection(db, "social_channels"), {
                        name: wayName.substring(0, 30),
                        schoolName: internalSchoolName,
                        createdBy: currentUser.uid,
                        createdAt: serverTimestamp(),
                        postCount: 0 
                    });
                    topicModal.style.display = 'none';
                    window.selectWay(newRef.id);
                } catch (e) { alert("Error: " + e.message); } 
                finally { btnConfirmTopic.disabled = false; }
            };

            // --- 2. PRELOAD BOOKS ---
            async function preloadBooksAndLoadFeed(wayId) {
                let bookQ = query(collection(db, "listings"), where("status", "==", "active"), orderBy("timestamp", "desc"), limit(6));
                
                if (currentUser && internalSchoolName !== "Global Campus") {
                    try {
                        const sBookQ = query(collection(db, "listings"), where("location", "==", internalSchoolName), where("status", "==", "active"), limit(6));
                        const bSnap = await getDocs(sBookQ);
                        if (!bSnap.empty) bookQ = sBookQ;
                    } catch(e) {}
                }
                
                try {
                    const snap = await getDocs(bookQ);
                    listings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (e) { console.error("Error preloading books", e); }
                
                loadFeed(wayId);
            }

            // --- 3. LOAD HYBRID FEED ---
            function loadFeed(wayId) {
                if (unsubscribePosts) unsubscribePosts();
                feedContainer.innerHTML = `<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br><span>${ui.loading_hub}</span></div>`;

                let q = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(15));
                
                try {
                    unsubscribePosts = onSnapshot(q, (snapshot) => {
                        feedContainer.innerHTML = '';
                        
                        let filteredDocs = snapshot.docs.filter(d => d.data().wayId === wayId);
                        if (internalSchoolName !== "Global Campus") {
                            filteredDocs = filteredDocs.filter(d => d.data().schoolName === internalSchoolName);
                        }

                        if (filteredDocs.length === 0) {
                            feedContainer.innerHTML = `<div class="loader-msg">${ui.noPosts}</div>`;
                            return;
                        }

                        const frag = document.createDocumentFragment();
                        let postCounter = 0;

                        filteredDocs.forEach(docSnap => {
                            const d = docSnap.data();
                            frag.appendChild(createPostElement(docSnap.id, d));
                            postCounter++;

                            // Inject Marketplace Break after every 3 posts
                            if (postCounter === 3 && listings.length > 0) {
                                frag.appendChild(createMarketBreak());
                            }
                        });
                        
                        if (postCounter < 3 && listings.length > 0) {
                            frag.appendChild(createMarketBreak());
                        }

                        feedContainer.appendChild(frag);
                    });
                } catch (e) { console.error(e); }
            }

            function createPostElement(id, d) {
                let pfp = d.authorPhoto;
                if (!pfp || pfp.includes("googleusercontent") || pfp.includes("live.com")) {
                    pfp = `https://api.dicebear.com/7.x/identicon/svg?seed=${d.authorUid}&backgroundColor=EBF2FA`;
                }

                let timeStr = ui.justNow;
                if (d.timestamp) {
                    const dateObj = d.timestamp.toDate();
                    const diffMins = Math.round((new Date() - dateObj) / 60000);
                    if (diffMins < 60) timeStr = lang === 'fr' ? `Il y a ${diffMins} min` : `${diffMins}m`;
                    else if (diffMins < 1440) timeStr = lang === 'fr' ? `Il y a ${Math.round(diffMins/60)} h` : `${Math.round(diffMins/60)}h`;
                    else timeStr = lang === 'fr' ? `Il y a ${Math.round(diffMins/1440)} j` : `${Math.round(diffMins/1440)}d`;
                }

                const isLiked = currentUser && d.likedBy && d.likedBy.includes(currentUser.uid);

                const card = document.createElement('div');
                card.className = 'post-card';
                // 🔥 SECURITY: Sanitize outputs
                card.innerHTML = `
                    <div class="post-header">
                        <img src="${escapeHTML(pfp)}" class="post-avatar" alt="Avatar">
                        <div class="post-meta">
                            <span class="post-author">${escapeHTML(d.authorName)}</span>
                            <span class="post-time">${timeStr}</span>
                        </div>
                    </div>
                    <div class="post-body">${escapeHTML(d.text)}</div>
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.likePost('${id}', ${isLiked})">
                            <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${d.likes || 0}
                        </button>
                    </div>
                `;
                return card;
            }

            function createMarketBreak() {
                const breakSection = document.createElement('div');
                breakSection.className = 'market-break';
                
                let bookHtml = '';
                listings.forEach(b => {
                    // 🔥 SECURITY: Sanitize book outputs
                    bookHtml += `
                        <a href="/listing.html?id=${b.id}" class="mini-book-card">
                            <div class="mini-img" style="background-image:url('${escapeHTML(b.imageUrls[0])}')" role="img" aria-label="Book Image"></div>
                            <div class="mini-info">
                                <div class="mini-price">$${b.price.toFixed(2)}</div>
                                <div class="mini-title">${escapeHTML(b.title)}</div>
                            </div>
                        </a>
                    `;
                });

                breakSection.innerHTML = `
                    <div class="break-header">
                        <span class="break-title"><i class="fas fa-book-open"></i> ${ui.suggest}</span>
                        <a href="/search.html" class="break-link">${ui.browse}</a>
                    </div>
                    <div class="break-scroll">${bookHtml}</div>
                `;
                return breakSection;
            }

            btnSendPost.onclick = async () => {
                const text = postInput.value.trim();
                if (!text) return;
                
                btnSendPost.disabled = true;
                postInput.value = '';
                postInput.style.height = '60px'; 

                try {
                    let photoToSave = currentUser.photoURL;
                    if (!photoToSave || photoToSave.includes("googleusercontent") || photoToSave.includes("live.com")) {
                        photoToSave = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}&backgroundColor=EBF2FA`;
                    }

                    await addDoc(collection(db, "social_posts"), {
                        wayId: currentWayId,
                        schoolName: internalSchoolName,
                        text: text,
                        authorUid: currentUser.uid,
                        authorName: currentUser.displayName || "User",
                        authorPhoto: photoToSave,
                        likes: 0,
                        likedBy: [],
                        timestamp: serverTimestamp()
                    });

                    if (currentWayId !== 'general') {
                        await updateDoc(doc(db, "social_channels", currentWayId), {
                            postCount: increment(1)
                        });
                    }

                } catch (e) { alert("Error posting."); }
                
                btnSendPost.disabled = false;
            };

            postInput.addEventListener('input', function() {
                this.style.height = '60px';
                this.style.height = (this.scrollHeight) + 'px';
                if (this.value.trim() === '') this.style.height = '60px';
            });

            window.likePost = async (id, alreadyLiked) => {
                if (!currentUser) { window.location.href='/LoginInToCheaplet.html'; return; }
                const ref = doc(db, "social_posts", id);
                if(alreadyLiked) {
                    await updateDoc(ref, { likes: increment(-1), likedBy: arrayRemove(currentUser.uid) });
                } else {
                    await updateDoc(ref, { likes: increment(1), likedBy: arrayUnion(currentUser.uid) });
                }
            };
        }
        main();
    </script>
</body>
</html>
