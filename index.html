<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scoralia - The smartest campus marketplace and community hub.">
    <meta name="theme-color" content="#0C1446">
    <title>Campus Hub — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F0F2F5; 
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #050505;
            --text-muted:#65676B;
            --radius:    12px;
            --shadow:    0 1px 2px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; }

        /* ── HEADER ── */
        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── LAYOUT FIX: CENTERED ── */
        .hub-layout { 
            max-width: 1100px; 
            margin: 20px auto; 
            display: grid; 
            grid-template-columns: 300px 1fr; 
            gap: 30px; 
            padding: 0 20px; 
            align-items: start; 
        }

        /* ── SIDEBAR ── */
        .sidebar { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 15px; }
        .school-header { padding: 10px 5px; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--ink); }
        .school-sub { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

        .topics-menu { display: flex; flex-direction: column; gap: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 10px 0 5px 10px; }
        
        .way-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: #1c1e21; transition: 0.2s; }
        .way-item:hover { background: #e4e6eb; }
        .way-item.active { background: #FFFFFF; color: var(--deep); box-shadow: var(--shadow); }
        .way-item i { width: 20px; text-align: center; color: var(--text-muted); }
        .way-item.active i { color: var(--deep); }
        .way-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); background: #f0f2f5; padding: 2px 8px; border-radius: 10px; }

        .btn-new-way { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: 1px dashed #cbd5e1; border-radius: 8px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-top: 5px; }

        /* ── MOBILE WAYS BAR: HORIZONTAL SCROLL ── */
        .mobile-ways-bar { display: none; background: var(--white); border-bottom: 1px solid #e4e6eb; padding: 12px 15px; overflow-x: auto; white-space: nowrap; position: sticky; top: 68px; z-index: 150; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #f0f2f5; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #1c1e21; margin-right: 8px; cursor: pointer; transition: 0.2s; }
        .m-way-pill.active { background: var(--ink); color: var(--white); }

        /* ── FEED COLUMN ── */
        .feed-column { display: flex; flex-direction: column; gap: 16px; padding-bottom: 60px; }
        #feed-container { display: flex; flex-direction: column; gap: 16px; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .composer-top { display: flex; gap: 12px; align-items: center; }
        .composer-pfp { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; border: 1px solid #e4e6eb; }
        .composer-input { flex-grow: 1; background: #f0f2f5; border: none; border-radius: 20px; padding: 10px 15px; font-family: inherit; font-size: 1rem; outline: none; resize: none; min-height: 40px; }
        .composer-bottom { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f2f5; }
        
        .btn-action { background: var(--deep); color: #fff; border: none; padding: 8px 24px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-ghost { background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; padding: 8px 16px; }

        /* ── POST CARD ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); animation: fadeUp 0.3s ease both; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #e4e6eb; }
        .post-author { font-weight: 700; font-size: 0.95rem; }
        .post-time { font-size: 0.75rem; color: var(--text-muted); }
        .post-body { font-size: 1rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .post-actions { display: flex; gap: 20px; margin-top: 15px; padding-top: 12px; border-top: 1px solid #f0f2f5; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .action-btn.liked { color: #e53e3e; }

        /* ── MARKETPLACE BREAK ── */
        .market-break { padding: 20px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
        .break-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .break-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 900; color: var(--ink); }
        .break-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .break-scroll::-webkit-scrollbar { display: none; }
        .mini-book-card { flex: 0 0 140px; background: var(--white); border-radius: 8px; overflow: hidden; text-decoration: none; color: var(--text-main); border: 1px solid #e4e6eb; display: flex; flex-direction: column; }
        .mini-img { height: 110px; background-size: cover; background-position: center; }
        .mini-info { padding: 10px; flex-grow: 1; }
        .mini-price { font-weight: 800; font-size: 0.95rem; color: var(--deep); }
        .mini-title { font-size: 0.75rem; font-weight: 600; line-height: 1.2; height: 2.4em; overflow: hidden; }

        .loader-msg { text-align: center; padding: 40px; color: var(--text-muted); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ── MODAL ── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.8); backdrop-filter: blur(4px); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal-card { background: var(--white); padding: 30px; border-radius: var(--radius); width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-card input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; outline: none; }

        /* 🔥 MOBILE FIXES 🔥 */
        @media (max-width: 850px) {
            .hub-layout { grid-template-columns: 1fr; padding: 0; margin-top: 0; }
            .sidebar { display: none; }
            .mobile-ways-bar { display: block; }
            
            /* Add space from screen edges */
            .feed-column { padding: 10px; gap: 10px; background: var(--off-white); }
            #feed-container { gap: 10px; }
            
            /* Professional Card Style */
            .composer, .post-card, .market-break { border-radius: 12px; border: 1px solid #e2e8f0; }
            .post-body { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="mobile-ways-bar" id="mobile-ways-list">
        <div class="m-way-pill active" id="m-way-general" onclick="window.selectWay('general')">
            <i class="fas fa-hashtag"></i> <span data-i18n="topics_campus">Campus Public</span>
        </div>
    </div>

    <div class="hub-layout">
        <!-- DESKTOP SIDEBAR -->
        <aside class="sidebar">
            <div class="school-header">
                <div class="school-name" id="d-user-school">Loading...</div>
                <div class="school-sub">Community Hub</div>
            </div>
            
            <div class="topics-menu">
                <div class="topic-section-title" data-i18n="topics_public">Channels</div>
                <div class="way-item active" id="d-way-general" onclick="window.selectWay('general')">
                    <i class="fas fa-hashtag"></i> <span data-i18n="topics_campus">Campus Public</span>
                </div>

                <div class="topic-section-title" data-i18n="topics_custom">Custom Topics</div>
                <div id="desktop-ways-list"></div>
                <button class="btn-new-way" id="btn-create-way"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>
            </div>

            <button class="btn-action" style="width:100%; margin-top:10px; background:var(--ink); color:white;" onclick="window.location.href='/listanitem.html'" data-i18n="sell">List a Book</button>

            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 15px; padding-left: 10px;">
                <a href="/terms.html" style="color:inherit; text-decoration:none;">Terms</a> · <a href="/privacy.html" style="color:inherit; text-decoration:none;">Privacy</a><br>© 2026 Scoralia
            </div>
        </aside>

        <!-- FEED -->
        <main class="feed-column">
            <div class="composer" id="composer-card" style="display: none;">
                <div class="composer-top">
                    <img src="" id="composer-pfp" class="composer-pfp" alt="Profile">
                    <textarea class="composer-input" id="post-input" data-i18n-placeholder="post_placeholder" placeholder="What's happening?"></textarea>
                </div>
                <div class="composer-bottom" id="composer-controls" style="display:none;">
                    <button class="btn-action" id="btn-send-post"><i class="fas fa-paper-plane"></i> <span data-i18n="btn_post">Post</span></button>
                </div>
            </div>

            <div id="feed-container">
                <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i> <span data-i18n="loading_hub">Loading feed...</span></div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="topic-modal">
        <div class="modal-card">
            <h2 data-i18n="modal_title">New Topic</h2>
            <input type="text" id="topic-name-input" maxlength="30" placeholder="Topic name...">
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-ghost" id="btn-cancel-topic" data-i18n="btn_cancel">Cancel</button>
                <button class="btn-action" id="btn-confirm-topic" data-i18n="btn_create">Create</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, limit, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const allStrings = {
                en: { 
                    topics_public: "Channels", topics_campus: "Campus Public", topics_custom: "Custom Topics", topics_new: "Create Topic",
                    post_placeholder: "What's on your mind?", btn_post: "Post", loading_hub: "Loading campus feed...",
                    noPosts: "No posts yet. Start the conversation!", justNow: "Just now", 
                    suggest: "Marketplace", browse: "See all", guest: "Global Campus", sell: "List a Book",
                    modal_title: "New Topic", btn_cancel: "Cancel", btn_create: "Create"
                },
                fr: { 
                    topics_public: "Canaux", topics_campus: "Campus Public", topics_custom: "Sujets", topics_new: "Nouveau Sujet",
                    post_placeholder: "Quoi de neuf ?", btn_post: "Publier", loading_hub: "Chargement du fil...",
                    noPosts: "Aucune publication. Soyez le premier !", justNow: "À l'instant", 
                    suggest: "Marché", browse: "Voir tout", guest: "Campus Global", sell: "Vendre un livre",
                    modal_title: "Nouveau Sujet", btn_cancel: "Annuler", btn_create: "Créer"
                }
            };
            const ui = allStrings[lang] || allStrings['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (ui[key]) el.textContent = ui[key];
            });

            function formatCount(num) { return !num ? 0 : (num > 999 ? (num / 1000).toFixed(1) + 'k' : num); }

            let currentUser = null;
            let internalSchoolName = "Global Campus"; 
            let currentWayId = "general";
            let unsubscribePosts = null;
            let listings = []; 

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        currentUser = { ...user, ...data };
                        internalSchoolName = data.schoolName || "Global Campus";
                        document.getElementById('d-user-school').textContent = internalSchoolName === "Global Campus" ? ui.guest : internalSchoolName;
                        document.getElementById('composer-card').style.display = 'block';
                        let pfp = data.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=EBF2FA`;
                        document.getElementById('composer-pfp').src = pfp;
                        loadTopics();
                        preloadBooksAndLoadFeed("general");
                    }
                } else {
                    document.getElementById('d-user-school').textContent = ui.guest;
                    preloadBooksAndLoadFeed("general");
                }
            });

            function loadTopics() {
                if (!currentUser) return;
                const q = query(collection(db, "social_channels"), where("schoolName", "==", internalSchoolName), orderBy("postCount", "desc"));
                onSnapshot(q, (snapshot) => {
                    document.getElementById('desktop-ways-list').innerHTML = '';
                    const mList = document.getElementById('mobile-ways-list');
                    const mGen = document.getElementById('m-way-general');
                    mList.innerHTML = ''; mList.appendChild(mGen);

                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d.postCount === 0 && docSnap.id !== currentWayId && d.createdBy !== currentUser.uid) return;

                        const dItem = document.createElement('div');
                        dItem.className = `way-item ${currentWayId === docSnap.id ? 'active' : ''}`;
                        dItem.onclick = () => window.selectWay(docSnap.id);
                        dItem.innerHTML = `<i class="fas fa-hashtag"></i> <span>${d.name}</span> <span class="way-count">${formatCount(d.postCount)}</span>`;
                        document.getElementById('desktop-ways-list').appendChild(dItem);

                        const mItem = document.createElement('div');
                        mItem.className = `m-way-pill ${currentWayId === docSnap.id ? 'active' : ''}`;
                        mItem.onclick = () => window.selectWay(docSnap.id);
                        mItem.innerHTML = `<i class="fas fa-hashtag"></i> ${d.name} <span class="m-way-count">${formatCount(d.postCount)}</span>`;
                        mList.appendChild(mItem);
                    });
                    const mAdd = document.createElement('div'); mAdd.className = 'm-way-pill'; mAdd.innerHTML = `<i class="fas fa-plus"></i>`; mAdd.onclick = triggerNewWay; mList.appendChild(mAdd);
                });
            }

            window.selectWay = (wayId) => {
                if (currentWayId !== 'general' && currentWayId !== wayId) {
                    getDoc(doc(db, "social_channels", currentWayId)).then(d => {
                        if (d.exists() && d.data().postCount === 0 && d.data().createdBy === currentUser?.uid) deleteDoc(doc(db, "social_channels", currentWayId));
                    });
                }
                currentWayId = wayId;
                document.querySelectorAll('.way-item, .m-way-pill').forEach(el => el.classList.remove('active'));
                loadFeed(wayId);
            };

            const triggerNewWay = () => { if (!currentUser) { window.location.href='/LoginInToCheaplet.html'; return; } document.getElementById('topic-modal').style.display='flex'; };
            document.getElementById('btn-create-way').onclick = triggerNewWay;
            document.getElementById('btn-cancel-topic').onclick = () => document.getElementById('topic-modal').style.display='none';
            document.getElementById('btn-confirm-topic').onclick = async () => {
                const name = document.getElementById('topic-name-input').value.trim();
                if (name.length < 2) return;
                const newRef = await addDoc(collection(db, "social_channels"), { name: name.substring(0, 30), schoolName: internalSchoolName, createdBy: currentUser.uid, createdAt: serverTimestamp(), postCount: 0 });
                document.getElementById('topic-modal').style.display='none';
                window.selectWay(newRef.id);
            };

            async function preloadBooksAndLoadFeed(wayId) {
                let bookQ = query(collection(db, "listings"), where("status", "==", "active"), limit(6));
                try {
                    const snap = await getDocs(bookQ);
                    listings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (e) {}
                loadFeed(wayId);
            }

            function loadFeed(wayId) {
                if (unsubscribePosts) unsubscribePosts();
                const container = document.getElementById('feed-container');
                container.innerHTML = `<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i></div>`;
                const q = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(15));
                unsubscribePosts = onSnapshot(q, (snapshot) => {
                    const frag = document.createDocumentFragment();
                    let filtered = snapshot.docs.filter(d => d.data().wayId === wayId);
                    if (internalSchoolName !== "Global Campus") filtered = filtered.filter(d => d.data().schoolName === internalSchoolName);
                    if (filtered.length === 0) { container.innerHTML = `<div class="loader-msg">${ui.noPosts}</div>`; return; }
                    filtered.forEach((docSnap, i) => {
                        frag.appendChild(createPostElement(docSnap.id, docSnap.data()));
                        if (i === 2 && listings.length > 0) frag.appendChild(createMarketBreak());
                    });
                    container.innerHTML = ''; container.appendChild(frag);
                });
            }

            function createPostElement(id, d) {
                const card = document.createElement('div'); card.className = 'post-card';
                let pfp = d.authorPhoto || `https://api.dicebear.com/7.x/identicon/svg?seed=${d.authorUid}&backgroundColor=EBF2FA`;
                const isLiked = currentUser && d.likedBy && d.likedBy.includes(currentUser.uid);
                card.innerHTML = `<div class="post-header"><img src="${pfp}" class="post-avatar"><div class="post-meta"><span class="post-author">${d.authorName}</span><span class="post-time">${ui.justNow}</span></div></div><div class="post-body">${d.text}</div><div class="post-actions"><button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.likePost('${id}', ${isLiked})"><i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${d.likes || 0}</button></div>`;
                return card;
            }

            function createMarketBreak() {
                const brk = document.createElement('div'); brk.className = 'market-break';
                let books = listings.map(b => `<a href="/listing.html?id=${b.id}" class="mini-book-card"><div class="mini-img" style="background-image:url('${b.imageUrls[0]}')"></div><div class="mini-info"><div class="mini-price">$${b.price.toFixed(2)}</div><div class="mini-title">${b.title}</div></div></a>`).join('');
                brk.innerHTML = `<div class="break-header"><span class="break-title">${ui.suggest}</span><a href="/search.html" class="break-link">${ui.browse}</a></div><div class="break-scroll">${books}</div>`;
                return brk;
            }

            document.getElementById('post-input').onfocus = () => document.getElementById('composer-controls').style.display='flex';
            document.getElementById('btn-send-post').onclick = async () => {
                const text = document.getElementById('post-input').value.trim();
                if (!text) return;
                document.getElementById('post-input').value = ''; document.getElementById('composer-controls').style.display='none';
                let pfp = currentUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}&backgroundColor=EBF2FA`;
                await addDoc(collection(db, "social_posts"), { wayId: currentWayId, schoolName: internalSchoolName, text, authorUid: currentUser.uid, authorName: currentUser.displayName, authorPhoto: pfp, likes: 0, likedBy: [], timestamp: serverTimestamp() });
                if (currentWayId !== 'general') await updateDoc(doc(db, "social_channels", currentWayId), { postCount: increment(1) });
            };

            window.likePost = async (id, liked) => {
                if (!currentUser) return;
                const ref = doc(db, "social_posts", id);
                await updateDoc(ref, { likes: increment(liked ? -1 : 1), likedBy: liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
            };
        }
        main();
    </script>
</body>
</html>
