<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Hub — Cheaplet</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F4F7FC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #1a2a4a;
            --text-muted:#6b84a3;
            --radius: 16px;
            --shadow: 0 4px 15px rgba(12,20,70,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; }
        .logo em { color: var(--gold); font-style: normal; }

        .hub-layout { max-width: 1000px; margin: 20px auto; display: grid; grid-template-columns: 1fr 300px; gap: 25px; padding: 0 15px; align-items: start; }

        .composer { background: var(--white); border-radius: var(--radius); padding: 18px; margin-bottom: 25px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .composer-top { display: flex; gap: 12px; align-items: center; }
        .composer-pfp { width: 42px; height: 42px; border-radius: 50%; background: var(--off-white); object-fit: cover; border: 2px solid var(--gold); }
        .composer-btn { flex-grow: 1; background: var(--off-white); border: 1px solid #e2e8f0; padding: 12px 20px; border-radius: 25px; color: var(--text-muted); text-align: left; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .composer-btn:hover { background: #edf2f7; }

        .post-card { background: var(--white); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; animation: fadeUp 0.4s ease both; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: var(--off-white); border: 1.5px solid var(--mist); }
        .post-author { font-weight: 700; font-size: 1rem; color: var(--ink); }
        .post-time { font-size: 0.75rem; color: var(--text-muted); }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; }

        .market-break { margin: 30px -15px; padding: 25px 15px; background: var(--ink); color: #fff; }
        .break-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .break-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .break-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .break-scroll::-webkit-scrollbar { display: none; }
        
        .mini-book-card { flex: 0 0 160px; background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; text-decoration: none; color: #fff; scroll-snap-align: start; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .mini-book-card:hover { background: rgba(255,255,255,0.1); }
        .mini-img { height: 120px; background-size: cover; background-position: center; }
        .mini-info { padding: 10px; }
        .mini-price { font-weight: 800; font-size: 0.9rem; color: var(--gold); }
        .mini-title { font-size: 0.75rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .sidebar { position: sticky; top: 90px; }
        .widget { background: #fff; border-radius: var(--radius); padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: var(--shadow); }
        .widget-title { font-weight: 800; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .widget-title i { color: var(--gold); }
        .campus-info { display: flex; flex-direction: column; gap: 8px; }
        .campus-name { font-weight: 700; color: var(--ink); font-size: 1.1rem; }
        .user-rep { display: flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; font-size: 0.9rem; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 850px) {
            .hub-layout { grid-template-columns: 1fr; padding: 0; margin-top: 10px; }
            .sidebar { display: none; }
            .composer, .post-card { border-radius: 0; border-left: none; border-right: none; }
            .post-card { padding: 15px; }
            .post-body { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Cheap<em>let</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="hub-layout">
        <main id="unified-feed">
            <div class="composer" id="main-composer" style="display: none;">
                <div class="composer-top">
                    <img src="" id="user-avatar-main" class="composer-pfp">
                    <div class="composer-btn" onclick="window.location.href='/social.html'" id="ui-composer-text">What's happening on campus?</div>
                </div>
            </div>

            <div id="feed-container">
                <p style="text-align:center; padding:50px; color:#888;"><i class="fas fa-circle-notch fa-spin"></i> Loading campus hub...</p>
            </div>
        </main>

        <aside class="sidebar">
            <div class="widget">
                <div class="widget-title"><i class="fas fa-university"></i> <span id="ui-your-campus">Your Campus</span></div>
                <div class="campus-info">
                    <div class="campus-name" id="user-school-name">Guest Member</div>
                    <div class="user-rep" id="user-rating-val"></div>
                </div>
                <button class="btn" style="width:100%; margin-top:15px; border-radius:20px; padding:10px;" onclick="window.location.href='/listanitem.html'" id="ui-sell-btn">List a Book</button>
            </div>

            <div class="widget">
                <div class="widget-title"><i class="fas fa-shield-alt"></i> Safe Trade</div>
                <p style="font-size:0.8rem; color:var(--text-muted); line-height:1.5;">Cheaplet works best when you meet on campus. Always use the internal chat to keep a record of your deal.</p>
            </div>

            <div style="padding-left:10px; font-size:0.75rem; color:#888;">
                © 2025 Cheaplet · <a href="/terms.html" style="color:inherit; text-decoration:none;">Terms</a> · <a href="/privacy.html" style="color:inherit; text-decoration:none;">Privacy</a>
            </div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, limit, where, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const db = getFirestore(app);
            const auth = getAuth(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: { composer: "What's happening on campus?", yourC: "Your Campus", sell: "List a Book", guest: "Guest Member", suggest: "Campus Marketplace", browse: "Browse All →", justNow: "Just now" },
                fr: { composer: "Que se passe-t-il sur le campus ?", yourC: "Votre Campus", sell: "Vendre un livre", guest: "Membre Invité", suggest: "Marché du Campus", browse: "Voir tout →", justNow: "À l'instant" }
            }[lang];

            // Safely assign translations without crashing
            document.getElementById('ui-composer-text').textContent = ui.composer;
            document.getElementById('ui-your-campus').textContent = ui.yourC;
            document.getElementById('ui-sell-btn').textContent = ui.sell;

            let userSchool = null;
            let posts = [];
            let listings = [];

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const uSnap = await getDoc(doc(db, "users", user.uid));
                        if (uSnap.exists()) {
                            const d = uSnap.data();
                            userSchool = d.schoolName;
                            document.getElementById('user-school-name').textContent = d.schoolName || "Global Campus";
                            document.getElementById('main-composer').style.display = 'block';
                            
                            let pfp = d.photoURL;
                            if (!pfp || pfp.includes("googleusercontent") || pfp.includes("live.com")) {
                                pfp = `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=F4F7FC`;
                            }
                            document.getElementById('user-avatar-main').src = pfp;

                            if (d.ratingCount) {
                                document.getElementById('user-rating-val').innerHTML = `<i class="fas fa-star"></i> ${(d.ratingSum / d.ratingCount).toFixed(1)} Reputation`;
                            }
                        }
                    } catch (e) { console.error(e); }
                }
                loadHubData();
            });

            function loadHubData() {
                // 1. Fetch Latest 10 Posts
                let postQ = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(10));
                if (userSchool) postQ = query(collection(db, "social_posts"), where("schoolName", "==", userSchool), orderBy("timestamp", "desc"), limit(10));

                onSnapshot(postQ, (postSnap) => {
                    posts = postSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'post' }));
                    
                    // 2. Fetch Latest 8 Books
                    let bookQ = query(collection(db, "listings"), where("status", "==", "active"), orderBy("timestamp", "desc"), limit(8));
                    if (userSchool) bookQ = query(collection(db, "listings"), where("location", "==", userSchool), where("status", "==", "active"), orderBy("timestamp", "desc"), limit(8));

                    getDocs(bookQ).then(bookSnap => {
                        listings = bookSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'book' }));
                        renderMixedFeed();
                    }).catch(err => {
                        // Fallback if index is missing: just fetch all and filter
                        getDocs(query(collection(db, "listings"), where("status", "==", "active"), limit(8))).then(backupSnap => {
                            listings = backupSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'book' }));
                            renderMixedFeed();
                        });
                    });
                }, (error) => {
                    console.error("Feed error:", error);
                    document.getElementById('feed-container').innerHTML = `<p style="text-align:center; padding:40px; color:#888;">Error loading feed. Please check your database permissions.</p>`;
                });
            }

            function renderMixedFeed() {
                const container = document.getElementById('feed-container');
                const frag = document.createDocumentFragment();
                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = `<p style="text-align:center; padding:40px; color:#888;">No posts yet at your campus. Start the conversation!</p>`;
                    return;
                }

                let postIdx = 0;
                let bookIdx = 0;

                while (postIdx < posts.length) {
                    // Add 2 Posts
                    for (let i = 0; i < 2 && postIdx < posts.length; i++) {
                        frag.appendChild(createPostElement(posts[postIdx]));
                        postIdx++;
                    }

                    // Add Marketplace Break
                    if (bookIdx < listings.length) {
                        const breakSection = document.createElement('div');
                        breakSection.className = 'market-break';
                        
                        let bookItemsHtml = '';
                        for (let j = 0; j < 4 && bookIdx < listings.length; j++) {
                            const b = listings[bookIdx];
                            bookItemsHtml += `
                                <a href="/listing.html?id=${b.id}" class="mini-book-card">
                                    <div class="mini-img" style="background-image:url('${b.imageUrls[0]}')"></div>
                                    <div class="mini-info">
                                        <div class="mini-price">$${b.price.toFixed(2)}</div>
                                        <div class="mini-title">${b.title}</div>
                                    </div>
                                </a>
                            `;
                            bookIdx++;
                        }

                        breakSection.innerHTML = `
                            <div class="break-header">
                                <span class="break-title"><i class="fas fa-book-open"></i> ${ui.suggest}</span>
                                <a href="/search.html" style="color:var(--gold); font-size:0.85rem; font-weight:700; text-decoration:none;">${ui.browse}</a>
                            </div>
                            <div class="break-scroll">${bookItemsHtml}</div>
                        `;
                        frag.appendChild(breakSection);
                    }
                }

                container.appendChild(frag);
            }

            function createPostElement(p) {
                const div = document.createElement('div');
                div.className = 'post-card';
                
                let pfp = p.authorPhoto;
                if (!pfp || pfp.includes("googleusercontent") || pfp.includes("live.com")) {
                    pfp = `https://api.dicebear.com/7.x/identicon/svg?seed=${p.authorUid}&backgroundColor=EBF2FA`;
                }

                div.innerHTML = `
                    <div class="post-header">
                        <img src="${pfp}" class="post-avatar">
                        <div class="post-meta">
                            <div class="post-author">${p.authorName}</div>
                            <div class="post-time">${ui.justNow}</div>
                        </div>
                    </div>
                    <div class="post-body">${p.text}</div>
                `;
                return div;
            }
        }
        main();
    </script>
</body>
</html>
