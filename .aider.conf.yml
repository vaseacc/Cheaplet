# .aider.conf.yml
model: groq/llama-3.3-70b-versatile
edit-format: diff

# UI & Behavior
stream: false
yes-always: true  # This is the "Don't ask me questions" flag
auto-commits: true
map-tokens: 512

# This tells Aider it's okay to suggest and run shell commands (like mkdir)
allow-run-commands: true

read:
  - CONVENTIONS.md
