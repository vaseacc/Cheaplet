# .aider.conf.yml
# Using the 2026 "Smart" model
model: gemini/gemini-3.1-pro-preview

# Surgical diffs for reliability
edit-format: diff

# Standard Agent Behaviors
stream: false
yes-always: true
auto-commits: true
map-tokens: 1024
show-model-warnings: false

# Always check conventions
read:
  - CONVENTIONS.md
