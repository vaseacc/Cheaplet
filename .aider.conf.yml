# .aider.conf.yml
# Use the high-reasoning Gemini 3.1 Pro for better logic
model: gemini/gemini-3.1-pro
# Fallback to Flash if you hit rate limits (uncomment if needed)
# model: gemini/gemini-3.1-flash

# Surgical diffs only
edit-format: diff

# UI & Behavior
stream: false
yes-always: true
auto-commits: true
# Map tokens helps the AI "see" your whole repo structure
map-tokens: 1024

# Enforce your conventions
read:
  - CONVENTIONS.md
