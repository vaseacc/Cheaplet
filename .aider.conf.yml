# .aider.conf.yml
# Swapping to Groq's high-reasoning Llama model
model: groq/llama-3.3-70b-versatile

# Use surgical diffs
edit-format: diff

# Performance & Quota Saving
stream: false
yes-always: true
auto-commits: true
# Reduced map-tokens to save your Groq quota
map-tokens: 512
show-model-warnings: false

# Always obey your rules
read:
  - CONVENTIONS.md
