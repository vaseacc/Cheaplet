<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Deep Navy Background Gradient -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0C1446" />
            <stop offset="100%" stop-color="#1a365d" />
        </linearGradient>
        
        <!-- Scoralia Gold Gradient -->
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#edcf82" />
            <stop offset="50%" stop-color="#C8A96E" />
            <stop offset="100%" stop-color="#a6854b" />
        </linearGradient>
        
        <!-- Subtle Premium Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <!-- App Icon Base (Squircle) -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" />
    
    <!-- Subtle Inner Border -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

    <!-- Academic Shield Outline -->
    <path d="M256 100 L390 145 V250 C390 355 256 425 256 425 C256 425 122 355 122 250 V145 Z" 
          fill="none" 
          stroke="url(#gold-grad)" 
          stroke-width="36" 
          stroke-linejoin="round" 
          filter="url(#shadow)" />
    
    <!-- Modern 'S' for Scoralia -->
    <path d="M305 205 C305 175 285 165 256 165 C225 165 207 180 207 210 C207 245 305 245 305 290 C305 325 285 345 256 345 C225 345 205 330 205 300" 
          fill="none" 
          stroke="url(#gold-grad)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#shadow)" />
</svg>
