<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Deep Premium Navy Background Gradient -->
        <linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop offset="0%" stop-color="#0C1446" />
            <stop offset="100%" stop-color="#14244d" />
        </linearGradient>
        
        <!-- Scoralia Gold Gradient -->
        <linearGradient id="gold-grad" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop offset="0%" stop-color="#f5e0a3" />
            <stop offset="50%" stop-color="#C8A96E" />
            <stop offset="100%" stop-color="#91713b" />
        </linearGradient>
        
        <!-- Premium Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
    </defs>
    
    <!-- App Icon Base (Squircle) -->
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg-grad)" />
    
    <!-- Subtle Inner Border -->
    <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3" />

    <!-- Delicate, Scholarly Outer Rings (Astrolabe style) -->
    <circle cx="256" cy="256" r="182" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.25" />
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.35" />
    
    <!-- Subtle Secondary Page Layers (Adds depth under the main book outlines) -->
    <!-- Left page layer 1 -->
    <path d="M 160 334 C 190 348, 228 358, 256 358" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.4" />
    <!-- Left page layer 2 -->
    <path d="M 164 338 C 194 351, 230 361, 256 361" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.2" />
    <!-- Right page layer 1 -->
    <path d="M 256 358 C 284 358, 322 348, 352 334" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.4" />
    <!-- Right page layer 2 -->
    <path d="M 256 361 C 282 361, 318 351, 348 338" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.2" />

    <!-- Main Monogram (Unified Book & S-Ribbon) -->
    <g fill="none" stroke="url(#gold-grad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
        <!-- Left Page Outlines -->
        <path d="M 156 250 C 186 265, 226 275, 256 275 L 256 355 C 226 355, 186 345, 156 330 Z" />
        
        <!-- Right Page Outlines -->
        <path d="M 256 275 C 286 275, 326 265, 356 250 L 356 330 C 326 345, 286 355, 256 355" />
        
        <!-- Graceful "S" Bookmark Ribbon (Sweeps down to connect with the spine) -->
        <path d="M 305 140 C 255 125, 200 135, 200 180 C 200 225, 256 225, 256 275" />
    </g>

    <!-- Spark of Knowledge / Learning Star -->
    <path d="M 185 130 L 189 139 L 198 143 L 189 147 L 185 156 L 181 147 L 172 143 L 181 139 Z" 
          fill="url(#gold-grad)" 
          filter="url(#shadow)" />
</svg>
