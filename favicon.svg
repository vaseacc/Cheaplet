<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gold -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B5"/>
      <stop offset="50%" stop-color="#D4AF73"/>
      <stop offset="100%" stop-color="#8C6A35"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="6"
        flood-color="#000"
        flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main S -->
  <path
    d="
      M 320 140
      C 290 105, 220 105, 185 145
      C 150 185, 165 235, 235 255
      C 305 275, 325 295, 325 335
      C 325 375, 290 405, 240 405
      C 200 405, 165 390, 140 360
    "
    fill="none"
    stroke="url(#gold-grad)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Top-right spark accent -->
  <path
    d="
      M 380 110
      Q 380 145, 345 145
      Q 380 145, 380 180
      Q 380 145, 415 145
      Q 380 145, 380 110 Z
    "
    fill="url(#gold-grad)"
    opacity="0.95"
  />
</svg>
