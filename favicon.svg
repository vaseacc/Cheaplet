<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#388E3C" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.2"/>
        </filter>
    </defs>
    <!-- Green Gradient Circle -->
    <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" />
    <!-- Yellow 'C' -->
    <text x="256" y="360" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="320" font-weight="900" fill="#FFD700" text-anchor="middle" filter="url(#shadow)">C</text>
</svg>
