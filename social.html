<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Community - Cheaplet</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --text: #e2e8f0;
            --accent: #C8A96E;
            --muted: #64748b;
            --gold: #C8A96E;
            --ink: #0C1446;
            --deep: #2B5C92;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --font-display: 'Playfair Display', Georgia, serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── HEADER FIX (Matches Global Marketplace Header) ── */
        header { 
            position: sticky; top: 0; z-index: 200; 
            background: #0b0e14 !important; 
            border-bottom: 1px solid rgba(255,255,255,0.1) !important; 
            flex-shrink: 0; 
        }
        .header-inner { 
            max-width: 1280px !important; /* MATCHES OTHER PAGES */
            margin: 0 auto; 
            padding: 0 28px !important; 
            height: 68px !important; 
            display: flex; align-items: center; justify-content: space-between; 
        }
        
        /* THE LOGO FIX */
        .logo { 
            font-family: var(--font-display) !important; 
            font-size: 1.6rem !important; 
            font-weight: 900 !important; 
            color: #FFFFFF !important; 
            text-decoration: none !important; 
            letter-spacing: -0.5px !important; 
        }
        .logo em { color: var(--gold) !important; font-style: normal !important; }

        /* ── LAYOUT ── */
        .layout { max-width: 1000px; margin: 30px auto; display: grid; grid-template-columns: 280px 1fr; gap: 30px; padding: 0 20px; }

        /* ── SIDEBAR ── */
        .sidebar { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 15px; }
        .school-card { background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #2d3748; }
        .school-card h2 { font-size: 1.1rem; color: var(--text); font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .school-card h2 i { color: var(--gold); }
        
        .topics-menu { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #2d3748; padding: 10px; }
        .topic-title { font-size: 0.75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 10px 15px; }
        .way-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-weight: 600; display: flex; align-items: center; gap: 12px; color: var(--text); }
        .way-item:hover { background: #1e2532; color: var(--gold); }
        .way-item.active { background: #1e2532; color: var(--gold); font-weight: 700; border-left: 3px solid var(--gold); border-radius: 0 10px 10px 0; }
        .way-item i { width: 20px; text-align: center; color: var(--muted); }
        .way-item.active i { color: var(--gold); }

        .btn-new-topic { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: none; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .btn-new-topic:hover { color: var(--text); background: #1e2532; border-radius: 10px; }

        /* ── MOBILE WAYS BAR ── */
        .mobile-ways-bar { display: none; background: var(--card); border-bottom: 1px solid #2d3748; padding: 10px 15px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #1e2532; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-right: 8px; cursor: pointer; border: 1px solid transparent; }
        .m-way-pill.active { background: var(--gold); color: var(--ink); border-color: var(--gold); }
        .m-school-header { display: none; padding: 15px; background: var(--card); border-bottom: 1px solid #2d3748; font-weight: 700; color: var(--text); align-items: center; gap: 8px; }

        /* ── FEED COLUMN ── */
        .feed-column { display: flex; flex-direction: column; gap: 20px; }

        /* ── COMPOSER ── */
        .composer-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #2d3748; padding: 20px; }
        .composer-top { display: flex; gap: 15px; }
        .composer-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #eee; border: 2px solid var(--gold); }
        .composer-input { flex-grow: 1; border: none; font-family: inherit; font-size: 1.1rem; color: white; resize: none; outline: none; padding-top: 10px; min-height: 60px; background: transparent; }
        .composer-input::placeholder { color: #64748b; }
        .composer-bottom { display: flex; justify-content: flex-end; align-items: center; border-top: 1px solid #2d3748; padding-top: 15px; margin-top: 10px; }
        .btn-post { background: var(--gold); color: var(--ink); border: none; padding: 10px 25px; border-radius: 50px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(200, 169, 110, 0.2); }
        .btn-post:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(200, 169, 110, 0.4); }
        .btn-post:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── POST CARDS ── */
        .posts-container { display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
        .post-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #2d3748; padding: 25px; animation: fadeUp 0.4s ease both; }
        .post-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; background: #1e2532; object-fit: cover; }
        .post-meta { display: flex; flex-direction: column; }
        .post-author { font-weight: 800; color: white; font-size: 1rem; }
        .post-time { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
        .post-body { font-size: 1.05rem; color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
        
        .post-actions { display: flex; gap: 25px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #2d3748; }
        .action-btn { background: none; border: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .action-btn:hover { color: var(--gold); }
        .action-btn.liked { color: #e53e3e; }
        .action-btn.liked:hover { color: #c53030; }
        .action-btn i { font-size: 1.2rem; }

        .loader-msg { text-align: center; padding: 40px; color: var(--muted); font-size: 1.1rem; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 768px) {
            nav { display: none; }
            .layout { grid-template-columns: 1fr; padding: 0; gap: 0; margin: 0; }
            .sidebar { display: none; } 
            .m-school-header { display: flex; } 
            .mobile-ways-bar { display: block; position: sticky; top: 68px; z-index: 150; } 
            .feed-column { gap: 10px; background: var(--bg); padding-top: 10px; }
            .composer-card { border-radius: 0; border-left: none; border-right: none; }
            .post-card { border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Cheap<em>let</em></a>
            <nav>
                <ul>
                    <li><a href="/search.html" id="nav-browse">Browse</a></li>
                    <li><a href="/my-listings.html" id="nav-listings">My Listings</a></li>
                    <li><a href="/messages.html" id="nav-messages">Messages</a></li>
                </ul>
            </nav>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- MOBILE HEADERS -->
    <div class="m-school-header"><i class="fas fa-university" style="color:var(--gold);"></i> <span id="m-user-school">Loading...</span></div>
    <div class="mobile-ways-bar" id="mobile-ways-list">
        <div class="m-way-pill active" id="m-way-general" onclick="window.selectWay('general')"># General</div>
    </div>

    <div class="layout">
        
        <!-- DESKTOP SIDEBAR -->
        <aside class="sidebar">
            <div class="school-card">
                <h2 id="school-title"><i class="fas fa-university"></i> <span id="d-user-school">Loading...</span></h2>
            </div>
            
            <div class="topics-menu">
                <div class="topic-title" id="ui-topics">Campus Topics</div>
                <div id="desktop-ways-list">
                    <div class="way-item active" id="d-way-general" onclick="window.selectWay('general')">
                        <i class="fas fa-hashtag"></i> <span id="ui-general-way">General</span>
                    </div>
                </div>
                <button class="btn-new-topic" id="btn-create-way"><i class="fas fa-plus-circle"></i> <span id="ui-btn-new-way">Create Topic</span></button>
            </div>
        </aside>

        <!-- MAIN FEED -->
        <main class="feed-column">
            
            <!-- POST COMPOSER -->
            <div class="composer-card">
                <div class="composer-top">
                    <img src="" id="composer-pfp" class="composer-avatar">
                    <textarea class="composer-input" id="post-input" placeholder="What's happening on campus?"></textarea>
                </div>
                <div class="composer-bottom">
                    <button class="btn-post" id="btn-send-post" data-i18n="btn_post">Post</button>
                </div>
            </div>

            <!-- POSTS FEED -->
            <div class="posts-container" id="posts-container">
                <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i> Loading feed...</div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, query, where, onSnapshot, orderBy, updateDoc, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            // --- BILINGUAL UI ---
            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: { navB: "Browse", navL: "My Listings", navM: "Messages", topics: "Topics", gen: "General", newTopic: "Create Topic", postPlace: "What's happening on campus?", btnPost: "Post", promptWay: "Enter a new topic name:", noPosts: "No posts yet. Be the first to share something!" },
                fr: { navB: "Parcourir", navL: "Mes Annonces", navM: "Messages", topics: "Sujets", gen: "Général", newTopic: "Nouveau Sujet", postPlace: "Que se passe-t-il sur le campus ?", btnPost: "Publier", promptWay: "Entrez un nom pour le nouveau sujet :", noPosts: "Aucune publication. Soyez le premier à partager !" }
            };

            document.getElementById('nav-browse').textContent = ui[lang].navB;
            document.getElementById('nav-listings').textContent = ui[lang].navL;
            document.getElementById('nav-messages').textContent = ui[lang].navM;
            document.getElementById('ui-topics').textContent = ui[lang].topics;
            document.getElementById('ui-general-way').textContent = ui[lang].gen;
            document.getElementById('m-way-general').innerHTML = `# ${ui[lang].gen}`;
            document.getElementById('ui-btn-new-way').textContent = ui[lang].newTopic;
            document.getElementById('post-input').placeholder = ui[lang].postPlace;
            document.getElementById('btn-send-post').textContent = ui[lang].btnPost;

            let currentUser = null;
            let userSchool = "Campus Community"; 
            let currentWayId = "general";
            let unsubscribePosts = null;

            const desktopWaysList = document.getElementById('desktop-ways-list');
            const mobileWaysList = document.getElementById('mobile-ways-list');
            const postsContainer = document.getElementById('posts-container');
            const postInput = document.getElementById('post-input');
            const btnSendPost = document.getElementById('btn-send-post');

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        currentUser = { ...user, ...data };
                        userSchool = data.schoolName || "Campus Community";
                        
                        document.getElementById('d-user-school').textContent = userSchool;
                        document.getElementById('m-user-school').textContent = userSchool;

                        let pfpUrl = data.photoURL;
                        if (!pfpUrl || pfpUrl.includes("googleusercontent") || pfpUrl.includes("live.com")) {
                            pfpUrl = `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=151921`;
                        }
                        document.getElementById('composer-pfp').src = pfpUrl;
                        
                        loadCustomWays();
                        loadPosts("general");
                    }
                } else {
                    window.location.href = '/LoginInToCheaplet.html';
                }
            });

            function loadCustomWays() {
                const q = query(collection(db, "social_channels"), where("schoolName", "==", userSchool), orderBy("createdAt", "asc"));
                onSnapshot(q, (snapshot) => {
                    const dGeneral = document.getElementById('d-way-general');
                    desktopWaysList.innerHTML = '';
                    desktopWaysList.appendChild(dGeneral);

                    const mGeneral = document.getElementById('m-way-general');
                    mobileWaysList.innerHTML = '';
                    mobileWaysList.appendChild(mGeneral);

                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        
                        const dItem = document.createElement('div');
                        dItem.className = `way-item ${currentWayId === docSnap.id ? 'active' : ''}`;
                        dItem.id = `d-way-${docSnap.id}`;
                        dItem.innerHTML = `<i class="fas fa-hashtag"></i> <span>${d.name}</span>`;
                        dItem.onclick = () => window.selectWay(docSnap.id);
                        desktopWaysList.appendChild(dItem);

                        const mItem = document.createElement('div');
                        mItem.className = `m-way-pill ${currentWayId === docSnap.id ? 'active' : ''}`;
                        mItem.id = `m-way-${docSnap.id}`;
                        mItem.textContent = `# ${d.name}`;
                        mItem.onclick = () => window.selectWay(docSnap.id);
                        mobileWaysList.appendChild(mItem);
                    });

                    const mNew = document.createElement('div');
                    mNew.className = 'm-way-pill';
                    mNew.innerHTML = `<i class="fas fa-plus"></i> ${ui[lang].newTopic}`;
                    mNew.onclick = triggerNewWay;
                    mobileWaysList.appendChild(mNew);
                });
            }

            window.selectWay = (wayId) => {
                currentWayId = wayId;
                
                document.querySelectorAll('.way-item').forEach(el => el.classList.remove('active'));
                const dEl = document.getElementById(`d-way-${wayId}`) || document.getElementById('d-way-general');
                if (dEl) dEl.classList.add('active');

                document.querySelectorAll('.m-way-pill').forEach(el => el.classList.remove('active'));
                const mEl = document.getElementById(`m-way-${wayId}`) || document.getElementById('m-way-general');
                if (mEl) mEl.classList.add('active');

                loadPosts(wayId);
            };

            const triggerNewWay = async () => {
                const wayName = prompt(ui[lang].promptWay);
                if (!wayName || wayName.trim().length < 2) return;

                try {
                    const newRef = await addDoc(collection(db, "social_channels"), {
                        name: wayName.trim().substring(0, 30),
                        schoolName: userSchool,
                        createdBy: currentUser.uid,
                        createdAt: serverTimestamp()
                    });
                    window.selectWay(newRef.id);
                } catch (e) { alert("Error creating topic. " + e.message); }
            };
            document.getElementById('btn-create-way').onclick = triggerNewWay;

            function loadPosts(wayId) {
                if (unsubscribePosts) unsubscribePosts();
                postsContainer.innerHTML = `<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i></div>`;

                const q = query(
                    collection(db, "social_posts"), 
                    where("schoolName", "==", userSchool),
                    where("wayId", "==", wayId),
                    orderBy("timestamp", "desc")
                );

                unsubscribePosts = onSnapshot(q, (snapshot) => {
                    postsContainer.innerHTML = '';
                    if (snapshot.empty) {
                        postsContainer.innerHTML = `<div class="loader-msg">${ui[lang].noPosts}</div>`;
                        return;
                    }

                    const frag = document.createDocumentFragment();
                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        
                        let pfp = d.authorPhoto;
                        if (!pfp || pfp.includes("googleusercontent") || pfp.includes("live.com")) {
                            pfp = `https://api.dicebear.com/7.x/identicon/svg?seed=${d.authorUid}&backgroundColor=151921`;
                        }

                        let timeStr = "Just now";
                        if (d.timestamp) {
                            const dateObj = d.timestamp.toDate();
                            const now = new Date();
                            const diffMs = now - dateObj;
                            const diffMins = Math.round(diffMs / 60000);
                            const diffHrs = Math.round(diffMs / 3600000);
                            const diffDays = Math.round(diffMs / 86400000);
                            
                            if (diffMins < 1) timeStr = lang === 'fr' ? "À l'instant" : "Just now";
                            else if (diffMins < 60) timeStr = lang === 'fr' ? `Il y a ${diffMins} min` : `${diffMins}m`;
                            else if (diffHrs < 24) timeStr = lang === 'fr' ? `Il y a ${diffHrs} h` : `${diffHrs}h`;
                            else timeStr = lang === 'fr' ? `Il y a ${diffDays} j` : `${diffDays}d`;
                        }

                        const isLiked = d.likedBy && d.likedBy.includes(auth.currentUser.uid);

                        const card = document.createElement('div');
                        card.className = 'post-card';
                        card.innerHTML = `
                            <div class="post-header">
                                <img src="${pfp}" class="post-avatar">
                                <div class="post-meta">
                                    <span class="post-author">${d.authorName}</span>
                                    <span class="post-time">${timeStr}</span>
                                </div>
                            </div>
                            <div class="post-text">${d.text}</div>
                            <div class="post-actions">
                                <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.likePost('${docSnap.id}', ${isLiked})">
                                    <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${d.likes || 0}
                                </button>
                            </div>
                        `;
                        frag.appendChild(card);
                    });
                    postsContainer.appendChild(frag);
                });
            }

            btnSendPost.onclick = async () => {
                const text = postInput.value.trim();
                if (!text) return;
                
                btnSendPost.disabled = true;
                postInput.value = '';
                postInput.style.height = '60px'; // Reset composer height

                try {
                    let photoToSave = currentUser.photoURL;
                    if (!photoToSave || photoToSave.includes("googleusercontent") || photoToSave.includes("live.com")) {
                        photoToSave = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}&backgroundColor=151921`;
                    }

                    await addDoc(collection(db, "social_posts"), {
                        wayId: currentWayId,
                        schoolName: userSchool,
                        text: text,
                        authorUid: currentUser.uid,
                        authorName: currentUser.displayName || "User",
                        authorPhoto: photoToSave,
                        likes: 0,
                        likedBy: [],
                        timestamp: serverTimestamp()
                    });
                } catch (e) { alert("Error posting. " + e.message); }
                
                btnSendPost.disabled = false;
            };

            // Auto-resize textarea
            postInput.addEventListener('input', function() {
                this.style.height = '60px';
                this.style.height = (this.scrollHeight) + 'px';
                if (this.value.trim() === '') this.style.height = '60px';
            });

            // Global Like function
            window.likePost = async (id, alreadyLiked) => {
                const ref = doc(db, "social_posts", id);
                if(alreadyLiked) {
                    await updateDoc(ref, { likes: increment(-1), likedBy: arrayRemove(auth.currentUser.uid) });
                } else {
                    await updateDoc(ref, { likes: increment(1), likedBy: arrayUnion(auth.currentUser.uid) });
                }
            };
        }
        main();
    </script>
</body>
</html>
