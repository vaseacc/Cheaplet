<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheaplet Community</title>
    <script type="module" src="global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --text: #e2e8f0;
            --accent: #C8A96E;
            --muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── HEADER (Injected by global.js) ── */
        header { background: #0b0e14 !important; border-bottom: 1px solid #2d3748 !important; }

        .layout { max-width: 900px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 200px 1fr; gap: 30px; }

        /* ── SIDEBAR ── */
        .sidebar { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 100px; }
        .sidebar-title { font-size: 0.7rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
        .way-item { color: #94a3b8; font-weight: 500; padding: 10px 0; cursor: pointer; transition: 0.2s; }
        .way-item:hover { color: var(--gold); }
        .way-item.active { color: var(--gold); font-weight: 700; }

        /* ── FEED ── */
        .feed { display: flex; flex-direction: column; gap: 20px; }
        .composer { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid #2d3748; }
        .composer textarea { width: 100%; background: transparent; border: none; color: white; font-size: 1.1rem; outline: none; resize: none; min-height: 60px; }
        .composer button { background: var(--gold); color: var(--ink); border: none; padding: 8px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; float: right; }

        /* ── POSTS ── */
        .post { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid #2d3748; }
        .post-author { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2d3748; }
        .author-info { font-size: 0.9rem; }
        .author-name { font-weight: 700; color: white; display: block; }
        .post-body { font-size: 1rem; line-height: 1.5; color: #cbd5e1; }

        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <header><div class="header-inner"><a href="/index.html" class="logo">Cheap<em>let</em></a><nav><ul></ul></nav><div class="header-right"></div></div></header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-title" id="ui-ways-title">Topics</div>
            <div id="ways-list">
                <div class="way-item active" onclick="window.selectWay('general')"># General</div>
            </div>
            <button id="btn-create-way" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:5px; border-radius:5px; cursor:pointer;">+ New Topic</button>
        </aside>

        <section class="feed">
            <div class="composer">
                <textarea id="post-input" placeholder="Share something with your campus..."></textarea>
                <div class="composer-bottom"><button id="btn-send-post">Post</button></div>
            </div>
            <div id="posts-container"></div>
        </section>
    </div>

    <script type="module">
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        const db = getFirestore();
        const auth = getAuth();
        let currentWay = "general";

        // Handle Posting
        document.getElementById('btn-send-post').onclick = async () => {
            const input = document.getElementById('post-input');
            if(!input.value.trim()) return;
            await addDoc(collection(db, "social_posts"), {
                text: input.value,
                wayId: currentWay,
                authorName: auth.currentUser.displayName,
                authorUid: auth.currentUser.uid,
                timestamp: serverTimestamp()
            });
            input.value = '';
        };

        // Load Feed
        function loadPosts(way) {
            currentWay = way;
            const q = query(collection(db, "social_posts"), where("wayId", "==", way), orderBy("timestamp", "desc"));
            onSnapshot(q, (snap) => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    container.innerHTML += `
                        <div class="post">
                            <div class="post-author">
                                <div class="avatar"></div>
                                <div class="author-info"><span class="author-name">${d.authorName}</span></div>
                            </div>
                            <p class="post-body">${d.text}</p>
                        </div>
                    `;
                });
            });
        }
        window.selectWay = loadPosts;
        loadPosts("general");
    </script>
</body>
</html>
