<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Hub — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        /* Navigation for Desktop */
        nav ul { display: flex; list-style: none; gap: 25px; align-items: center; }
        nav ul li a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
        nav ul li a:hover { color: #fff; }

        /* ── RESTRICTED ACCESS SCREEN ── */
        .locked-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 68px); padding: 20px; text-align: center; }
        .locked-card { background: var(--white); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); max-width: 450px; width: 100%; animation: fadeUp 0.4s ease both; }
        .locked-icon { font-size: 3rem; color: var(--red); margin-bottom: 20px; }
        .locked-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 15px; }
        .locked-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .btn-locked { background: var(--gold); color: var(--ink); border: none; padding: 12px 30px; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-locked:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(200, 169, 110, 0.4); }

        /* ── MAIN LAYOUT ── */
        .hub-layout { display: none; max-width: 1100px; margin: 30px auto; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; padding: 0 20px; align-items: start; width: 100%; }

        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .school-header { margin-bottom: 10px; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
        .school-sub { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; }
        .topics-menu { display: flex; flex-direction: column; gap: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 10px; }
        .way-item { padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); transition: all 0.2s; font-size: 0.95rem; text-decoration: none; position: relative; }
        .way-item:hover { background: #f1f5f9; color: var(--deep); }
        .way-item.active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); border: var(--border); font-weight: 700; }
        .way-item i.fa-thumbtack { position: absolute; right: 10px; font-size: 0.7rem; color: var(--gold); }
        
        /* ── MOBILE TOPICS BAR REDESIGN ── */
        .mobile-topics-wrapper { display: none; position: sticky; top: 68px; z-index: 150; background: var(--white); border-bottom: var(--border); width: 100%; align-items: center; padding-right: 10px; }
        .mobile-ways-bar { display: flex; padding: 12px 10px 12px 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-grow: 1; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 10px; cursor: pointer; border: var(--border); transition: 0.2s; text-decoration: none; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .mobile-fade { width: 30px; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1)); position: absolute; right: 90px; pointer-events: none; }
        
        .m-hub-controls { display: flex; gap: 8px; flex-shrink: 0; }
        .m-icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--off-white); border: var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .m-icon-btn:hover { color: var(--deep); border-color: var(--deep); background: #f1f5f9; }

        /* ── SEARCH HUB BAR ── */
        .social-search-bar { display: flex; align-items: center; background: var(--white); border: var(--border); border-radius: 30px; padding: 5px 15px; box-shadow: var(--shadow); margin-bottom: -5px; transition: border-color 0.2s; }
        .social-search-bar:focus-within { border-color: var(--deep); }
        .social-search-input { flex-grow: 1; border: none; outline: none; padding: 10px; font-family: inherit; font-size: 0.95rem; background: transparent; color: var(--text-main); }

        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; width: 100%; min-width: 0; overflow-x: hidden; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); width: 100%; display: flex; gap: 15px; align-items: flex-start; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-input-wrapper { flex-grow: 1; position: relative; background: var(--off-white); border: 1px solid #e2e8f0; border-radius: 24px; padding: 5px 15px; display: flex; align-items: flex-end; transition: border-color 0.2s, background 0.2s; }
        .composer-input-wrapper:focus-within { border-color: var(--deep); background: var(--white); }
        .composer-input { flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 1rem; color: var(--text-main); resize: none; outline: none; padding: 10px 0; min-height: 40px; max-height: 150px; }
        .btn-composer-send { background: var(--deep); color: var(--white); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; margin-left: 10px; transition: 0.2s; flex-shrink: 0; }
        .btn-composer-send:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* ── POST CARDS ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; overflow: visible; position: relative; }
        .post-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .post-author-link { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); }
        
        .post-menu-container { position: relative; }
        .post-menu-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 5px 10px; border-radius: 50%; }
        .post-dropdown { position: absolute; right: 0; top: 35px; background: var(--white); border: var(--border); border-radius: 12px; box-shadow: var(--shadow-md); width: 160px; display: none; flex-direction: column; z-index: 100; overflow: hidden; }
        .post-dropdown.show { display: flex; }
        .post-dropdown-item { padding: 12px 15px; background: none; border: none; text-align: left; font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; }
        .post-dropdown-item:hover { background: var(--surface); }

        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; margin-bottom: 15px; }
        .post-image-attachment { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; }

        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .action-btn.liked { color: var(--red); }

        /* ── TOPIC EXPLORER MODAL (Smart Mobile Solution) ── */
        .explorer-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.4); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: flex-end; }
        .explorer-sheet { background: var(--white); width: 100%; border-radius: 24px 24px 0 0; padding: 25px 20px; max-height: 85vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); animation: sheetUp 0.3s ease-out; }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .explorer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; background: white; z-index: 5; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .explorer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .explorer-item { display: flex; flex-direction: column; gap: 8px; padding: 15px; background: var(--off-white); border-radius: 16px; border: 1.5px solid #e2e8f0; text-decoration: none; color: inherit; position: relative; }
        .explorer-item.is-pinned { border-color: var(--gold); background: #fffcf5; }
        .pin-btn { position: absolute; top: 10px; right: 10px; color: #cbd5e1; cursor: pointer; font-size: 0.9rem; }
        .pin-btn.active { color: var(--gold); }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); }
        .loader-msg i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 850px) {
            .hub-layout { display: flex; flex-direction: column; padding: 0; gap: 0; margin: 0; }
            .sidebar { display: none; }
            nav { display: none; }
            .mobile-topics-wrapper { display: flex; }
            .feed-column { gap: 8px; padding: 8px 0 60px; }
            .composer { padding: 15px; border-radius: 0; border-left: none; border-right: none; }
            .post-card { padding: 16px 15px; border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <nav>
                <ul>
                    <li><a href="/search.html" data-i18n="nav_browse">Browse</a></li>
                    <li><a href="/my-listings.html" data-i18n="nav_listings">My Listings</a></li>
                    <li><a href="/social.html" data-i18n="nav_hub">Campus Hub</a></li>
                    <li><a href="/messages.html" data-i18n="nav_messages">Messages</a></li>
                </ul>
            </nav>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- MOBILE TOPICS BAR -->
    <div class="mobile-topics-wrapper" id="mobile-topics-wrapper">
        <div class="mobile-ways-bar" id="mobile-ways-list">
            <!-- Pinned & General injected here -->
        </div>
        <div class="mobile-fade"></div>
        <div class="m-hub-controls">
            <button class="m-icon-btn" id="m-btn-explorer" title="All Topics"><i class="fas fa-th-large"></i></button>
            <button class="m-icon-btn" id="m-btn-create-way"><i class="fas fa-plus"></i></button>
        </div>
    </div>

    <div class="hub-layout" id="hub-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="school-header">
                <div class="school-name" id="d-user-school">Campus</div>
                <div class="school-sub">Community Hub</div>
            </div>
            
            <div class="topics-menu">
                <div class="topic-section-title" data-i18n="topics_public">Channels</div>
                <div id="desktop-ways-list">
                    <a href="/social.html" class="way-item active">
                        <i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span>
                    </a>
                </div>
                <button class="btn-new-way" onclick="window.location.href='/createtopic.html'"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>
            </div>
        </aside>

        <!-- MAIN FEED -->
        <main class="feed-column">
            
            <div class="social-search-bar">
                <i class="fas fa-search" style="color:var(--text-muted); margin-left:5px;"></i>
                <input type="text" class="social-search-input" id="social-search-input" data-i18n-placeholder="search_social_place" placeholder="Search posts, topics, people...">
            </div>

            <div class="composer" id="composer-card">
                <img src="" id="composer-pfp" class="composer-pfp" alt="Avatar">
                <div class="composer-input-wrapper">
                    <textarea class="composer-input" id="post-input" data-i18n-placeholder="post_placeholder" placeholder="What's happening?"></textarea>
                    <button class="btn-composer-send" id="btn-send-post" disabled><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="feed-container">
                <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i> <br><span id="ui-loading" data-i18n="loading_hub">Loading...</span></div>
            </div>
        </main>
    </div>

    <!-- LOCKED SCREEN -->
    <div class="locked-screen" id="locked-screen">
        <div class="locked-card">
            <i class="fas fa-lock locked-icon"></i>
            <h2 class="locked-title" id="ui-locked-title">Verified Access</h2>
            <p class="locked-desc" id="ui-locked-desc">Join the community! Login with your school email to access the Campus Hub.</p>
            <a href="/LoginInToCheaplet.html?redirect=/social.html" class="btn-locked" id="ui-locked-btn">Get Started</a>
        </div>
    </div>

    <!-- TOPIC EXPLORER SHEET (MOBILE) -->
    <div class="explorer-overlay" id="explorer-overlay">
        <div class="explorer-sheet">
            <div class="explorer-header">
                <h2 style="font-family:'Playfair Display', serif;" data-i18n="topics_public">Explore Topics</h2>
                <i class="fas fa-times close-modal" id="close-explorer" style="cursor:pointer; font-size:1.5rem;"></i>
            </div>
            <input type="text" class="social-search-input" id="explorer-search" style="border:1px solid #eee; border-radius:12px; margin-bottom:10px; width:100%;" placeholder="Search all topics...">
            <div class="explorer-grid" id="explorer-grid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, limit, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: { search_social_place: "Search posts, topics...", loading_hub: "Syncing campus feed...", noPosts: "The feed is quiet. Start the conversation!", justNow: "Just now", post_placeholder: "What's on your mind?", msg_del_confirm: "Delete post permanently?", kick: "Remove User", pin: "Pin Topic", unpin: "Unpin" },
                fr: { search_social_place: "Rechercher messages, sujets...", loading_hub: "Synchronisation du flux...", noPosts: "Le flux est calme. Commencez la conversation !", justNow: "À l'instant", post_placeholder: "Quoi de neuf ?", msg_del_confirm: "Supprimer définitivement ?", kick: "Bannir", pin: "Épingler", unpin: "Désépingler" }
            }[lang];

            let currentUser = null;
            let internalSchoolName = "Global Campus"; 
            let pinnedTopics = JSON.parse(localStorage.getItem('pinned_topics') || '[]');

            const postInput = document.getElementById('post-input');
            const btnSendPost = document.getElementById('btn-send-post');
            const feedContainer = document.getElementById('feed-container');

            // --- NAVIGATION LOGIC ---
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        if (!data.isStudent && data.role !== 'admin') { showLockedScreen(); return; }
                        currentUser = { ...user, ...data };
                        internalSchoolName = data.schoolName || "Global Campus";
                        document.getElementById('d-user-school').textContent = internalSchoolName;
                        document.getElementById('composer-pfp').src = data.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=EBF2FA`;
                        showHubLayout();
                        loadTopics();
                        loadFeed();
                    }
                } else { showLockedScreen(); }
            });

            function showLockedScreen() {
                document.getElementById('hub-layout').style.display = 'none';
                document.getElementById('mobile-topics-wrapper').style.display = 'none';
                document.getElementById('locked-screen').style.display = 'flex';
            }

            function showHubLayout() {
                document.getElementById('locked-screen').style.display = 'none';
                document.getElementById('hub-layout').style.display = (window.innerWidth > 850) ? 'grid' : 'flex';
                if(window.innerWidth <= 850) document.getElementById('mobile-topics-wrapper').style.display = 'flex';
            }

            // --- TOPICS LOADING (SMART) ---
            function loadTopics() {
                const q = query(collection(db, "social_channels"), orderBy("postCount", "desc"));
                onSnapshot(q, (snapshot) => {
                    const dList = document.getElementById('desktop-ways-list');
                    const mList = document.getElementById('mobile-ways-list');
                    const expGrid = document.getElementById('explorer-grid');
                    
                    // Keep general
                    const generalHtml = `<a href="/social.html" class="way-item active"><i class="fas fa-globe-americas"></i> <span>Campus Public</span></a>`;
                    const mGeneralHtml = `<a href="/social.html" class="m-way-pill active"><i class="fas fa-globe-americas"></i> <span>Campus Public</span></a>`;
                    
                    dList.innerHTML = generalHtml;
                    mList.innerHTML = mGeneralHtml;
                    expGrid.innerHTML = '';

                    const channels = [];
                    snapshot.forEach(docSnap => channels.push({ id: docSnap.id, ...docSnap.data() }));

                    // Sort: Pinned first
                    channels.sort((a,b) => pinnedTopics.includes(b.id) - pinnedTopics.includes(a.id));

                    channels.forEach(ch => {
                        if (ch.visibility === 'private' && ch.createdBy !== currentUser.uid && !currentUser.role === 'admin') return;
                        
                        const isPinned = pinnedTopics.includes(ch.id);
                        const count = formatCount(ch.postCount);
                        const pinIcon = isPinned ? '<i class="fas fa-thumbtack"></i>' : '';

                        // Sidebar
                        const dItem = document.createElement('a');
                        dItem.className = 'way-item';
                        dItem.href = `/topic.html?id=${ch.id}`;
                        dItem.innerHTML = `<i class="fas fa-hashtag"></i> <span>${ch.name}</span> ${pinIcon} <span class="way-count">${count}</span>`;
                        dList.appendChild(dItem);

                        // Mobile Bar (Show General + Pinned)
                        if (isPinned) {
                            const mItem = document.createElement('a');
                            mItem.className = 'm-way-pill';
                            mItem.href = `/topic.html?id=${ch.id}`;
                            mItem.innerHTML = `<i class="fas fa-hashtag"></i> ${ch.name}`;
                            mList.appendChild(mItem);
                        }

                        // Explorer Grid
                        const expItem = document.createElement('div');
                        expItem.className = `explorer-item ${isPinned ? 'is-pinned' : ''}`;
                        expItem.innerHTML = `
                            <a href="/topic.html?id=${ch.id}" style="text-decoration:none; color:inherit;">
                                <div class="topic-name"><i class="fas fa-hashtag"></i> ${ch.name}</div>
                                <div style="font-size:0.75rem; color:#888;">${count} posts</div>
                            </a>
                            <i class="fas fa-thumbtack pin-btn ${isPinned ? 'active' : ''}" onclick="window.togglePin('${ch.id}')"></i>
                        `;
                        expGrid.appendChild(expItem);
                    });
                });
            }

            window.togglePin = (id) => {
                if (pinnedTopics.includes(id)) pinnedTopics = pinnedTopics.filter(t => t !== id);
                else pinnedTopics.push(id);
                localStorage.setItem('pinned_topics', JSON.stringify(pinnedTopics));
                loadTopics();
            };

            // --- MOBILE HUB CONTROLS ---
            document.getElementById('m-btn-explorer').onclick = () => document.getElementById('explorer-overlay').style.display = 'flex';
            document.getElementById('close-explorer').onclick = () => document.getElementById('explorer-overlay').style.display = 'none';
            document.getElementById('m-btn-create-way').onclick = () => window.location.href = '/createtopic.html';

            // --- FEED LOADING ---
            function loadFeed() {
                feedContainer.innerHTML = `<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br><span>${ui.loading_hub}</span></div>`;
                const q = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(100));
                onSnapshot(q, (snapshot) => {
                    feedContainer.innerHTML = '';
                    let filtered = snapshot.docs.filter(d => d.data().wayId === 'general');
                    if (currentUser.role !== 'admin') {
                        filtered = filtered.filter(d => d.data().schoolName === internalSchoolName || d.data().schoolName === "Global Campus");
                    }
                    if (filtered.length === 0) { feedContainer.innerHTML = `<div class="loader-msg">${ui.noPosts}</div>`; return; }
                    filtered.forEach(docSnap => feedContainer.appendChild(renderPost(docSnap)));
                });
            }

            function renderPost(docSnap) {
                const d = docSnap.data();
                const id = docSnap.id;
                const card = document.createElement('div');
                card.className = 'post-card';
                const canDel = currentUser && (currentUser.uid === d.authorUid || currentUser.role === 'admin');
                
                card.innerHTML = `
                    <div class="post-header-top">
                        <a href="/user.html?id=${d.authorUid}" class="post-author-link">
                            <img src="${d.authorPhoto}" class="post-avatar">
                            <div class="post-meta">
                                <span class="post-author">${d.authorName}</span>
                                <span class="post-time">${d.timestamp ? formatTime(d.timestamp.toDate()) : ui.justNow} ${d.edited ? ui.edited_label : ''}</span>
                            </div>
                        </a>
                        <div class="post-menu-container">
                            <button class="post-menu-btn" onclick="window.toggleMenu('${id}')"><i class="fas fa-ellipsis-h"></i></button>
                            <div class="post-dropdown" id="dropdown-${id}">
                                ${canDel ? `<button class="post-dropdown-item" style="color:var(--red);" onclick="window.deletePost('${id}')"><i class="fas fa-trash"></i> Delete</button>` : ''}
                                <button class="post-dropdown-item" onclick="window.reportPost('${id}')"><i class="fas fa-flag"></i> Report</button>
                            </div>
                        </div>
                    </div>
                    <div class="post-body">${d.text}</div>
                    ${d.imageUrl ? `<img src="${d.imageUrl}" class="post-image-attachment" onclick="window.open('${d.imageUrl}')">` : ''}
                    <div class="post-actions">
                        <button class="action-btn" onclick="window.likePost('${id}')"><i class="far fa-heart"></i> ${d.likes || 0}</button>
                        <button class="action-btn" onclick="window.toggleComments('${id}')"><i class="far fa-comment"></i> ${d.commentCount || 0}</button>
                    </div>
                `;
                return card;
            }

            // --- HELPERS ---
            window.toggleMenu = (id) => {
                const drop = document.getElementById(`dropdown-${id}`);
                const open = drop.style.display === 'flex';
                document.querySelectorAll('.post-dropdown').forEach(d => d.style.display = 'none');
                drop.style.display = open ? 'none' : 'flex';
            };

            window.deletePost = async (id) => {
                if(confirm(ui.msg_del_confirm)) await deleteDoc(doc(db, "social_posts", id));
            };

            postInput.oninput = function() {
                btnSendPost.disabled = this.value.trim() === "";
                this.style.height = "44px";
                this.style.height = this.scrollHeight + "px";
            };

            btnSendPost.onclick = async () => {
                const text = postInput.value.trim();
                btnSendPost.disabled = true;
                await addDoc(collection(db, "social_posts"), {
                    wayId: 'general', schoolName: internalSchoolName, text, authorUid: currentUser.uid, 
                    authorName: currentUser.displayName, authorPhoto: currentUser.photoURL,
                    likes: 0, likedBy: [], commentCount: 0, timestamp: serverTimestamp()
                });
                postInput.value = ""; postInput.style.height = "44px";
            };

            function formatTime(date) {
                const diff = Math.round((new Date() - date) / 60000);
                if (diff < 60) return lang === 'fr' ? `${diff}m` : `${diff}m`;
                if (diff < 1440) return Math.round(diff/60) + "h";
                return Math.round(diff/1440) + "d";
            }
            function formatCount(n) { return n > 999 ? (n/1000).toFixed(1)+'k' : n; }
        }
        main();
    </script>
</body>
</html>
