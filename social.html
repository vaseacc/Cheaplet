<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cheaplet — Campus Hub</title>
    <!-- We keep the script call for when you move to Netlify, but it won't crash CodePen -->
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F4F7FC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #1a2a4a;
            --text-muted:#6b84a3;
            --radius: 16px;
            --shadow: 0 4px 15px rgba(12,20,70,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; }

        /* ── HEADER ── */
        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: #fff; text-decoration: none; }
        .logo em { color: var(--gold); font-style: normal; }

        .header-right-demo { display: flex; align-items: center; gap: 10px; }
        .btn-demo { background: var(--gold); color: var(--ink); border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

        /* ── HUB LAYOUT ── */
        .hub-layout { max-width: 1000px; margin: 20px auto; display: grid; grid-template-columns: 1fr 300px; gap: 25px; padding: 0 15px; align-items: start; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 18px; margin-bottom: 25px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        .composer-top { display: flex; gap: 12px; align-items: center; }
        .composer-pfp { width: 42px; height: 42px; border-radius: 50%; background: #eee; border: 2px solid var(--gold); }
        .composer-btn { flex-grow: 1; background: var(--off-white); border: 1px solid #e2e8f0; padding: 12px 20px; border-radius: 25px; color: var(--text-muted); text-align: left; cursor: pointer; font-size: 0.95rem; }

        /* ── SOCIAL POST CARD ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; animation: fadeUp 0.4s ease both; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #EBF2FA; border: 1.5px solid var(--gold); }
        .post-author { font-weight: 700; font-size: 1rem; color: var(--ink); }
        .post-time { font-size: 0.75rem; color: var(--text-muted); }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; }
        
        .post-actions { display: flex; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .action-btn.liked i { color: #e53e3e; }

        /* ── MARKETPLACE BREAK ── */
        .market-break { margin: 30px -15px; padding: 25px 15px; background: var(--ink); color: #fff; }
        .break-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .break-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 800; color: var(--gold); }
        .break-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .break-scroll::-webkit-scrollbar { display: none; }
        
        .mini-book-card { flex: 0 0 160px; background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .mini-img { height: 120px; background-size: cover; background-position: center; background-color: #333; }
        .mini-info { padding: 10px; }
        .mini-price { font-weight: 800; font-size: 0.9rem; color: var(--gold); }
        .mini-title { font-size: 0.75rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ── SIDEBAR ── */
        .sidebar { position: sticky; top: 90px; }
        .widget { background: #fff; border-radius: var(--radius); padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: var(--shadow); }
        .widget-title { font-weight: 800; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .widget-title i { color: var(--gold); }
        .campus-name { font-weight: 700; color: var(--ink); font-size: 1.1rem; margin-bottom: 5px; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 850px) {
            .hub-layout { grid-template-columns: 1fr; padding: 0; }
            .sidebar { display: none; }
            .composer, .post-card { border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="#" class="logo">Cheap<em>let</em></a>
            <div class="header-right-demo">
                <button class="btn-demo">Log In</button>
            </div>
        </div>
    </header>

    <div class="hub-layout">
        <main>
            <!-- Composer -->
            <div class="composer">
                <div class="composer-top">
                    <img src="https://api.dicebear.com/7.x/identicon/svg?seed=user&backgroundColor=F4F7FC" class="composer-pfp">
                    <div class="composer-btn">What's happening on campus?</div>
                </div>
            </div>

            <!-- Feed Container -->
            <div id="feed-container">
                <!-- Data will be injected here -->
            </div>
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="widget">
                <div class="widget-title"><i class="fas fa-university"></i> Your Campus</div>
                <div class="campus-name">Collège de Rosemont</div>
                <div style="color:var(--gold); font-weight:bold; font-size:0.9rem;"><i class="fas fa-star"></i> 4.9 Reputation</div>
                <button style="width:100%; margin-top:15px; background:var(--ink); color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">List a Book</button>
            </div>

            <div class="widget">
                <div class="widget-title"><i class="fas fa-shield-alt"></i> Safe Trade</div>
                <p style="font-size:0.8rem; color:var(--text-muted); line-height:1.5;">Cheaplet works best when you meet on campus. Always use the internal chat for safety.</p>
            </div>
        </aside>
    </div>

    <script type="module">
        // --- DEMO DATA ENGINE ---
        const demoPosts = [
            { authorName: "Alexandre D.", text: "Just listed my Macroeconomics textbook for half price. Perfect condition! 📚", authorUid: "a1" },
            { authorName: "Sarah L.", text: "Anyone want to form a study group for the Bio final next week? Meeting at the library at 4pm! ☕", authorUid: "s2" },
            { authorName: "Kevin M.", text: "Does anyone know if the cafeteria is open late today?", authorUid: "k3" }
        ];

        const demoBooks = [
            { title: "Psychology 101", price: 45.00, img: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=200&q=80" },
            { title: "Organic Chemistry", price: 89.00, img: "https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=200&q=80" },
            { title: "Calculus Vol. 2", price: 30.00, img: "https://images.unsplash.com/photo-1589998059171-988d887df646?auto=format&fit=crop&w=200&q=80" },
            { title: "Modern History", price: 25.00, img: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=200&q=80" }
        ];

        function renderDemoFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            // Render 2 posts
            demoPosts.slice(0, 2).forEach(p => container.appendChild(createPostCard(p)));

            // Render Market Break
            const marketBreak = document.createElement('div');
            marketBreak.className = 'market-break';
            let bookHtml = demoBooks.map(b => `
                <div class="mini-book-card">
                    <div class="mini-img" style="background-image:url('${b.img}')"></div>
                    <div class="mini-info">
                        <div class="mini-price">$${b.price.toFixed(2)}</div>
                        <div class="mini-title">${b.title}</div>
                    </div>
                </div>
            `).join('');
            
            marketBreak.innerHTML = `
                <div class="break-header"><span class="break-title">Suggested Books</span><span style="color:var(--gold); font-size:0.8rem; font-weight:700;">See All</span></div>
                <div class="break-scroll">${bookHtml}</div>
            `;
            container.appendChild(marketBreak);

            // Render remaining post
            container.appendChild(createPostCard(demoPosts[2]));
        }

        function createPostCard(p) {
            const div = document.createElement('div');
            div.className = 'post-card';
            div.innerHTML = `
                <div class="post-header">
                    <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${p.authorUid}&backgroundColor=EBF2FA" class="post-avatar">
                    <div class="post-meta">
                        <div class="post-author">${p.authorName}</div>
                        <div class="post-time">Recently</div>
                    </div>
                </div>
                <div class="post-body">${p.text}</div>
                <div class="post-actions">
                    <button class="action-btn" onclick="this.classList.toggle('liked')"><i class="fas fa-heart"></i> Like</button>
                    <button class="action-btn"><i class="fas fa-comment"></i> Comment</button>
                </div>
            `;
            return div;
        }

        // Run Demo on load
        window.addEventListener('DOMContentLoaded', renderDemoFeed);
    </script>
</body>
</html>
