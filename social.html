<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Hub — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── RESTRICTED ACCESS SCREEN ── */
        .locked-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 68px); padding: 20px; text-align: center; }
        .locked-card { background: var(--white); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); max-width: 450px; width: 100%; animation: fadeUp 0.4s ease both; }
        .locked-icon { font-size: 3rem; color: var(--red); margin-bottom: 20px; }
        .locked-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 15px; }
        .locked-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .btn-locked { background: var(--gold); color: var(--ink); border: none; padding: 12px 30px; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-locked:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(200, 169, 110, 0.4); }

        /* ── MAIN LAYOUT ── */
        .hub-layout { display: none; max-width: 1100px; margin: 30px auto; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; padding: 0 20px; align-items: start; width: 100%; }

        /* ── SIDEBAR ── */
        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 5px; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .school-header { margin-bottom: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
        .verified-check { color: var(--green); font-size: 1rem; margin-left: 4px; }
        .school-sub { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; width: 100%; }
        
        .topics-menu { display: flex; flex-direction: column; gap: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 10px; }
        .way-item { padding: 8px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); transition: all 0.2s; font-size: 0.95rem; text-decoration: none; }
        .way-item:hover { background: #f1f5f9; color: var(--deep); }
        .way-item.active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); border: var(--border); font-weight: 700; }
        .way-item i { width: 20px; text-align: center; color: var(--text-muted); font-size: 1.1rem; }
        .way-item.active i { color: var(--gold); }
        .way-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); background: var(--off-white); padding: 2px 8px; border-radius: 12px; font-weight: 700; }

        .btn-new-way { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: 1.5px dashed #cbd5e1; border-radius: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-top: 10px; }
        .btn-new-way:hover { color: var(--deep); border-color: var(--deep); background: #f8fafc; }

        /* ── MOBILE TOPICS BAR ── */
        .mobile-topics-wrapper { display: none; position: sticky; top: 68px; z-index: 150; background: var(--white); border-bottom: var(--border); width: 100%; align-items: center; }
        .mobile-ways-bar { display: flex; padding: 12px 10px 12px 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-grow: 1; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 10px; cursor: pointer; border: var(--border); transition: 0.2s; text-decoration: none; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .m-way-count { opacity: 0.6; font-size: 0.75rem; margin-left: 4px; }
        
        .m-menu-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--off-white); border: var(--border); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-right: 15px; z-index: 2; transition: 0.2s; font-size: 1.1rem; }

        /* ── BOTTOM SHEET (MOBILE) ── */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.6); backdrop-filter: blur(4px); z-index: 10050; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10051; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
        .sheet-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .sheet-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); }
        .close-sheet { background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; }
        .sheet-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; width: 100%; min-width: 0; overflow-x: hidden; }

        /* ── FILTER BAR ── */
        .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; background: var(--white); border-radius: 30px; padding: 5px 15px; width: fit-content; border: var(--border); box-shadow: var(--shadow); }
        .filter-bar span { font-size: 0.85rem; color: var(--text-muted); }
        .school-filter { background: none; border: none; padding: 8px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .school-filter.active { background: var(--ink); color: white; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); width: 100%; display: flex; gap: 15px; align-items: flex-start; flex-direction: row; position: relative; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-content { flex-grow: 1; display: flex; flex-direction: column; background: var(--off-white); border: 1px solid #e2e8f0; border-radius: 18px; padding: 5px; transition: border-color 0.2s, background 0.2s; }
        .composer-content:focus-within { border-color: var(--deep); background: var(--white); }
        .composer-input { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 1.05rem; color: var(--text-main); resize: none; outline: none; padding: 10px 15px; min-height: 44px; max-height: 200px; }
        .composer-preview-area { display: none; padding: 10px 15px; border-top: 1px dashed #cbd5e1; gap: 10px; flex-wrap: wrap; }
        .composer-actions { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; }
        .btn-composer-send { background: var(--deep); color: var(--white); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; margin-bottom: 5px; margin-left: 10px; }
        .btn-composer-send:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        /* Restricted Shield for Rosemont posting */
        #composer-shield { position: absolute; inset: 0; z-index: 10; cursor: pointer; display: none; }

        /* ── POST CARDS ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; position: relative; }
        .post-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .post-author-link { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); }
        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; word-wrap: break-word; margin-bottom: 15px; }
        .post-image-attachment { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; cursor: pointer; border: 1px solid #eee; }
        .post-actions { display: flex; gap: 25px; margin-top: 5px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .action-btn.liked { color: #e53e3e; }

        .market-break { margin: 10px 0; padding: 25px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); width: 100%; }
        .break-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .break-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--ink); }
        .break-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .mini-book-card { flex: 0 0 160px; background: var(--white); border: var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--text-main); }
        .mini-img { height: 120px; background-size: cover; background-position: center; }
        .mini-info { padding: 10px; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.9); backdrop-filter: blur(6px); z-index: 10020; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: white; border-radius: 24px; padding: 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-card i { font-size: 3rem; color: var(--gold); margin-bottom: 20px; }
        .btn-modal { padding: 12px 30px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; background: var(--gold); color: var(--ink); text-decoration: none; display: inline-block; margin-top: 20px; }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 850px) {
            .hub-layout { display: flex; flex-direction: column; padding: 0; margin: 0; }
            .sidebar { display: none; }
            .mobile-topics-wrapper { display: flex; }
            .feed-column { padding: 10px 0 60px; }
            .post-card, .composer, .market-break { border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="mobile-topics-wrapper" id="mobile-topics-wrapper">
        <div class="mobile-ways-bar" id="mobile-ways-list">
            <a href="/social.html" class="m-way-pill active"><i class="fas fa-globe-americas"></i> Global Feed</a>
        </div>
        <button class="m-menu-btn" id="m-btn-open-menu"><i class="fas fa-bars"></i></button>
    </div>

    <div class="sheet-overlay" id="sheet-overlay"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-title">Topics Directory</div>
            <button class="close-sheet" id="close-sheet-btn">&times;</button>
        </div>
        <div class="sheet-content" id="mobile-topic-list"></div>
    </div>

    <div id="restricted-modal" class="modal-overlay">
        <div class="modal-card">
            <i class="fas fa-graduation-cap"></i>
            <h2>Verified Student Required</h2>
            <p>To post in the official Collège de Rosemont feed or create custom topics, you need a verified student account.</p>
            <a href="/LoginInToCheaplet.html" class="btn-modal">Create School Account</a>
            <button class="btn-modal" style="background: #eee; margin-left: 10px;" onclick="document.getElementById('restricted-modal').style.display='none'">Close</button>
        </div>
    </div>

    <div class="hub-layout" id="hub-layout">
        <aside class="sidebar">
            <div class="school-header">
                <div class="school-name" id="d-user-school">Campus Hub</div>
                <div class="school-sub">Community Feed</div>
            </div>
            <div class="topics-menu" id="desktop-topic-list"></div>
            <button class="btn-new-way" id="btn-create-topic"><i class="fas fa-plus"></i> Create Topic</button>
        </aside>

        <main class="feed-column">
            <div id="filter-bar" class="filter-bar">
                <span><i class="fas fa-filter"></i> Filter:</span>
                <button class="school-filter active" data-filter="all">Global Campus</button>
                <button class="school-filter" data-filter="my" id="my-school-filter">Collège de Rosemont</button>
            </div>

            <div class="composer" id="composer-card">
                <div id="composer-shield"></div>
                <img src="" id="composer-pfp" class="composer-pfp">
                <div class="composer-content">
                    <textarea class="composer-input" id="post-input" placeholder="What's happening?"></textarea>
                    <div class="composer-preview-area" id="composer-preview-area"></div>
                    <div class="composer-actions">
                        <div class="composer-tools">
                            <button class="tool-btn" id="btn-attach-img"><i class="fas fa-image"></i></button>
                            <input type="file" id="post-img-upload" accept="image/*" style="display:none;">
                        </div>
                        <button class="btn-composer-send" id="btn-send-post" disabled><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div id="feed-container"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, limit, getDocs, deleteDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const feedContainer = document.getElementById('feed-container');
            const postInput = document.getElementById('post-input');
            const btnSendPost = document.getElementById('btn-send-post');
            const myFilterBtn = document.getElementById('my-school-filter');
            const allFilterBtn = document.querySelector('.school-filter[data-filter="all"]');
            const resModal = document.getElementById('restricted-modal');
            const shield = document.getElementById('composer-shield');

            let currentUser = null;
            let currentSchoolFilter = 'all'; 
            let unsubscribePosts = null;
            let listings = [];

            // --- AUTH LOGIC ---
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        currentUser = { ...user, ...uSnap.data() };
                        document.getElementById('composer-pfp').src = currentUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}`;
                        if (document.getElementById('d-user-school')) document.getElementById('d-user-school').textContent = currentUser.schoolName || "Global Hub";
                        
                        showHub();
                        loadFeed();
                        preloadBooks();
                    }
                } else {
                    window.location.href = '/LoginInToCheaplet.html?redirect=/social.html&msg=social';
                }
            });

            function showHub() {
                document.getElementById('hub-layout').style.display = window.innerWidth <= 850 ? 'flex' : 'grid';
                if (window.innerWidth <= 850) document.getElementById('mobile-topics-wrapper').style.display = 'flex';
                updatePostingPermissions();
            }

            function updatePostingPermissions() {
                // If filtering by Rosemont but user isn't verified, block the composer
                const isRosemontFeed = currentSchoolFilter === 'my';
                const isVerified = currentUser && currentUser.isStudent === true;

                if (isRosemontFeed && !isVerified) {
                    shield.style.display = 'block';
                    postInput.placeholder = "Read-only: Verified account required to post here.";
                } else {
                    shield.style.display = 'none';
                    postInput.placeholder = isRosemontFeed ? "Post to Collège de Rosemont..." : "Post to Global Campus...";
                }
            }

            shield.onclick = () => resModal.style.display = 'flex';
            document.getElementById('btn-create-topic').onclick = () => {
                if (currentUser && currentUser.isStudent === true) window.location.href = '/createtopic.html';
                else resModal.style.display = 'flex';
            };

            // --- FILTER LOGIC ---
            allFilterBtn.onclick = () => {
                currentSchoolFilter = 'all';
                allFilterBtn.classList.add('active');
                myFilterBtn.classList.remove('active');
                updatePostingPermissions();
                loadFeed();
            };
            myFilterBtn.onclick = () => {
                currentSchoolFilter = 'my';
                myFilterBtn.classList.add('active');
                allFilterBtn.classList.remove('active');
                updatePostingPermissions();
                loadFeed();
            };

            // --- FEED LOGIC ---
            function loadFeed() {
                if (unsubscribePosts) unsubscribePosts();
                feedContainer.innerHTML = '<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br>Loading feed...</div>';

                // Use the dedicated Rosemont collection or general posts
                const collectionName = currentSchoolFilter === 'my' ? "social_rosemont" : "social_posts";
                const q = query(collection(db, collectionName), orderBy("timestamp", "desc"), limit(50));

                unsubscribePosts = onSnapshot(q, (snapshot) => {
                    feedContainer.innerHTML = '';
                    if (snapshot.empty) {
                        feedContainer.innerHTML = '<div class="loader-msg">No posts yet. Be the first!</div>';
                        return;
                    }
                    let count = 0;
                    snapshot.forEach(docSnap => {
                        feedContainer.appendChild(createPostEl(docSnap.id, docSnap.data(), collectionName));
                        count++;
                        if (count === 3 && listings.length > 0) feedContainer.appendChild(createMarketBreak());
                    });
                });
            }

            function createPostEl(id, d, coll) {
                const card = document.createElement('div');
                card.className = 'post-card';
                const time = d.timestamp ? formatTime(d.timestamp.toDate()) : "Just now";
                const isLiked = currentUser && d.likedBy && d.likedBy.includes(currentUser.uid);
                
                card.innerHTML = `
                    <div class="post-header-top">
                        <div class="post-author-link">
                            <img src="${d.authorPhoto}" class="post-avatar">
                            <div class="post-meta">
                                <span class="post-author">${d.authorName}</span>
                                <span class="post-time">${time}</span>
                            </div>
                        </div>
                    </div>
                    <div class="post-body">${d.text}</div>
                    ${d.imageUrl ? `<img src="${d.imageUrl}" class="post-image-attachment">` : ''}
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.like('${coll}', '${id}', ${isLiked})">
                            <i class="fas fa-heart"></i> ${d.likes || 0}
                        </button>
                    </div>
                `;
                return card;
            }

            // --- POSTING LOGIC ---
            btnSendPost.onclick = async () => {
                const text = postInput.value.trim();
                if (!text || !currentUser) return;

                btnSendPost.disabled = true;
                const coll = currentSchoolFilter === 'my' ? "social_rosemont" : "social_posts";
                
                try {
                    await addDoc(collection(db, coll), {
                        text,
                        authorUid: currentUser.uid,
                        authorName: currentUser.displayName,
                        authorPhoto: currentUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}`,
                        schoolName: currentSchoolFilter === 'my' ? "Collège de Rosemont" : "Global Campus",
                        likes: 0, likedBy: [], timestamp: serverTimestamp()
                    });
                    postInput.value = '';
                    btnSendPost.disabled = false;
                } catch(e) { alert("Error posting."); btnSendPost.disabled = false; }
            };

            postInput.oninput = () => btnSendPost.disabled = postInput.value.trim().length === 0;

            window.like = async (coll, id, hasLiked) => {
                const ref = doc(db, coll, id);
                await updateDoc(ref, {
                    likes: increment(hasLiked ? -1 : 1),
                    likedBy: hasLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
                });
            };

            async function preloadBooks() {
                const snap = await getDocs(query(collection(db, "listings"), where("status", "==", "active"), limit(6)));
                listings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }

            function createMarketBreak() {
                const div = document.createElement('div');
                div.className = 'market-break';
                let books = '';
                listings.forEach(b => {
                    books += `<a href="/listing.html?id=${b.id}" class="mini-book-card">
                        <div class="mini-img" style="background-image:url('${b.imageUrls[0]}')"></div>
                        <div class="mini-info"><div class="mini-price">$${b.price}</div></div>
                    </a>`;
                });
                div.innerHTML = `<div class="break-header"><span class="break-title">Campus Market</span></div><div class="break-scroll">${books}</div>`;
                return div;
            }

            function formatTime(date) {
                const diff = Math.round((new Date() - date) / 60000);
                if (diff < 60) return `${diff}m`;
                if (diff < 1440) return `${Math.round(diff/60)}h`;
                return `${Math.round(diff/1440)}d`;
            }
        }
        main();
    </script>
</body>
</html>
