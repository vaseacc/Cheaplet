<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Hub — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── MOBILE TOPICS NAVIGATION (ADVANCED) ── */
        .mobile-topics-wrapper { display: none; position: sticky; top: 68px; z-index: 150; background: var(--white); border-bottom: var(--border); width: 100%; align-items: center; }
        
        .m-menu-toggle { width: 45px; height: 50px; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 1.2rem; cursor: pointer; border-right: 1px solid #f1f5f9; flex-shrink: 0; }

        .mobile-ways-bar { display: flex; padding: 10px 10px 10px 15px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-grow: 1; align-items: center; gap: 8px; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border: var(--border); transition: 0.2s; text-decoration: none; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .m-way-pill i.fa-thumbtack { font-size: 0.7rem; color: var(--gold); transform: rotate(45deg); }

        .mobile-fade { width: 40px; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1)); position: absolute; right: 50px; pointer-events: none; }
        .m-create-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: var(--ink); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-right: 12px; z-index: 2; transition: 0.2s; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(200, 169, 110, 0.3); }

        /* ── TOPICS DRAWER ── */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; backdrop-filter: blur(2px); }
        .topics-drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--white); z-index: 1001; transition: transform 0.3s ease; display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
        .topics-drawer.open { transform: translateX(280px); }
        .drawer-header { padding: 25px 20px; border-bottom: var(--border); display: flex; align-items: center; justify-content: space-between; }
        .drawer-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); }
        .drawer-close { font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        .drawer-body { flex-grow: 1; overflow-y: auto; padding: 15px 10px; }

        .drawer-section-title { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 10px; display: flex; align-items: center; gap: 8px; }
        .drawer-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 12px; text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.95rem; transition: 0.2s; }
        .drawer-item:hover { background: #f1f5f9; }
        .drawer-item.active { background: #f0f7ff; color: var(--deep); }
        .drawer-item i { width: 20px; text-align: center; color: var(--text-muted); }
        .pin-btn { margin-left: auto; color: #cbd5e1; cursor: pointer; padding: 5px; transition: 0.2s; }
        .pin-btn:hover, .pin-btn.active { color: var(--gold); }

        /* ── HUB LAYOUT ── */
        .hub-layout { display: none; max-width: 1100px; margin: 30px auto; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; padding: 0 20px; align-items: start; width: 100%; }
        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; width: 100%; min-width: 0; overflow-x: hidden; }

        /* ── RESTRICTED ACCESS SCREEN ── */
        .locked-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 68px); padding: 20px; text-align: center; }
        .locked-card { background: var(--white); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); max-width: 450px; width: 100%; animation: fadeUp 0.4s ease both; }
        .locked-icon { font-size: 3rem; color: var(--red); margin-bottom: 20px; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); width: 100%; display: flex; gap: 15px; align-items: flex-start; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-content { flex-grow: 1; display: flex; flex-direction: column; background: var(--off-white); border: 1px solid #e2e8f0; border-radius: 18px; padding: 5px; }
        .composer-input { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 1rem; color: var(--text-main); resize: none; outline: none; padding: 10px 15px; min-height: 40px; max-height: 200px; }
        .btn-composer-send { background: var(--deep); color: var(--white); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .btn-composer-send:disabled { background: #cbd5e1; }

        /* ── POST CARDS ── */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; position: relative; }
        .post-actions { display: flex; gap: 25px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        .social-search-bar { display: flex; align-items: center; background: var(--white); border: var(--border); border-radius: 30px; padding: 5px 15px; box-shadow: var(--shadow); margin-bottom: -5px; }
        .social-search-input { flex-grow: 1; border: none; outline: none; padding: 10px; font-family: inherit; font-size: 0.95rem; background: transparent; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 850px) {
            .hub-layout { display: flex; flex-direction: column; padding: 0; margin: 0; width: 100%; }
            .sidebar { display: none; }
            .mobile-topics-wrapper { display: flex; }
            .feed-column { gap: 8px; padding: 8px 0 60px; }
            .composer, .post-card, .market-break { border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- MOBILE TOPICS NAV -->
    <div class="mobile-topics-wrapper" id="mobile-topics-wrapper">
        <div class="m-menu-toggle" id="m-drawer-open"><i class="fas fa-bars"></i></div>
        <div class="mobile-ways-bar" id="mobile-ways-list">
            <!-- Pinned & Trending Topics injected here -->
        </div>
        <div class="mobile-fade"></div>
        <button class="m-create-btn" id="m-btn-create-way"><i class="fas fa-plus"></i></button>
    </div>

    <!-- SIDE DRAWER -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="topics-drawer" id="topics-drawer">
        <div class="drawer-header">
            <div class="drawer-title">Community Hub</div>
            <div class="drawer-close" id="m-drawer-close"><i class="fas fa-times"></i></div>
        </div>
        <div class="drawer-body" id="drawer-list">
            <!-- Categories: Pinned, My Topics, All Topics -->
        </div>
    </div>

    <div class="hub-layout" id="hub-layout">
        <aside class="sidebar">
            <div class="school-header">
                <div class="school-name" id="d-user-school">Campus</div>
                <div class="school-sub">Community Hub</div>
            </div>
            <div class="topics-menu">
                <div class="topic-section-title">All Channels</div>
                <div id="desktop-ways-list"></div>
                <button class="btn-new-way" id="btn-create-way"><i class="fas fa-plus"></i> <span>Create Topic</span></button>
            </div>
        </aside>

        <main class="feed-column">
            <div class="social-search-bar">
                <i class="fas fa-search" style="color:var(--text-muted); margin-left:5px;"></i>
                <input type="text" class="social-search-input" id="social-search-input" placeholder="Search hub...">
                <button class="social-search-btn" id="btn-social-search"><i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="composer" id="composer-card">
                <img src="" id="composer-pfp" class="composer-pfp">
                <div class="composer-content">
                    <textarea class="composer-input" id="post-input" placeholder="What's happening?"></textarea>
                    <div class="composer-actions">
                        <div class="composer-tools">
                            <button class="tool-btn" id="btn-attach-img"><i class="fas fa-image"></i></button>
                            <button class="tool-btn" id="btn-attach-listing"><i class="fas fa-book"></i></button>
                        </div>
                        <button class="btn-composer-send" id="btn-send-post" disabled><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
            <div id="feed-container"></div>
        </main>
    </div>

    <!-- LOCKED SCREEN -->
    <div class="locked-screen" id="locked-screen">
        <div class="locked-card">
            <i class="fas fa-lock locked-icon"></i>
            <h2 class="locked-title">Restricted Access</h2>
            <p class="locked-desc">The Hub is for verified students. Please log in with your school email.</p>
            <a href="/LoginInToCheaplet.html?redirect=/social.html" class="btn-locked">Log In</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, doc, getDoc, limit } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            let internalSchoolName = "Global Campus";
            let pinnedTopics = JSON.parse(localStorage.getItem('pinned_topics') || '[]');

            // --- DRAWER LOGIC ---
            const drawer = document.getElementById('topics-drawer');
            const overlay = document.getElementById('drawer-overlay');
            const openBtn = document.getElementById('m-drawer-open');
            const closeBtn = document.getElementById('m-drawer-close');

            const toggleDrawer = (open) => {
                drawer.classList.toggle('open', open);
                overlay.style.display = open ? 'block' : 'none';
            };
            openBtn.onclick = () => toggleDrawer(true);
            closeBtn.onclick = () => toggleDrawer(false);
            overlay.onclick = () => toggleDrawer(false);

            // --- AUTH & LOCK ---
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        if (!data.isStudent && data.role !== 'admin') { document.getElementById('locked-screen').style.display='flex'; return; }
                        currentUser = { ...user, ...data };
                        internalSchoolName = data.schoolName || "Global Campus";
                        document.getElementById('hub-layout').style.display='grid';
                        document.getElementById('composer-pfp').src = data.photoURL || 'https://api.dicebear.com/7.x/identicon/svg?seed='+user.uid;
                        loadTopics();
                        // (Feed logic skipped for brevity, remains same as your previous working code)
                    }
                } else { document.getElementById('locked-screen').style.display='flex'; }
            });

            // --- TOPICS LOADING ---
            function loadTopics() {
                onSnapshot(query(collection(db, "social_channels"), orderBy("postCount", "desc")), (snapshot) => {
                    const desktopList = document.getElementById('desktop-ways-list');
                    const mobileList = document.getElementById('mobile-ways-list');
                    const drawerList = document.getElementById('drawer-list');

                    desktopList.innerHTML = '';
                    mobileList.innerHTML = '';
                    drawerList.innerHTML = '';

                    const allTopics = [];
                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d.visibility === 'private' && d.createdBy !== currentUser.uid && (!d.members || !d.members.includes(currentUser.uid))) return;
                        allTopics.push({ id: docSnap.id, ...d });
                    });

                    // 1. PINNED SECTION
                    const pinned = allTopics.filter(t => pinnedTopics.includes(t.id));
                    if (pinned.length > 0) {
                        drawerList.innerHTML += `<div class="drawer-section-title"><i class="fas fa-thumbtack"></i> Pinned</div>`;
                        pinned.forEach(t => {
                            renderTopicItem(t, drawerList, mobileList, true);
                        });
                    }

                    // 2. MY TOPICS
                    const mine = allTopics.filter(t => t.createdBy === currentUser.uid);
                    drawerList.innerHTML += `<div class="drawer-section-title">My Topics</div>`;
                    mine.forEach(t => renderTopicItem(t, drawerList, null, false));

                    // 3. ALL TOPICS
                    drawerList.innerHTML += `<div class="drawer-section-title">Explore All</div>`;
                    allTopics.forEach(t => {
                        renderTopicItem(t, drawerList, mobileList, false);
                        renderTopicItem(t, desktopList, null, false);
                    });
                });
            }

            function renderTopicItem(t, container, mobileContainer, isPinned) {
                const isActive = window.location.search.includes(t.id);
                
                // Drawer Element
                if (container) {
                    const item = document.createElement('div');
                    item.className = `drawer-item ${isActive ? 'active' : ''}`;
                    item.innerHTML = `
                        <i class="fas fa-hashtag"></i>
                        <a href="/topic.html?id=${t.id}" style="text-decoration:none; color:inherit; flex-grow:1;">${t.name}</a>
                        <div class="pin-btn ${isPinned ? 'active' : ''}" onclick="window.togglePin('${t.id}')">
                            <i class="fas fa-thumbtack"></i>
                        </div>
                    `;
                    container.appendChild(item);
                }

                // Mobile Horizontal Bar (Only for Pinned or Top Trending)
                if (mobileContainer && (isPinned || mobileContainer.children.length < 8)) {
                    const pill = document.createElement('a');
                    pill.className = `m-way-pill ${isActive ? 'active' : ''}`;
                    pill.href = `/topic.html?id=${t.id}`;
                    pill.innerHTML = `${isPinned ? '<i class="fas fa-thumbtack"></i>' : ''} ${t.name}`;
                    mobileContainer.appendChild(pill);
                }
            }

            window.togglePin = (id) => {
                if (pinnedTopics.includes(id)) pinnedTopics = pinnedTopics.filter(p => p !== id);
                else pinnedTopics.push(id);
                localStorage.setItem('pinned_topics', JSON.stringify(pinnedTopics));
                loadTopics();
            };

            document.getElementById('m-btn-create-way').onclick = () => window.location.href='/createtopic.html';
            document.getElementById('btn-create-way').onclick = () => window.location.href='/createtopic.html';
        }
        main();
    </script>
</body>
</html>
