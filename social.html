<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Hub — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── RESTRICTED ACCESS SCREEN ── */
        .locked-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 68px); padding: 20px; text-align: center; }
        .locked-card { background: var(--white); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); max-width: 450px; width: 100%; animation: fadeUp 0.4s ease both; }
        .locked-icon { font-size: 3rem; color: var(--red); margin-bottom: 20px; }
        .locked-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 15px; }
        .locked-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .btn-locked { background: var(--gold); color: var(--ink); border: none; padding: 12px 30px; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-locked:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(200, 169, 110, 0.4); }

        /* ── MAIN LAYOUT ── */
        .hub-layout { display: none; max-width: 1100px; margin: 30px auto; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; padding: 0 20px; align-items: start; width: 100%; }
        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .school-header { margin-bottom: 10px; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
        .school-sub { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 10px; }
        .way-item { padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); transition: all 0.2s; font-size: 0.95rem; text-decoration: none; }
        .way-item:hover { background: #f1f5f9; color: var(--deep); }
        .way-item.active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); border: var(--border); font-weight: 700; }
        .way-item i { width: 20px; text-align: center; color: var(--text-muted); font-size: 1.1rem; }
        .way-item.active i { color: var(--gold); }
        .way-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); background: var(--off-white); padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .btn-new-way { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: 1.5px dashed #cbd5e1; border-radius: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-top: 10px; }
        .btn-new-way:hover { color: var(--deep); border-color: var(--deep); background: #f8fafc; }

        /* ── MOBILE TOPICS BAR REDESIGN ── */
        .mobile-topics-wrapper { display: none; position: sticky; top: 68px; z-index: 150; background: var(--white); border-bottom: var(--border); width: 100%; align-items: center; padding-right: 5px; }
        .mobile-hub-btn { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--ink); cursor: pointer; border-right: 1px solid #f1f5f9; flex-shrink: 0; }
        .mobile-ways-bar { display: flex; padding: 12px 10px 12px 10px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-grow: 1; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 10px; cursor: pointer; border: var(--border); transition: 0.2s; text-decoration: none; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .mobile-fade { width: 40px; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1)); position: absolute; right: 55px; pointer-events: none; }
        .m-create-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--off-white); border: var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; z-index: 2; transition: 0.2s; font-size: 1rem; }

        /* ── MOBILE NAVIGATOR OVERLAY ── */
        .navigator-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.4); backdrop-filter: blur(8px); z-index: 2000; display: none; }
        .navigator-drawer { position: absolute; top: 0; left: -100%; width: 85%; height: 100%; background: var(--white); box-shadow: 10px 0 30px rgba(0,0,0,0.1); transition: 0.3s ease; display: flex; flex-direction: column; }
        .navigator-drawer.open { left: 0; }
        .nav-header { padding: 25px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .nav-header h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--ink); }
        .nav-scroll-area { flex-grow: 1; overflow-y: auto; padding: 10px 20px 40px; }
        .nav-close { font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }

        /* ── COMPOSER ── */
        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); width: 100%; display: flex; gap: 15px; align-items: flex-start; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-content { flex-grow: 1; display: flex; flex-direction: column; background: var(--off-white); border: 1px solid #e2e8f0; border-radius: 18px; padding: 5px; transition: border-color 0.2s, background 0.2s; }
        .composer-input { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 1.05rem; color: var(--text-main); resize: none; outline: none; padding: 10px 15px; min-height: 44px; max-height: 200px; }
        .btn-composer-send { background: var(--deep); color: var(--white); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; margin-left: 10px; transition: 0.2s; flex-shrink: 0; }
        .btn-composer-send:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* ── SEARCH BAR ── */
        .social-search-bar { display: flex; align-items: center; background: var(--white); border: var(--border); border-radius: 30px; padding: 5px 15px; box-shadow: var(--shadow); margin-bottom: -5px; transition: border-color 0.2s; }
        .social-search-input { flex-grow: 1; border: none; outline: none; padding: 10px; font-family: inherit; font-size: 0.95rem; background: transparent; color: var(--text-main); }
        .social-search-btn { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }

        /* Feed */
        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; width: 100%; min-width: 0; overflow-x: hidden; }
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; overflow: visible; position: relative; }
        .post-author-link { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px; margin-bottom: 15px; transition: opacity 0.2s; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; flex-shrink: 0; }
        .post-meta { display: flex; flex-direction: column; overflow: hidden; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; word-wrap: break-word; width: 100%; margin-bottom: 15px; }
        .post-actions { display: flex; gap: 25px; margin-top: 5px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .action-btn.liked { color: var(--red); }

        /* Report Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.9); backdrop-filter: blur(6px); z-index: 10020; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: white; border-radius: 24px; padding: 32px; max-width: 420px; width: 100%; text-align: left; animation: fadeUp 0.3s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        @media (max-width: 850px) {
            .hub-layout { display: flex; flex-direction: column; padding: 0; gap: 0; margin: 0; width: 100%; }
            .sidebar { display: none; }
            .mobile-topics-wrapper { display: flex; }
            .feed-column { gap: 8px; padding: 8px 0 60px; background: var(--off-white); width: 100%; }
            .composer { padding: 15px; border-radius: 0; border-left: none; border-right: none; }
            .post-card { padding: 16px 15px; border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- LOCKED SCREEN -->
    <div class="locked-screen" id="locked-screen">
        <div class="locked-card">
            <i class="fas fa-lock locked-icon"></i>
            <h2 class="locked-title" id="ui-locked-title">Restricted Access</h2>
            <p class="locked-desc" id="ui-locked-desc">The Campus Hub is exclusive to verified students.</p>
            <a href="/LoginInToCheaplet.html?redirect=/social.html" class="btn-locked" id="ui-locked-btn">Log In</a>
        </div>
    </div>

    <!-- MOBILE TOPICS BAR -->
    <div class="mobile-topics-wrapper" id="mobile-topics-wrapper">
        <div class="mobile-hub-btn" id="btn-mobile-navigator"><i class="fas fa-th-large"></i></div>
        <div class="mobile-ways-bar" id="mobile-ways-list">
            <a href="/social.html" class="m-way-pill active"><i class="fas fa-globe-americas"></i> Campus Public</a>
        </div>
        <div class="mobile-fade"></div>
        <button class="m-create-btn" id="m-btn-create-way"><i class="fas fa-plus"></i></button>
    </div>

    <!-- MOBILE NAVIGATOR DRAWER -->
    <div class="navigator-overlay" id="nav-overlay">
        <div class="navigator-drawer" id="nav-drawer">
            <div class="nav-header">
                <h2 data-i18n="topics_nav">Topic Hub</h2>
                <div class="nav-close" id="nav-close">&times;</div>
            </div>
            <div class="nav-scroll-area" id="nav-content">
                <!-- Smart categories loaded here via JS -->
            </div>
        </div>
    </div>

    <div class="hub-layout" id="hub-layout">
        <aside class="sidebar">
            <div class="school-header"><div class="school-name" id="d-user-school">Campus</div><div class="school-sub">Community Hub</div></div>
            <div class="topics-menu">
                <div class="topic-section-title" data-i18n="topics_public">Public Channels</div>
                <div id="desktop-general-list">
                    <a href="/social.html" class="way-item active"><i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span></a>
                </div>
                <div class="topic-section-title" style="margin-top: 20px;" data-i18n="topics_custom">Custom Topics</div>
                <div id="desktop-ways-list"></div>
                <button class="btn-new-way" id="btn-create-way"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>
            </div>
        </aside>

        <main class="feed-column">
            <div class="social-search-bar">
                <i class="fas fa-search" style="color:var(--text-muted); margin-left:5px;"></i>
                <input type="text" class="social-search-input" id="social-search-input" placeholder="Search posts, topics, people...">
                <button class="social-search-btn" id="btn-social-search"><i class="fas fa-arrow-right"></i></button>
            </div>
            <div class="composer" id="composer-card">
                <img src="" id="composer-pfp" class="composer-pfp" alt="Avatar">
                <div class="composer-input-wrapper">
                    <textarea class="composer-input" id="post-input" placeholder="What's happening on campus?"></textarea>
                    <button class="btn-composer-send" id="btn-send-post" disabled><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
            <div id="feed-container"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, limit, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: { guest: "Campus Hub", topics_campus: "Campus Public", topics_new: "Create Topic", topics_public: "Public Channels", topics_custom: "Custom Topics", topics_my: "Created By Me", loading: "Loading...", justNow: "Just now", noPosts: "No posts yet." },
                fr: { guest: "Hub Campus", topics_campus: "Campus Public", topics_new: "Nouveau Sujet", topics_public: "Canaux Publics", topics_custom: "Sujets Personnalisés", topics_my: "Mes Sujets", loading: "Chargement...", justNow: "À l'instant", noPosts: "Aucun message." }
            }[lang];

            let currentUser = null;
            let internalSchoolName = "Global Campus"; 

            // --- MOBILE NAVIGATOR LOGIC ---
            const navOverlay = document.getElementById('nav-overlay');
            const navDrawer = document.getElementById('nav-drawer');
            const navContent = document.getElementById('nav-content');

            window.toggleNavigator = (open) => {
                if(open) { navOverlay.style.display = 'block'; setTimeout(() => navDrawer.classList.add('open'), 10); }
                else { navDrawer.classList.remove('open'); setTimeout(() => navOverlay.style.display = 'none', 300); }
            };
            document.getElementById('btn-mobile-navigator').onclick = () => toggleNavigator(true);
            document.getElementById('nav-close').onclick = () => toggleNavigator(false);
            navOverlay.onclick = (e) => { if(e.target === navOverlay) toggleNavigator(false); };

            // Auth & Lockdown
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        if (!data.isStudent && data.role !== 'admin') { showLockedScreen(); return; }
                        currentUser = { ...user, ...data };
                        internalSchoolName = data.schoolName || "Global Campus";
                        document.getElementById('composer-pfp').src = data.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=EBF2FA`;
                        showHubLayout(); loadTopics(); loadFeed();
                    }
                } else { showLockedScreen(); }
            });

            function showLockedScreen() { document.getElementById('hub-layout').style.display = 'none'; document.getElementById('locked-screen').style.display = 'flex'; }
            function showHubLayout() { document.getElementById('locked-screen').style.display = 'none'; document.getElementById('hub-layout').style.display = 'grid'; }

            function loadTopics() {
                const q = query(collection(db, "social_channels"), orderBy("postCount", "desc"));
                onSnapshot(q, (snapshot) => {
                    const deskList = document.getElementById('desktop-ways-list');
                    const mobList = document.getElementById('mobile-ways-list');
                    deskList.innerHTML = '';
                    mobList.innerHTML = '';
                    navContent.innerHTML = '';

                    // Sections for the Navigator
                    const myTopicsArr = [];
                    const otherTopicsArr = [];

                    const mGeneral = document.createElement('a');
                    mGeneral.className = 'm-way-pill active'; mGeneral.href = '/social.html';
                    mGeneral.innerHTML = `<i class="fas fa-globe-americas"></i> ${ui.topics_campus}`;
                    mobList.appendChild(mGeneral);

                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        const isPrivate = d.visibility === 'private';
                        const isOwner = currentUser && d.createdBy === currentUser.uid;
                        const isMember = currentUser && d.members && d.members.includes(currentUser.uid);
                        if (isPrivate && !isOwner && !isMember && currentUser.role !== 'admin') return;

                        const name = d.name;
                        const icon = isPrivate ? 'fas fa-lock' : 'fas fa-hashtag';
                        const displayCount = formatCount(d.postCount);

                        // Populate categorised arrays for the Navigator
                        if(isOwner) myTopicsArr.push({ id: docSnap.id, name, icon, count: displayCount });
                        else otherTopicsArr.push({ id: docSnap.id, name, icon, count: displayCount });

                        // Add to horizontal mobile bar (first few only)
                        if(mobList.children.length < 10) {
                            const mItem = document.createElement('a');
                            mItem.className = 'm-way-pill'; mItem.href = `/topic.html?id=${docSnap.id}`;
                            mItem.innerHTML = `<i class="${icon}"></i> ${name}`;
                            mobList.appendChild(mItem);
                        }

                        // Desktop Sidebar
                        const dItem = document.createElement('a');
                        dItem.className = 'way-item'; dItem.href = `/topic.html?id=${docSnap.id}`;
                        dItem.innerHTML = `<i class="${icon}"></i> <span style="flex-grow:1;">${name}</span> <span class="way-count">${displayCount}</span>`;
                        deskList.appendChild(dItem);
                    });

                    // Build the Vertical Mobile Navigator Content
                    const buildNavSection = (title, items) => {
                        if(items.length === 0) return;
                        const div = document.createElement('div');
                        div.innerHTML = `<div class="topic-section-title">${title}</div>`;
                        items.forEach(it => {
                            const link = document.createElement('a');
                            link.className = 'way-item'; link.href = `/topic.html?id=${it.id}`;
                            link.innerHTML = `<i class="${it.icon}"></i> <span style="flex-grow:1;">${it.name}</span> <span class="way-count">${it.count}</span>`;
                            div.appendChild(link);
                        });
                        navContent.appendChild(div);
                    };

                    buildNavSection(ui.topics_public, [{id: 'general', name: ui.topics_campus, icon: 'fas fa-globe-americas', count: ''}]);
                    buildNavSection(ui.topics_my, myTopicsArr);
                    buildNavSection(ui.topics_custom, otherTopicsArr);
                });
            }

            // Post Logic
            const postInput = document.getElementById('post-input');
            const btnSendPost = document.getElementById('btn-send-post');
            postInput.oninput = function() { this.style.height = '40px'; this.style.height = (this.scrollHeight) + 'px'; btnSendPost.disabled = (this.value.trim() === ''); };
            btnSendPost.onclick = async () => {
                const text = postInput.value.trim(); if(!text) return;
                btnSendPost.disabled = true; postInput.value = '';
                await addDoc(collection(db, "social_posts"), { wayId: 'general', schoolName: internalSchoolName, text, authorUid: currentUser.uid, authorName: currentUser.displayName, authorPhoto: currentUser.photoURL, likes: 0, likedBy: [], commentCount: 0, timestamp: serverTimestamp() });
            };

            function loadFeed() {
                const q = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(100));
                onSnapshot(q, (snapshot) => {
                    feedContainer.innerHTML = '';
                    const filtered = snapshot.docs.filter(d => d.data().wayId === 'general' && (d.data().schoolName === internalSchoolName || d.data().schoolName === "Global Campus"));
                    if(filtered.length === 0) { feedContainer.innerHTML = `<div class="loader-msg">${ui.noPosts}</div>`; return; }
                    filtered.forEach(docSnap => feedContainer.appendChild(renderPost(docSnap)));
                });
            }

            function renderPost(snap) {
                const d = snap.data();
                const card = document.createElement('div'); card.className = 'post-card';
                card.innerHTML = `<div class="post-body">${d.text}</div>`;
                return card;
            }

            document.getElementById('m-btn-create-way').onclick = () => window.location.href = '/createtopic.html';
            document.getElementById('btn-create-way').onclick = () => window.location.href = '/createtopic.html';
            document.getElementById('btn-social-search').onclick = () => { const q = document.getElementById('social-search-input').value.trim(); if(q) window.location.href = `/searchsocial.html?q=${q}`; };
        }
        main();
    </script>
</body>
</html>
