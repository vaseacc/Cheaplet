<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #e0e0e0; min-height: 100vh; }

        /* --- Security Overlay --- */
        #security-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            color: #0f0; font-family: 'Courier New', monospace;
        }

        /* --- Header --- */
        header { background-color: #2d2d2d; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4CAF50; }
        .logo { font-size: 20px; font-weight: bold; color: #4CAF50; letter-spacing: 1px; }
        .admin-badge { background: #4CAF50; color: black; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
        
        .nav-btn { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: color 0.2s; }
        .nav-btn:hover { color: white; }

        /* --- Dashboard --- */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h1 { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }

        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
        }

        /* --- Admin Card --- */
        .admin-card {
            background-color: #2d2d2d; border: 1px solid #444; border-radius: 8px; overflow: hidden;
            display: flex; flex-direction: column;
        }
        
        .card-header { padding: 10px; background: #333; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #aaa; }
        .user-link { color: #4CAF50; text-decoration: none; font-weight: bold; }
        .user-link:hover { text-decoration: underline; }

        .card-body { padding: 15px; flex-grow: 1; display: flex; gap: 10px; }
        .card-img { width: 80px; height: 80px; background: #000; object-fit: cover; border-radius: 4px; }
        .card-info { flex: 1; }
        .card-title { font-weight: bold; margin-bottom: 5px; color: white; font-size: 1.1rem; }
        .card-price { color: #FFD700; font-weight: bold; }
        .card-tags { font-size: 0.8rem; color: #888; margin-top: 5px; }

        /* --- Action Buttons --- */
        .card-actions {
            padding: 10px; background: #222; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .btn { border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }

        .btn-delete { background-color: #ff9800; color: black; } /* Orange */
        .btn-ban { background-color: #d32f2f; color: white; } /* Red */

    </style>
</head>
<body>

    <!-- SECURITY GATE -->
    <div id="security-screen">
        <i class="fas fa-shield-alt fa-3x" style="margin-bottom: 20px;"></i>
        <div>VERIFYING ADMIN CREDENTIALS...</div>
    </div>

    <!-- MAIN INTERFACE (Hidden initially) -->
    <div id="main-interface" style="display: none;">
        <header>
            <div class="logo">CHEAPLET <span class="admin-badge">ADMIN CENTER</span></div>
            <div>
                <a href="/index.html" class="nav-btn">Back to Site</a>
                <a href="#" id="logoutBtn" class="nav-btn">Logout</a>
            </div>
        </header>

        <main class="container">
            <h1>All Active Listings</h1>
            <div id="listings-grid" class="dashboard-grid">
                <!-- Cards injected here -->
                <p style="color: #666;">Loading listings...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, query, orderBy, deleteDoc, where, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            
            const app = initializeApp(config.firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const securityScreen = document.getElementById('security-screen');
            const mainInterface = document.getElementById('main-interface');
            const listingsGrid = document.getElementById('listings-grid');

            // --- 1. SECURITY CHECK ---
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists() && userDoc.data().role === 'admin') {
                            // ACCESS GRANTED
                            securityScreen.style.display = 'none';
                            mainInterface.style.display = 'block';
                            loadAllListings();
                        } else {
                            // ACCESS DENIED
                            alert("ACCESS DENIED: Admins only.");
                            window.location.href = '/index.html';
                        }
                    } catch (e) {
                        console.error(e);
                        window.location.href = '/index.html';
                    }
                } else {
                    window.location.href = '/LoginInToCheaplet.html';
                }
            });

            // --- 2. LOAD DATA ---
            async function loadAllListings() {
                listingsGrid.innerHTML = '';
                const q = query(collection(db, "listings"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    listingsGrid.innerHTML = '<p>No active listings found.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    renderAdminCard(doc);
                });
            }

            function renderAdminCard(docSnap) {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'admin-card';
                card.id = `card-${docSnap.id}`;

                const imgUrl = (data.imageUrls && data.imageUrls.length > 0) ? data.imageUrls[0] : '';
                const tags = data.tags ? data.tags.join(', ') : 'No tags';

                card.innerHTML = `
                    <div class="card-header">
                        <span>ID: ${docSnap.id.substring(0, 6)}...</span>
                        <a href="/user.html?id=${data.posterUid}" target="_blank" class="user-link">
                            <i class="fas fa-user"></i> ${data.posterDisplayName || 'User'}
                        </a>
                    </div>
                    <div class="card-body">
                        <img src="${imgUrl}" class="card-img" alt="Item">
                        <div class="card-info">
                            <div class="card-title"><a href="/listing.html?id=${docSnap.id}" style="color:white;text-decoration:none;" target="_blank">${data.title}</a></div>
                            <div class="card-price">$${data.price}</div>
                            <div class="card-tags"><i class="fas fa-tag"></i> ${tags}</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-delete" onclick="window.deleteSingle('${docSnap.id}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                        <button class="btn btn-ban" onclick="window.banAndWipe('${data.posterUid}')">
                            <i class="fas fa-ban"></i> BAN USER
                        </button>
                    </div>
                `;
                listingsGrid.appendChild(card);
            }

            // --- 3. ACTIONS (Attached to Window for HTML access) ---
            
            // Delete Single Listing
            window.deleteSingle = async (listingId) => {
                if (confirm("Delete this listing only?")) {
                    try {
                        await deleteDoc(doc(db, "listings", listingId));
                        // Remove from UI immediately
                        const card = document.getElementById(`card-${listingId}`);
                        if(card) card.remove();
                    } catch (e) {
                        alert("Error: " + e.message);
                    }
                }
            };

            // Ban User & Delete All Their Stuff
            window.banAndWipe = async (targetUid) => {
                if (!confirm("⚠️ CRITICAL ACTION ⚠️\n\n1. This user will be BANNED.\n2. ALL their listings will be DELETED.\n\nProceed?")) {
                    return;
                }

                try {
                    // 1. Get all listings by user
                    const q = query(collection(db, "listings"), where("posterUid", "==", targetUid));
                    const snapshot = await getDocs(q);

                    let count = 0;
                    const deletePromises = snapshot.docs.map(d => {
                        count++;
                        // Remove from UI as we go
                        const card = document.getElementById(`card-${d.id}`);
                        if(card) card.remove();
                        // Delete from DB
                        return deleteDoc(d.ref);
                    });

                    // 2. Execute Deletes
                    await Promise.all(deletePromises);

                    // 3. Mark User as Banned
                    await updateDoc(doc(db, "users", targetUid), { role: 'banned' });

                    alert(`Success: User banned and ${count} listings removed.`);

                } catch (e) {
                    console.error(e);
                    alert("Error executing ban: " + e.message);
                }
            };

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
        }

        main();
    </script>
</body>
</html>
