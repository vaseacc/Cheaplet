<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* [Previous CSS is the same, adding toggle styles] */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #e0e0e0; min-height: 100vh; }
        #security-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #0f0; font-family: 'Courier New', monospace; }
        header { background-color: #2d2d2d; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4CAF50; }
        .logo { font-size: 20px; font-weight: bold; color: #4CAF50; letter-spacing: 1px; }
        .admin-badge { background: #4CAF50; color: black; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
        .header-controls { display: flex; gap: 20px; align-items: center; }
        .nav-btn { color: #ccc; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; cursor: pointer; }
        .nav-btn:hover { color: white; }
        .tabs { display: flex; justify-content: center; margin-top: 20px; gap: 10px; }
        .tab-btn { background-color: #333; color: #aaa; border: 1px solid #444; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: all 0.2s; }
        .tab-btn.active { background-color: #4CAF50; color: black; border-color: #4CAF50; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h1 { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 1.5rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .admin-card { background-color: #2d2d2d; border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .card-header { padding: 10px; background: #333; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #aaa; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; gap: 10px; }
        .card-img { width: 80px; height: 80px; background: #000; object-fit: cover; border-radius: 4px; }
        .card-info { flex: 1; }
        .card-title { font-weight: bold; margin-bottom: 5px; color: white; font-size: 1.1rem; }
        .card-price { color: #FFD700; font-weight: bold; }
        .card-actions { padding: 10px; background: #222; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-delete { background-color: #ff9800; color: black; } 
        .btn-ban { background-color: #d32f2f; color: white; } 
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* SETTINGS SWITCH STYLE */
        .setting-row { background: #2d2d2d; padding: 20px; border-radius: 8px; border: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .setting-info h3 { color: white; margin-bottom: 5px; }
        .setting-info p { color: #888; font-size: 0.9rem; }
        
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <div id="security-screen">
        <i class="fas fa-shield-alt fa-3x" style="margin-bottom: 20px;"></i>
        <div>VERIFYING ADMIN CREDENTIALS...</div>
    </div>

    <div id="main-interface" style="display: none;">
        <header>
            <div class="logo">CHEAPLET <span class="admin-badge">ADMIN</span></div>
            <div class="header-controls">
                <a href="/index.html" class="nav-btn">Back to Site</a>
                <a href="#" id="logoutBtn" class="nav-btn">Logout</a>
            </div>
        </header>

        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('listings')">Listings</button>
                <button class="tab-btn" onclick="switchTab('settings')">Site Settings</button>
            </div>

            <!-- VIEW: LISTINGS -->
            <div id="view-listings" class="view-section active">
                <h1>All Listings</h1>
                <div id="listings-grid" class="dashboard-grid"></div>
            </div>

            <!-- VIEW: SETTINGS (NEW) -->
            <div id="view-settings" class="view-section">
                <h1>Global Configuration</h1>
                
                <div class="setting-row">
                    <div class="setting-info">
                        <h3>Language Selection Popup</h3>
                        <p>If enabled, new users will be asked to choose between English and French.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-lang-prompt" onchange="window.toggleSetting('enableLanguagePrompt', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, query, orderBy, deleteDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            
            const app = initializeApp(config.firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const securityScreen = document.getElementById('security-screen');
            const mainInterface = document.getElementById('main-interface');
            const listingsGrid = document.getElementById('listings-grid');

            // --- 1. SECURITY CHECK & LOAD SETTINGS ---
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().role === 'admin') {
                        securityScreen.style.display = 'none';
                        mainInterface.style.display = 'block';
                        loadAllListings();
                        loadSettings(); // NEW
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    window.location.href = '/LoginInToCheaplet.html';
                }
            });

            // --- 2. SETTINGS LOGIC ---
            async function loadSettings() {
                try {
                    const docSnap = await getDoc(doc(db, "site_settings", "config"));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('toggle-lang-prompt').checked = data.enableLanguagePrompt || false;
                    }
                } catch (e) { console.error("Error loading settings:", e); }
            }

            window.toggleSetting = async (key, value) => {
                try {
                    const settingRef = doc(db, "site_settings", "config");
                    await setDoc(settingRef, { [key]: value }, { merge: true });
                    console.log(`Updated ${key} to ${value}`);
                } catch (e) {
                    alert("Error updating settings: " + e.message);
                }
            };

            // --- 3. LISTINGS (Simplified for length) ---
            async function loadAllListings() {
                const q = query(collection(db, "listings"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                listingsGrid.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = 'admin-card';
                    div.innerHTML = `
                        <div class="card-body">
                            <div class="card-info">
                                <div class="card-title">${data.title}</div>
                                <div class="card-price">$${data.price}</div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-delete" onclick="window.deleteListing('${docSnap.id}')">Delete</button>
                        </div>
                    `;
                    listingsGrid.appendChild(div);
                });
            }

            window.deleteListing = async (id) => {
                if(confirm("Delete?")) { await deleteDoc(doc(db, "listings", id)); loadAllListings(); }
            };

            window.switchTab = (tabName) => {
                document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
                document.getElementById(`view-${tabName}`).classList.add('active');
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                event.target.classList.add('active');
            };

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
        }
        main();
    </script>
</body>
</html>
