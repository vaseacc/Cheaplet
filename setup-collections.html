<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup School Collections</title>
    <!-- Import your global scripts so getFunctionUrl() works -->
    <script type="module" src="ui-utils.js"></script>
    <script type="module" src="global.js"></script>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f8fafc; color: #0f172a; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        button { background: #2B5C92; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        button:hover { background: #0C1446; }
        #log { margin-top: 20px; font-size: 0.9rem; color: #334155; white-space: pre-wrap; background: #f1f5f9; padding: 15px; border-radius: 8px; display: none; }
        .success { color: #2E7D32; font-weight: bold; }
        .error { color: #e53e3e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Initialize School Feeds</h2>
        <p>This script will create the missing collections so they appear in your Firebase Console. <strong>You must be logged into an Admin account for this to work.</strong></p>
        <button id="setup-btn">Create Collections</button>
        <div id="log"></div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        const logDiv = document.getElementById('log');
        const setupBtn = document.getElementById('setup-btn');

        function logMsg(msg, type = "normal") {
            logDiv.style.display = 'block';
            const span = document.createElement('div');
            span.className = type;
            span.textContent = msg;
            logDiv.appendChild(span);
        }

        async function init() {
            try {
                // Now using your global getFunctionUrl() just like social.html
                const response = await fetch(getFunctionUrl('config')); 
                const config = await response.json();
                
                const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
                const auth = getAuth(app);
                const db = getFirestore(app);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        logMsg(`Logged in as: ${user.email} (Proceeding...)`, "success");
                    } else {
                        logMsg("You are not logged in! Please go to your website, log in as an Admin, and refresh this page.", "error");
                        setupBtn.disabled = true;
                        setupBtn.style.background = "#cbd5e1";
                    }
                });

                setupBtn.onclick = async () => {
                    setupBtn.disabled = true;
                    setupBtn.textContent = "Creating...";

                    const schoolsToCreate = [
                        'social_posts_vanier',
                        'social_posts_lasalle',
                        'social_posts_saintlaurent',
                        'social_posts_maisonneuve'
                    ];

                    for (const schoolColl of schoolsToCreate) {
                        try {
                            logMsg(`Attempting to create ${schoolColl}...`);
                            await addDoc(collection(db, schoolColl), {
                                text: "Welcome to your school's private Campus Hub! 🎓",
                                authorUid: "system_admin",
                                authorName: "Scoralia System",
                                authorIsStudent: true,
                                schoolName: schoolColl.replace("social_posts_", ""),
                                likes: 0,
                                likedBy: [],
                                commentCount: 0,
                                status: "active",
                                timestamp: serverTimestamp()
                            });
                            logMsg(`✅ Successfully created: ${schoolColl}`, "success");
                        } catch (error) {
                            logMsg(`❌ Failed to create ${schoolColl}. Error: ${error.message} (Are you an Admin?)`, "error");
                        }
                    }

                    setupBtn.textContent = "Done!";
                };

            } catch (err) {
                logMsg(`Initialization Error: ${err.message}`, "error");
            }
        }

        // Wait a tiny bit to ensure global.js sets up getFunctionUrl
        setTimeout(init, 500);
    </script>
</body>
</html>
