<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing - Cheaplet</title>
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; cursor: pointer; color: white; text-decoration: none; }
        .logo span { color: #FFD700; }
        nav ul { display: flex; list-style: none; gap: 20px; }
        .header-auth-buttons { display: flex; gap: 10px; align-items: center; }
        
        .firebase-form-section { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 30px auto; max-width: 600px; text-align: left; }
        .firebase-form-section h2 { text-align: center; margin-bottom: 25px; color: #333; }
        .form-field { margin-bottom: 15px; }
        .form-field label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; display: block; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #4CAF50; }
        
        .form-buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .form-buttons .btn { flex: 1; min-width: 120px; }
        
        .tag-container { border: 2px solid #ddd; border-radius: 6px; padding: 10px; background: #fff; display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
        .tag-container:focus-within { border-color: #4CAF50; }
        .tag-chip { background-color: #e8f5e9; color: #2E7D32; padding: 5px 10px; border-radius: 16px; font-size: 0.9rem; font-weight: 600; }
        #tag-input { border: none; outline: none; padding: 5px; flex-grow: 1; min-width: 120px; }
        .suggestions-box { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ddd; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .suggestion-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .suggestion-item:hover { background-color: #f8f9fa; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; background: #fdfdfd; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.9rem; cursor: pointer; color: #444; }
        .checkbox-item input { width: 18px; height: 18px; margin: 0; cursor: pointer; }

        .image-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .image-preview-wrapper { position: relative; width: 80px; height: 80px; }
        .image-preview { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; border: 1px solid #ddd; }
        .remove-image-btn { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; background-color: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        #add-photo-label { width: 80px; height: 80px; border: 2px dashed #ccc; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #777; }

        .info-message { text-align: center; padding: 50px; font-size: 1.2rem; color: #777; }
        @media (max-width: 767px) { nav { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/index.html" class="logo">Cheap<span>let</span></a>
            <nav><ul></ul></nav>
            <div class="header-auth-buttons"></div>
        </div>
    </header>

    <main class="container">
        <div id="info-container">
            <p class="info-message">Loading listing...</p>
        </div>

        <section id="edit-form-container" class="firebase-form-section" style="display: none;">
            <h2 id="ui-main-title">Edit Your Listing</h2>
            
            <div class="form-field">
                <label id="ui-label-title">Title</label>
                <input type="text" id="listing-title" required>
            </div>

            <div class="form-field">
                <label id="ui-label-desc">Description</label>
                <textarea id="listing-description" required></textarea>
            </div>

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;" class="form-field">
                    <label id="ui-label-price">Sale Price ($) - Max $1200</label>
                    <input type="text" inputmode="decimal" id="listing-price" placeholder="0.00" required 
                           oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1'); if(this.value > 1200) this.value = '1200';">
                </div>
                <div style="flex: 1;" class="form-field">
                    <label id="ui-label-orig-price">Original Price ($) - Max $5000</label>
                    <input type="text" inputmode="decimal" id="listing-original-price" placeholder="0.00" 
                           oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1'); if(this.value > 5000) this.value = '5000';">
                </div>
            </div>

            <div class="form-field">
                <label id="ui-label-condition">Condition</label>
                <select id="listing-condition" required>
                    <option value="" id="opt-cond-select">Select Condition</option>
                    <option value="New" id="opt-cond-new">New</option>
                    <option value="Like New" id="opt-cond-likenew">Like New</option>
                    <option value="Good" id="opt-cond-good">Good</option>
                    <option value="Fair" id="opt-cond-fair">Fair</option>
                </select>
            </div>

            <div class="form-field">
                <label id="ui-label-details">Additional Details</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" id="cond-writing"> <span id="ui-check-writing">Writing inside</span></label>
                    <label class="checkbox-item"><input type="checkbox" id="cond-water"> <span id="ui-check-water">Water damage</span></label>
                    <label class="checkbox-item"><input type="checkbox" id="cond-missing"> <span id="ui-check-missing">Missing pages</span></label>
                </div>
            </div>

            <div class="form-field">
                <label id="ui-label-code">Digital Access Code</label>
                <select id="listing-digital-code">
                    <option value="Not applicable" id="opt-code-na">Not applicable</option>
                    <option value="Available / Unused" id="opt-code-avail">Available / Unused</option>
                    <option value="Already used" id="opt-code-used">Already used</option>
                </select>
            </div>

            <div class="form-field">
                <label id="ui-label-tags">Tags</label>
                <div class="tag-container" id="tag-container">
                    <div id="selected-tags" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                    <input type="text" id="tag-input" autocomplete="off">
                    <div class="suggestions-box" id="suggestions-box"></div>
                </div>
            </div>

            <!-- 🔥 FIXED: Restricted strictly to Rosemont -->
            <div class="form-field">
                <label id="ui-label-location">Campus Location</label>
                <select id="listing-location" required>
                    <option value="Collège de Rosemont" selected>Collège de Rosemont</option>
                </select>
            </div>

            <div class="form-field">
                <label id="ui-label-meet">Meeting Point</label>
                <input type="text" id="listing-meeting-point">
            </div>
            
            <div class="form-field">
                <label id="ui-label-photos">Photos (Max 5, Max 5MB each)</label>
                <div id="image-uploader">
                    <div class="image-preview-grid" id="image-preview-container"></div>
                    <label for="listing-image-input" id="add-photo-label" style="margin-top:10px;">
                        <i class="fas fa-camera"></i>
                        <span style="font-size: 10px;" id="ui-btn-add-photo">Add Photo</span>
                    </label>
                    <input type="file" id="listing-image-input" accept="image/*" style="display:none;">
                </div>
            </div>
            
            <div class="form-buttons">
                <button class="btn" id="updateListingBtn">Save Changes</button>
                <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, setDoc, increment, query, where, collection, getDocs, limit } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${config.cloudinary.cloudName}/image/upload`;
            const UPLOAD_PRESET = config.cloudinary.uploadPreset;

            const infoContainer = document.getElementById('info-container');
            const editFormContainer = document.getElementById('edit-form-container');
            const tagInput = document.getElementById('tag-input');
            const selectedTagsContainer = document.getElementById('selected-tags');
            const suggestionsBox = document.getElementById('suggestions-box');
            const previewContainer = document.getElementById('image-preview-container');

            let existingImageUrls = [];
            let newImageFiles = [];
            let tags = [];

            // 🔥 FIXED: Direct Local Translations
            const lang = localStorage.getItem('preferred_language') || 'en';
            const ui = {
                en: {
                    mainTitle: "Edit Your Listing", lblTitle: "Title", lblDesc: "Description", lblPrice: "Sale Price ($) - Max $1200", 
                    lblOrigPrice: "Original Price ($) - Max $5000", lblTags: "Tags (Max 15)", tagPlace: "Type and press Enter...",
                    lblCond: "Condition", optCondSel: "Select Condition", optNew: "New", optLikeNew: "Like New", optGood: "Good", optFair: "Fair",
                    lblCode: "Digital Access Code", optNa: "Not applicable", optAvail: "Available / Unused", optUsed: "Already used",
                    lblLoc: "Campus Location", lblMeet: "Meeting Point (Max 60 chars)", meetPlace: "e.g., Near Library",
                    lblDet: "Additional Details", chkWrite: "Writing inside", chkWater: "Water damage", chkMiss: "Missing pages",
                    lblPhotos: "Photos (Max 5, Max 5MB each)", btnAddPhoto: "Add Photo", btnPost: "Save Changes", btnCancel: "Cancel",
                    priceErr: "Max price is $1200.", origPriceErr: "Original price cannot exceed $5000.", 
                    imgTypeErr: "Unsupported file type. Please upload an image.", imgSizeErr: "Image too large (Max 5MB).", 
                    saving: "Saving...", tagUses: "uses"
                },
                fr: {
                    mainTitle: "Modifier votre annonce", lblTitle: "Titre", lblDesc: "Description", lblPrice: "Prix de vente ($) - Max 1200$", 
                    lblOrigPrice: "Prix d'origine ($) - Max 5000$", lblTags: "Mots-clés (Max 15)", tagPlace: "Tapez et appuyez sur Entrée...",
                    lblCond: "État", optCondSel: "Sélectionner l'état", optNew: "Neuf", optLikeNew: "Comme neuf", optGood: "Bon état", optFair: "Acceptable",
                    lblCode: "Code d'accès numérique", optNa: "Non applicable", optAvail: "Disponible / Inutilisé", optUsed: "Déjà utilisé",
                    lblLoc: "Emplacement du campus", lblMeet: "Point de rencontre (Max 60 car.)", meetPlace: "ex: Près de la bibliothèque",
                    lblDet: "Détails supplémentaires", chkWrite: "Écritures à l'intérieur", chkWater: "Dommages causés par l'eau", chkMiss: "Pages manquantes",
                    lblPhotos: "Photos (Max 5, Max 5MB chacune)", btnAddPhoto: "Ajouter une photo", btnPost: "Enregistrer", btnCancel: "Annuler",
                    priceErr: "Le prix max est de 1200$.", origPriceErr: "Le prix d'origine ne peut dépasser 5000$.", 
                    imgTypeErr: "Format non supporté. Veuillez télécharger une image.", imgSizeErr: "Image trop lourde (Max 5MB).", 
                    saving: "Enregistrement...", tagUses: "utilisations"
                }
            };

            // Apply translations to UI
            document.getElementById('ui-main-title').textContent = ui[lang].mainTitle;
            document.getElementById('ui-label-title').textContent = ui[lang].lblTitle;
            document.getElementById('ui-label-desc').textContent = ui[lang].lblDesc;
            document.getElementById('ui-label-price').textContent = ui[lang].lblPrice;
            document.getElementById('ui-label-orig-price').textContent = ui[lang].lblOrigPrice;
            document.getElementById('ui-label-tags').textContent = ui[lang].lblTags;
            document.getElementById('tag-input').placeholder = ui[lang].tagPlace;
            document.getElementById('ui-label-condition').textContent = ui[lang].lblCond;
            document.getElementById('opt-cond-select').textContent = ui[lang].optCondSel;
            document.getElementById('opt-cond-new').textContent = ui[lang].optNew;
            document.getElementById('opt-cond-likenew').textContent = ui[lang].optLikeNew;
            document.getElementById('opt-cond-good').textContent = ui[lang].optGood;
            document.getElementById('opt-cond-fair').textContent = ui[lang].optFair;
            document.getElementById('ui-label-code').textContent = ui[lang].lblCode;
            document.getElementById('opt-code-na').textContent = ui[lang].optNa;
            document.getElementById('opt-code-avail').textContent = ui[lang].optAvail;
            document.getElementById('opt-code-used').textContent = ui[lang].optUsed;
            document.getElementById('ui-label-location').textContent = ui[lang].lblLoc;
            document.getElementById('ui-label-meet').textContent = ui[lang].lblMeet;
            document.getElementById('listing-meeting-point').placeholder = ui[lang].meetPlace;
            document.getElementById('ui-label-details').textContent = ui[lang].lblDet;
            document.getElementById('ui-check-writing').textContent = ui[lang].chkWrite;
            document.getElementById('ui-check-water').textContent = ui[lang].chkWater;
            document.getElementById('ui-check-missing').textContent = ui[lang].chkMiss;
            document.getElementById('ui-label-photos').textContent = ui[lang].lblPhotos;
            document.getElementById('ui-btn-add-photo').textContent = ui[lang].btnAddPhoto;
            document.getElementById('updateListingBtn').textContent = ui[lang].btnPost;
            document.getElementById('cancelEditBtn').textContent = ui[lang].btnCancel;


            // --- TAG SYSTEM LOGIC ---
            function renderTags() {
                selectedTagsContainer.innerHTML = '';
                tags.forEach((tag, index) => {
                    const chip = document.createElement('div');
                    chip.className = 'tag-chip';
                    chip.innerHTML = `${tag} <span style="cursor:pointer; margin-left:5px;" onclick="window.removeTag(${index})">&times;</span>`;
                    selectedTagsContainer.appendChild(chip);
                });
            }
            window.removeTag = (index) => { tags.splice(index, 1); renderTags(); };
            function addTag(tagName) {
                const cleaned = tagName.trim();
                if (cleaned && !tags.includes(cleaned)) { tags.push(cleaned); renderTags(); }
                tagInput.value = ''; suggestionsBox.style.display = 'none';
            }
            
            tagInput.oninput = async (e) => {
                const val = e.target.value.trim().toLowerCase();
                if (val.length < 1) { suggestionsBox.style.display = 'none'; return; }
                const q = query(collection(db, "global_tags"), where("tag_lowercase", ">=", val), where("tag_lowercase", "<=", val + "\uf8ff"), limit(5));
                const snap = await getDocs(q);
                suggestionsBox.innerHTML = '';
                if (!snap.empty) {
                    suggestionsBox.style.display = 'block';
                    snap.forEach(doc => {
                        const d = doc.data();
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerHTML = `<span>${d.tag}</span> <span style="font-size:0.8rem; color:#888; background:#f0f0f0; padding:2px 8px; border-radius:10px;">${d.count || 1} ${ui[lang].tagUses}</span>`;
                        div.onclick = () => addTag(d.tag);
                        suggestionsBox.appendChild(div);
                    });
                } else {
                    suggestionsBox.style.display = 'block';
                    suggestionsBox.innerHTML = `<div class="suggestion-item" onclick="window.addTagManual()">Create: "${tagInput.value}"</div>`;
                }
            };
            window.addTagManual = () => addTag(tagInput.value);
            tagInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(tagInput.value); } };

            // --- IMAGE LOGIC WITH VALIDATION ---
            function renderPreviews() {
                previewContainer.innerHTML = '';
                const all = [...existingImageUrls, ...newImageFiles];
                all.forEach((img, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'image-preview-wrapper';
                    const el = document.createElement('img');
                    el.className = 'image-preview';
                    el.src = (typeof img === 'string') ? img : URL.createObjectURL(img);
                    const btn = document.createElement('button');
                    btn.className = 'remove-image-btn';
                    btn.innerHTML = '&times;';
                    btn.onclick = () => {
                        if (typeof img === 'string') existingImageUrls.splice(existingImageUrls.indexOf(img), 1);
                        else newImageFiles.splice(newImageFiles.indexOf(img), 1);
                        renderPreviews();
                    };
                    wrapper.appendChild(el); wrapper.appendChild(btn);
                    previewContainer.appendChild(wrapper);
                });
                document.getElementById('add-photo-label').style.display = all.length < 5 ? 'flex' : 'none';
            }
            
            document.getElementById('listing-image-input').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (!file.type.startsWith('image/')) { alert(ui[lang].imgTypeErr); e.target.value = ''; return; }
                    if (file.size > 5 * 1024 * 1024) { alert(ui[lang].imgSizeErr); e.target.value = ''; return; }
                    newImageFiles.push(file); renderPreviews(); 
                }
            };

            // --- DATA LOAD ---
            async function fetchAndPopulate(listingId, userId) {
                const snap = await getDoc(doc(db, 'listings', listingId));
                if (snap.exists()) {
                    const d = snap.data();
                    if (d.posterUid !== userId) { infoContainer.innerHTML = "<p>Unauthorized</p>"; return; }
                    
                    document.getElementById('listing-title').value = d.title;
                    document.getElementById('listing-description').value = d.description;
                    document.getElementById('listing-price').value = d.price;
                    document.getElementById('listing-original-price').value = d.originalPrice || "";
                    document.getElementById('listing-condition').value = d.condition || "";
                    document.getElementById('listing-digital-code').value = d.digitalCode || "Not applicable";
                    
                    // Always default to Rosemont since it's the only option now
                    document.getElementById('listing-location').value = "Collège de Rosemont";

                    document.getElementById('listing-meeting-point').value = d.meetingPoint || "";
                    document.getElementById('cond-writing').checked = d.hasWriting || false;
                    document.getElementById('cond-water').checked = d.hasWaterDamage || false;
                    document.getElementById('cond-missing').checked = d.hasMissingPages || false;
                    
                    tags = d.tags || [];
                    existingImageUrls = d.imageUrls || [];
                    renderTags(); renderPreviews();
                    infoContainer.style.display = 'none'; editFormContainer.style.display = 'block';
                }
            }

            onAuthStateChanged(auth, user => {
                const id = new URLSearchParams(window.location.search).get('id');
                if (user && id) fetchAndPopulate(id, user.uid);
                else if (!user) window.location.href = '/LoginInToCheaplet.html';
            });

            // --- SAVE ---
            document.getElementById('updateListingBtn').onclick = async () => {
                const priceVal = document.getElementById('listing-price').value;
                const price = priceVal ? parseFloat(priceVal) : 0;
                if (price > 1200) { alert(ui[lang].priceErr); return; }
                
                const originalPriceVal = document.getElementById('listing-original-price').value;
                const originalPrice = originalPriceVal ? parseFloat(originalPriceVal) : null;
                if (originalPrice && originalPrice > 5000) { alert(ui[lang].origPriceErr); return; }
                
                const btn = document.getElementById('updateListingBtn');
                btn.disabled = true; btn.textContent = ui[lang].saving;

                try {
                    const uploaded = [];
                    for (const f of newImageFiles) {
                        const fd = new FormData(); fd.append('file', f); fd.append('upload_preset', UPLOAD_PRESET);
                        const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: fd }).then(r => r.json());
                        uploaded.push(res.secure_url);
                    }

                    await updateDoc(doc(db, 'listings', new URLSearchParams(window.location.search).get('id')), {
                        title: document.getElementById('listing-title').value.trim(),
                        description: document.getElementById('listing-description').value.trim(),
                        price: price,
                        originalPrice: originalPrice,
                        condition: document.getElementById('listing-condition').value,
                        digitalCode: document.getElementById('listing-digital-code').value,
                        location: document.getElementById('listing-location').value,
                        meetingPoint: document.getElementById('listing-meeting-point').value.trim(),
                        hasWriting: document.getElementById('cond-writing').checked,
                        hasWaterDamage: document.getElementById('cond-water').checked,
                        hasMissingPages: document.getElementById('cond-missing').checked,
                        tags: tags,
                        imageUrls: [...existingImageUrls, ...uploaded]
                    });

                    alert("Updated!");
                    window.location.href = `/listing.html?id=${new URLSearchParams(window.location.search).get('id')}`;
                } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = ui[lang].btnPost; }
            };

            document.getElementById('cancelEditBtn').onclick = () => window.history.back();
        }
        main();
    </script>
</body>
</html>
