<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cheaplet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Header Styles (Consistent with Index) */
        header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .logo span {
            color: #FFD700;
        }

        /* Auth Container Styles */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .auth-card h2 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .auth-card p {
            color: #666;
            margin-bottom: 30px;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn-submit {
            background: linear-gradient(135deg, #FFD700 0%, #FFC400 100%);
            color: #333;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .toggle-link {
            display: block;
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            text-align: left;
        }

        #register-fields {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/index.html" class="logo">Cheap<span>let</span></a>
        </div>
    </header>

    <main class="container auth-wrapper">
        <div class="auth-card">
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle">Log in to continue shopping and selling.</p>
            
            <div id="auth-error" class="error-message"></div>

            <form id="auth-form">
                <div id="register-fields">
                    <input type="text" id="firstName" placeholder="First Name">
                    <input type="text" id="lastName" placeholder="Last Name">
                </div>
                
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <button type="submit" class="btn-submit" id="submit-btn">Log In</button>
            </form>

            <a class="toggle-link" id="toggle-auth">New to Cheaplet? Create an account.</a>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendEmailVerification, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            // Fetch configuration
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            
            // Initialize Firebase
            const app = initializeApp(config.firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // UI Elements
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const authForm = document.getElementById('auth-form');
            const registerFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            const toggleLink = document.getElementById('toggle-auth');
            const authError = document.getElementById('auth-error');
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');

            let isLoginMode = true;

            // Check if user is already logged in
            onAuthStateChanged(auth, (user) => {
                if (user && user.emailVerified) {
                    // Redirect to home if already logged in and verified
                    window.location.href = '/index.html';
                }
            });

            // Toggle between Login and Register
            toggleLink.addEventListener('click', (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                authError.style.display = 'none';
                authForm.reset();

                if (isLoginMode) {
                    formTitle.textContent = 'Welcome Back';
                    formSubtitle.textContent = 'Log in to continue shopping and selling.';
                    registerFields.style.display = 'none';
                    submitBtn.textContent = 'Log In';
                    toggleLink.textContent = 'New to Cheaplet? Create an account.';
                    firstNameInput.removeAttribute('required');
                    lastNameInput.removeAttribute('required');
                } else {
                    formTitle.textContent = 'Join Cheaplet';
                    formSubtitle.textContent = 'Create an account to start listing items.';
                    registerFields.style.display = 'block';
                    submitBtn.textContent = 'Register';
                    toggleLink.textContent = 'Already have an account? Log in.';
                    firstNameInput.setAttribute('required', 'true');
                    lastNameInput.setAttribute('required', 'true');
                }
            });

            // Handle Form Submission
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                authError.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';

                const email = emailInput.value;
                const password = passwordInput.value;

                try {
                    if (isLoginMode) {
                        // --- LOGIN LOGIC ---
                        const userCredential = await signInWithEmailAndPassword(auth, email, password);
                        if (!userCredential.user.emailVerified) {
                            throw new Error('Please verify your email address before logging in.');
                        }
                        // Redirect happens automatically via onAuthStateChanged, but we can force it here too
                        window.location.href = '/index.html';
                    } else {
                        // --- REGISTER LOGIC ---
                        if (password.length < 6) {
                            throw new Error('Password must be at least 6 characters long.');
                        }
                        const firstName = firstNameInput.value.trim();
                        const lastName = lastNameInput.value.trim();
                        
                        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                        const displayName = `${firstName} ${lastName}`;
                        
                        // Update Auth Profile
                        await updateProfile(userCredential.user, { displayName: displayName });
                        
                        // Save to Firestore
                        await setDoc(doc(db, "users", userCredential.user.uid), {
                            uid: userCredential.user.uid,
                            displayName: displayName,
                            email: email,
                            role: 'user' // Default role
                        });

                        // Send Verification Email
                        await sendEmailVerification(userCredential.user);
                        
                        // Sign out immediately so they have to log in after verifying
                        await auth.signOut();

                        alert("Registration successful! We have sent a verification link to your email. Please check your inbox (and spam folder) to verify your account, then log in.");
                        
                        // Switch back to login mode
                        isLoginMode = true;
                        toggleLink.click(); 
                    }
                } catch (error) {
                    console.error("Auth Error:", error);
                    authError.textContent = error.message.replace('Firebase: ', '');
                    authError.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = isLoginMode ? 'Log In' : 'Register';
                }
            });
        }

        main();
    </script>
</body>
</html>
