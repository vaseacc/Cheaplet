<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cheaplet</title>

<script type="module" src="global.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #191265 0%, #241c8c 100%);
    color: #EBEBDF;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    padding: 20px 40px;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
    color: #EBEBDF;
}

.logo span {
    color: #FFD700;
}

.btn-back {
    background: rgba(255, 215, 0, 0.15);
    color: #FFD700;
    border: 1px solid rgba(255, 215, 0, 0.4);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    gap: 6px;
    align-items: center;
    transition: 0.3s;
}

.btn-back:hover {
    background: #FFD700;
    color: #191265;
}

/* MAIN LAYOUT */
.auth-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.auth-container {
    width: 1100px;
    max-width: 95%;
    height: 650px;
    background: #1f1a7a;
    border-radius: 20px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}

/* LEFT PANEL */
.left-panel {
    flex: 1;
    background: linear-gradient(145deg, #191265, #2b22a3);
    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #EBEBDF;
}

.left-panel h1 {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.3;
}

.left-panel span {
    color: #FFD700;
}

.dots {
    display: flex;
    gap: 10px;
}

.dots div {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
}

.dots div.active {
    background: #FFD700;
}

/* RIGHT PANEL */
.right-panel {
    flex: 1;
    background: #191265;
    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.auth-card {
    width: 100%;
}

.auth-card h2 {
    font-size: 32px;
    color: #FFD700;
    margin-bottom: 10px;
}

.auth-card p {
    font-size: 14px;
    margin-bottom: 30px;
    opacity: 0.8;
}

/* INPUTS */
input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: #EBEBDF;
    font-size: 14px;
    transition: 0.3s;
}

input::placeholder {
    color: rgba(235,235,223,0.6);
}

input:focus {
    outline: none;
    border-color: #FFD700;
    box-shadow: 0 0 12px rgba(255,215,0,0.4);
}

/* BUTTON */
.btn-submit {
    width: 100%;
    padding: 14px;
    background: #FFD700;
    color: #191265;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255,215,0,0.5);
}

/* SEPARATOR */
.separator {
    text-align: center;
    margin: 25px 0;
    font-size: 13px;
    color: rgba(235,235,223,0.6);
    position: relative;
}

.separator::before,
.separator::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 35%;
    height: 1px;
    background: rgba(255,255,255,0.2);
}

.separator::before { left: 0; }
.separator::after { right: 0; }

/* GOOGLE */
.btn-google {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: #EBEBDF;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-google:hover {
    border-color: #FFD700;
    color: #FFD700;
}

.toggle-link {
    display: block;
    margin-top: 20px;
    color: #FFD700;
    font-size: 14px;
    cursor: pointer;
}

/* LOADING */
#loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(25,18,101,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #FFD700;
    z-index: 9999;
}

.spinner {
    border: 4px solid rgba(255,255,255,0.2);
    border-top: 4px solid #FFD700;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .auth-container {
        flex-direction: column;
        height: auto;
    }
    .left-panel {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <button id="smart-back-btn" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back
        </button>
        <a href="/index.html" class="logo">Cheap<span>let</span></a>
        <div></div>
    </div>
</header>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight:bold;">Authenticating...</div>
</div>

<main class="auth-wrapper">
<div class="auth-container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
        <h1>Buy. Sell.<br><span>Save Smart.</span></h1>
        <div class="dots">
            <div></div>
            <div class="active"></div>
            <div></div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="auth-card">
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle">Log in to continue shopping and selling.</p>

            <div id="auth-error" class="error-message"></div>

            <form id="auth-form">
                <div id="register-fields" style="display:none;">
                    <input type="text" id="firstName" placeholder="First Name">
                    <input type="text" id="lastName" placeholder="Last Name">
                </div>

                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>

                <button type="submit" class="btn-submit" id="submit-btn">Log In</button>
            </form>

            <div class="separator">OR</div>

            <button type="button" class="btn-google" id="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Sign in with Google
            </button>

            <a class="toggle-link" id="toggle-auth">
                New to Cheaplet? Create an account.
            </a>
        </div>
    </div>

</div>
</main>

<!-- YOUR ORIGINAL SCRIPT (UNCHANGED) -->
<script type="module">
/* YOUR ORIGINAL JS REMAINS EXACTLY THE SAME */
</script>

</body>
</html>
