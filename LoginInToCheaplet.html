<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login / Register - Cheaplet</title>
    <!-- GLOBAL BRAIN -->
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; overflow-x: hidden; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 10px; }
        header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; }
        .header-content { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; flex-shrink: 1; min-width: 0; }
        .logo { font-size: clamp(18px, 4vw, 24px); font-weight: bold; cursor: pointer; text-decoration: none; color: white; white-space: nowrap; }
        .logo span { color: #FFD700; }
        .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .btn-back { background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; transition: background 0.3s; white-space: nowrap; }
        
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 85vh; padding: 15px; }
        .auth-card { background: white; padding: clamp(20px, 5vw, 40px); border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        .auth-card h2 { color: #2E7D32; margin-bottom: 10px; font-size: 1.7rem; }
        .auth-card p { color: #666; margin-bottom: 25px; font-size: 0.95rem; }
        
        .student-tip { background-color: #e8f5e9; border: 1px solid #c8e6c9; color: #2E7D32; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 0.85rem; line-height: 1.4; display: none; }
        .student-tip i { font-size: 1.5rem; flex-shrink: 0; }

        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
        input:focus { border-color: #4CAF50; }
        
        .forgot-pass-link { display: block; text-align: right; font-size: 0.85rem; color: #2E7D32; cursor: pointer; margin-top: -5px; margin-bottom: 15px; font-weight: 600; }
        .forgot-pass-link:hover { text-decoration: underline; }

        .btn-submit { background: linear-gradient(135deg, #FFD700 0%, #FFC400 100%); color: #333; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 5px; }
        
        .separator { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #888; font-size: 0.85rem; }
        .separator::before, .separator::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
        .separator::before { margin-right: 10px; }
        .separator::after { margin-left: 10px; }
        
        .btn-google, .btn-microsoft { background-color: white; color: #555; border: 1px solid #ddd; padding: 10px; width: 100%; border-radius: 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-bottom: 10px; transition: background 0.2s; }
        .btn-google:hover, .btn-microsoft:hover { background-color: #f8f9fa; }
        .btn-google img, .btn-microsoft img { width: 18px; }
        
        .toggle-link { display: block; margin-top: 20px; color: #4CAF50; text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .toggle-link:hover { text-decoration: underline; }
        
        .error-message { color: #d32f2f; background-color: #ffebee; padding: 10px; border-radius: 6px; margin-bottom: 20px; display: none; font-size: 0.85rem; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4CAF50; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-left">
                <button id="smart-back-btn" class="btn-back">
                    <i class="fas fa-arrow-left"></i> <span id="back-btn-text">Back</span>
                </button>
                <a href="/index.html" class="logo">Cheap<span>let</span></a>
            </div>
            <div class="header-right"></div>
        </div>
    </header>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-weight:bold;" id="loading-text">Verifying...</div>
    </div>

    <main class="container auth-wrapper">
        <div class="auth-card">
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle">Log in to continue shopping and selling.</p>
            
            <div id="auth-error" class="error-message"></div>

            <div class="student-tip" id="student-tip">
                <i class="fas fa-graduation-cap"></i>
                <span id="student-tip-text">Use your school email (or school Google/Microsoft account) to automatically get a <strong>Verified Student</strong> badge!</span>
            </div>

            <form id="auth-form">
                <div id="register-fields" style="display:none;">
                    <input type="text" id="firstName" placeholder="First Name">
                    <input type="text" id="lastName" placeholder="Last Name">
                </div>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <a id="forgot-password-link" class="forgot-pass-link">Forgot Password?</a>

                <button type="submit" class="btn-submit" id="submit-btn">Log In</button>
            </form>
            
            <div class="separator" id="or-text">OR</div>
            
            <button type="button" class="btn-google" id="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
                <span id="google-btn-text">Continue with Google</span>
            </button>
            <button type="button" class="btn-microsoft" id="microsoft-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="MS">
                <span id="microsoft-btn-text">Continue with Microsoft</span>
            </button>
            
            <a class="toggle-link" id="toggle-auth">New to Cheaplet? Create an account.</a>
        </div>
    </main>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendEmailVerification, sendPasswordResetEmail, onAuthStateChanged, GoogleAuthProvider, OAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);
            const googleProvider = new GoogleAuthProvider();
            const msProvider = new OAuthProvider('microsoft.com');

            const formTitle = document.getElementById('form-title');
            const toggleLink = document.getElementById('toggle-auth');
            const authForm = document.getElementById('auth-form');
            const submitBtn = document.getElementById('submit-btn');
            const loadingOverlay = document.getElementById('loading-overlay');
            const studentTip = document.getElementById('student-tip');
            const forgotPasswordLink = document.getElementById('forgot-password-link');
            const authError = document.getElementById('auth-error');

            let isLoginMode = true;
            let isRegistering = false;

            const lang = localStorage.getItem('preferred_language') || 'en';
            const strings = {
                en: {
                    loginTitle: "Welcome Back", loginSub: "Log in to continue shopping and selling.",
                    regTitle: "Join Cheaplet", regSub: "Create an account to start buying and selling.",
                    loginBtn: "Log In", regBtn: "Register",
                    toggleToReg: "New to Cheaplet? Create an account.", toggleToLogin: "Already have an account? Log in.",
                    studentTip: "Use your school email (or link your school's Google/Microsoft account) to automatically get a <strong>Verified Student</strong> badge!",
                    placeFirst: "First Name", placeLast: "Last Name", placeEmail: "Email Address", placePass: "Password",
                    google: "Continue with Google", microsoft: "Continue with Microsoft", or: "OR", back: "Back", verify: "Verifying...",
                    errBanned: "Account banned.", errVerify: "Please verify your email first!", errSent: "Verification email sent! Please check your inbox.",
                    forgotPass: "Forgot Password?", enterEmailFirst: "Please enter your email address to reset your password.", resetSent: "Password reset email sent! Check your inbox."
                },
                fr: {
                    loginTitle: "Bon retour", loginSub: "Connectez-vous pour continuer vos achats et ventes.",
                    regTitle: "Rejoindre Cheaplet", regSub: "Créez un compte pour commencer à acheter et vendre.",
                    loginBtn: "Connexion", regBtn: "S'inscrire",
                    toggleToReg: "Nouveau sur Cheaplet ? Créez un compte.", toggleToLogin: "Vous avez déjà un compte ? Connectez-vous.",
                    studentTip: "Utilisez votre courriel scolaire (ou un compte Google/Microsoft de l'école) pour obtenir automatiquement le badge <strong>Étudiant vérifié</strong> !",
                    placeFirst: "Prénom", placeLast: "Nom de famille", placeEmail: "Adresse e-mail", placePass: "Mot de passe",
                    google: "Continuer avec Google", microsoft: "Continuer avec Microsoft", or: "OU", back: "Retour", verify: "Vérification...",
                    errBanned: "Compte banni.", errVerify: "Veuillez d'abord vérifier votre e-mail !", errSent: "E-mail de vérification envoyé ! Vérifiez votre boîte de réception.",
                    forgotPass: "Mot de passe oublié ?", enterEmailFirst: "Veuillez entrer votre adresse e-mail pour réinitialiser le mot de passe.", resetSent: "E-mail de réinitialisation envoyé ! Vérifiez votre boîte de réception."
                }
            };

            formTitle.textContent = strings[lang].loginTitle;
            document.getElementById('form-subtitle').textContent = strings[lang].loginSub;
            submitBtn.textContent = strings[lang].loginBtn;
            toggleLink.textContent = strings[lang].toggleToReg;
            document.getElementById('student-tip-text').innerHTML = strings[lang].studentTip;
            document.getElementById('firstName').placeholder = strings[lang].placeFirst;
            document.getElementById('lastName').placeholder = strings[lang].placeLast;
            document.getElementById('email').placeholder = strings[lang].placeEmail;
            document.getElementById('password').placeholder = strings[lang].placePass;
            document.getElementById('google-btn-text').textContent = strings[lang].google;
            document.getElementById('microsoft-btn-text').textContent = strings[lang].microsoft;
            document.getElementById('or-text').textContent = strings[lang].or;
            document.getElementById('back-btn-text').textContent = strings[lang].back;
            document.getElementById('loading-text').textContent = strings[lang].verify;
            forgotPasswordLink.textContent = strings[lang].forgotPass;

            // 🔥 NEW: School Domains Dictionary Mapping
            const schoolDomains = {
                "@etu.cegepjonquiere.ca": "Cégep de Jonquière",
                "@cegep-lanaudiere.qc.ca": "Cégep de Lanaudière",
                "@etu.cegep-lanaudiere.qc.ca": "Cégep de Lanaudière",
                "@crosemont.qc.ca": "Cégep de Rosemont",
                "@cmaisonneuve.qc.ca": "Cégep Maisonneuve",
                "@cegepmv.qc.ca": "Cégep Marie-Victorin",
                "@collegeahuntsic.qc.ca": "Collège Ahuntsic",
                "@dawsoncollege.qc.ca": "Dawson College",
                "@usherbrooke.ca": "Université de Sherbrooke",
                "@ulaval.ca": "Université Laval"
            };

            // Helper function to extract school info from email
            function getSchoolInfo(email) {
                const domain = email.substring(email.lastIndexOf("@")).toLowerCase();
                if (schoolDomains[domain]) {
                    return { isStudent: true, schoolName: schoolDomains[domain] };
                }
                return { isStudent: false, schoolName: null };
            }

            async function handleLoginSuccess(user) {
                loadingOverlay.style.display = 'flex';
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);
                    const email = user.email.toLowerCase();
                    
                    const schoolInfo = getSchoolInfo(email);

                    if (!userDoc.exists()) {
                        await setDoc(userDocRef, { 
                            uid: user.uid, 
                            displayName: user.displayName, 
                            email: user.email, 
                            role: 'user', 
                            isStudent: schoolInfo.isStudent,
                            schoolName: schoolInfo.schoolName
                        });
                    } else {
                        const data = userDoc.data();
                        if (data.role === 'banned') {
                            await signOut(auth); alert(strings[lang].errBanned); window.location.reload(); return;
                        } 
                        // Update legacy accounts if they match the new school list but aren't flagged yet
                        else if (schoolInfo.isStudent && (!data.isStudent || !data.schoolName)) {
                            await updateDoc(userDocRef, { 
                                isStudent: true, 
                                schoolName: schoolInfo.schoolName 
                            });
                        }
                    }
                    window.location.href = new URLSearchParams(window.location.search).get('redirect') || '/index.html';
                } catch (e) { window.location.href = '/index.html'; }
            }

            onAuthStateChanged(auth, async (user) => { 
                if (user && !isRegistering) {
                    const isOAuth = user.providerData.some(p => p.providerId === 'microsoft.com' || p.providerId === 'google.com');
                    if (user.emailVerified || isOAuth) handleLoginSuccess(user);
                    else { await signOut(auth); loadingOverlay.style.display = 'none'; }
                }
            });

            forgotPasswordLink.onclick = async () => {
                const emailVal = document.getElementById('email').value.trim();
                if (!emailVal) {
                    authError.textContent = strings[lang].enterEmailFirst;
                    authError.style.display = 'block';
                    return;
                }
                try {
                    await sendPasswordResetEmail(auth, emailVal);
                    authError.style.display = 'none';
                    alert(strings[lang].resetSent);
                } catch (error) {
                    authError.textContent = error.message;
                    authError.style.display = 'block';
                }
            };

            toggleLink.onclick = () => {
                isLoginMode = !isLoginMode;
                document.getElementById('register-fields').style.display = isLoginMode ? 'none' : 'block';
                studentTip.style.display = isLoginMode ? 'none' : 'flex';
                forgotPasswordLink.style.display = isLoginMode ? 'block' : 'none'; 
                authError.style.display = 'none'; 
                
                formTitle.textContent = isLoginMode ? strings[lang].loginTitle : strings[lang].regTitle;
                document.getElementById('form-subtitle').textContent = isLoginMode ? strings[lang].loginSub : strings[lang].regSub;
                submitBtn.textContent = isLoginMode ? strings[lang].loginBtn : strings[lang].regBtn;
                toggleLink.textContent = isLoginMode ? strings[lang].toggleToReg : strings[lang].toggleToLogin;
            };

            document.getElementById('google-btn').onclick = async () => { try { await signInWithPopup(auth, googleProvider); } catch (e) { authError.textContent = e.message; authError.style.display = 'block'; } };
            document.getElementById('microsoft-btn').onclick = async () => { try { await signInWithPopup(auth, msProvider); } catch (e) { authError.textContent = e.message; authError.style.display = 'block'; } };

            authForm.onsubmit = async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                const email = document.getElementById('email').value.toLowerCase();
                const pass = document.getElementById('password').value;
                authError.style.display = 'none';

                try {
                    if (isLoginMode) {
                        const cred = await signInWithEmailAndPassword(auth, email, pass);
                        if (!cred.user.emailVerified) { await signOut(auth); alert(strings[lang].errVerify); }
                    } else {
                        isRegistering = true;
                        const cred = await createUserWithEmailAndPassword(auth, email, pass);
                        const name = `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`;
                        
                        const schoolInfo = getSchoolInfo(email);
                        
                        await updateProfile(cred.user, { displayName: name });
                        await setDoc(doc(db, "users", cred.user.uid), { 
                            uid: cred.user.uid, 
                            displayName: name, 
                            email: email, 
                            role: 'user', 
                            isStudent: schoolInfo.isStudent,
                            schoolName: schoolInfo.schoolName
                        });
                        await sendEmailVerification(cred.user);
                        
                        await signOut(auth);
                        isRegistering = false;
                        alert(strings[lang].errSent);
                        location.reload();
                    }
                } catch (err) { 
                    authError.textContent = err.message; 
                    authError.style.display = 'block'; 
                    isRegistering = false; 
                }
                submitBtn.disabled = false;
            };

            document.getElementById('smart-back-btn').onclick = () => window.history.back();
        }
        main();
    </script>
</body>
</html>
