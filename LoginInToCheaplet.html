<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cheaplet</title>
    <!-- GLOBAL BRAIN (Connects Profile Circle, Ban Check, Language) -->
    <script type="module" src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 24px; font-weight: bold; cursor: pointer; text-decoration: none; color: white; }
        .logo span { color: #FFD700; }
        
        /* FIX: Align buttons side-by-side and prevent overlapping */
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .btn-back { background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; transition: background 0.3s; }
        .btn-back:hover { background: rgba(255, 255, 255, 0.3); }
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        .auth-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .auth-card h2 { color: #2E7D32; margin-bottom: 10px; font-size: 1.8rem; }
        .auth-card p { color: #666; margin-bottom: 25px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #4CAF50; }
        .btn-submit { background: linear-gradient(135deg, #FFD700 0%, #FFC400 100%); color: #333; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 5px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .separator { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #888; font-size: 0.9rem; }
        .separator::before, .separator::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
        .separator::before { margin-right: 10px; }
        .separator::after { margin-left: 10px; }
        .btn-google { background-color: white; color: #555; border: 1px solid #ddd; padding: 10px; width: 100%; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background-color 0.3s, box-shadow 0.3s; }
        .btn-google:hover { background-color: #f8f9fa; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-google img { width: 20px; height: 20px; }
        .toggle-link { display: block; margin-top: 20px; color: #4CAF50; text-decoration: none; font-weight: 500; cursor: pointer; }
        .toggle-link:hover { text-decoration: underline; }
        .error-message { color: #d32f2f; background-color: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 20px; display: none; font-size: 0.9rem; text-align: left; }
        #register-fields { display: none; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #4CAF50; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { font-size: 1.2rem; color: #333; font-weight: 500; }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-left">
                <button id="smart-back-btn" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <a href="/index.html" class="logo">Cheap<span>let</span></a>
            </div>
            <!-- Global.js target -->
            <div class="header-right"></div>
        </div>
    </header>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Setting up your account...</div>
    </div>

    <main class="container auth-wrapper">
        <div class="auth-card">
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle">Log in to continue shopping and selling.</p>
            <div id="auth-error" class="error-message"></div>
            <form id="auth-form">
                <div id="register-fields">
                    <input type="text" id="firstName" placeholder="First Name">
                    <input type="text" id="lastName" placeholder="Last Name">
                </div>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-submit" id="submit-btn">Log In</button>
            </form>
            <div class="separator">OR</div>
            <button type="button" class="btn-google" id="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Sign in with Google
            </button>
            <a class="toggle-link" id="toggle-auth">New to Cheaplet? Create an account.</a>
        </div>
    </main>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendEmailVerification, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);
            const googleProvider = new GoogleAuthProvider();

            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const authForm = document.getElementById('auth-form');
            const registerFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            const toggleLink = document.getElementById('toggle-auth');
            const authError = document.getElementById('auth-error');
            const googleBtn = document.getElementById('google-btn');
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            const smartBackBtn = document.getElementById('smart-back-btn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');

            let isLoginMode = true;

            smartBackBtn.addEventListener('click', () => {
                if (window.history.length > 1 && document.referrer.includes(window.location.hostname)) {
                    window.history.back();
                } else {
                    window.location.href = '/index.html';
                }
            });

            async function handleLoginSuccess(user) {
                loadingOverlay.style.display = 'flex';
                loadingText.textContent = "Verifying account status...";

                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);

                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        if (userData.role === 'banned') {
                            await signOut(auth);
                            loadingOverlay.style.display = 'none';
                            alert("This account has been banned.");
                            window.location.reload(); 
                            return; 
                        }
                        if (userData.displayName && userData.displayName !== user.displayName) {
                            await updateProfile(user, { displayName: userData.displayName });
                        }
                    } else {
                        await setDoc(userDocRef, {
                            uid: user.uid,
                            displayName: user.displayName,
                            email: user.email,
                            photoURL: user.photoURL,
                            role: 'user'
                        });
                    }
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectTarget = urlParams.get('redirect');
                    window.location.href = redirectTarget || '/index.html';

                } catch (e) {
                    window.location.href = '/index.html';
                }
            }

            onAuthStateChanged(auth, (user) => {
                if (user && user.emailVerified) {
                    handleLoginSuccess(user);
                }
            });

            toggleLink.addEventListener('click', (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                authError.style.display = 'none';
                authForm.reset();
                if (isLoginMode) {
                    formTitle.textContent = 'Welcome Back';
                    formSubtitle.textContent = 'Log in to continue shopping and selling.';
                    registerFields.style.display = 'none';
                    submitBtn.textContent = 'Log In';
                    toggleLink.textContent = 'New to Cheaplet? Create an account.';
                } else {
                    formTitle.textContent = 'Join Cheaplet';
                    formSubtitle.textContent = 'Create an account to start listing items.';
                    registerFields.style.display = 'block';
                    submitBtn.textContent = 'Register';
                    toggleLink.textContent = 'Already have an account? Log in.';
                }
            });

            googleBtn.addEventListener('click', async () => {
                try { await signInWithPopup(auth, googleProvider); } 
                catch (error) { authError.textContent = error.message; authError.style.display = 'block'; }
            });

            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                authError.style.display = 'none';
                submitBtn.disabled = true;
                const email = emailInput.value;
                const password = passwordInput.value;

                try {
                    if (isLoginMode) {
                        const userCredential = await signInWithEmailAndPassword(auth, email, password);
                        if (!userCredential.user.emailVerified) {
                            await signOut(auth);
                            throw new Error('Please verify your email address.');
                        }
                    } else {
                        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                        const displayName = `${firstNameInput.value.trim()} ${lastNameInput.value.trim()}`;
                        await updateProfile(userCredential.user, { displayName: displayName });
                        await sendEmailVerification(userCredential.user);
                        await setDoc(doc(db, "users", userCredential.user.uid), { uid: userCredential.user.uid, displayName, email, role: 'user' });
                        await signOut(auth);
                        alert("Verification email sent!");
                        isLoginMode = true; toggleLink.click(); 
                    }
                } catch (error) {
                    authError.textContent = error.message;
                    authError.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                }
            });
        }
        main();
    </script>
</body>
</html>
