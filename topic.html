<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon — Scoralia</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/dark-theme.css">

    <style>
        :root {
            --ink:    #0C1446;
            --gold:   #C8A96E;
            --muted:  #64748b;
            --text:   #1a2a4a;
        }

        body {
            margin: 0;
            background: var(--ink);
            color: white;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 900;
            color: white;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .logo em {
            color: var(--gold);
            font-style: normal;
        }

        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200,169,110,0.25);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .icon {
            font-size: 3.5rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            margin-bottom: 12px;
        }

        p {
            color: rgba(255,255,255,0.65);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: var(--gold);
            color: var(--ink);
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(200,169,110,0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(200,169,110,0.5);
        }

        .small-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <a href="/" class="logo">Scor<em>alia</em></a>

    <div class="card">
        <div class="icon">
            <i class="fas fa-tools"></i>
        </div>

        <h1 id="title">Function in Progress</h1>
        <p id="message">We're working on an improved Campus Hub experience.<br>Please check back soon!</p>

        <a href="/" class="btn">
            <i class="fas fa-arrow-left" style="margin-right:8px;"></i>
            <span id="btn-text">Back to Home</span>
        </a>

        <div class="small-text">
            © 2026 Scoralia
        </div>
    </div>

    <script>
        (function() {
            const lang = localStorage.getItem('preferred_language') || 'en';

            const strings = {
                en: {
                    title: "Function in Progress",
                    message: "We're working on an improved Campus Hub experience.<br>Please check back soon!",
                    btn: "Back to Home"
                },
                fr: {
                    title: "Fonction en cours",
                    message: "Nous travaillons sur une nouvelle expérience du Campus Hub.<br>Revenez bientôt !",
                    btn: "Retour à l'accueil"
                }
            };

            const t = strings[lang] || strings['en'];
            document.getElementById('title').textContent = t.title;
            document.getElementById('message').innerHTML = t.message;
            document.getElementById('btn-text').textContent = t.btn;
        })();
    </script>

</body>
</html>
