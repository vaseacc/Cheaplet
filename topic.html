<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topic — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        .hub-layout { max-width: 1100px; margin: 30px auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; padding: 0 20px; align-items: start; width: 100%; }

        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .school-header { margin-bottom: 10px; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
        .school-sub { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; }
        .topics-menu { display: flex; flex-direction: column; gap: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 10px; }
        .way-item { padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); transition: all 0.2s; font-size: 0.95rem; text-decoration: none; }
        .way-item:hover { background: #f1f5f9; color: var(--deep); }
        .way-item.active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); border: var(--border); font-weight: 700; }
        .way-item i { width: 20px; text-align: center; color: var(--text-muted); font-size: 1.1rem; }
        .way-item.active i { color: var(--gold); }
        .way-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); background: var(--off-white); padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .btn-new-way { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: 1.5px dashed #cbd5e1; border-radius: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-top: 10px; }
        .btn-new-way:hover { color: var(--deep); border-color: var(--deep); background: #f8fafc; }

        .mobile-topics-wrapper { display: none; position: sticky; top: 68px; z-index: 150; background: var(--white); border-bottom: var(--border); width: 100%; align-items: center; }
        .mobile-ways-bar { display: flex; padding: 12px 10px 12px 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-grow: 1; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 10px; cursor: pointer; border: var(--border); transition: 0.2s; text-decoration: none; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .m-way-count { opacity: 0.6; font-size: 0.75rem; margin-left: 4px; }
        .mobile-fade { width: 40px; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1)); position: absolute; right: 55px; pointer-events: none; }
        .m-create-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--off-white); border: var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-right: 15px; z-index: 2; transition: 0.2s; font-size: 1rem; }
        .m-create-btn:hover { color: var(--deep); border-color: var(--deep); background: #f1f5f9; }

        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; width: 100%; min-width: 0; overflow-x: hidden; }

        .topic-header { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 10px; }
        .topic-header i { color: var(--gold); }

        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); width: 100%; display: flex; gap: 15px; align-items: flex-start; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-input-wrapper { flex-grow: 1; position: relative; background: var(--off-white); border: 1px solid #e2e8f0; border-radius: 24px; padding: 5px 15px; display: flex; align-items: flex-end; transition: border-color 0.2s, background 0.2s; }
        .composer-input-wrapper:focus-within { border-color: var(--deep); background: var(--white); }
        .composer-input { flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 1rem; color: var(--text-main); resize: none; outline: none; padding: 10px 0; min-height: 40px; max-height: 150px; }
        .composer-input::placeholder { color: #94a3b8; }
        .btn-composer-send { background: var(--deep); color: var(--white); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; margin-left: 10px; transition: 0.2s; flex-shrink: 0; }
        .btn-composer-send:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-composer-send:not(:disabled):hover { background: var(--ink); transform: translateY(-2px); }

        .btn-action { background: var(--gold); color: var(--ink); border: none; padding: 10px 28px; border-radius: 30px; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(200, 169, 110, 0.2); }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(200, 169, 110, 0.4); }
        .btn-ghost { background: #f1f5f9; color: var(--text-main); padding: 10px 28px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-ghost:hover { background: #e2e8f0; }

        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; overflow: hidden; }
        .post-author-link { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px; margin-bottom: 18px; transition: opacity 0.2s; }
        .post-author-link:hover { opacity: 0.8; }
        .post-author-link:hover .post-author { color: var(--deep); text-decoration: underline; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; flex-shrink: 0; }
        .post-meta { display: flex; flex-direction: column; overflow: hidden; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; word-wrap: break-word; width: 100%; }
        
        .post-actions { display: flex; gap: 25px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .action-btn:hover { color: var(--deep); }
        .action-btn.liked { color: #e53e3e; }
        .action-btn.liked i { animation: popHeart 0.3s ease; }
        @keyframes popHeart { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* Comments */
        .comments-section { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e2e8f0; }
        .comment-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .comment-list::-webkit-scrollbar { width: 6px; }
        .comment-list::-webkit-scrollbar-track { background: var(--off-white); border-radius: 10px; }
        .comment-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .comment-item { display: flex; gap: 10px; animation: fadeUp 0.2s ease both; }
        .comment-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #f1f5f9; flex-shrink: 0; }
        .comment-content { background: var(--off-white); padding: 10px 14px; border-radius: 12px; flex-grow: 1; border: 1px solid #f1f5f9; }
        .comment-author-link { text-decoration: none; color: inherit; }
        .comment-author { font-weight: 700; font-size: 0.85rem; color: var(--ink); margin-bottom: 2px; transition: color 0.2s; }
        .comment-author-link:hover .comment-author { color: var(--deep); text-decoration: underline; }
        .comment-text { font-size: 0.9rem; color: #334155; word-wrap: break-word; line-height: 1.4; }
        .comment-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; }
        .comment-input-wrapper { display: flex; gap: 10px; align-items: flex-start; }
        .comment-input { flex-grow: 1; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 20px; font-family: inherit; font-size: 0.9rem; resize: none; outline: none; height: 42px; transition: border-color 0.2s; }
        .comment-input:focus { border-color: var(--deep); }
        .btn-comment-send { background: var(--deep); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .btn-comment-send:hover:not(:disabled) { background: var(--ink); transform: translateY(-2px); }
        .btn-comment-send:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader-msg { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.1rem; font-weight: 500; }
        .loader-msg i { font-size: 2rem; color: var(--gold); margin-bottom: 15px; display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Modals */
        .login-modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.9); backdrop-filter: blur(6px); z-index: 10020; display: none; justify-content: center; align-items: center; padding: 20px; }
        .login-modal-card { background: white; border-radius: 24px; padding: 32px; max-width: 420px; width: 100%; text-align: center; animation: fadeUp 0.3s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
        .login-modal-card h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 12px; }
        .login-modal-card p { color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem; }
        .login-modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .login-modal-buttons .btn { padding: 10px 24px; min-width: 120px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-login { background: var(--gold); color: var(--ink); }
        .btn-register { background: transparent; border: 2px solid var(--gold); color: var(--ink); }
        .close-modal { position: absolute; top: 16px; right: 20px; font-size: 1.4rem; cursor: pointer; color: #aaa; }

        @media (max-width: 850px) {
            .hub-layout { display: flex; flex-direction: column; padding: 0; gap: 0; margin: 0; width: 100%; }
            .sidebar { display: none; }
            .mobile-topics-wrapper { display: flex; }
            .feed-column { gap: 8px; padding: 8px 0 60px; background: var(--off-white); width: 100%; }
            .topic-header { padding: 15px 15px 0; margin: 0; }
            .composer { padding: 15px; margin-bottom: 0; border-radius: 0; border-left: none; border-right: none; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; box-shadow: none; width: 100%; }
            .post-card { padding: 16px 15px; border-radius: 0; border-left: none; border-right: none; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; box-shadow: none; margin-bottom: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <!-- MOBILE TOPICS BAR -->
    <div class="mobile-topics-wrapper">
        <div class="mobile-ways-bar" id="mobile-ways-list">
            <a href="/social.html" class="m-way-pill">
                <i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span>
            </a>
        </div>
        <div class="mobile-fade"></div>
        <button class="m-create-btn" id="m-btn-create-way"><i class="fas fa-plus"></i></button>
    </div>

    <div class="hub-layout">
        
        <aside class="sidebar">
            <div class="school-header">
                <div class="school-name" id="d-user-school">Campus</div>
                <div class="school-sub">Community Hub</div>
            </div>
            
            <div class="topics-menu">
                <div class="topic-section-title" data-i18n="topics_public">Public Channels</div>
                <div id="desktop-general-list">
                    <a href="/social.html" class="way-item">
                        <i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span>
                    </a>
                </div>

                <div class="topic-section-title" style="margin-top: 20px;" data-i18n="topics_custom">Custom Topics</div>
                <div id="desktop-ways-list"></div>
                <button class="btn-new-way" id="btn-create-way"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>
            </div>

            <button class="btn-action" style="width:100%; margin-top:15px; background:var(--ink); color:white; justify-content:center;" onclick="window.location.href='/listanitem.html'" data-i18n="sell">List a Book</button>

            <div style="padding: 10px; font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; margin-top: 10px;">
                <a href="/terms.html" style="color:inherit; text-decoration:none;">Terms</a> · 
                <a href="/privacy.html" style="color:inherit; text-decoration:none;">Privacy</a> · 
                <a href="/safety.html" style="color:inherit; text-decoration:none;">Safety</a><br>
                © 2026 Scoralia
            </div>
        </aside>

        <main class="feed-column">
            
            <div class="topic-header">
                <i class="fas fa-hashtag"></i> <span id="ui-topic-name">Loading...</span>
            </div>

            <!-- COMPOSER -->
            <div class="composer" id="composer-card" style="display: none;">
                <img src="" id="composer-pfp" class="composer-pfp" alt="Avatar">
                <div class="composer-input-wrapper">
                    <textarea class="composer-input" id="post-input" placeholder="Loading..."></textarea>
                    <button class="btn-composer-send" id="btn-send-post" disabled><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="feed-container">
                <div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i> <br><span id="ui-loading" data-i18n="loading_hub">Loading topic...</span></div>
            </div>

        </main>
    </div>

    <!-- MODAL FOR LOGIN/REGISTER -->
    <div id="login-modal" class="login-modal-overlay" style="display: none;">
        <div class="login-modal-card">
            <span class="close-modal" id="close-login-modal">&times;</span>
            <h2 id="modal-login-title">Join the Conversation</h2>
            <p id="modal-login-desc">Sign in to access this custom topic and share your thoughts.</p>
            <div class="login-modal-buttons">
                <button class="btn btn-login" id="modal-login-btn">Log In</button>
                <button class="btn btn-register" id="modal-register-btn">Register</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, limit, getDocs } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const urlParams = new URLSearchParams(window.location.search);
            const topicId = urlParams.get('id');
            if (!topicId) { window.location.href = '/social.html'; return; }

            const lang = localStorage.getItem('preferred_language') || 'en';
            const allStrings = {
                en: { 
                    topics_public: "Public Channels", topics_campus: "Campus Public", topics_custom: "Custom Topics", topics_new: "Create Topic",
                    btn_post: "Post", loading_hub: "Loading topic...",
                    noPosts: "No posts yet. Be the first to share something!", justNow: "Just now", guest: "Campus Hub", sell: "List a Book",
                    loginTitle: "Join the Conversation", loginDesc: "Sign in to access this custom topic and share your thoughts.",
                    loginBtn: "Log In", registerBtn: "Register", comment_placeholder: "Write a comment...", no_comments: "No comments yet.",
                    post_in: "Post in #"
                },
                fr: { 
                    topics_public: "Canaux Publics", topics_campus: "Campus Public", topics_custom: "Sujets Personnalisés", topics_new: "Nouveau Sujet",
                    btn_post: "Publier", loading_hub: "Chargement du sujet...",
                    noPosts: "Aucune publication. Soyez le premier à partager !", justNow: "À l'instant", guest: "Hub Campus", sell: "Vendre un livre",
                    loginTitle: "Rejoindre la conversation", loginDesc: "Connectez-vous pour accéder à ce sujet personnalisé et partager vos idées.",
                    loginBtn: "Connexion", registerBtn: "S'inscrire", comment_placeholder: "Écrire un commentaire...", no_comments: "Aucun commentaire pour le moment.",
                    post_in: "Publier dans #"
                }
            };
            const ui = allStrings[lang] || allStrings['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => { if (ui[el.getAttribute('data-i18n')]) el.textContent = ui[el.getAttribute('data-i18n')]; });

            // Fetch Topic Name
            let currentTopicName = "Topic";
            try {
                const tDoc = await getDoc(doc(db, "social_channels", topicId));
                if (!tDoc.exists()) { window.location.href = '/social.html'; return; }
                currentTopicName = tDoc.data().name;
                document.getElementById('ui-topic-name').textContent = currentTopicName;
                document.getElementById('post-input').placeholder = `${ui.post_in}${currentTopicName}...`;
            } catch(e) {
                window.location.href = '/social.html'; return;
            }

            const loginModal = document.getElementById('login-modal');
            window.showLoginModal = (tId) => {
                const redirect = tId ? `/topic.html?id=${tId}` : `/topic.html?id=${topicId}`;
                document.getElementById('modal-login-btn').onclick = () => window.location.href = `/LoginInToCheaplet.html?redirect=${encodeURIComponent(redirect)}`;
                document.getElementById('modal-register-btn').onclick = () => window.location.href = `/LoginInToCheaplet.html?redirect=${encodeURIComponent(redirect)}`;
                loginModal.style.display = 'flex';
            };
            document.getElementById('close-login-modal').onclick = () => { loginModal.style.display = 'none'; };

            function formatCount(num) { return !num ? 0 : (num > 999 ? (num / 1000).toFixed(1) + 'k' : num); }

            let currentUser = null;
            let internalSchoolName = "Global Campus"; 
            let unsubscribePosts = null;
            let commentUnsubscribes = {}; 

            const dSchoolName = document.getElementById('d-user-school');
            const desktopWaysList = document.getElementById('desktop-ways-list');
            const mobileWaysList = document.getElementById('mobile-ways-list');
            const feedContainer = document.getElementById('feed-container');

            // --- COMPOSER EVENTS ---
            const postInput = document.getElementById('post-input');
            const btnSendPost = document.getElementById('btn-send-post');

            postInput.addEventListener('input', function() {
                this.style.height = '40px';
                this.style.height = (this.scrollHeight) + 'px';
                if (this.value.trim() === '') {
                    this.style.height = '40px';
                    btnSendPost.disabled = true;
                } else {
                    btnSendPost.disabled = false;
                }
            });

            btnSendPost.onclick = async () => {
                if (!currentUser) { window.showLoginModal(topicId); return; }
                
                const text = postInput.value.trim();
                if (!text) return;
                
                btnSendPost.disabled = true;
                postInput.value = '';
                postInput.style.height = '40px'; 
                postInput.blur(); 

                try {
                    let photoToSave = currentUser.photoURL;
                    if (!photoToSave || photoToSave.includes("googleusercontent") || photoToSave.includes("live.com")) {
                        photoToSave = `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}&backgroundColor=EBF2FA`;
                    }

                    await addDoc(collection(db, "social_posts"), {
                        wayId: topicId,
                        schoolName: internalSchoolName,
                        text: text,
                        authorUid: currentUser.uid,
                        authorName: currentUser.displayName || "User",
                        authorPhoto: photoToSave,
                        likes: 0,
                        likedBy: [],
                        commentCount: 0,
                        timestamp: serverTimestamp()
                    });

                    await updateDoc(doc(db, "social_channels", topicId), { postCount: increment(1) });
                } catch (e) { 
                    alert("Error posting."); 
                    btnSendPost.disabled = false;
                }
            };

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uSnap = await getDoc(doc(db, "users", user.uid));
                    if (uSnap.exists()) {
                        const data = uSnap.data();
                        currentUser = { ...user, ...data };
                        internalSchoolName = data.schoolName || "Global Campus";
                        
                        dSchoolName.textContent = internalSchoolName === "Global Campus" ? ui.guest : internalSchoolName;
                        document.getElementById('composer-card').style.display = 'flex';
                        document.getElementById('composer-pfp').src = data.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}&backgroundColor=EBF2FA`;
                        
                        loadTopics();
                        loadFeed();
                    }
                } else {
                    internalSchoolName = "Global Campus";
                    dSchoolName.textContent = ui.guest;
                    loadTopics();
                    loadFeed();
                }
            });

            function loadTopics() {
                const q = query(collection(db, "social_channels"), orderBy("postCount", "desc"));
                onSnapshot(q, (snapshot) => {
                    desktopWaysList.innerHTML = '';
                    
                    const mGeneral = document.createElement('a');
                    mGeneral.className = 'm-way-pill'; mGeneral.href = '/social.html';
                    mGeneral.innerHTML = `<i class="fas fa-globe-americas"></i> ${ui.topics_campus}`;
                    mobileWaysList.innerHTML = '';
                    mobileWaysList.appendChild(mGeneral);

                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        
                        const isPrivate = d.visibility === 'private';
                        const isOwner = currentUser && d.createdBy === currentUser.uid;
                        if (isPrivate && !isOwner) return;

                        const displayCount = formatCount(d.postCount);
                        const lockIcon = isPrivate ? ' <i class="fas fa-lock" style="font-size:0.65rem; margin-left:4px;"></i>' : '';
                        const isActive = topicId === docSnap.id;
                        
                        const dItem = document.createElement('a');
                        dItem.className = `way-item ${isActive ? 'active' : ''}`;
                        dItem.href = `/topic.html?id=${docSnap.id}`;
                        dItem.innerHTML = `<i class="fas fa-hashtag"></i> <span style="flex-grow:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${d.name}${lockIcon}</span> <span class="way-count">${displayCount}</span>`;
                        dItem.onclick = (e) => {
                            if (!currentUser) { e.preventDefault(); showLoginModal(docSnap.id); }
                        };
                        desktopWaysList.appendChild(dItem);

                        const mItem = document.createElement('a');
                        mItem.className = `m-way-pill ${isActive ? 'active' : ''}`;
                        mItem.href = `/topic.html?id=${docSnap.id}`;
                        mItem.innerHTML = `<i class="fas fa-hashtag"></i> ${d.name}${lockIcon} <span class="m-way-count">${displayCount}</span>`;
                        mItem.onclick = (e) => {
                            if (!currentUser) { e.preventDefault(); showLoginModal(docSnap.id); }
                        };
                        mobileWaysList.appendChild(mItem);
                    });
                });
            }

            const triggerNewWay = () => {
                if (!currentUser) { showLoginModal(null); return; }
                window.location.href = '/createtopic.html';
            };
            
            document.getElementById('btn-create-way').onclick = triggerNewWay;
            document.getElementById('m-btn-create-way').onclick = triggerNewWay;

            function loadFeed() {
                if (unsubscribePosts) unsubscribePosts();
                Object.values(commentUnsubscribes).forEach(unsub => unsub());
                commentUnsubscribes = {};

                feedContainer.innerHTML = `<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br><span>${ui.loading_hub}</span></div>`;

                let q = query(collection(db, "social_posts"), orderBy("timestamp", "desc"), limit(100));
                
                try {
                    unsubscribePosts = onSnapshot(q, (snapshot) => {
                        feedContainer.innerHTML = '';
                        
                        let filteredDocs = snapshot.docs.filter(d => d.data().wayId === topicId);

                        if (filteredDocs.length === 0) {
                            feedContainer.innerHTML = `<div class="loader-msg">${ui.noPosts}</div>`;
                            return;
                        }

                        const frag = document.createDocumentFragment();

                        filteredDocs.forEach(docSnap => {
                            const d = docSnap.data();
                            frag.appendChild(createPostElement(docSnap.id, d));
                        });

                        feedContainer.appendChild(frag);
                    });
                } catch (e) { console.error(e); }
            }

            function createPostElement(id, d) {
                let pfp = d.authorPhoto || `https://api.dicebear.com/7.x/identicon/svg?seed=${d.authorUid}&backgroundColor=EBF2FA`;
                
                let timeStr = ui.justNow;
                if (d.timestamp) {
                    const dateObj = d.timestamp.toDate();
                    const diffMins = Math.round((new Date() - dateObj) / 60000);
                    if (diffMins < 60) timeStr = lang === 'fr' ? `Il y a ${diffMins} min` : `${diffMins}m`;
                    else if (diffMins < 1440) timeStr = lang === 'fr' ? `Il y a ${Math.round(diffMins/60)} h` : `${Math.round(diffMins/60)}h`;
                    else timeStr = lang === 'fr' ? `Il y a ${Math.round(diffMins/1440)} j` : `${Math.round(diffMins/1440)}d`;
                }

                const isLiked = currentUser && d.likedBy && d.likedBy.includes(currentUser.uid);
                const commentCount = d.commentCount || 0;

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <a href="/user.html?id=${d.authorUid}" class="post-author-link">
                        <img src="${pfp}" class="post-avatar" alt="Avatar">
                        <div class="post-meta">
                            <span class="post-author">${d.authorName}</span>
                            <span class="post-time">${timeStr}</span>
                        </div>
                    </a>
                    <div class="post-body">${d.text}</div>
                    
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.likePost('${id}', ${isLiked})">
                            <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> ${d.likes || 0}
                        </button>
                        <button class="action-btn" onclick="window.toggleComments('${id}')">
                            <i class="far fa-comment"></i> ${commentCount}
                        </button>
                    </div>

                    <div class="comments-section" id="comments-section-${id}">
                        <div class="comment-list" id="comment-list-${id}">
                            <div style="text-align:center; font-size:0.8rem; color:#888;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                        </div>
                        <div class="comment-input-wrapper">
                            <textarea class="comment-input" id="comment-input-${id}" placeholder="${ui.comment_placeholder}"></textarea>
                            <button class="btn-comment-send" onclick="window.postComment('${id}')" id="btn-send-comment-${id}"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;
                return card;
            }

            window.likePost = async (id, alreadyLiked) => {
                if (!currentUser) { window.showLoginModal(topicId); return; }
                const ref = doc(db, "social_posts", id);
                if(alreadyLiked) {
                    await updateDoc(ref, { likes: increment(-1), likedBy: arrayRemove(currentUser.uid) });
                } else {
                    await updateDoc(ref, { likes: increment(1), likedBy: arrayUnion(currentUser.uid) });
                }
            };

            window.toggleComments = (postId) => {
                const section = document.getElementById(`comments-section-${postId}`);
                if (section.style.display === 'block') {
                    section.style.display = 'none';
                    if (commentUnsubscribes[postId]) {
                        commentUnsubscribes[postId]();
                        delete commentUnsubscribes[postId];
                    }
                } else {
                    section.style.display = 'block';
                    loadCommentsForPost(postId);
                }
            };

            function loadCommentsForPost(postId) {
                const listEl = document.getElementById(`comment-list-${postId}`);
                const q = query(collection(db, "social_posts", postId, "comments"), orderBy("timestamp", "asc"));
                
                commentUnsubscribes[postId] = onSnapshot(q, (snap) => {
                    listEl.innerHTML = '';
                    if (snap.empty) {
                        listEl.innerHTML = `<div style="text-align:center; font-size:0.85rem; color:var(--text-muted);">${ui.no_comments}</div>`;
                        return;
                    }
                    
                    snap.forEach(doc => {
                        const c = doc.data();
                        let timeStr = ui.justNow;
                        if (c.timestamp) {
                            const diffMins = Math.round((new Date() - c.timestamp.toDate()) / 60000);
                            if (diffMins < 60) timeStr = lang === 'fr' ? `Il y a ${diffMins}m` : `${diffMins}m`;
                            else if (diffMins < 1440) timeStr = lang === 'fr' ? `Il y a ${Math.round(diffMins/60)}h` : `${Math.round(diffMins/60)}h`;
                            else timeStr = lang === 'fr' ? `Il y a ${Math.round(diffMins/1440)}j` : `${Math.round(diffMins/1440)}d`;
                        }
                        let pfp = c.authorPhoto || `https://api.dicebear.com/7.x/identicon/svg?seed=${c.authorUid}&backgroundColor=EBF2FA`;
                        
                        const div = document.createElement('div');
                        div.className = 'comment-item';
                        div.innerHTML = `
                            <a href="/user.html?id=${c.authorUid}"><img src="${pfp}" class="comment-avatar"></a>
                            <div class="comment-content">
                                <a href="/user.html?id=${c.authorUid}" class="comment-author-link"><div class="comment-author">${c.authorName}</div></a>
                                <div class="comment-text">${c.text}</div>
                                <div class="comment-time">${timeStr}</div>
                            </div>
                        `;
                        listEl.appendChild(div);
                    });
                    listEl.scrollTop = listEl.scrollHeight;
                });
            }

            window.postComment = async (postId) => {
                if (!currentUser) { window.showLoginModal(topicId); return; }
                const inputEl = document.getElementById(`comment-input-${postId}`);
                const btnEl = document.getElementById(`btn-send-comment-${postId}`);
                const text = inputEl.value.trim();
                
                if (!text) return;
                
                btnEl.disabled = true;
                inputEl.value = '';
                
                let photoToSave = currentUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.uid}&backgroundColor=EBF2FA`;

                try {
                    await addDoc(collection(db, "social_posts", postId, "comments"), {
                        text: text,
                        authorUid: currentUser.uid,
                        authorName: currentUser.displayName || "User",
                        authorPhoto: photoToSave,
                        timestamp: serverTimestamp()
                    });
                    await updateDoc(doc(db, "social_posts", postId), { commentCount: increment(1) });
                } catch(e) { console.error(e); alert("Error posting comment."); } 
                finally { btnEl.disabled = false; }
            };

            document.body.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target.classList.contains('comment-input')) {
                    e.preventDefault();
                    const postId = e.target.id.replace('comment-input-', '');
                    window.postComment(postId);
                }
            });
        }
        main();
    </script>
</body>
</html>
