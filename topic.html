<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topic — Scoralia</title>
    <script type="module" src="global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink:       #0C1446;
            --deep:      #2B5C92;
            --off-white: #F8FAFC;
            --white:     #FFFFFF;
            --gold:      #C8A96E;
            --text-main: #0f172a;
            --text-muted:#64748b;
            --radius:    16px;
            --shadow:    0 4px 20px rgba(12,20,70,0.05);
            --border:    1px solid #e2e8f0;
            --red:       #e53e3e;
            --green:     #2E7D32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); color: var(--text-main); overflow-x: hidden; width: 100%; }

        header { position: sticky; top: 0; z-index: 200; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
        .logo em { color: var(--gold); font-style: normal; }

        /* ── RESTRICTED ACCESS SCREEN ── */
        .locked-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 68px); padding: 20px; text-align: center; }
        .locked-card { background: var(--white); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: var(--border); max-width: 450px; width: 100%; animation: fadeUp 0.4s ease both; }
        .locked-icon { font-size: 3rem; color: var(--red); margin-bottom: 20px; }
        .locked-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 15px; }
        .locked-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .btn-locked { background: var(--gold); color: var(--ink); border: none; padding: 12px 30px; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-locked:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(200, 169, 110, 0.4); }

        /* ── MAIN LAYOUT ── */
        .hub-layout { display: none; max-width: 1100px; margin: 30px auto; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; padding: 0 20px; align-items: start; width: 100%; }

        .sidebar { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 5px; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .school-header { margin-bottom: 10px; }
        .school-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.2; }
        .school-sub { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; }
        .topics-menu { display: flex; flex-direction: column; gap: 4px; }
        .topic-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 10px; }
        .way-item { padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--text-main); transition: all 0.2s; font-size: 0.95rem; text-decoration: none; }
        .way-item:hover { background: #f1f5f9; color: var(--deep); }
        .way-item.active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); border: var(--border); font-weight: 700; }
        .way-item i { width: 20px; text-align: center; color: var(--text-muted); font-size: 1.1rem; }
        .way-item.active i { color: var(--gold); }
        .way-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); background: var(--off-white); padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .edit-way-btn { margin-left: auto; color: var(--text-muted); padding: 5px; border-radius: 5px; transition: 0.2s; }
        .edit-way-btn:hover { background: #e2e8f0; color: var(--deep); }

        .btn-new-way { width: 100%; text-align: left; padding: 12px 15px; background: transparent; border: 1.5px dashed #cbd5e1; border-radius: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; margin-top: 10px; }
        .btn-new-way:hover { color: var(--deep); border-color: var(--deep); background: #f8fafc; }

        .mobile-topics-wrapper { display: none; position: sticky; top: 68px; z-index: 150; background: var(--white); border-bottom: var(--border); width: 100%; align-items: center; }
        .mobile-ways-bar { display: flex; padding: 12px 10px 12px 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-grow: 1; }
        .mobile-ways-bar::-webkit-scrollbar { display: none; }
        .m-way-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: var(--off-white); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 10px; cursor: pointer; border: var(--border); transition: 0.2s; text-decoration: none; }
        .m-way-pill.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
        .m-way-count { opacity: 0.6; font-size: 0.75rem; margin-left: 4px; }
        .mobile-fade { width: 40px; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1)); position: absolute; right: 55px; pointer-events: none; }
        .m-menu-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--off-white); border: var(--border); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-right: 15px; z-index: 2; transition: 0.2s; font-size: 1.1rem; }
        .m-menu-btn:hover { color: var(--deep); border-color: var(--deep); background: #f1f5f9; }

        /* Bottom Sheet */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.6); backdrop-filter: blur(4px); z-index: 10050; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10051; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
        .sheet-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .sheet-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); }
        .close-sheet { background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; }
        .sheet-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .sheet-section { margin-bottom: 25px; }
        .sheet-section-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }

        .feed-column { display: flex; flex-direction: column; gap: 24px; padding-bottom: 60px; width: 100%; min-width: 0; overflow-x: hidden; }

        .topic-header { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--ink); display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .topic-title-area { display: flex; align-items: center; gap: 10px; }
        .topic-title-area i { color: var(--gold); }
        .topic-settings-btn { background: var(--surface); color: var(--deep); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--mist); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .topic-settings-btn:hover { background: var(--mist); color: var(--ink); transform: scale(1.05); }

        /* Composer */
        .composer { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: var(--border); width: 100%; display: flex; gap: 15px; align-items: flex-start; }
        .composer-pfp { width: 45px; height: 45px; border-radius: 50%; background: #eee; object-fit: cover; border: 2px solid var(--off-white); flex-shrink: 0; }
        .composer-content { flex-grow: 1; display: flex; flex-direction: column; background: var(--off-white); border: 1px solid #e2e8f0; border-radius: 18px; padding: 5px; transition: border-color 0.2s, background 0.2s; }
        .composer-content:focus-within { border-color: var(--deep); background: var(--white); }
        .composer-input { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 1rem; color: var(--text-main); resize: none; outline: none; padding: 10px 15px; min-height: 40px; max-height: 150px; }
        .composer-preview-area { display: none; padding: 10px 15px; border-top: 1px dashed #cbd5e1; gap: 10px; flex-wrap: wrap; }
        .btn-composer-send { background: var(--deep); color: var(--white); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; margin-left: 10px; flex-shrink: 0; }
        .btn-composer-send:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Cards */
        .post-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: var(--border); animation: fadeUp 0.4s ease both; width: 100%; overflow: visible; position: relative; }
        .post-header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .post-author-link { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px; margin-bottom: 15px; transition: opacity 0.2s; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; flex-shrink: 0; }
        .post-meta { display: flex; flex-direction: column; overflow: hidden; }
        .post-author { font-weight: 800; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        .post-menu-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 5px 10px; border-radius: 50%; transition: 0.2s; }
        .post-dropdown { position: absolute; right: 0; top: 35px; background: var(--white); border: var(--border); border-radius: 12px; box-shadow: var(--shadow-md); width: 160px; display: none; flex-direction: column; z-index: 100; overflow: hidden; }
        .post-dropdown.show { display: flex; }
        .post-dropdown-item { padding: 12px 15px; background: none; border: none; text-align: left; font-family: inherit; font-size: 0.9rem; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; }
        .post-dropdown-item.danger { color: var(--red); }
        .post-body { font-size: 1.05rem; line-height: 1.6; color: #334155; white-space: pre-wrap; word-wrap: break-word; width: 100%; margin-bottom: 15px; }
        .post-image-attachment { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; cursor: pointer; }
        .post-listing-attachment { display: flex; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; transition: 0.2s; margin-bottom: 15px; background: var(--off-white); }
        .pla-img { width: 100px; height: 100px; background-size: cover; background-position: center; background-color: #cbd5e1; flex-shrink: 0; }
        .pla-info { padding: 12px 15px; }
        .pla-title { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
        .pla-price { font-weight: 800; color: var(--deep); }
        .post-actions { display: flex; gap: 25px; margin-top: 5px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(12,20,70,0.85); backdrop-filter: blur(4px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: var(--white); padding: 30px; border-radius: var(--radius); width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
        .modal-card h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 12px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 15px; }
        .btn { padding: 10px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-danger { background: var(--red); color: white; }
        .btn-ghost { background: var(--surface); color: var(--text-main); }
        .preview-img-wrap { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1; }
        .remove-preview-btn { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; background: var(--red); color: white; border-radius: 50%; border: none; font-size: 0.7rem; cursor: pointer; }

        @media (max-width: 850px) {
            .hub-layout { display: flex; flex-direction: column; padding: 0; gap: 0; margin: 0; width: 100%; }
            .sidebar { display: none; }
            .mobile-topics-wrapper { display: flex; }
            .feed-column { gap: 8px; padding: 8px 0 60px; background: var(--off-white); }
            .composer { padding: 15px; border-radius: 0; border-left: none; border-right: none; }
            .post-card { padding: 16px 15px; border-radius: 0; }
        }
    </style>
</head>

        <div class="header-inner">
            <a href="/index.html" class="logo">Scor<em>alia</em></a>
            <div class="header-right"></div>
        </div>
    </header>

    <div class="locked-screen" id="locked-screen">
        <div class="locked-card">
            <i class="fas fa-lock locked-icon"></i>
            <h2 class="locked-title" id="ui-locked-title">Restricted Access</h2>
            <p class="locked-desc" id="ui-locked-desc">Log in with a student email to join.</p>
            <a href="/LoginInToCheaplet.html?redirect=/social.html" class="btn-locked">Log In</a>

    <div class="mobile-topics-wrapper" id="mobile-topics-wrapper">

    </div>

    <div class="sheet-overlay" id="sheet-overlay"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-header"><div class="sheet-title" data-i18n="topics_directory">Topics</div><button class="close-sheet" id="close-sheet-btn">&times;</button></div>
        <div class="sheet-content">
            <button class="btn-new-way" id="m-sheet-create-way"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>

            <div class="sheet-section" id="m-sec-pinned"><div class="sheet-section-title" data-i18n="pinned_topics">Pinned Topics</div><div id="m-list-pinned"></div></div>
            <div class="sheet-section" id="m-sec-discover"><div class="sheet-section-title" data-i18n="discover_topics">Discover</div><div id="m-list-discover"></div></div>

    <div class="hub-layout" id="hub-layout">
        <aside class="sidebar">
            <div class="school-header"><div class="school-name" id="d-user-school">Campus</div><div class="school-sub">Community Hub</div></div>
            <div class="topics-menu">
                <div class="topic-section-title" data-i18n="topics_public">Public Channels</div>
                <div id="desktop-general-list"><a href="/social.html" class="way-item"><i class="fas fa-globe-americas"></i> <span data-i18n="topics_campus">Campus Public</span></a></div>
                <div id="d-sec-my" style="display:none;"><div class="topic-section-title" data-i18n="my_topics">My Topics</div><div id="d-list-my"></div></div>
                <div id="d-sec-pinned" style="display:none;"><div class="topic-section-title" data-i18n="pinned_topics">Pinned Topics</div><div id="d-list-pinned"></div></div>
                <div id="d-sec-discover" style="display:none;"><div class="topic-section-title" data-i18n="discover_topics">Discover</div><div id="d-list-discover"></div></div>
                <button class="btn-new-way" id="btn-create-way"><i class="fas fa-plus"></i> <span data-i18n="topics_new">Create Topic</span></button>
            </div>
            <button class="btn-action" style="width:100%; margin-top:15px; background:var(--ink); color:white; justify-content:center;" onclick="window.location.href='/listanitem.html'" data-i18n="sell">List a Book</button>
        </aside>

        <main class="feed-column">
            <div class="social-search-bar"><i class="fas fa-search" style="color:var(--text-muted); margin-left:5px;"></i><input type="text" class="social-search-input" id="social-search-input" placeholder="Search..."><button class="social-search-btn" id="btn-social-search"><i class="fas fa-arrow-right"></i></button></div>
            <div class="topic-header"><div class="topic-title-area"><i class="fas fa-hashtag"></i> <span id="ui-topic-name">Loading...</span></div><div style="display:flex; gap:10px;"><button class="topic-settings-btn" id="btn-pin-topic" style="display:none;"><i class="far fa-bookmark"></i></button><a href="#" class="topic-settings-btn" id="topic-settings-btn" style="display:none;"><i class="fas fa-cog"></i></a></div></div>
            <div class="composer" id="composer-card"><img src="" id="composer-pfp" class="composer-pfp"><div class="composer-content"><textarea class="composer-input" id="post-input"></textarea><div class="composer-preview-area" id="composer-preview-area"></div><div class="composer-actions"><div class="composer-tools"><button class="tool-btn" id="btn-attach-img"><i class="fas fa-image"></i></button><button class="tool-btn" id="btn-attach-listing"><i class="fas fa-book"></i></button><input type="file" id="post-img-upload" accept="image/*" style="display:none;"></div><button class="btn-composer-send" id="btn-send-post" disabled><i class="fas fa-paper-plane"></i></button></div></div></div>

    <div class="modal-overlay" id="edit-post-modal"><div class="modal-card"><span class="close-modal" id="close-edit-modal">&times;</span><h2 data-i18n="edit_post_title">Edit Post</h2><textarea id="edit-post-text" class="form-input"></textarea><div class="modal-buttons"><button class="btn btn-ghost" id="btn-cancel-edit">Cancel</button><button class="btn btn-action" id="btn-submit-edit">Save</button></div></div></div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot, orderBy, doc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, limit, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-auth.js";

        async function main() {
            const response = await fetch('/.netlify/functions/config');
            const config = await response.json();
            const app = getApps().length === 0 ? initializeApp(config.firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            const urlParams = new URLSearchParams(window.location.search);
            const topicId = urlParams.get('id');
            if (!topicId) { window.location.href = '/social.html'; return; }

            const lang = localStorage.getItem('preferred_language') || 'en';
            const allStrings = {
                en: { topics_campus: "Campus Public", topics_new: "Create Topic", post_placeholder: "What's happening?", loading_hub: "Loading...", noPosts: "No posts yet.", justNow: "Just now", suggest: "Marketplace", browse: "Browse All →", comment_placeholder: "Comment...", my_topics: "My Topics", pinned_topics: "Pinned Topics", discover_topics: "Discover", edited_label: " • Edited", rep_success: "Reported." },
                fr: { topics_campus: "Campus Public", topics_new: "Nouveau Sujet", post_placeholder: "Que se passe-t-il ?", loading_hub: "Chargement...", noPosts: "Aucune publication.", justNow: "À l'instant", suggest: "Marché", browse: "Tout voir →", comment_placeholder: "Commenter...", my_topics: "Mes Sujets", pinned_topics: "Sujets Épinglés", discover_topics: "Découvrir", edited_label: " • Modifié", rep_success: "Signalé." }
            };
            const ui = allStrings[lang] || allStrings['en'];

            // Sidebar and Menu logic
            const sheetOverlay = document.getElementById('sheet-overlay');
            const bottomSheet = document.getElementById('bottom-sheet');
            document.getElementById('m-btn-open-menu').onclick = () => { sheetOverlay.style.display = 'block'; setTimeout(() => { sheetOverlay.style.opacity = '1'; bottomSheet.style.transform = 'translateY(0)'; }, 10); };
            const closeSheet = () => { sheetOverlay.style.opacity = '0'; bottomSheet.style.transform = 'translateY(100%)'; setTimeout(() => { sheetOverlay.style.display = 'none'; }, 300); };
            document.getElementById('close-sheet-btn').onclick = closeSheet; sheetOverlay.onclick = closeSheet;

            let currentUser = null; let internalSchoolName = "Global Campus"; let allTopicsData = []; let listings = []; let unsubscribePosts = null; let commentUnsubscribes = {};
            let currentTopicData = null;

            // Fetch current topic name
            const tDoc = await getDoc(doc(db, "social_channels", topicId));
            if (!tDoc.exists()) { window.location.href = '/social.html'; return; }
            currentTopicData = tDoc.data();
            document.getElementById('ui-topic-name').textContent = currentTopicData.name;
            document.getElementById('post-input').placeholder = `Post in #${currentTopicData.name}...`;

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    onSnapshot(doc(db, "users", user.uid), (uSnap) => {
                        if (uSnap.exists()) {
                            const data = uSnap.data();
                            if (!data.isStudent && data.role !== 'admin') { showLockedScreen(); return; }
                            currentUser = { ...user, ...data };
                            internalSchoolName = data.schoolName || "Global Campus";
                            document.getElementById('composer-pfp').src = data.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}`;
                            document.getElementById('hub-layout').style.display = (window.innerWidth > 850) ? 'grid' : 'flex';
                            document.getElementById('mobile-topics-wrapper').style.display = (window.innerWidth <= 850) ? 'flex' : 'none';
                            
                            const pinBtn = document.getElementById('btn-pin-topic');
                            pinBtn.style.display = 'flex';
                            const isPinned = (data.pinnedTopics || []).includes(topicId);
                            pinBtn.innerHTML = `<i class="${isPinned ? 'fas' : 'far'} fa-bookmark"></i>`;
                            pinBtn.style.color = isPinned ? 'var(--gold)' : '';
                            pinBtn.onclick = async () => {
                                const userRef = doc(db, "users", user.uid);
                                if (isPinned) await updateDoc(userRef, { pinnedTopics: arrayRemove(topicId) });
                                else await updateDoc(userRef, { pinnedTopics: arrayUnion(topicId) });
                            };

                            if (currentTopicData.createdBy === user.uid) { document.getElementById('topic-settings-btn').style.display='flex'; document.getElementById('topic-settings-btn').href=`/edittopic.html?id=${topicId}`; }

                            loadTopics(); preloadBooksAndLoadFeed();
                        }
                    });
                }
            });

            function showLockedScreen() { document.getElementById('hub-layout').style.display = 'none'; document.getElementById('locked-screen').style.display = 'flex'; }

            function loadTopics() {
                onSnapshot(query(collection(db, "social_channels"), orderBy("postCount", "desc")), (snapshot) => {
                    allTopicsData = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                    renderTopics();
                });
            }

            function renderTopics() {
                const dListMy = document.getElementById('d-list-my'); const dListPinned = document.getElementById('d-list-pinned'); const dListDiscover = document.getElementById('d-list-discover');
                const mListMy = document.getElementById('m-list-my'); const mListPinned = document.getElementById('m-list-pinned'); const mListDiscover = document.getElementById('m-list-discover');
                dListMy.innerHTML = ''; dListPinned.innerHTML = ''; dListDiscover.innerHTML = ''; mListMy.innerHTML = ''; mListPinned.innerHTML = ''; mListDiscover.innerHTML = '';
                
                const mobileWaysList = document.getElementById('mobile-ways-list');
                mobileWaysList.innerHTML = `<a href="/social.html" class="m-way-pill"><i class="fas fa-globe-americas"></i> ${ui.topics_campus}</a>`;
                
                const pinnedArr = (currentUser && currentUser.pinnedTopics) || [];
                const myT = [], pinT = [], discT = [];

                allTopicsData.forEach(d => {
                    const isPrivate = d.visibility === 'private';
                    const isOwner = currentUser && d.createdBy === currentUser.uid;
                    const isMember = currentUser && d.members && d.members.includes(currentUser.uid);
                    if (isPrivate && !isOwner && !isMember && currentUser.role !== 'admin') return;
                    if (isOwner) myT.push(d);
                    else if (pinnedArr.includes(d.id)) pinT.push(d);
                    else discT.push(d);
                });

                document.getElementById('d-sec-my').style.display = myT.length ? 'block' : 'none';
                document.getElementById('d-sec-pinned').style.display = pinT.length ? 'block' : 'none';
                document.getElementById('d-sec-discover').style.display = discT.length ? 'block' : 'none';

                const createItem = (t, isMy) => {
                    const link = document.createElement('a'); link.className = `way-item ${t.id === topicId ? 'active' : ''}`; link.href = `/topic.html?id=${t.id}`;
                    link.innerHTML = `<i class="fas fa-hashtag"></i> <span style="flex-grow:1;">${t.name}</span> <span class="way-count">${t.postCount || 0}</span>${isMy ? `<a href="/edittopic.html?id=${t.id}" class="edit-way-btn"><i class="fas fa-cog"></i></a>` : ''}`;
                    return link;
                };

                const createPill = (t) => {
                    const pill = document.createElement('a'); pill.className = `m-way-pill ${t.id === topicId ? 'active' : ''}`; pill.href = `/topic.html?id=${t.id}`;
                    pill.innerHTML = `<i class="fas fa-hashtag"></i> ${t.name}`; return pill;
                };

                myT.forEach(t => { dListMy.appendChild(createItem(t, true)); mListMy.appendChild(createItem(t, true)); mobileWaysList.appendChild(createPill(t)); });
                pinT.forEach(t => { dListPinned.appendChild(createItem(t, false)); mListPinned.appendChild(createItem(t, false)); mobileWaysList.appendChild(createPill(t)); });
                discT.forEach(t => { dListDiscover.appendChild(createItem(t, false)); mListDiscover.appendChild(createItem(t, false)); if(t.id !== topicId) mobileWaysList.appendChild(createPill(t)); });
            }

            function preloadBooksAndLoadFeed() {
                getDocs(query(collection(db, "listings"), where("status", "==", "active"), limit(10))).then(snap => {
                    listings = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    loadFeed();
                });
            }

            function loadFeed() {
                if (unsubscribePosts) unsubscribePosts();
                feedContainer.innerHTML = '<div class="loader-msg"><i class="fas fa-circle-notch fa-spin"></i><br>Loading...</div>';
                unsubscribePosts = onSnapshot(query(collection(db, "social_posts"), where("wayId", "==", topicId), orderBy("timestamp", "desc"), limit(50)), (snapshot) => {
                    feedContainer.innerHTML = '';
                    if (snapshot.empty) { feedContainer.innerHTML = `<div class="loader-msg">${ui.noPosts}</div>`; return; }
                    snapshot.docs.forEach((doc, i) => {
                        feedContainer.appendChild(createPostElement(doc.id, doc.data()));
                        if ((i+1) % 4 === 0 && listings.length > 0) feedContainer.appendChild(createMarketBreak());
                    });
                });
            }

            function createPostElement(id, d) {
                const card = document.createElement('div'); card.className = 'post-card';
                const isOwner = currentUser && d.authorUid === currentUser.uid;
                card.innerHTML = `
                    <div class="post-header-top">
                        <a href="/user.html?id=${d.authorUid}" class="post-author-link">
                            <img src="${d.authorPhoto || ''}" class="post-avatar">
                            <div class="post-meta"><span class="post-author">${d.authorName}</span><span class="post-time">${d.timestamp ? formatTime(d.timestamp.toDate()) : ui.justNow}${d.edited ? ui.edited_label : ''}</span></div>
                        </a>
                        <div class="post-menu-container">
                            <button class="post-menu-btn" onclick="window.togglePostMenu('${id}')"><i class="fas fa-ellipsis-h"></i></button>
                            <div class="post-dropdown" id="post-dropdown-${id}">
                                ${isOwner ? `<button class="post-dropdown-item" onclick="window.openEditPost('${id}', '${d.text.replace(/'/g, "\\'")}')"><i class="fas fa-edit"></i> Edit</button>` : ''}
                                <button class="post-dropdown-item" onclick="window.reportPost('${id}', '${d.authorUid}', '${d.authorName}')"><i class="fas fa-flag"></i> Report</button>
                                ${isOwner || currentUser.role === 'admin' ? `<button class="post-dropdown-item danger" onclick="window.deletePost('${id}')"><i class="fas fa-trash-alt"></i> Delete</button>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="post-body">${d.text}</div>
                    ${d.imageUrl ? `<img src="${d.imageUrl}" class="post-image-attachment" onclick="window.open('${d.imageUrl}')">` : ''}
                    ${d.attachedListing ? `<a href="/listing.html?id=${d.attachedListing.id}" class="post-listing-attachment"><div class="pla-img" style="background-image:url('${d.attachedListing.img}')"></div><div class="pla-info"><div class="pla-title">${d.attachedListing.title}</div><div class="pla-price">$${d.attachedListing.price}</div></div></a>` : ''}
                    <div class="post-actions">
                        <button class="action-btn" onclick="window.likePost('${id}', ${d.likedBy?.includes(currentUser.uid)})"><i class="${d.likedBy?.includes(currentUser.uid) ? 'fas' : 'far'} fa-heart"></i> ${d.likes || 0}</button>
                        <button class="action-btn" onclick="window.toggleComments('${id}')"><i class="far fa-comment"></i> ${d.commentCount || 0}</button>
                    </div>
                    <div class="comments-section" id="comments-section-${id}"><div class="comment-list" id="comment-list-${id}"></div><div class="comment-input-wrapper"><textarea class="comment-input" id="comment-input-${id}" placeholder="Comment..."></textarea><button class="btn-comment-send" onclick="window.postComment('${id}')" id="btn-send-comment-${id}"><i class="fas fa-paper-plane"></i></button></div></div>`;
                return card;
            }

            function createMarketBreak() {
                const b = document.createElement('div'); b.className = 'market-break';
                let h = `<div class="break-header"><span class="break-title"><i class="fas fa-book-open"></i> ${ui.suggest}</span><a href="/search.html" class="break-link">${ui.browse}</a></div><div class="break-scroll">`;
                listings.forEach(l => { h += `<a href="/listing.html?id=${l.id}" class="mini-book-card"><div class="mini-img" style="background-image:url('${l.imageUrls[0]}')"></div><div class="mini-info"><div class="mini-price">$${l.price.toFixed(2)}</div><div class="mini-title">${l.title}</div></div></a>`; });
                b.innerHTML = h + '</div>'; return b;
            }

            function formatTime(t) { const m = Math.round((new Date() - t)/60000); if(m<60) return `${m}m`; if(m<1440) return `${Math.round(m/60)}h`; return `${Math.round(m/1440)}d`; }
            window.togglePostMenu = (id) => { const d = document.getElementById(`post-dropdown-${id}`); const s = d.classList.contains('show'); document.querySelectorAll('.post-dropdown').forEach(x => x.classList.remove('show')); if(!s) d.classList.add('show'); };
            window.openEditPost = (id, text) => { document.getElementById('edit-post-text').value = text; document.getElementById('edit-post-modal').style.display='flex'; window.currentEditId = id; };
            document.getElementById('btn-submit-edit').onclick = async () => { await updateDoc(doc(db, "social_posts", window.currentEditId), { text: document.getElementById('edit-post-text').value, edited: true }); document.getElementById('edit-post-modal').style.display='none'; };
            window.deletePost = async (id) => { if(confirm("Delete?")) { await deleteDoc(doc(db, "social_posts", id)); await updateDoc(doc(db, "social_channels", topicId), { postCount: increment(-1) }); } };
            window.likePost = async (id, liked) => { const r = doc(db, "social_posts", id); if(liked) await updateDoc(r, { likes: increment(-1), likedBy: arrayRemove(currentUser.uid) }); else await updateDoc(r, { likes: increment(1), likedBy: arrayUnion(currentUser.uid) }); };
            window.toggleComments = (id) => { const s = document.getElementById(`comments-section-${id}`); if(s.style.display==='block') s.style.display='none'; else { s.style.display='block'; loadComments(id); } };
            function loadComments(postId) { const list = document.getElementById(`comment-list-${postId}`); onSnapshot(query(collection(db, "social_posts", postId, "comments"), orderBy("timestamp", "asc")), (snap) => { list.innerHTML = snap.empty ? `<div style="text-align:center; font-size:0.85rem; color:#888;">${ui.no_comments}</div>` : ''; snap.forEach(doc => { const c = doc.data(); const div = document.createElement('div'); div.className = 'comment-item'; div.innerHTML = `<img src="${c.authorPhoto || ''}" class="comment-avatar"><div class="comment-content"><div class="comment-author">${c.authorName}</div><div class="comment-text">${c.text}</div></div>`; list.appendChild(div); }); }); }
            window.postComment = async (postId) => { const input = document.getElementById(`comment-input-${postId}`); const text = input.value.trim(); if (!text) return; input.value = ''; await addDoc(collection(db, "social_posts", postId, "comments"), { text, authorUid: currentUser.uid, authorName: currentUser.displayName, authorPhoto: currentUser.photoURL, timestamp: serverTimestamp() }); await updateDoc(doc(db, "social_posts", postId), { commentCount: increment(1) }); };
            
            const postInput = document.getElementById('post-input');
            postInput.oninput = () => document.getElementById('btn-send-post').disabled = !postInput.value.trim();
            document.getElementById('btn-send-post').onclick = async () => { const text = postInput.value.trim(); if(!text) return; postInput.value=''; document.getElementById('btn-send-post').disabled=true; await addDoc(collection(db, "social_posts"), { wayId: topicId, schoolName: internalSchoolName, text, authorUid: currentUser.uid, authorName: currentUser.displayName, authorPhoto: currentUser.photoURL, likes: 0, likedBy: [], commentCount: 0, timestamp: serverTimestamp() }); await updateDoc(doc(db, "social_channels", topicId), { postCount: increment(1) }); };
        }
        main();
    </script>
</body>
</html>
